# ── Hetzner Object Storage (S3-compatible) ─────────────────────────────────
# ! These are deliberately NOT named AWS_* . aws-cli gives real environment
# ! variables precedence over EVERY other credential source — including an
# ! `aws login` session and ~/.aws/credentials — so repo-wide AWS_* vars broke
# ! all real AWS access: every `aws` call made inside this repo was redirected
# ! at Hetzner and, when the encrypted secret was unavailable,
# ! absent from a bare shell, failed with "Partial credentials found in env,
# ! missing: AWS_SECRET_ACCESS_KEY" before it ever reached the login provider.
# ! Verified with `aws sts get-caller-identity` both ways.
# !
# ! So the values are named for what they are, and each s3-* task maps them
# ! into AWS_* via its own `env` table — scoped to that task only. Nothing
# ! global is named AWS_* any more; that is the whole point of the split.
# * HETZNER_S3_ACCESS_KEY_ID is a public access key id, not a secret.
# * HETZNER_S3_SECRET_ACCESS_KEY is age-encrypted below and mapped per task.
# !
