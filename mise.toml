description = "Regression-test streaming Kubernetes Secret encryption and vault-backed decryption"
run = '''
#!/usr/bin/env -S ./.venv/bin/python
import subprocess
import yaml

plaintext = "apiVersion: v1\nkind: Secret\nmetadata:\n  name: sops-stream-test\n  namespace: goose\nstringData:\n  value: nonsecret-test-value\n"
encrypted = subprocess.run(["mise", "run", "sops-encrypt-stdin", "--", "kubernetes/apps/goose/test.sops.yaml"], input=plaintext, text=True, stdout=subprocess.PIPE, check=True).stdout
document = yaml.safe_load(encrypted)
assert document["metadata"]["name"] == "sops-stream-test"
assert document["stringData"]["value"].startswith("ENC[")
decrypted = subprocess.run(["mise", "--raw", "run", "sops-decrypt", "--", "--input-type", "yaml", "--output-type", "yaml", "/dev/stdin"], input=encrypted, text=True, stdout=subprocess.PIPE, check=True).stdout
assert yaml.safe_load(decrypted) == yaml.safe_load(plaintext)
print("PASS: streaming encryption preserves metadata, encrypts stringData, and round-trips without plaintext files")
'''

