#!/usr/bin/env -S ./.venv/bin/python
import ast
import os
import tomllib
from unittest.mock import patch

with open("mise.toml", "rb") as stream:
  tasks = tomllib.load(stream)["tasks"]
with patch("os.geteuid", return_value=0):
  try:
    exec(compile(tasks["goose-build"]["run"], "goose-build", "exec"), {})
  except SystemExit as error:
    assert "without sudo" in str(error)
  else:
    raise AssertionError("Privileged compilation must be rejected")
print("PASS: compilation rejects root before running Git or Cargo")
body = ast.parse(tasks["goose-image"]["run"])
assignment = next(node for node in body.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "environment" for target in node.targets))
with patch.dict(os.environ, {"PATH": "/usr/bin", "HOME": "/home/operator", "SUDO_UID": "1000", "GITHUB_TOKEN": "must-not-pass"}, clear=True):
  namespace = {"os": os}
  exec(compile(ast.Module(body=[assignment], type_ignores=[]), "image-environment", "exec"), namespace)
  assert namespace["environment"] == {"PATH": "/usr/bin", "HOME": "/home/operator", "SUDO_UID": "1000"}
print("PASS: packaging preserves sudo repository ownership context without inheriting credentials")
selection = next(node for node in ast.walk(body) if isinstance(node, ast.If) and isinstance(node.test, ast.Compare) and isinstance(node.test.left, ast.Name) and node.test.left.id == "image_name" and any(isinstance(child, ast.Name) and child.id == "toolchain" for child in ast.walk(node)))
for selected, valid in [("stable-x86_64-unknown-linux-gnu", True), ("stable", False), ("stable-x86_64-unknown-linux-musl", False)]:
  namespace = {"image_name": "backend", "environment": {}, "subprocess": __import__("subprocess"), "json": __import__("json"), "lines": []}
  with patch("subprocess.check_output", return_value=selected + " (default)\n"):
    try:
      exec(compile(ast.Module(body=[selection], type_ignores=[]), "image-rust-toolchain", "exec"), namespace)
    except SystemExit:
      assert not valid
    else:
      assert valid
      assert namespace["lines"] == ['RUSTUP_TOOLCHAIN = "' + selected + '"']
print("PASS: packaging selects a complete GNU Rust toolchain and rejects ambiguous or musl selections")
'''

[tasks.goose-ssh-check]
description = "Validate Goose's canonical machine SSH identity and strict GitHub configuration without plaintext key files"
run = '''
#!/usr/bin/env -S ./.venv/bin/python
import os
from pathlib import Path
import subprocess
import yaml

root = Path("kubernetes/apps/goose").resolve()
secret = yaml.safe_load(subprocess.check_output(["mise", "--raw", "run", "sops-decrypt", "--", str(root / "machine-access-ssh.sops.yaml")], text=True))
key = secret["stringData"]["ssh-privatekey"]
canonical = subprocess.check_output(["mise", "--raw", "run", "ansible-vault-view", "--", "vault_saikat_machine_access_ssh_private_key"], text=True)
assert key.strip() == canonical.strip()
assert key.startswith("-----BEGIN OPENSSH PRIVATE KEY-----")
descriptor = os.memfd_create("goose-ssh-check", os.MFD_CLOEXEC)
try:
  os.fchmod(descriptor, 0o600)
  os.write(descriptor, key.encode())
  public = subprocess.check_output(["ssh-keygen", "-y", "-P", "", "-f", "/proc/" + str(os.getpid()) + "/fd/" + str(descriptor)], text=True)
  assert public.startswith("ssh-ed25519 ")
  print("PASS: canonical private key parses as an Ed25519 identity without output framing")
  virtual_machine = yaml.safe_load((root / "workstation.yaml").read_text())
  cloud_init = yaml.safe_load(next(volume["cloudInitNoCloud"]["userData"] for volume in virtual_machine["spec"]["template"]["spec"]["volumes"] if "cloudInitNoCloud" in volume))
  assert cloud_init["users"][0]["ssh_authorized_keys"][0].split()[:2] == public.split()[:2]
  print("PASS: VM authorizes exactly the canonical machine-access identity")
finally:
  os.close(descriptor)
environment = dict(os.environ)
environment.update({"GIT_CONFIG_SYSTEM": str(root / "gitconfig"), "GIT_CONFIG_GLOBAL": "/dev/null"})
url = subprocess.check_output(["git", "ls-remote", "--get-url", "https://github.com/atmz-ai/saikat-kubernetes-cluster.git"], env=environment, text=True).strip()
assert url == "git@github.com:atmz-ai/saikat-kubernetes-cluster.git"
settings = subprocess.check_output(["ssh", "-G", "-F", str(root / "ssh_config"), "github.com"], text=True)
assert "identitiesonly yes" in settings and "batchmode yes" in settings
assert "stricthostkeychecking true" in settings or "stricthostkeychecking yes" in settings
fingerprint = subprocess.check_output(["ssh-keygen", "-lf", str(root / "known_hosts")], text=True)
assert "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU" in fingerprint
print("PASS: GitHub URL rewrite and strict official host verification")
'''

[tasks.goose-push]
description = "Audit and push prebuilt Goose images to Harbor without privileged compilation or plaintext credential files"
depends = ["goose-build-workflow-check", "goose-ssh-check"]
run = '''
#!/usr/bin/env -S ./.venv/bin/python
import base64
from datetime import datetime, timezone
import hashlib
import json
import os
from pathlib import Path
import subprocess
import yaml

root = Path.cwd()
if os.geteuid() == 0:
  raise SystemExit("Push prebuilt images without sudo.")
for name in ["backend", "browser"]:
  output = root / "target/goose/oci" / name
  with (output / "index.json").open() as stream:
    index = json.load(stream)
  manifest_digest = index["manifests"][0]["digest"].split(":", 1)[1]
  manifest_bytes = (output / "blobs/sha256" / manifest_digest).read_bytes()
  assert hashlib.sha256(manifest_bytes).hexdigest() == manifest_digest
  manifest = json.loads(manifest_bytes)
  for blob in [manifest["config"], *manifest["layers"]]:
    digest = blob["digest"].split(":", 1)[1]
    with (output / "blobs/sha256" / digest).open("rb") as stream:
      assert hashlib.file_digest(stream, "sha256").hexdigest() == digest
    print("PASS: " + name + " blob sha256:" + digest, flush=True)
  image_configuration = json.loads((output / "blobs/sha256" / manifest["config"]["digest"].split(":", 1)[1]).read_bytes())
  assert image_configuration["config"]["User"] == "1000:1000"
  if name == "backend":
    image_environment = dict(value.split("=", 1) for value in image_configuration["config"]["Env"])
    assert image_environment["RUSTUP_TOOLCHAIN"].endswith("-x86_64-unknown-linux-gnu")
with (root / "ansible/roles/goose/defaults/main.yml").open() as stream:
  defaults = yaml.safe_load(stream)
decrypted = subprocess.check_output(["mise", "run", "sops-decrypt", "--", "kubernetes/infrastructure/harbor/harbor-admin-secret.sops.yaml"], text=True)
password = yaml.safe_load(decrypted)["stringData"]["admin-password"]
authentication = base64.b64encode(("admin:" + password).encode()).decode()
registry_configuration = json.dumps({"auths": {"harbor.yral.com": {"auth": authentication}}})
descriptor = os.memfd_create("goose-registry-auth", os.MFD_CLOEXEC)
try:
  os.write(descriptor, registry_configuration.encode())
  environment = {key: os.environ[key] for key in ["PATH", "HOME", "SSL_CERT_FILE", "SSL_CERT_DIR"] if key in os.environ}
  environment.update({"REGISTRY_AUTH_FILE": "/proc/self/fd/" + str(descriptor), "MISE_EXPERIMENTAL": "1"})
  commit = subprocess.check_output(["git", "rev-parse", "--short=8", "HEAD"], text=True).strip()
  tag = datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S") + "-" + commit
  for name, repository in [("backend", defaults["goose_image_repository"]), ("browser", defaults["goose_image_repository"] + "-browser")]:
    output = root / "target/goose/oci" / name
    reference = repository + ":" + tag
    print("Pushing " + reference, flush=True)
    subprocess.run(["mise", "--no-config", "--no-env", "--no-hooks", "oci", "push", "--image-dir", str(output), reference], env=environment, pass_fds=(descriptor,), check=True)
    with (output / "index.json").open() as stream:
      digest = json.load(stream)["manifests"][0]["digest"]
    print("Published " + repository + "@" + digest, flush=True)
finally:
  os.close(descriptor)
'''

