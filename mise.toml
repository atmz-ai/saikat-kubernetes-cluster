[tasks.bootstrap]
description = "Create .venv, install Python tooling, and extract infra SSH key from vault"
run = '''
#!/usr/bin/env bash
set -euo pipefail

python -m venv .venv && ./.venv/bin/pip install --upgrade pip && ./.venv/bin/pip install -e . && ./.venv/bin/ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections

# Validate the vault password once, up front. A missing/empty/incorrect password
# (e.g. GitHub PRs from Dependabot/Renovate, which never receive repo secrets)
# must degrade to warn-and-skip below — NOT crash the whole bootstrap with a
# traceback deep inside a Python one-liner.
# Sets: bootstrap_vault_ok=true|false
bootstrap_vault_ok=false
if [ -s ansible/.vault_pass ] && \
   ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass > /dev/null 2>&1; then
  bootstrap_vault_ok=true
  echo '  ✓ Vault password valid — ansible/.vault_pass decrypts the vault'
else
  echo '  ⚠ Vault password missing or does not decrypt ansible/inventory/group_vars/all/vault.yml'
  echo '    → skipping ALL vault extractions (infra SSH key, kubeconfig, age identity).'
  echo '    → CI runs from Dependabot/Renovate PRs are expected to land here (no secrets).'
  echo '    → locally: check ansible/.vault_pass contains the real vault password.'
fi

# Extract saikat-machine-access SSH private key from Ansible vault → ./.saikat-machine-access-ed25519 (repo-local, gitignored)
# * Used for age decryption and ansible.cfg (private_key_file), and installed
# as the machine's default SSH identity below. Idempotent — skips if already present.
if [ "$bootstrap_vault_ok" = true ] && [ ! -f .saikat-machine-access-ed25519 ]; then
  ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass | \
    ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)['vault_saikat_machine_access_ssh_private_key'])" \
    > .saikat-machine-access-ed25519
  chmod 600 .saikat-machine-access-ed25519
  echo '  ✓ Extracted saikat-machine-access SSH key to .saikat-machine-access-ed25519'
elif [ -f .saikat-machine-access-ed25519 ]; then
  echo '  ✓ Saikat machine-access SSH key already at .saikat-machine-access-ed25519'
fi

# Install the saikat-machine-access SSH key as the machine's DEFAULT identity (~/.ssh/id_ed25519),
# deliberately OVERWRITING any existing key (operator decision 2026-09-01: this
# vault key is the adopted identity for everything — GitHub + every node provider;
# see ansible/inventory/group_vars/all/vars.yml "single key for everything"). ssh,
# git, and ansible then pick it up automatically — locally AND on the CI runner,
# which is what lets the submodule clone below authenticate with no CI-specific
# setup.
if [ -f .saikat-machine-access-ed25519 ]; then
  mkdir -p ~/.ssh && chmod 700 ~/.ssh
  cp .saikat-machine-access-ed25519 ~/.ssh/id_ed25519
  chmod 600 ~/.ssh/id_ed25519
  # Regenerate the matching .pub — a stale .pub from a previous key makes SSH
  # reject the pair ("contents do not match public").
  ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
  chmod 644 ~/.ssh/id_ed25519.pub
  echo '  ✓ Installed saikat-machine-access SSH key as ~/.ssh/id_ed25519 (default machine identity)'
fi

# Initialize git submodules (app source repos). SSH URLs (git@github.com:...)
# resolve via the default identity installed above. accept-new handles a fresh
# CI runner (github.com not yet in known_hosts) while still refusing CHANGED
# host keys (TOFU).
GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git submodule update --init --recursive

# Extract kubeconfig from Ansible vault → ~/.kube/config (idempotent — skips if already present)
if [ "$bootstrap_vault_ok" = true ] && [ ! -f ~/.kube/config ]; then
  mkdir -p ~/.kube
  ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass | \
    ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)['vault_kubeconfig'])" \
    > ~/.kube/config
  chmod 600 ~/.kube/config
  echo '  ✓ Extracted kubeconfig to ~/.kube/config'
elif [ -f ~/.kube/config ]; then
  echo '  ✓ Kubeconfig already at ~/.kube/config'
fi
'''

[tasks.ansible-vault-decrypt]
description = "Decrypt ansible/inventory/group_vars/all/vault.yml for editing"
run = "./.venv/bin/ansible-vault decrypt ansible/inventory/group_vars/all/vault.yml"

[tasks.ansible-vault-encrypt]
description = "Re-encrypt ansible/inventory/group_vars/all/vault.yml after editing"
run = "./.venv/bin/ansible-vault encrypt ansible/inventory/group_vars/all/vault.yml"

[tasks.ansible-vault-view]
description = "View a value from Ansible vault (usage: mise run ansible-vault-view -- <yaml key>)"
run = '''
./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml | \
  ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)[sys.argv[1]])" "$@"
'''

[tasks.ansible-playbook]
description = "Run an Ansible playbook (usage: mise run ansible-playbook -- ansible/playbooks/operations/<playbook>.yml [-e target_host=...])"
run = "./.venv/bin/ansible-playbook"

[tasks.kafka-manifests-check]
description = "Validate Kafka, Connect, and Bridge placement and preserve replica counts and persistent storage"
run = '''
./.venv/bin/python - <<'PY'
import pathlib, yaml
def load(path):
  return list(yaml.safe_load_all(pathlib.Path(path).read_text()))
pool = next(document for document in load('kubernetes/infrastructure/kafka/kafka.yaml') if document['kind'] == 'KafkaNodePool')
connect = next(document for document in load('kubernetes/infrastructure/kafka-connect/connect.yaml') if document['kind'] == 'KafkaConnect')
bridge = next(document for document in load('kubernetes/infrastructure/kafka-bridge/kafka-bridge.yaml') if document['kind'] == 'KafkaBridge')
for affinity, topology_key in [
  (pool['spec']['template']['pod']['affinity'], 'topology.kubernetes.io/zone'),
  (connect['spec']['template']['pod']['affinity'], 'kubernetes.io/hostname'),
]:
  assert 'nodeAffinity' not in affinity
  assert affinity['podAntiAffinity']['preferredDuringSchedulingIgnoredDuringExecution'][0]['podAffinityTerm']['topologyKey'] == topology_key
assert 'nodeAffinity' not in bridge['spec'].get('template', {}).get('pod', {}).get('affinity', {})
assert pool['spec']['replicas'] == 3
assert pool['spec']['storage'] == {'type': 'persistent-claim', 'size': '250Gi', 'class': 'longhorn-1replica', 'deleteClaim': True}
assert connect['spec']['replicas'] == 2
assert bridge['spec']['replicas'] == 1
print('Verified unrestricted regional placement and preserved replica counts and persistent storage.')
PY
'''

[tasks.rustfs-manifests-check]
description = "Parse RustFS manifests and verify the pinned chart renders the expected storage claims"
run = '''
./.venv/bin/python - <<'PY'
import pathlib, subprocess, tempfile, yaml
directory = pathlib.Path('kubernetes/infrastructure/rustfs')
for path in directory.glob('*.yaml'):
  list(yaml.safe_load_all(path.read_text()))
  print(f'Parsed {path}')
import json
from jinja2.nativetypes import NativeEnvironment
template_environment = NativeEnvironment()
template_environment.filters['from_json'] = json.loads
removal_tasks = yaml.safe_load(pathlib.Path('ansible/roles/node-remove/tasks/main.yml').read_text())
storage_guard = next(task for task in removal_tasks if task['name'] == 'Refuse removal of a node with bound RustFS local storage')
for persistent_volumes in [[], [{'metadata': {'name': 'rustfs-azure-1-disk-0'}}]]:
  rendered_loop = template_environment.from_string(storage_guard['loop']).render(node_remove_persistent_volumes={'stdout': json.dumps({'items': persistent_volumes})})
  assert rendered_loop == persistent_volumes
  assert not callable(rendered_loop)
print('Verified node-removal storage guard reads JSON items, including an empty list.')
cleanup_tasks = yaml.safe_load(pathlib.Path('ansible/roles/node-remove/tasks/cleanup.yml').read_text())
assert cleanup_tasks[0]['ansible.builtin.command']['cmd'].startswith('kubeadm reset phase cleanup-node ')
assert next(index for index, task in enumerate(cleanup_tasks) if 'ansible.builtin.wait_for' in task) < next(index for index, task in enumerate(cleanup_tasks) if 'ansible.builtin.file' in task)
assert all('failed_when' not in task and 'ignore_unreachable' not in task for task in cleanup_tasks)
assert any(task.get('ansible.builtin.include_tasks') == 'cleanup.yml' for task in removal_tasks)
print('Verified container cleanup precedes configuration deletion and failures are not ignored.')
release = list(yaml.safe_load_all((directory / 'helmrelease.yaml').read_text()))[1]
with tempfile.TemporaryDirectory() as temporary:
  archive = pathlib.Path(temporary) / 'rustfs.tgz'
  subprocess.run(['curl', '--fail', '--location', 'https://charts.rustfs.com/rustfs-1.0.1.tgz', '--output', str(archive)], check=True)
  values = pathlib.Path(temporary) / 'values.yaml'
  values.write_text(yaml.safe_dump(release['spec']['values']))
