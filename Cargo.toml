[workspace]
resolver = "3"
members = ["apps/my-website"]

[workspace.dependencies]
anyhow = "1.0.103"
axum = "0.8.7"
chrono = "0.4"
comrak = "0.59.0"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
getrandom = "0.4.3"
leptos = "0.8.20"
leptos_axum = "0.8.7"
leptos_meta = "0.8.7"
leptos_router = "0.8.11"
log = "0.4.34"
noyalib = "0.0.60"
serde = "1.0.229"
serde_json = "1.0.145"
tokio = "1.53.1"
tracing = "0.1"
tracing-subscriber = "0.3"
wasm-bindgen = "0.2.130"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
