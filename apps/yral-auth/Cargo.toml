[package]
name = "yral-auth"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "yral-auth"
path = "src/main.rs"
required-features = ["ssr"]

[[bin]]
name = "jwt-secret-gen"
path = "src/jwt_secret_gen.rs"
required-features = ["ssr"]

[dependencies]
axum = { workspace = true, features = ["form", "json", "macros"], optional = true }
axum-extra = { workspace = true, features = ["cookie", "cookie-private"], optional = true }
base64 = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
console_log = { workspace = true, optional = true }
enum_dispatch = { workspace = true }
futures = { workspace = true }
hex = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true, features = ["aws_lc_rs", "use_pem"] }
leptos = { workspace = true }
leptos_axum = { workspace = true, optional = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
log = { workspace = true }
openidconnect = { workspace = true }
p256 = { workspace = true, features = ["pkcs8"], optional = true }
postcard = { workspace = true, features = ["use-std"] }
regex = { workspace = true }
rustls = { workspace = true, features = ["logging", "ring", "std", "tls12"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }

tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["js", "v4"] }
wasm-bindgen = { workspace = true, optional = true }
web-time = { workspace = true }

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["aws_lc_rs", "use_pem"] }
p256 = { workspace = true, features = ["pkcs8"] }
tokio = { workspace = true, features = ["macros", "rt"] }

# getrandom v0.4 is pulled transitively by leptos_macro's uuid dep.
# On wasm32-unknown-unknown, it needs the wasm_js feature enabled.
# This is a target-specific dependency — only active on WASM targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[features]
apple-oauth = []
google-oauth = []
hydrate = [
  "dep:console_error_panic_hook",
  "dep:console_log",
  "dep:wasm-bindgen",
  "leptos/hydrate",
]
release-bin = ["apple-oauth", "google-oauth", "ssr"]
release-lib = ["apple-oauth", "google-oauth", "hydrate"]
ssr = [
  "dep:axum",
  "dep:axum-extra",
  "dep:hex",
  "dep:jsonwebtoken",
  "dep:leptos_axum",
  "dep:p256",
  "dep:rustls",
  "dep:sha2",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "leptos/ssr",
]
