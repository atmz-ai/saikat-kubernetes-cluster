[package]
name = "yral-metadata-client"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = {
  workspace = true,
  features = [
    "http2",
    "json",
  ]
}
serde_json = { workspace = true }
thiserror = { workspace = true }
types = { package = "yral-metadata-types", path = "../types", default-features = false }
url = { workspace = true }

[features]
default = []
rustls-tls = ["reqwest/rustls"]
