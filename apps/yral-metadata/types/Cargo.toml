[package]
name = "yral-metadata-types"
version = "0.1.0"
edition = "2021"

[dependencies]
candid = { workspace = true }
ic-agent = { workspace = true, optional = true }
k256 = { workspace = true, features = ["ecdsa", "pkcs8"], optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true }
web-time = { workspace = true }

[features]
default = ["ic-agent", "verify"]
ic-agent = ["dep:ic-agent"]
verify = ["dep:k256", "ic-agent"]