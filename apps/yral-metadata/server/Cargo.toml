[package]
name = "yral-metadata-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { workspace = true, features = ["json"] }
config = { workspace = true, features = ["toml"] }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs", "use_pem"] }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["cors", "trace"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
types = { package = "yral-metadata-types", path = "../types", default-features = false }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum", "reqwest"] }

[dev-dependencies]
metadata-client = { package = "yral-metadata-client", path = "../client" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[features]
default = []
