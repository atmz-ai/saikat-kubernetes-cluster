# Canonical SSH keys (always included)
# `name` is the key's LABEL IN THE HETZNER ROBOT ACCOUNT — the hetzner_rescue role
# matches it against the Robot API to authorize canonical keys in rescue mode. It
# is NOT the key's own comment field. The saikat-machine-access key must be registered in
# the Hetzner Robot account under the name "saikat-machine-access".
# `key` is the canonical public key line (unmatched today — the deployed
# authorized_keys come from ssh_security/files/authorized_keys).
canonical_ssh_keys:
  - name: "saikat-machine-access"
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM/H7Jp2RgC1xtg1nyzpmhzOTmUz3n+PQPsk83BzUskg saikat-machine-access"
