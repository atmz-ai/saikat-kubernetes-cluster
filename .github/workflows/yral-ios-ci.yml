name: Yral iOS CI

# * CI runs read-only checks; local yral-ios-checks formats before the same checks.
# * Simulator checks need no signing credentials or vault secrets.
#
# * pull_request → mise run yral-ios-ci-checks (lint + tests + sim build)
#   push/merge to main    → same checks (deploys run locally — see the
#                           commented-out deploy job below)
#
on:
  pull_request:
    paths:
      - "apps/yral-ios/**"
      - ".github/workflows/yral-ios-ci.yml"
      - "mise.toml"
      - "mise/tasks/workspace.toml"
      - "mise/tasks/yral-ios.toml"
  push:
    branches:
      - main
    paths:
      - "apps/yral-ios/**"
      - ".github/workflows/yral-ios-ci.yml"
      - "mise.toml"
      - "mise/tasks/workspace.toml"
      - "mise/tasks/yral-ios.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs cancel freely; main runs serialize (one checks run at a time).
  group: yral-ios-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # mise-action installs the toolchain declared in mise.toml. Xcode itself
      # is pinned below (preinstalled on the runner image).
      - name: Set up mise + project tools
        uses: jdx/mise-action@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run checks (lint + package tests + simulator build)
        run: mise run yral-ios-ci-checks

  # TestFlight deploy DISABLED (2026-09-01): macOS runners on the free
  # public pool queue for 1h+ and the deploy job can be starved entirely —
  # it also raced ahead of the latest commit on at least one occasion.
  # * Deploys run locally with mise run yral-ios-upload-testflight.
  # * Local checks format first; CI checks do not rewrite Swift files.
  # To re-enable: uncomment this job (and the bootstrap step it needs).
