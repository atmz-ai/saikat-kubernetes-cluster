name: Infrastructure Releases

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-releases-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Release bundle checks (${{ matrix.operating_system }})
    strategy:
      fail-fast: false
      matrix:
        operating_system:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.operating_system }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up validation tools
        uses: jdx/mise-action@v5
        with:
          install_args: kubectl python node
      - name: Install declared Python tooling
        run: mise run --skip-tools python-setup
      - name: Validate upstream bundles and update discovery
        run: |
          mise run --skip-tools infrastructure-release-checks ::: renovate-configuration-checks
