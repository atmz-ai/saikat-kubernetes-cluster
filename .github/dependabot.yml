version: 2
updates:
  # * Both Dependabot and Renovate intentionally monitor npm dependencies.
  - package-ecosystem: "npm"
    directories:
      - "/apps/my-website"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directories:
      - "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/docker/**"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directories:
      - "/"
    schedule:
      interval: "weekly"
