apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-kubevirt
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/kubevirt
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-kubevirt-operator
  healthCheckExprs:
    - apiVersion: kubevirt.io/v1
      kind: KubeVirt
      current: status.conditions.exists(condition, condition.type == 'Available' && condition.status == 'True')