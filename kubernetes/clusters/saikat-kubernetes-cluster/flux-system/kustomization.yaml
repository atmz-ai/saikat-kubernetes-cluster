apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- git-https-credentials.yaml
patches:
- target:
    kind: GitRepository
    name: flux-system
  patch: |
    - op: replace
      path: /spec/secretRef/name
      value: flux-git-https
    - op: replace
      path: /spec/url
      value: https://github.com/saikatdas0790/saikat-kubernetes-cluster.git
- target:
    kind: Kustomization
    name: flux-system
  patch: |
    - op: add
      path: /spec/decryption
      value:
        provider: sops
        secretRef:
          name: sops-age
