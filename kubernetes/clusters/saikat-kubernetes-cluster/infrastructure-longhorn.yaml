# TODO adopt native per-volume hard limits once upstream #11666 ships (currently targeted for v1.15.0); use upstream capacity defaults until then.
# ! Longhorn v1.12.1 has no total-space hard-limit field; snapshotMaxSize only
# ! blocks new snapshots and excludes the volume head and removed snapshots.
# * Upstream capability: https://github.com/longhorn/longhorn/issues/11666
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-longhorn
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/longhorn
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
