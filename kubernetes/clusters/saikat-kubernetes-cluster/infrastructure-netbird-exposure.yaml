apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-netbird-exposure
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./kubernetes/networking/routes/netbird
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # ! Public registration is exposed only after the operator and Google are configured.
  dependsOn:
    - name: infrastructure-netbird
