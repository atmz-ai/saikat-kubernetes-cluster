apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-netbird
  namespace: flux-system
spec:
  interval: 1h
  # ! Initial dependency/readiness failures must not inherit the one-hour retry delay.
  retryInterval: 1m
  path: ./kubernetes/infrastructure/netbird
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infrastructure-longhorn
    - name: networking
