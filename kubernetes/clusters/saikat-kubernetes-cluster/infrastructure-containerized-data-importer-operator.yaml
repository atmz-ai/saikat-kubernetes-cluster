apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-containerized-data-importer-operator
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/containerized-data-importer/operator
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system