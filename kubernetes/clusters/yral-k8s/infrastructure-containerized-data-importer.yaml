apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-containerized-data-importer
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/containerized-data-importer
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-containerized-data-importer-operator
  healthCheckExprs:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: CDI
      current: status.conditions.exists(condition, condition.type == 'Available' && condition.status == 'True')