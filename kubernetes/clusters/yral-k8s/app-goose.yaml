apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-goose
  namespace: flux-system
spec:
  interval: 1m
  path: ./kubernetes/apps/goose
  prune: true
  suspend: false
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age