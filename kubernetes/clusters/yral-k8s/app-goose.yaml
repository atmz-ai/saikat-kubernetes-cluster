apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-goose
  namespace: flux-system
spec:
  interval: 1m
  path: ./kubernetes/apps/goose
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: networking
    - name: infrastructure-longhorn
    - name: infrastructure-harbor
    - name: infrastructure-kubevirt
    - name: infrastructure-containerized-data-importer
  healthCheckExprs:
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      current: status.ready
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      current: status.phase == 'Succeeded'