apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-kilo
  namespace: flux-system
spec:
  # ENABLED 2026-09-27 after the topology fault was fixed and verified.
  #
  # `suspend` was removed in this commit, together with the node annotations that
  # make it safe (ansible/roles/node-labels applies
  # kilo.squat.ai/force-internal-ip + force-endpoint to every node). The previous
  # breakage was NOT a datapath bug: on public-only Hetzner nodes Kilo gave each
  # node its own location, so every packet counted as cross-location while
  # --local=false skipped the return paths. force-internal-ip makes InternalIP
  # non-nil, which groups nodes into their real region -- verified against live
  # node objects BEFORE enabling:
  #     0 nodes without a private IP; 2 locations
  #     location:falkenstein 22 nodes   location:helsinki 18 nodes
  # With locations that large, --local=false is finally the correct setting.
  #
  # The first thing to check after this reconciles is that `kilo_leader` reads 1 on
  # ONLY node-1 and node-2. `kilo_leader 1` on all 40 nodes means the per-node
  # locations are back and the topology fix did not take -- re-add `suspend: true`
  # immediately.
  #
  # KILL SWITCH (standby): point spec.template.spec.nodeSelector at a non-existent
  # label, e.g. `kilo-disabled: "true"`, which drives pods to 0 and lets kubelet tear
  # down kilo0. Do NOT use `scale --replicas=0`; the scale subresource returns
  # NotFound on this cluster even when the API is healthy. A live patch stops the
  # bleeding in seconds, but add `suspend: true` here in the same breath, because
  # flux-system re-applies this file every reconcile and will revert a live patch
  # within about a minute.
  interval: 1h
  path: ./kubernetes/infrastructure/kilo
  prune: true
  wait: true
  # 5m: the DaemonSet must roll out a privileged, host-network pod onto all 40
  # nodes, each of which creates a WireGuard interface and rewrites host routes.
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # Kilo's Cilium mode routes its IPIP outer packets through Cilium's VXLAN
    # overlay, so Cilium must already be running and the CNI must be ready on the
    # node before a Kilo agent can bring up its mesh interface.
    - name: infrastructure-cilium
