---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.yral.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-yral-com-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: https-saikat-dev
      port: 443
      protocol: HTTPS
      hostname: "*.saikat.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-saikat-dev-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: https-saikat-dev-apex
      port: 443
      protocol: HTTPS
      hostname: "saikat.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-saikat-dev-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
