apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goose-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - goose.saikat.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goose
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https-saikat-dev
  hostnames:
    - goose.saikat.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /goose-mobile/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /goose-mobile/
      backendRefs:
        - name: goose-browser
          namespace: goose
          port: 8080