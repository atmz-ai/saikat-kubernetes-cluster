apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks
  namespace: kube-system
spec:
  hostnames:
    - goldilocks.yral.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: web-gateway
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: oauth2-proxy-goldilocks
          namespace: oauth2-proxy
          port: 4180
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks-redirect
  namespace: kube-system
spec:
  hostnames:
    - goldilocks.yral.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: web-gateway
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
