# Longhorn UI HTTPRoute
#
# Exposes the Longhorn storage UI at https://longhorn-ui.saikat.oleole.ai via
# oauth2-proxy (Google Workspace SSO). Auth is enforced by oauth2-proxy; the
# longhorn-frontend Service itself is never exposed directly.
#
# ! Longhorn v1.12.1 has NO native authentication (auth-with-kubernetes-secret was
# ! removed), so the proxy in front is the ONLY thing gating the UI — do not route
# ! this host straight to longhorn-frontend. The proxy must front only this host:
# ! Longhorn's manager-url setting requires the manager API to stay unauthenticated
# ! for longhorn-driver-deployer / longhorn-csi-plugin to follow its response links.
#
# Host moved from longhorn-ui.yral.com; the listener is https-longhorn-ui in
# gateway.yaml and the cert is auto-issued by the cert-manager Gateway shim.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - longhorn-ui.saikat.oleole.ai
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https-longhorn-ui
  hostnames:
    - longhorn-ui.saikat.oleole.ai
  rules:
    - backendRefs:
        - name: oauth2-proxy-longhorn-ui
          namespace: oauth2-proxy
          port: 4180
