# ! Longhorn has no native authentication; keep the UI behind oauth2-proxy.
# ! Do not gate the manager API: CSI components follow its unauthenticated links.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - longhorn-ui.saikat.dev
    - longhorn-ui.saikat.oleole.ai
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https-longhorn-ui
    - name: web-gateway
      namespace: kube-system
      sectionName: https-saikat-dev
  hostnames:
    - longhorn-ui.saikat.dev
    - longhorn-ui.saikat.oleole.ai
  rules:
    - backendRefs:
        - name: oauth2-proxy-longhorn-ui
          namespace: oauth2-proxy
          port: 4180
