# * Cross-namespace backend access is granted by off-chain-agent/reference-grant.yaml.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: off-chain-agent-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - offchain.saikat.oleole.ai
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: off-chain-agent
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https-off-chain-agent
  hostnames:
    - offchain.saikat.oleole.ai
  rules:
    - backendRefs:
        - name: off-chain-agent
          namespace: off-chain-agent
          port: 50051