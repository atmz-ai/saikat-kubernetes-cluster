---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - grafana.saikat.dev
    - grafana.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
    - name: web-gateway
      namespace: kube-system
      sectionName: https-saikat-dev
  hostnames:
    - grafana.saikat.dev
    - grafana.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-grafana
          namespace: oauth2-proxy
          port: 4180
