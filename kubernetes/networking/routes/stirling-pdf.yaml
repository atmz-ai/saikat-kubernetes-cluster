apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      sectionName: http
  hostnames:
    - pdf.saikat.oleole.ai
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      sectionName: https-stirling-pdf
  hostnames:
    - pdf.saikat.oleole.ai
  rules:
    - backendRefs:
        - name: stirling-pdf
          namespace: stirling-pdf
          port: 8080