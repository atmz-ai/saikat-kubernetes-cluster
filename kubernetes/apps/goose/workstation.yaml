apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: goose-workstation
  namespace: goose
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: goose-workstation
    spec:
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 16Gi
        devices:
          disks:
            - name: root-disk
              disk:
                bus: virtio
            - name: cloud-init
              disk:
                bus: virtio
            - name: ssh-host
              serial: GOOSEHOSTKEY
              disk:
                bus: virtio
            - name: machine-access
              serial: GOOSEACCESS
              disk:
                bus: virtio
            - name: ssh-config
              serial: GOOSECONFIG
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      readinessProbe:
        guestAgentPing: {}
      # ! Secret and ConfigMap ISO disks are boot snapshots, not live guest projections.
      volumes:
        - name: root-disk
          dataVolume:
            name: goose-workstation-root
        - name: ssh-host
          secret:
            secretName: goose-ssh-host
        - name: machine-access
          secret:
            secretName: goose-machine-access-ssh
        - name: ssh-config
          configMap:
            name: goose-ssh-config
        - name: cloud-init
          cloudInitNoCloud:
            secretRef:
              name: goose-workstation-cloud-init