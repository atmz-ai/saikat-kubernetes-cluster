apiVersion: v1
kind: Service
metadata:
  name: goose-browser
  namespace: goose
spec:
  selector:
    app: goose-browser
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: goose
  namespace: goose
spec:
  selector:
    app: goose
  ports:
    - name: acp
      port: 3284
      targetPort: acp