apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: goose-workstation-root
  namespace: goose
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/releases/26.04/release-20261016/ubuntu-26.04-server-cloudimg-amd64.img
      checksum: sha256:5645d0318ad21f643ebb1ac4567514620e9893380b07b0201fda163baa5b7eb5
  storage:
    accessModes:
      - ReadWriteOnce
    volumeMode: Filesystem
    storageClassName: longhorn
    resources:
      requests:
        storage: 80Gi