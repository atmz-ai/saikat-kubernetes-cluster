apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: goose-ssh
  namespace: goose
spec:
  gatewayClassName: cilium
  listeners:
    - name: ssh
      protocol: TCP
      port: 2222
      allowedRoutes:
        kinds:
          - kind: TCPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: goose-ssh
  namespace: goose
spec:
  parentRefs:
    - name: goose-ssh
      sectionName: ssh
  rules:
    - backendRefs:
        - name: goose-workstation
          port: 22