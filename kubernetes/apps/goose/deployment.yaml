apiVersion: apps/v1
kind: Deployment
metadata:
  name: goose
  namespace: goose
  annotations:
    secret.reloader.stakater.com/reload: goose-machine-access-ssh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: goose
  template:
    metadata:
      labels:
        app: goose
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-home
          image: harbor.yral.com/library/goose@sha256:6994a795ca7ed3ff17ab7fdad54f2986f815a31a0247fdafaa88d66fc8cd488a
          command:
            - /bin/sh
            - -ec
            - >-
              mkdir -p /home/goose/.config/goose /home/goose/workspace &&
              cp /run/goose-machine-access/ssh-privatekey /home/goose/.ssh/id_ed25519 &&
              chmod 0600 /home/goose/.ssh/id_ed25519
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/goose
            - name: ssh-identity
              mountPath: /home/goose/.ssh
            - name: machine-access-secret
              mountPath: /run/goose-machine-access
              readOnly: true
      containers:
        - name: goose
          image: harbor.yral.com/library/goose@sha256:6994a795ca7ed3ff17ab7fdad54f2986f815a31a0247fdafaa88d66fc8cd488a
          workingDir: /home/goose/workspace
          args:
            - serve
            - --platform
            - desktop
            - --host
            - 0.0.0.0
            - --port
            - "3284"
            - --roam
          ports:
            - name: acp
              containerPort: 3284
          envFrom:
            - configMapRef:
                name: goose-runtime
            - secretRef:
                name: goose-credentials
            - secretRef:
                name: goose-desktop-auth
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /status
              port: acp
          volumeMounts:
            - name: home
              mountPath: /home/goose
            - name: trust
              mountPath: /home/goose/.config/goose/roaming_trust.json
              subPath: roaming_trust.json
              readOnly: true
            - name: ssh-identity
              mountPath: /home/goose/.ssh
              readOnly: true
            - name: ssh-config
              mountPath: /etc/goose-ssh
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: goose-home
        - name: trust
          configMap:
            name: goose-trust
        - name: ssh-identity
          emptyDir:
            medium: Memory
        - name: machine-access-secret
          secret:
            secretName: goose-machine-access-ssh
            defaultMode: 0440
        - name: ssh-config
          configMap:
            name: goose-ssh-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goose-browser
  namespace: goose
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goose-browser
  template:
    metadata:
      labels:
        app: goose-browser
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: browser
          image: harbor.yral.com/library/goose-browser@sha256:78ddd11b9ae231b07c1e3bd315aca92c7d34d85414314f69935c671a5132c35e
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /goose-mobile/
              port: http
          livenessProbe:
            httpGet:
              path: /goose-mobile/
              port: http