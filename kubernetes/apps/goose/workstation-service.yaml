apiVersion: v1
kind: Service
metadata:
  name: goose-workstation
  namespace: goose
spec:
  # ! SSH cannot use TCPRoute while Gateway host-network mode is enabled.
  type: LoadBalancer
  loadBalancerClass: io.cilium/node
  allocateLoadBalancerNodePorts: false
  selector:
    app: goose-workstation
  ports:
    - name: ssh
      port: 2222
      targetPort: 22