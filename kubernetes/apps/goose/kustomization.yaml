apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configurations:
  - name-references.yaml
configMapGenerator:
  - name: goose-trust
    namespace: goose
    files:
      - roaming_trust.json
  - name: goose-ssh-config
    namespace: goose
    files:
      - gitconfig
      - ssh_config
      - known_hosts
resources:
  - namespace.yaml
  - reference-grant.yaml
  - configmap.yaml
  - persistentvolumeclaim.yaml
  - deployment.yaml
  - service.yaml
  - workstation-root-disk.yaml
  - workstation.yaml
  - workstation-service.yaml
  - ssh-gateway.yaml
  - credentials.sops.yaml
  - desktop-auth.sops.yaml
  - machine-access-ssh.sops.yaml
  - ssh-host.sops.yaml
  - harbor-pull-secret.sops.yaml