apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: goose-trust
    namespace: goose
    files:
      - roaming_trust.json
resources:
  - namespace.yaml
  - reference-grant.yaml
  - configmap.yaml
  - persistentvolumeclaim.yaml
  - deployment.yaml
  - service.yaml
  - credentials.sops.yaml
  - harbor-pull-secret.sops.yaml