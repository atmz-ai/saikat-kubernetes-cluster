---
apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  name: my-website
  namespace: my-website
spec:
  source:
    type: Git
    git:
      url: https://github.com/saikatdas0790/saikat-kubernetes-cluster.git
      revision: main
  strategy:
    name: buildkit
    kind: ClusterBuildStrategy
  paramValues:
    - name: dockerfile
      value: apps/my-website/Dockerfile.buildkit
    - name: cache
      value: registry
  output:
    image: harbor.saikat.dev/my-website/my-website
    pushSecret: harbor-pull-secret
  retention:
    succeededLimit: 3
    failedLimit: 3
    ttlAfterSucceeded: 1h
    ttlAfterFailed: 24h