apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: harbor
namespace: harbor

resources:
  - namespace.yaml
  - reference-grant.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - harbor-admin-secret.sops.yaml
  - oidc-values.sops.yaml
  # The `harbor` application role and its password. This is the only credential Harbor
  # uses, and the DatabaseRole owns it, so it cannot drift the way the superuser's did.
  - harbor-role-secret.sops.yaml
  - databaserole.yaml
  # Owns the ownership-transfer SQL. Live use was a one-off migration Job (now removed,
  # its work done and verified); it remains here because cnpg-cluster.yaml references it
  # as the postInitApplicationSQLRefs hook, so a fresh bootstrap stays correct.
  # ! Removing this file from the list would also drop the ConfigMap that hook needs.
  - harbor-db-grants.yaml
  - cnpg-cluster.yaml
  - postgresql-backups.yaml
  - ../loki/loki-rustfs-credentials.sops.yaml
patches:
  - target:
      kind: Secret
      name: loki-rustfs-credentials
    patch: |-
      - op: replace
        path: /metadata/name
        value: postgresql-rustfs-credentials
