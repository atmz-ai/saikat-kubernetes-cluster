apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: harbor
namespace: harbor

resources:
  - namespace.yaml
  - reference-grant.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - harbor-admin-secret.sops.yaml
  # ! Kept until the superuser role is genuinely retired. cnpg-cluster.yaml still
  # ! references it via superuserSecret, and removing it from this list would make
  # ! Flux PRUNE the live Secret out from under that reference. It is stale (its
  # ! password fails over TCP) but it is still wired in; retiring it is a separate,
  # ! coordinated change.
  - harbor-db-superuser.sops.yaml
  # The `harbor` application role and its password. This is what Harbor connects as —
  # see databaserole.yaml. Keep this file in the kustomization: it is the only
  # credential Harbor uses, and it cannot drift because the DatabaseRole owns it.
  - harbor-role-secret.sops.yaml
  - databaserole.yaml
  # Owns the ownership-transfer SQL. Live use was a one-off migration Job (now removed,
  # its work done and verified); it remains here because cnpg-cluster.yaml references it
  # as the postInitApplicationSQLRefs hook, so a fresh bootstrap stays correct.
  - harbor-db-grants.yaml
  - cnpg-cluster.yaml
