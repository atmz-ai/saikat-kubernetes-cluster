apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 30m
  timeout: 10m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: harbor
      version: "1.19.4"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor
  values:
    externalURL: https://harbor.yral.com
    
    # Expose core service internally for oauth2-proxy backend
    expose:
      type: clusterIP
      tls:
        enabled: false
        certSource: none
        auto:
          commonName: harbor.yral.com
      core:
        servicePort: 80
    
    # Disable Harbor's built-in auth — oauth2-proxy provides authentication
    # oauth2-proxy will handle authz/authn before reaching Harbor core
    
    # Storage backend for images
    persistence:
      enabled: true
      resourceName: registry
      storageClass: "longhorn"
      persistentVolumeClaim:
        registry:
          size: 50Gi
        jobservice:
          size: 10Gi
        redis:
          size: 5Gi
    
    # Disable components not needed for temporary app registry
    chartmuseum:
      enabled: false
    notary:
      enabled: false
    trivy:
      enabled: false

    # Harbor only templates updateStrategy.type for these PVC-backed Deployments.
    # Use Recreate so the old pod releases the RWO volume before the new pod starts.
    updateStrategy:
      type: Recreate

    # Core Harbor settings
    # podAnnotations trigger a restart when changed — Harbor core needs to
    # re-run schema migrations on the fresh DB (recreated after purge).
    core:
      replicas: 1
      podAnnotations:
        restart-trigger: "db-password-rotation"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
    
    registry:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    
    jobservice:
      replicas: 1
      podAnnotations:
        restart-trigger: "db-password-rotation"
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    
    database:
      type: external
      external:
        host: harbor-db-rw.harbor.svc
        port: "5432"
        # ! Must match the `harbor` role. The role and the database ownership are
        # ! managed declaratively by databaserole.yaml + harbor-db-grants.yaml; see
        # ! databaserole.yaml for why the application role is kept distinct from
        # ! CNPG's `postgres` superuser.
        username: harbor
        coreDatabase: registry
        # The `harbor` role's password, from harbor-role-secret.sops.yaml. Only needs
        # `username` + `password` keys, which is what that Secret carries.
        # ! Do NOT point this back at harbor-db-superuser or harbor-db-app. Both
        # ! describe the `postgres` superuser, whose password drifts independently of
        # ! this Secret — that drift is what broke the registry on 2026-10-02. Only
        # ! harbor-role-secret is owned by the DatabaseRole, so only it cannot drift.
        existingSecret: harbor-role-secret
        sslmode: disable
    
    redis:
      type: internal
  
  valuesFrom:
    # Admin password lives in harbor-admin-secret.sops.yaml (SOPS-encrypted).
    # When the Harbor admin password or robot account credentials change, update ALL:
    #   1. kubernetes/infrastructure/harbor/harbor-admin-secret.sops.yaml  (admin password)
    #   2. kubernetes/apps/<app>/harbor-pull-secret.sops.yaml             (robot creds, per-app)
    # * Website image scans use kubernetes/apps/my-website/harbor-scan-secret.sops.yaml.
    # Use: mise run sops-decrypt <file> / mise run sops-encrypt <file>
    - kind: Secret
      name: harbor-secrets
      valuesKey: admin-password
      targetPath: harborAdminPassword
