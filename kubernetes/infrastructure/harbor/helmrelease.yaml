apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 30m
  timeout: 10m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: harbor
      version: "1.19.4"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor
  values:
    externalURL: https://harbor.saikat.dev
    
    expose:
      type: clusterIP
      tls:
        enabled: false
        certSource: none
      core:
        servicePort: 80
    
    persistence:
      enabled: true
      resourceName: registry
      storageClass: "longhorn"
      persistentVolumeClaim:
        registry:
          size: 50Gi
        jobservice:
          size: 10Gi
        redis:
          size: 5Gi
    
    chartmuseum:
      enabled: false
    notary:
      enabled: false
    trivy:
      enabled: false

    # ! Recreate releases each RWO volume before its replacement pod starts.
    updateStrategy:
      type: Recreate

    core:
      replicas: 1
      podAnnotations:
        restart-trigger: "db-password-rotation"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
    
    registry:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    
    jobservice:
      replicas: 1
      podAnnotations:
        restart-trigger: "db-password-rotation"
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    
    database:
      type: external
      # ! The default pool retained 97 idle connections, exhausting CNPG's 100
      # ! slots and preventing garbage collection from connecting.
      maxIdleConns: 10
      maxOpenConns: 80
      external:
        host: harbor-db-rw.harbor.svc
        port: "5432"
        # ! Keep the application role distinct from CNPG's postgres superuser.
        username: harbor
        coreDatabase: registry
        # ! DatabaseRole owns this credential; never substitute a postgres Secret.
        existingSecret: harbor-role-secret
        sslmode: disable
    
    redis:
      type: internal
  
  valuesFrom:
    - kind: Secret
      name: harbor-oidc-values
      valuesKey: values.yaml
    # ! Rotate application pull/push and Flux scanning credentials together.
    - kind: Secret
      name: harbor-secrets
      valuesKey: admin-password
      targetPath: harborAdminPassword
