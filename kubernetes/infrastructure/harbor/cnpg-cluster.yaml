# CloudNativePG Cluster for Harbor — 2-instance HA with streaming replication.
#
# Bootstrap: fresh initdb. Harbor's old internal PostgreSQL (harbor-database)
#            was removed by Helm when database.type switched to external.
#            Harbor core re-initializes its schema on first connect (migrations
#            run automatically via the `core` pod's init container).
#
# 2 instances (1 primary + 1 replica) with built-in streaming replication.
# Uses longhorn-1replica StorageClass per the storage replication policy —
# CNPG has native app-layer replication (streaming), so Longhorn 2-replica
# would be redundant write amplification.
#
# Harbor connects via the -rw endpoint (harbor-db-rw.harbor.svc:5432).
# Database: registry, User: postgres.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  # No enableSuperuserAccess and no superuserSecret — same as pdns-db, and for the same
  # reason: nothing here performs administrative work. Harbor connects as the `harbor`
  # application role (helmrelease.yaml) and no backup plugin or ScheduledBackup is
  # configured, so the superuser role has no consumer at all.
  #
  # Having it enabled was actively harmful. `enableSuperuserAccess: true` makes the
  # operator manage the `postgres` role's password from the superuser Secret, but the
  # application side was also reading a `postgres` credential — so two sources owned one
  # password and Harbor read the one that drifted. That produced
  # `FATAL: password authentication failed for user "postgres"`, a 500 on
  # GET /api/v2.0/internalconfig, and a crash-looping harbor-jobservice (2026-10-02).
  # The fix was to stop sharing a role between the application and the superuser, not to
  # repair the password. See databaserole.yaml.

  # Fresh initdb — Harbor core runs schema migrations on first connect.
  # The old Harbor internal DB was removed by Helm when we switched to
  # database.type: external, so there's no source to import from.
  #
  # ! `owner` and `postInitApplicationSQLRefs` are read ONLY at bootstrap, so both are
  # ! inert on the live cluster and safe to change. They exist so a FUTURE rebuild comes
  # ! up correct by construction rather than repeating the 2026-10-02 outage: the live
  # ! database was migrated to the `harbor` role by hand (see
  # ! harbor-db-ownership-migration.yaml) and this keeps a fresh bootstrap matching it.
  bootstrap:
    initdb:
      database: registry
      # A dedicated low-privilege role, not `postgres`. An earlier revision used
      # `owner: postgres`, which made the application role and CNPG's superuser the
      # same role — the bug class documented at length in external-dns/cnpg-cluster.yaml.
      owner: harbor
      # No-op on a fresh bootstrap (harbor already owns everything via `owner` above),
      # but the same script the one-off migration Job ran against the existing
      # database, so the two cannot drift apart. See harbor-db-grants.yaml.
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: harbor-db-grants
            key: grants.sql

  storage:
    storageClass: longhorn-1replica
    size: 10Gi