apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgresql-rustfs-backup-store

  bootstrap:
    initdb:
      database: registry
      owner: harbor
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: harbor-db-grants
            key: grants.sql

  storage:
    storageClass: longhorn-1replica
    size: 10Gi