# One-off ownership migration: reassign every object in the `registry` database
# from the `postgres` superuser to the new `harbor` application role.
#
# WHY A JOB AND NOT JUST postInitApplicationSQLRefs. `postInitApplicationSQLRefs`
# runs only during `initdb`, i.e. when the cluster is first created. This database
# already exists with `owner: postgres`, so the bootstrap hook cannot fix it — the
# hook alone would only make a FUTURE rebuild correct. This Job performs the same
# SQL against the live database, and is the reason the two share one script rather
# than duplicating it.
#
# Idempotent by construction: harbor-db-grants.yaml guards every statement with an
# ownership check, so re-running is a no-op. Safe to delete and let Flux recreate.
#
# ! Runs as `postgres`. The only working password for that role right now is in the
# ! `harbor-db-app` secret — verified over TCP, not inferred: `harbor-db-superuser`'s
# ! password fails with `password authentication failed for user "postgres"` while
# ! `harbor-db-app`'s succeeds. It is the bootstrap-era password, not the one the
# ! superuser secret carries.
# ? Note this CONTRADICTS AGENTS.md, which states that enableSuperuserAccess makes the
# ? operator sync the `postgres` password from the superuser secret on every reconcile.
# ? It demonstrably has not: the live superuser secret still holds the bootstrap value
# ? and the database does not accept it. AGENTS.md needs visiting once this is settled.
# ! Consequence, and the reason cnpg-cluster.yaml is NOT changed in this commit:
# !   - Disabling enableSuperuserAccess may set the `postgres` password to NULL, which
# !     would break BOTH secrets, including the credential this Job needs. It must wait
# !     until nothing reaches postgres over TCP.
# !   - The stale superuser secret must stay wired in and un-pruned until then, because
# !     cnpg-cluster.yaml still references it via superuserSecret.
# ! This Job does not depend on either resolution: it authenticates with -app, and only
# ! needs the `harbor` role to exist (created separately by databaserole.yaml).
#
# ! Deliberately does NOT restart Harbor. Harbor keeps running on its current
# ! credentials throughout, so this commit is reversible and has no service impact.
# ! Switching Harbor to the `harbor` role is a separate, later change — doing it in
# ! the same commit would point Harbor at a role before it owned anything, breaking
# ! the registry immediately.
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-db-ownership-migration
  namespace: harbor
spec:
  # Never retry into a half-migrated database; a failure should be read, not looped
  # over. The SQL is idempotent, so a manual re-run is always safe.
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/cloudnative-pg/postgresql:18.4
          env:
            - name: PGHOST
              value: harbor-db-rw.harbor.svc
            - name: PGDATABASE
              value: registry
            - name: PGUSER
              # The application role is not superuser, so it cannot reassign objects
              # it does not own — this migration must run as the current owner.
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-db-app
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # ! Wait for the `harbor` role to exist before touching anything.
              # ! The DatabaseRole that creates it lands in the SAME kustomization as
              # ! this Job, so there is no ordering guarantee between them: Flux applies
              # ! both in one pass and the Job can readily start first. Without this
              # ! wait, `ALTER TABLE ... OWNER TO harbor` fails with
              # ! `role "harbor" does not exist` — and with backoffLimit: 0 there is no
              # ! retry, so the migration would simply never run.
              echo "waiting for role 'harbor' to exist..."
              for attempt in $(seq 1 60); do
                if [ "$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='harbor'")" = "1" ]; then
                  echo "role 'harbor' present after ${attempt} attempt(s)"
                  break
                fi
                if [ "$attempt" = "60" ]; then
                  echo "ERROR: role 'harbor' never appeared; is the DatabaseRole reconciling?" >&2
                  exit 1
                fi
                sleep 5
              done

              echo "=== before ==="
              psql -tAc "SELECT tableowner, count(*) FROM pg_tables WHERE schemaname='public' GROUP BY 1"
              psql -tAc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname='registry'" \
                | sed 's/^/database owner: /'

              echo "=== applying grants.sql ==="
              psql -v ON_ERROR_STOP=1 -f /sql/grants.sql

              echo "=== after ==="
              psql -tAc "SELECT tableowner, count(*) FROM pg_tables WHERE schemaname='public' GROUP BY 1"
              psql -tAc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname='registry'" \
                | sed 's/^/database owner: /'

              # Fail loudly if anything was left behind, so a silent partial migration
              # cannot be mistaken for success. `public` is owned by pg_database_owner,
              # which resolves through the database owner checked above.
              left=$(psql -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tableowner <> 'harbor'")
              if [ "$left" != "0" ]; then
                echo "ERROR: $left table(s) still not owned by harbor" >&2
                exit 1
              fi
              echo "migration complete"
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: harbor-db-grants
