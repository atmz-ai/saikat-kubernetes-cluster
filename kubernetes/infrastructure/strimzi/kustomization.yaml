apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.3.1/helm-charts/helm3/strimzi-kafka-operator/crds/040-Crd-kafka.yaml
  - https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.3.1/helm-charts/helm3/strimzi-kafka-operator/crds/041-Crd-kafkaconnect.yaml
  - https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.3.1/helm-charts/helm3/strimzi-kafka-operator/crds/042-Crd-strimzipodset.yaml
  - https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.3.1/helm-charts/helm3/strimzi-kafka-operator/crds/043-Crd-kafkatopic.yaml
  - https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.3.1/helm-charts/helm3/strimzi-kafka-operator/crds/044-Crd-kafkauser.yaml
  - https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.3.1/helm-charts/helm3/strimzi-kafka-operator/crds/045-Crd-kafkanodepool.yaml
  - https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.3.1/helm-charts/helm3/strimzi-kafka-operator/crds/046-Crd-kafkabridge.yaml
  - https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.3.1/helm-charts/helm3/strimzi-kafka-operator/crds/047-Crd-kafkaconnector.yaml
  - https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.3.1/helm-charts/helm3/strimzi-kafka-operator/crds/048-Crd-kafkamirrormaker2.yaml
  - https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.3.1/helm-charts/helm3/strimzi-kafka-operator/crds/049-Crd-kafkarebalance.yaml
patches:
  # ! Retained CRDs still declare v1beta2 in status.storedVersions; adoption must retain it.
  - target:
      kind: CustomResourceDefinition
    patch: |
      - op: copy
        from: /spec/versions/0
        path: /spec/versions/-
      - op: replace
        path: /spec/versions/1/name
        value: v1beta2
      - op: replace
        path: /spec/versions/0/storage
        value: false
