# * Combined broker/controller pool; zone anti-affinity permits cross-region placement.
#
# Storage: 250Gi Longhorn PVC per node (1 replica via longhorn-1replica StorageClass)
#   Kafka provides its own replication (3 brokers, replication.factor=3) which is strictly
#   stronger than Longhorn 2-replica: tolerates 2/3 node failures vs Longhorn's 1/2.
#   Adding Longhorn replication on top would create 6× write amplification per produce request
#   (3 brokers × 2 Longhorn replicas) with no additional durability benefit.
#   200Gi  — data headroom for snowplow-enriched topic (200GiB cap spread across 12 partitions)
#    50Gi  — Kafka index files, __consumer_offsets, Connect internal topics, overhead
#
# Pool name 'combined-ceph': kept from the Ceph era to avoid breaking KRaft
# metadata and topic partition assignments. The name is cosmetic — the pool
# now uses Longhorn storage.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined-ceph
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 250Gi
    class: longhorn-1replica
    deleteClaim: true
  template:
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    strimzi.io/cluster: kafka-cluster
                topologyKey: topology.kubernetes.io/zone
---
# Kafka CR — KRaft mode (no ZooKeeper)
#
# SASL_PLAINTEXT listener on port 9092 for internal cluster traffic.
# All communication inside the Cilium WireGuard mesh is already encrypted
# at the network layer, so TLS at the Kafka layer is not required.
#
# Retention policy:
#   log.retention.ms=-1   — disables time-based global retention
#   log.retention.bytes   — set per-topic on snowplow-enriched KafkaTopic CR
#   log.retention.ms      — set per-topic on snowplow-raw KafkaTopic CR
#
# Replication:
#   default.replication.factor=3   — every topic replicated to all 3 brokers
#   min.insync.replicas=2          — producer acks=all requires 2/3 in-sync
# `v1` rather than the deprecated `v1beta2`: the CRD serves both, and every other
# Strimzi CR in this repo (KafkaNodePool, KafkaTopic, KafkaUser, KafkaBridge) is
# already on `v1`. Verified the API server accepts this CR as `v1` unchanged.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: kafka
  # strimzi.io/node-pools and strimzi.io/kraft annotations removed — both are
  # enabled by default from Strimzi 0.48.0 onwards and no longer need to be set.
spec:
  kafka:
    # 4.3.1 is the default Kafka version for Strimzi 1.2.0 (the chart pinned in
    # kubernetes/infrastructure/strimzi/helmrelease.yaml), so it is the version
    # the operator exercises most. Verify at:
    # https://github.com/strimzi/strimzi-kafka-operator/releases/tag/1.2.0
    #
    # This MUST stay within the set the running operator supports. Renovate bumped
    # the Strimzi chart 0.51.0 -> 1.2.0 on 2026-09-03, which dropped support for the
    # previously pinned 4.1.1; the operator then refused to reconcile the Kafka CR:
    #   Unsupported Kafka.spec.kafka.version: 4.1.1.
    #   Supported versions are: [4.2.0, 4.2.1, 4.3.0, 4.3.1]
    # The brokers kept serving, but the CR went NotReady, which stalled
    # infrastructure-kafka (wait: true) and would have blocked any broker restart or
    # node-pool change. When bumping the Strimzi chart, bump this in the same change.
    version: 4.3.1
    # metadataVersion tracks the broker's on-disk/wire format and CANNOT be
    # downgraded, so this is a one-way door. 4.3-IV0 is the metadata version paired
    # with Kafka 4.3.x (from the operator's own kafka-versions.yaml).
    metadataVersion: "4.3-IV0"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      # Replication and durability
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # Retention: disable global time-based retention; individual topics
      # configure their own via KafkaTopic CR overrides.
      log.retention.ms: -1
      log.retention.check.interval.ms: 300000
      # Performance
      num.partitions: 12
      log.flush.interval.messages: 10000
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafkaExporter:
    # Exposes consumer group lag and topic offset metrics for Prometheus.
    # Strimzi deploys a kafka-cluster-kafka-exporter Deployment + Service (port 9404).
    topicRegex: "snowplow.*"
    groupRegex: ".*"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
