apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kilo
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kilo
    app.kubernetes.io/part-of: kilo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kilo
      app.kubernetes.io/part-of: kilo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kilo
        app.kubernetes.io/part-of: kilo
    spec:
      serviceAccountName: kilo
      # The agent manipulates the HOST's network stack (creates the `kilo0`
      # WireGuard interface, IPIP tunnels and routes), so it must share the host
      # network namespace.
      hostNetwork: true
      containers:
        - name: kilo
          # Version is pinned to the upstream release this manifest is vendored
          # from. Bump together with the comment in kustomization.yaml.
          image: squat/kilo:0.7.0
          args:
            - --hostname=$(NODE_NAME)

            # ADAPTATION 1 — no --kubeconfig.
            # The upstream manifest passes --kubeconfig=/etc/kubernetes/kubeconfig
            # and mounts /etc/kubernetes/admin.conf, which exists ONLY on the 7
            # control-plane nodes. This DaemonSet must run on all 40 nodes, so on
            # the 33 workers that file is absent and the agent would fail to start.
            # With both --kubeconfig and --master unset, kg falls back to in-cluster
            # config (clientcmd.BuildConfigFromFlags("", "")), using the `kilo`
            # ServiceAccount from rbac.yaml. Same credentials, works everywhere.

            # ADAPTATION 2 — --internal-cidr pins the node's mesh identity.
            # Kilo considers a node's InternalIP to be its *private* address, and
            # that is the address other nodes route to over WireGuard. kubelet,
            # etcd and the API server all advertise `status.hostIP` too, so pinning
            # Kilo to $(NODE_IP)/32 (status.hostIP) keeps a single, consistent node
            # address across kubelet / etcd / Cilium / Kilo. Without it, Kilo's
            # heuristic could pick a different interface (e.g. a secondary NIC) and
            # cross-cloud etcd would break even though the mesh itself came up.
            - --internal-cidr=$(NODE_IP)/32

            # Cilium compatibility mode. Selected in cmd/kg/main.go:
            #   case compatCilium: enc = encapsulation.NewCilium(e)
            # It makes Kilo:
            #   (a) NOT install its own CNI (`--cni=false` below) — Cilium owns that;
            #   (b) NOT manage in-location routes (`--local=false` below) — Cilium
            #       already routes pods within a location;
            #   (c) encapsulate cross-location packets with IPIP and route the IPIP
            #       outer packet THROUGH Cilium's VXLAN overlay, by advertising each
            #       node's `cilium_host` address (CNICompatibilityIP) as the gateway.
            # Consequence: Cilium must stay in tunnel/VXLAN mode. Switching it to
            # native routing removes the overlay (c) depends on.
            # Source: https://github.com/squat/kilo/blob/0.7.0/pkg/encapsulation/cilium.go
            - --compatibility=cilium

            # Kilo does not own the CNI config or the in-location datapath; Cilium
            # does. Both flags are required for the add-on role described above.
            - --cni=false
            - --local=false

            # Encapsulate only when the peers are NOT in the same subnet.
            #   never      → no encapsulation; also DISABLES the leader's
            #                return-path IPIP routes (pkg/mesh/routes.go gates them
            #                on `enc.Strategy() != Never`), which is required in the
            #                --local=false case, so `never` is not usable here.
            #   crosssubnet→ encapsulate cross-subnet peers only.
            #   always     → encapsulate every intra-location packet too.
            # With --local=false the only paths Kilo builds are cross-location
            # (Cilium owns in-location), so those are always cross-subnet and get
            # encapsulated either way; `crosssubnet` is chosen because it keeps the
            # leader return-path routes enabled without adding redundant
            # encapsulation for anything Cilium already handles.
            # Source: https://github.com/squat/kilo/blob/0.7.0/pkg/mesh/routes.go
            - --encapsulate=crosssubnet

            # Kilo creates `kilo0`; remove it on shutdown so a stopped agent does not
            # leave a stale interface with stale keys behind.
            - --clean-up-interface=true

            # TODO: reduce log level after validation.
            # Verbose logging, deliberately kept on rather than quieted after
            # bring-up. A silent run is unverifiable: the agent's per-peer and
            # per-route lines are what let an operator confirm the mesh came up and
            # follow each location's link as it forms. WireGuard peer state is also
            # invisible from `kubectl get` alone, so these logs are the primary
            # signal. Reduce only if the volume becomes a real problem.
            - --log-level=all
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            # Health + Prometheus metrics, scraped by podmonitor.yaml.
            - containerPort: 1107
              name: metrics
          securityContext:
            # Required: creates interfaces, writes routes/iptables and owns the
            # WireGuard private key on the host.
            privileged: true
          volumeMounts:
            - name: kilo-dir
              mountPath: /var/lib/kilo
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: xtables-lock
              mountPath: /run/xtables.lock
              readOnly: false
      # Run on every node, including control-plane nodes (which carry the
      # node-role taint) — an unmeshed CP node cannot reach peers' etcd.
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      volumes:
        # Persists the node's WireGuard keypair across restarts, so peers do not
        # have to re-learn public keys each time the agent restarts.
        - name: kilo-dir
          hostPath:
            path: /var/lib/kilo
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
