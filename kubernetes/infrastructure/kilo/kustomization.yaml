# ══════════════════════════════════════════════════════════════════════════════
# THIS BREAKS THE CLUSTER ON OUR CURRENT NODES. FLUX IS SUSPENDED. READ BEFORE USE.
# ══════════════════════════════════════════════════════════════════════════════
# Installed 2026-09-26; broke pod->ClusterIP service routing cluster-wide within
# ~7 minutes and was removed the same day. Evidence: 78 pods across 18 namespaces
# in crash loops (5 of 6 Flux controllers among them, so Flux could not deliver its
# own fix), and `dial tcp 10.105.112.195:80: i/o timeout` / `10.96.0.1:443 context
# deadline exceeded` from in-cluster clients. Stopping Kilo restored service: new
# crashes 13/3min -> 0, not-ready pods 29 -> 10, Flux 5/6 crash-looping -> 6/6 ready.
#
# ROOT CAUSE — per-node locations + `--local=false` is a combination that installs a
# default route for the pod CIDR of every other node.
#
# On Hetzner every node is PUBLIC-only (see daemonset.yaml: getIP/isPublic cannot
# classify a public address as private, so InternalIP is nil). Kilo then gives each
# node its own location (pkg/mesh/topology.go):
#     if node.InternalIP == nil { location = nodeLocationPrefix + node.Name }
# so the cluster becomes 40 locations of one node. Every node is therefore its OWN
# leader — confirmed live via `kilo_leader 1` on every node — and the leader branch
# of Topology.Routes (pkg/mesh/routes.go) runs.
#
# That branch only adds the *pod-CIDR* route for another segment (line ~229):
#     for i := range segment.cidrs {
#         routes = append(routes, &netlink.Route{Dst: segment.cidrs[i], Gw: segment.wireGuardIP, LinkIndex: kiloIface, ...})
# while the guarded route that would pin the node's own private IP is skipped
# whenever privateIP == externalIP — i.e. exactly on a public-only node:
#     // Don't add routes through Kilo if the private IP equals the external IP.
#     if segment.privateIPs == nil || segment.privateIPs[i].Equal(<endpoint IP>) { continue }
# Net result: a route is installed for every other node's pod CIDR, with no matching
# node-IP route to anchor it.
#
# Separately, the leader's return-path block — the code that exists to route return
# traffic correctly when a non-leader uses overlay routing — is gated on `--local`:
#     if !local && t.privateIP != nil && enc.Strategy() != encapsulation.Never { ... }
# With `--local=false` (the upstream Cilium-mode setting) it is skipped entirely.
#
# So `--local=false` was a false assumption here: it means "Cilium owns all
# in-location routing", which is only true if nodes actually group into locations.
# With 40 single-node locations there IS no in-location traffic — every packet is
# cross-location — and Kilo installed IPIP routes for all of it while skipping the
# return paths. Cilium compounded it by adopting the Kilo interface and binding the
# overlay IP into nodeport handling:
#     msg="Devices changed" devices="[enp0s31f6 kilo0]"
#     msg="Node addresses updated" addresses="10.4.0.1 (primary, nodeport)" device=kilo0
#
# WHY UPSTREAM DIDN'T CATCH IT: kilo-kubeadm-cilium.yaml is written for clusters whose
# nodes HAVE private IPs, where locations are real and `--local=false` is correct.
# The per-node-location fallback is meant as a graceful degradation; combined with
# `--local=false` it is not graceful. This configuration is untested upstream.
#
# TO GO FORWARD — CORRECTED. An earlier version of this note said to scope the
# DaemonSet to a SINGLE node first. That would not have been a valid test: the
# breakage comes from the OTHER nodes each being in their own location, so with one
# node Kilo would simply look idle and pass for the wrong reason. Three constraints
# follow, and they must be satisfied together, not sequentially:
#
#   (a) EVERY node the DaemonSet touches must end up in a POPULATED location —
#       otherwise we are right back in the per-node-location failure mode. On a
#       public-only node this means setting `kilo.squat.ai/force-internal-ip`
#       (verified in pkg/k8s/backend.go: the annotation sets node.InternalIP, and
#       pkg/mesh/topology.go then groups by region instead of `node:<name>`).
#       On Hetzner the routable IP IS on the interface, unlike Azure, so pointing
#       the annotation at the node's public IP is legitimate.
#   (b) `--local` must match the topology. `--local=false` means "the CNI owns
#       in-location routing", which is only true when locations are real.
#   (c) There is NO way to make Kilo fail safe on a subset of nodes. Scaling the
#       DaemonSet down, or pointing a nodeSelector at a node that does not exist,
#       kills EVERY pod — so the first node we touch is already a whole-cluster
#       change. There is no small blast radius to be had; see below.
#
# The only honest way to test is therefore STAGED, with a kill switch prepared
# before each stage and the cluster's health measured after each:
#
#   Stage 0 — PREPARE, change nothing. Confirm the kill switch works (scale to 0 /
#       non-matching nodeSelector => 0 pods, verified) and that a baseline is
#       green. Note the blast radius: Kilo must run on the nodes that host Cilium's
#       own pods, so even one meshed node changes Cilium's datapath there.
#   Stage 1 — the topology fix at small scale. Apply `force-internal-ip` to a
#       handful of nodes in ONE region (start with 3, all worker-N in FSN1) and
#       re-enable with a nodeSelector matching only those. With >=2 nodes in one
#       real location, `--local=false` is finally the correct setting, and the
#       per-node-location failure cannot occur. Measure: pod->ClusterIP, pod->pod
#       same-node and cross-node, node->node, Kilo logs, Cilium Cluster health.
#   Stage 2 — the same region, more nodes. Widen the nodeSelector within FSN1.
#   Stage 3 — a second region (HEL1). This is the first genuine cross-location
#       test and the first time Kilo does its real job.
#   Stage 4 — remaining nodes, then Hetzner retirement.
#
# KILL SWITCH (needs no cluster access to reason about, only kubectl): point
# spec.template.spec.nodeSelector at a non-existent label, e.g.
# `kilo-disabled: "true"`, which drives every pod to 0 and lets kubelet tear down
# kilo0. Do NOT use `scale --replicas=0`; the scale subresource has returned
# NotFound on this cluster even when the API is healthy (kubectl patch and delete
# work, scale does not). A git-side change is still the only way to stop Flux from
# reverting the switch, but for stopping the bleeding mid-incident the patch is
# enough and takes effect in seconds.
#
# RE-ENABLE requires: removing `suspend: true` from
# kubernetes/clusters/yral-k8s/infrastructure-kilo.yaml IN THE SAME COMMIT as the
# nodeSelector and the force-internal-ip annotations, then watching the stages. Never
# un-suspend without a nodeSelector and annotations already in place — that is
# exactly the all-40-at-once rollout that took the cluster down.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kilo — multi-cloud WireGuard mesh (squat/kilo, Apache-2.0).
#
# WHY THIS EXISTS
# This cluster spans Hetzner HEL1, Hetzner FSN1, and (next) Azure/GCP/AWS regions.
# Nodes in different providers/DCs have no shared L3 network:

#   - Hetzner bare metal: public IP is ON the interface, so nodes are L3-adjacent
#     to the internet but not to each other within a private range.
#   - Cloud VMs (Azure/GCP/AWS): the OS only ever sees a PRIVATE address; the
#     public IP is 1:1 stateless NAT owned by the provider and must never be
#     configured on the interface ("Do not add any public IP addresses to the
#     virtual machine operating system." — Azure docs).

# Kilo builds a WireGuard mesh between logical locations, so cross-provider node
# IPs and pod CIDRs become mutually routable. Cilium remains the CNI.
#
# ROLE SPLIT (do not blur this)
#   Cilium → in-location pod networking, service load-balancing, Gateway API,
#            NetworkPolicy, in-location encryption.
#   Kilo   → cross-location reachability (the "wide area" half of the cluster).
# Both use WireGuard; that is intentional and not redundant — they encrypt
# different paths. See the `--encapsulate` note in daemonset.yaml.
#
# CILIUM STAYS IN TUNNEL MODE. Kilo's Cilium mode layers IPIP *through* Cilium's
# VXLAN overlay (it advertises the `cilium_host` address and routes the IPIP outer
# packet over it). Setting Cilium to `routingMode: native` would delete the overlay
# Kilo depends on. Do not "optimise" Cilium's routing mode while Kilo is installed.
#
# TOPOLOGY ON CURRENT NODES: 40 single-node locations (see the ROOT CAUSE block
# above for why, and why that combination is what breaks the cluster). This is NOT
# the "graceful degradation" it looks like — verify with:
#   kubectl get node <n> -o jsonpath='{.metadata.annotations.kilo\.squat\.ai/granularity}'
# Expect the cloud nodes to group into real locations once they join, since they DO
# have private addresses. That is the condition under which this becomes viable.
#
# VERSION PIN: 0.7.0 (released 2026-03-04) — latest upstream release; Kilo ships
# NO Helm chart, so the upstream `manifests/` YAML is the distribution mechanism
# and is vendored here verbatim (with the two adaptations noted in daemonset.yaml).
# Manifest source: https://github.com/squat/kilo/tree/0.7.0/manifests
# The version also appears in the DaemonSet image tag; bump BOTH together.
#
# Manual apply (before Flux is bootstrapped, or for a one-off):
#   kubectl apply -k kubernetes/infrastructure/kilo
resources:
  - crds.yaml
  - rbac.yaml
  - daemonset.yaml
  - podmonitor.yaml
