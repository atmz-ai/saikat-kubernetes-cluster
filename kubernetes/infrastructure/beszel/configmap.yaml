# ! Beszel resets password authentication from this environment on every restart.
# * Native Google configuration and pre-created users are managed by the beszel-auth role.
# ! SHARE_ALL_SYSTEMS permits writes by non-readonly users as well as reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beszel-config
  namespace: beszel
data:
  APP_URL: "https://beszel.saikat.dev"
  DISABLE_PASSWORD_AUTH: "true"
  SHARE_ALL_SYSTEMS: "true"