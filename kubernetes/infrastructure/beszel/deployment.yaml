apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel
  namespace: beszel
  annotations:
    configmap.reloader.stakater.com/reload: "beszel-config"
spec:
  replicas: 1
  # ! Recreate prevents overlapping pods from opening the same SQLite-backed PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beszel
  template:
    metadata:
      labels:
        app: beszel
      annotations:
        reloaded-at: "2026-08-25T07:00:00Z"
    spec:
      containers:
        - name: beszel
          image: henrygd/beszel:0.21.2
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: beszel-config
          volumeMounts:
            - name: beszel-data
              mountPath: /beszel_data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /_/
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_/
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: beszel-data
          persistentVolumeClaim:
            claimName: beszel-data