# Trino retirement — stage 2a.
#
# The HelmRelease was RESUMED (suspend: false) in the previous commit so that
# deleting it runs the Helm uninstall; a suspended release's delete skips the
# uninstall and orphans its resources (helm-controller reconcileDelete guards
# reconcileReleaseDeletion behind !spec.suspend).
#
# This commit removes ONLY the HelmRelease, keeping the Namespace so the
# release's Helm storage secret (which lives in this namespace) still exists
# when the uninstall runs. The Namespace is removed in stage 2b, after the
# uninstall has deleted the Deployment/Services/ConfigMaps.
apiVersion: v1
kind: Namespace
metadata:
  name: trino
