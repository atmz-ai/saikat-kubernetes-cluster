apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium-preflight
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.20.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  timeout: 15m
  values:
    agent: false
    operator:
      enabled: false
    # ! Preflight must not own or replace the active Cilium configuration.
    config:
      enabled: false
    preflight:
      enabled: true
    k8sServiceHost: kubernetes-api.yral.com
    k8sServicePort: 6443