apiVersion: batch/v1
kind: Job
metadata:
  name: netbird-google-bootstrap-v1
  namespace: netbird
  annotations:
    # ! Recreate only this initializer when image updates change its immutable template.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      # ! The bootstrap token shares the server's RWO volume, so colocate both pods.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: netbird-server
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-management
          image: docker.io/library/python:3.15.2-slim
          command: [python, -u, -c]
          args:
            - |
              import urllib.error
              import urllib.request
              print("Checking management readiness before authenticated bootstrap", flush=True)
              try:
                  with urllib.request.urlopen("http://netbird-server.netbird.svc.cluster.local/api/instance", timeout=30) as response:
                      if response.status != 200:
                          raise RuntimeError("Management readiness returned HTTP " + str(response.status))
              except urllib.error.HTTPError as error:
                  with error:
                      body = error.read(1048576).decode(errors="replace")
                  raise RuntimeError("Management HTTP " + str(error.code) + ": " + body) from error
              print("Management is ready", flush=True)
      containers:
        - name: configure-google
          image: docker.io/library/python:3.15.2-slim
          command: [python, -u, /configuration/bootstrap.py]
          env:
            - name: NETBIRD_OPERATOR_EMAIL
              value: saikat@atmz.ai
            - name: NETBIRD_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbird-server
                  key: bootstrap-password
            - name: NETBIRD_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: atmz-internal-apps-google-oauth
                  key: client-id
            - name: NETBIRD_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atmz-internal-apps-google-oauth
                  key: client-secret
          volumeMounts:
            - name: configuration
              mountPath: /configuration
              readOnly: true
            - name: data
              mountPath: /var/lib/netbird
      volumes:
        - name: configuration
          configMap:
            name: netbird-bootstrap
        - name: data
          persistentVolumeClaim:
            claimName: netbird-data
