apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: netbird-gateway-access
  namespace: netbird
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
  to:
    - group: ""
      kind: Service
      name: netbird-server
    - group: ""
      kind: Service
      name: netbird-grpc
    - group: ""
      kind: Service
      name: netbird-dashboard
