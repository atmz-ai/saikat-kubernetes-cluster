# ! Access is restricted by the Google client's Internal Workspace audience, not an email-domain filter.
# * Google callback: https://pdf.saikat.oleole.ai/login/oauth2/code/google
# * https://docs.stirlingpdf.com/Configuration/Security/OAuth%20SSO%20Configuration/
apiVersion: v1
kind: ConfigMap
metadata:
  name: stirling-pdf-config
  namespace: stirling-pdf
data:
  # ! One-startup ownership recovery; remove after the promotion is confirmed.
  STIRLING_ORG_OWNER_BREAK_GLASS: saikat@atmz.ai
  SECURITY_LOGINMETHOD: oauth2
  SECURITY_INITIALLOGIN_USERNAME: bootstrap-administrator
  SECURITY_OAUTH2_ENABLED: "true"
  SECURITY_OAUTH2_PROVIDER: google
  SECURITY_OAUTH2_AUTOCREATEUSER: "true"
  SECURITY_OAUTH2_BLOCKREGISTRATION: "false"
  SECURITY_OAUTH2_USEASUSERNAME: email
  SYSTEM_BACKENDURL: https://pdf.saikat.oleole.ai
  SYSTEM_FRONTENDURL: https://pdf.saikat.oleole.ai
  SYSTEM_CORSALLOWEDORIGINS: https://pdf.saikat.oleole.ai
  SYSTEM_ENABLEANALYTICS: "false"
  STORAGE_LOCAL_BASEPATH: /configs/storage