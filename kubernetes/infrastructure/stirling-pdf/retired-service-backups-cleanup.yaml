# ! Longhorn's native deletion is timing out; delete only the approved retired-volume prefixes.
apiVersion: batch/v1
kind: Job
metadata:
  name: retired-pdf-and-uptime-backups-cleanup-v1
  namespace: longhorn-system
spec:
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: delete-retired-pdf-backups
          image: public.ecr.aws/aws-cli/aws-cli:2.40.3
          args:
            - s3
            - rm
            - s3://saikat-kubernetes-cluster-longhorn-volume-snapshot-backups/backupstore/volumes/5e/29/pvc-3d2ecabc-e30a-4065-9c7b-9bb0ea1c52d1/
            - --recursive
          envFrom:
            - secretRef:
                name: longhorn-rustfs-credentials
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: longhorn-rustfs-credentials
                  key: AWS_ENDPOINTS
        - name: delete-retired-uptime-backups
          image: public.ecr.aws/aws-cli/aws-cli:2.40.3
          args:
            - s3
            - rm
            - s3://saikat-kubernetes-cluster-longhorn-volume-snapshot-backups/backupstore/volumes/e3/0a/pvc-ddf4a3e5-fb07-44c4-b7c7-499a7db850cc/
            - --recursive
          envFrom:
            - secretRef:
                name: longhorn-rustfs-credentials
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: longhorn-rustfs-credentials
                  key: AWS_ENDPOINTS
