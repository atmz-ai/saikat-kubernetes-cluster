# Trivy Operator — continuous security scanning (CIS Benchmark, vulnerabilities,
# config audits, exposed secrets, RBAC assessment, infra assessment).
#
# Replaces kube-bench with a CRD-native operator that stores results as
# Kubernetes resources (ClusterComplianceReport, VulnerabilityReport, etc.)
# queryable via kubectl and visualized in Headlamp via the Trivy plugin.
#
# Chart: https://artifacthub.io/packages/helm/trivy-operator/trivy-operator
# Source: https://github.com/aquasecurity/trivy-operator
#
# CIS Kubernetes Benchmark scanning is enabled by default via
# operator.clusterComplianceEnabled: true. The operator generates a
# ClusterComplianceReport CR every 6 hours with pass/fail/warn per control.
#
# The Headlamp Trivy plugin (added to the Headlamp HelmRelease) reads these CRs
# and renders them as visual dashboards.
#
# Standalone mode (default): each scan job downloads the Trivy DB independently
# to an emptyDir. No PVC needed. Simpler than ClientServer mode.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 1h
  chart:
    spec:
      chart: trivy-operator
      version: "0.36.0"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: trivy-system
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    operator:
      replicas: 1
      # CIS Kubernetes Benchmark — enabled by default, generates
      # ClusterComplianceReport CRs every 6 hours
      clusterComplianceEnabled: true
      # Vulnerability scanning — scans container images for CVEs
      vulnerabilityScannerEnabled: true
      # Config audit — checks workloads against security best practices
      configAuditScannerEnabled: true
      # Exposed secret scanning — detects secrets in container images
      exposedSecretScannerEnabled: true
      # RBAC assessment — checks RBAC for over-permissive bindings
      rbacAssessmentScannerEnabled: true
      # Infrastructure assessment — checks cluster infra (nodes, control plane)
      infraAssessmentScannerEnabled: true
      # SBOM generation — Software Bill of Materials for each image
      sbomGenerationEnabled: false
      # Limit concurrent scan jobs to avoid overwhelming the cluster
      scanJobsConcurrentLimit: 10
      # TTL for scan report CRs — old reports are garbage-collected
      scannerReportTTL: 24h
      # Scan jobs timeout
      scanJobTimeout: 5m
    trivy:
      # Standalone mode — each scan pod downloads the DB to emptyDir
      mode: Standalone
      # Scan for all severity levels
      severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      # Slower but less resource-intensive
      slow: true
      # In-memory scan cache, NOT the filesystem default.
      #
      # The operator builds one trivy container per workload container, all in
      # the same scan-job pod, all sharing the pod's `tmp` emptyDir mounted at
      # /tmp. Every container runs `trivy --cache-dir /tmp/trivy/.cache ...`, so
      # they contend for ONE BoltDB file — and BoltDB takes an exclusive lock
      # (only one process may open it). The losers fail with
      # "cache may be in use by another process: timeout" and exit 137-ish,
      # producing no report for their container.
      #
      # Measured 2026-10-08: every multi-container workload failed exactly one
      # cache-lock error per container — the 6-container Cilium DaemonSet job,
      # both 3-container Headlamp and Grafana jobs. Single-container workloads
      # were unaffected (no contention).
      #
      # `cache.backend: memory` is Trivy's prescribed fix (troubleshooting →
      # "Cache lock errors", Solution 1) and loses nothing here: the fs cache
      # lives in the throwaway pod's emptyDir and never persists between jobs
      # anyway. The chart passes this file to each container via
      # `--config /etc/trivy/trivy-config.yaml`.
      configFile:
        cache:
          backend: memory
      # Resource limits for scan job containers (Trivy). The chart default
      # 500M limit triggers "Memory Near Limit (>80%)" alerts during scans
      # that load the vuln DB + scan large images. Bumped to 1Gi.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
    trivyOperator:
      # Tolerate the control-plane taint so scan jobs can run on CP nodes.
      # The node-collector auto-selects a CP node (useNodeSelector: true) for
      # CIS benchmark scanning but doesn't add the toleration by default.
      scanJobTolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    nodeCollector:
      # Tolerate the control-plane taint so the node-collector can scan CP nodes.
      # Without this, the node-collector pod stays Pending on CP nodes (which
      # have the NoSchedule taint from kubeadm).
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    compliance:
      # Run compliance scans every 6 hours (default)
      cron: "0 */6 * * *"
      # Summary report (pass/fail counts per control)
      reportType: summary
      # Max fail entries per control check
      failEntriesLimit: 10
      # Built-in compliance specs to generate
      specs:
        - "k8s-cis-1.23"
        - "k8s-nsa-1.0"
        - "k8s-pss-baseline-0.1"
        - "k8s-pss-restricted-0.1"
    # Prometheus metrics — enable ServiceMonitor for our monitoring stack
    serviceMonitor:
      enabled: true
      namespace: trivy-system
      # Prometheus discovers ServiceMonitors by label: its serviceMonitorSelector
      # is `release: kube-prometheus-stack`, so a ServiceMonitor without that
      # label is silently ignored (no error, no scrape). The chart's own labels do
      # not include it, so it must be set here. This is the same requirement every
      # hand-written ServiceMonitor in monitoring/ meets.
      labels:
        release: kube-prometheus-stack
    # Resource limits for the OPERATOR pod (not the scan jobs).
    #
    # The chart ships `resources: {}` (unlimited) and leaves this to the user.
    # 512Mi was too low: the operator watches ALL namespaces and caches every
    # Trivy report CR cluster-wide (~644 objects across vulnerability/config-audit/
    # exposed-secret/rbac/infra reports). Steady state is ~180-260Mi but it spikes
    # to ~500Mi when a batch of reports is written (6-hourly CIS compliance scan,
    # or a cluster-wide rescan), which tripped the 512Mi ceiling and OOMKilled the
    # pod repeatedly (20 restarts over 8 days; each run survived ~16h before dying).
    # Measured peak working set over 7d: 503Mi. 1Gi gives ~2x headroom over that.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
