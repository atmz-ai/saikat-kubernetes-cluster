# ! The config/ tree reconciles separately so a crashed admission webhook cannot
# ! block creation of its own startup ConfigMap during the all-resource dry-run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://infra.tekton.dev/tekton-releases/triggers/previous/v0.37.2/release.yaml
  - https://infra.tekton.dev/tekton-releases/triggers/previous/v0.37.2/interceptors.yaml
patches:
  - target:
      kind: ConfigMap
      name: config-triggers-core-interceptors
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: config-triggers-core-interceptors
      $patch: delete