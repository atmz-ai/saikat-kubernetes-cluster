# ! Route to webhook-receiver, not the notification API on notification-controller.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook-redirect
  namespace: flux-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - flux-webhook.saikat.dev
    - flux-webhook.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
    - name: web-gateway
      namespace: kube-system
      sectionName: https-saikat-dev
  hostnames:
    - flux-webhook.saikat.dev
    - flux-webhook.yral.com
  rules:
    - backendRefs:
        - name: webhook-receiver
          port: 80
