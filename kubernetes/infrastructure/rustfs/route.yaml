apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-s3
  namespace: rustfs
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https-rustfs
  hostnames: [s3.saikat.oleole.ai]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs-svc
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https-rustfs-console
    - name: web-gateway
      namespace: kube-system
      sectionName: https-saikat-dev
  hostnames: [rust-fs.saikat.dev, rust-fs.saikat.oleole.ai]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs-console
          port: 9001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console-https-redirect
  namespace: rustfs
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames: [rust-fs.saikat.dev, rust-fs.saikat.oleole.ai]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
