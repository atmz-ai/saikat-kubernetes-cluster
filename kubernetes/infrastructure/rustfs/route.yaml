apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-s3
  namespace: rustfs
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https-rustfs
  hostnames: [s3.saikat.oleole.ai]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs-svc
          port: 9000
