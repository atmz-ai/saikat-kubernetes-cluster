apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: event-archive-credentials-reader
  namespace: rustfs
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [rustfs-credentials]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: event-archive-credentials-reader
  namespace: rustfs
subjects:
  - kind: ServiceAccount
    name: connect-cluster-connect
    namespace: kafka-connect
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: event-archive-credentials-reader