apiVersion: batch/v1
kind: Job
metadata:
  name: event-archive-bucket-1
  namespace: rustfs
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: provision-event-archive-bucket
          image: rustfs/rustfs:1.0.1
          command: [/bin/sh, -ec]
          args:
            - |
              bucket_url='http://rustfs-svc:9000/enriched-event-archive'
              printf 'Checking event archive bucket %s\n' "$bucket_url"
              status=$(curl --show-error --connect-timeout 10 --max-time 60 \
                --aws-sigv4 aws:amz:us-east-1:s3 \
                --variable '%RUSTFS_ACCESS_KEY' --variable '%RUSTFS_SECRET_KEY' \
                --expand-user '{{RUSTFS_ACCESS_KEY}}:{{RUSTFS_SECRET_KEY}}' \
                --head --output /dev/null --write-out '%{http_code}' "$bucket_url")
              case "$status" in
                200) printf 'Event archive bucket already exists\n' ;;
                404)
                  printf 'Creating event archive bucket\n'
                  curl --fail-with-body --connect-timeout 10 --max-time 60 \
                    --aws-sigv4 aws:amz:us-east-1:s3 \
                    --variable '%RUSTFS_ACCESS_KEY' --variable '%RUSTFS_SECRET_KEY' \
                    --expand-user '{{RUSTFS_ACCESS_KEY}}:{{RUSTFS_SECRET_KEY}}' \
                    --request PUT "$bucket_url"
                  ;;
                *) printf 'Bucket check failed with HTTP %s\n' "$status" >&2; exit 1 ;;
              esac
              printf 'Verifying event archive bucket\n'
              curl --fail-with-body --connect-timeout 10 --max-time 60 \
                --aws-sigv4 aws:amz:us-east-1:s3 \
                --variable '%RUSTFS_ACCESS_KEY' --variable '%RUSTFS_SECRET_KEY' \
                --expand-user '{{RUSTFS_ACCESS_KEY}}:{{RUSTFS_SECRET_KEY}}' \
                --head "$bucket_url"
          envFrom:
            - secretRef:
                name: rustfs-credentials