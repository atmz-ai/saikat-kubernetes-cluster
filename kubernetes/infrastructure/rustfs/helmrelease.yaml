apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 1h
  url: https://charts.rustfs.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: rustfs
      version: "1.0.6"
      sourceRef:
        kind: HelmRepository
        name: rustfs
        namespace: rustfs
  values:
    fullnameOverride: rustfs
    replicaCount: 3
    drivesPerNode: 1
    image:
      rustfs:
        repository: rustfs/rustfs
        tag: "1.0.6"
    ingress:
      enabled: false
    secret:
      existingSecret: rustfs-credentials
    localEndpointHost:
      autoInject: true
    extraEnv:
      - name: RUSTFS_SSE_S3_MASTER_KEY
        valueFrom:
          secretKeyRef:
            name: rustfs-sse-s3-master-key
            key: RUSTFS_SSE_S3_MASTER_KEY
      - name: RUSTFS_BROWSER_REDIRECT_URL
        value: https://rust-fs.saikat.dev
      - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL_google
        value: https://accounts.google.com/.well-known/openid-configuration
      - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID_google
        valueFrom:
          secretKeyRef:
            name: atmz-internal-apps-google-oauth
            key: client-id
      - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET_google
        valueFrom:
          secretKeyRef:
            name: atmz-internal-apps-google-oauth
            key: client-secret
      - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_google
        value: https://rust-fs.saikat.dev/rustfs/admin/v3/oidc/callback/google
      - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC_google
        value: "off"
      - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME_google
        value: Google
      - name: RUSTFS_IDENTITY_OPENID_ROLE_POLICY_google
        value: google-saikat-administrator
    config:
      rustfs:
        # ! No log PVC: dedicated data claims must not be consumed by log volumes.
        obs_log_directory: ""
        obs_environment: production
    storageclass:
      name: rustfs-local
      dataStorageSize: 31Ti
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - saikat-azure-central-india-1
                    - saikat-azure-central-india-2
                    - saikat-azure-central-india-3
    pdb:
      create: true
