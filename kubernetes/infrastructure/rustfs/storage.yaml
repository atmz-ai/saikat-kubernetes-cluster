apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rustfs-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rustfs-azure-1-disk-0
spec:
  capacity:
    storage: 31Ti
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: rustfs-local
  claimRef:
    namespace: rustfs
    name: data-rustfs-0
  local:
    path: /var/lib/rustfs/data/disk-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [saikat-azure-central-india-1]
---
apiVersion: v1
kind: PersistentVolume
