apiVersion: batch/v1
kind: Job
metadata:
  name: retire-event-archive-1
  namespace: rustfs
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: retire-event-archive
          image: rustfs/rustfs:1.0.1
          command: [/bin/sh, -ec]
          args:
            - |
              bucket_url='http://rustfs-svc:9000/enriched-event-archive'
              printf 'Checking retired event archive bucket %s\n' "$bucket_url"
              status=$(curl --show-error --connect-timeout 10 --max-time 60 \
                --aws-sigv4 aws:amz:us-east-1:s3 \
                --variable '%RUSTFS_ACCESS_KEY' --variable '%RUSTFS_SECRET_KEY' \
                --expand-user '{{RUSTFS_ACCESS_KEY}}:{{RUSTFS_SECRET_KEY}}' \
                --head --output /dev/null --write-out '%{http_code}' "$bucket_url")
              case "$status" in
                200)
                  printf 'Deleting retired event archive bucket and its contents\n'
                  curl --fail-with-body --connect-timeout 10 --max-time 60 \
                    --aws-sigv4 aws:amz:us-east-1:s3 \
                    --variable '%RUSTFS_ACCESS_KEY' --variable '%RUSTFS_SECRET_KEY' \
                    --expand-user '{{RUSTFS_ACCESS_KEY}}:{{RUSTFS_SECRET_KEY}}' \
                    --header 'x-rustfs-force-delete: true' \
                    --request DELETE "$bucket_url"
                  ;;
                404) printf 'Retired event archive bucket is already absent\n' ;;
                *) printf 'Bucket check failed with HTTP %s\n' "$status" >&2; exit 1 ;;
              esac
              printf 'Verifying retired event archive bucket is absent\n'
              status=$(curl --show-error --connect-timeout 10 --max-time 60 \
                --aws-sigv4 aws:amz:us-east-1:s3 \
                --variable '%RUSTFS_ACCESS_KEY' --variable '%RUSTFS_SECRET_KEY' \
                --expand-user '{{RUSTFS_ACCESS_KEY}}:{{RUSTFS_SECRET_KEY}}' \
                --head --output /dev/null --write-out '%{http_code}' "$bucket_url")
              if [ "$status" != 404 ]; then
                printf 'Bucket deletion verification failed with HTTP %s\n' "$status" >&2
                exit 1
              fi
              printf 'Retired event archive bucket deletion verified\n'
          envFrom:
            - secretRef:
                name: rustfs-credentials
