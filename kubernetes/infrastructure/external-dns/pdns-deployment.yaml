# PowerDNS Authoritative Server — Deployment with the gpgsql (PostgreSQL) backend.
#
# All zone data lives in the pdns-db CNPG cluster, so PowerDNS itself is stateless:
# no PVC, no init container, and replicas are interchangeable. The previous LMDB
# backend stored zones in a local file and could therefore only ever run ONE pod
# (LMDB is single-writer — `Multiple instances: No`), which made DNS a single point
# of failure on a single node.
#
# Zone, TSIG key and zone metadata are seeded once by the pdns-db-seed Job using
# `pdnsutil` — see pdns-db-seed.yaml. That is a bootstrap concern, not a per-pod
# one, which is why it is a Job rather than an init container here: three replicas
# would otherwise race to seed the same zone on every pod start.
#
# One shared TSIG key serves every zone (the key name is just an identifier);
# external-dns sends the same key whichever zone it writes to. Add a new zone by
# appending it in pdns-db-seed.yaml AND to external-dns's --rfc2136-zone /
# --domain-filter lists, plus its DNSEndpoint CRD.
#
# Scheduling: worker nodes only (node affinity excludes control-plane).
#
# Ports:
#   - 5300/UDP + 5300/TCP: DNS (LoadBalancer Service maps 53→5300)
#   - 8081/TCP: HTTP API (ClusterIP — read-only debugging only)
---
# Deployment, not StatefulSet: PowerDNS is stateless now (all zone data lives in
# the pdns-db CNPG cluster), so it needs no stable pod identity and no per-pod
# storage. Both Services select on `app: powerdns`, so neither depends on pod
# names — replicas are fully interchangeable and can be rolled freely.
#
# A StatefulSet would actively obstruct this: `volumeClaimTemplates` is immutable
# after creation, so removing the LMDB PVC claim (the very thing this migration
# does) is rejected with:
#   Forbidden: updates to statefulset spec for fields other than 'replicas', ...
# A Deployment has no such field, so the conversion also removes that hazard for
# any future change to the pod spec's storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerdns
  namespace: external-dns
  labels:
    app: powerdns
spec:
  # 3 replicas: PowerDNS is stateless (all state is in the pdns-db CNPG cluster),
  # so any replica can answer any query and accept any update. Three gives HA
  # across nodes and matches the database's 3 instances, so losing one node does
  # not remove the ability to serve DNS or accept RFC2136 updates.
  replicas: 3
  selector:
    matchLabels:
      app: powerdns
  template:
    metadata:
      labels:
        app: powerdns
    spec:
      securityContext:
        fsGroup: 953
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: powerdns
          image: docker.io/powerdns/pdns-auth-52:latest
          args:
            # No --gpgsql-*/--api-key flags: the image's pdns_server-startup wrapper
            # renders those from the environment (see pdns-config.yaml). Passing them
            # as args would additionally expose the DB password in the pod spec,
            # readable via `kubectl get pod`; a Secret reference does not.
          ports:
            - name: dns-udp
              containerPort: 5300
              protocol: UDP
            - name: dns-tcp
              containerPort: 5300
              protocol: TCP
            - name: api
              containerPort: 8081
              protocol: TCP
          env:
            # PDNS_AUTH_API_KEY is consumed by pdns_server-startup, which writes
            # webserver/api/api-key into pdns.d/_api.conf. This is the image's own
            # convention for the API key, so it must keep this exact name.
            - name: PDNS_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pdns-api-key
                  key: api-key
            # Tells pdns_server-startup which template(s) to render. The name must
            # match the ConfigMap key "gpgsql.j2".
            - name: TEMPLATE_FILES
              value: gpgsql
            # host/port are literals; dbname/user/password come from pdns-db-app —
            # the CNPG-generated Secret for the role that OWNS the database. Per
            # CNPG's "Connecting from an application" docs this is the secret
            # applications should use; pdns-db-superuser is for administrative use
            # only and is not even generated unless enableSuperuserAccess is set
            # (which this cluster deliberately does not enable).
            #
            # Values are read from the Secret rather than hardcoded so a CNPG
            # password rotation propagates without editing this manifest.
            - name: PDNS_DB_HOST
              value: pdns-db-rw.external-dns.svc.cluster.local
            - name: PDNS_DB_PORT
              value: "5432"
            - name: PDNS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: dbname
            - name: PDNS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: username
            - name: PDNS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: password
          volumeMounts:
            - name: pdns-config
              mountPath: /etc/powerdns/pdns.conf
              subPath: pdns.conf
              readOnly: true
            # The template the wrapper renders into pdns.d/gpgsql.conf. Mounted as a
            # directory (not subPath) because the wrapper reads the whole
            # templates.d directory to resolve TEMPLATE_FILES entries.
            - name: pdns-templates
              mountPath: /etc/powerdns/templates.d
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 5300
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5300
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      # No volumeClaimTemplates: PowerDNS holds no local state. All zone data lives
      # in the pdns-db CNPG cluster (see cnpg-cluster.yaml).
      volumes:
        - name: pdns-config
          configMap:
            name: pdns-config
            items:
              - key: pdns.conf
                path: pdns.conf
        - name: pdns-templates
          configMap:
            name: pdns-config
            items:
              - key: gpgsql.j2
                path: gpgsql.j2
