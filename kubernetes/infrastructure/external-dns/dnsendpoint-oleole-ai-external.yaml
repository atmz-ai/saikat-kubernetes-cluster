#
# oleole.ai — records that point OUTSIDE the cluster.
#
# HAND-WRITTEN, unlike dnsendpoint-oleole-ai.yaml which is generated from
# hosts.yml. The split exists so regenerating cluster records cannot clobber these
# and vice versa. See kustomization.yaml for the full rationale.
#
# Both files are plain DNSEndpoints and are applied identically by external-dns.
#
# Google Workspace domain verification — CNAME method.
#
# The value and name are issued per-Workspace-account by the Google admin console;
# they are not derivable, so they are recorded here verbatim as supplied.
#
# CNAME rather than the TXT method (google-site-verification=...) because it is
# Google's current mechanism and stays valid without re-pasting codes. The usual
# objection to a CNAME — that it is illegal at the zone apex (RFC 1034) — does not
# apply: this is a subdomain, not the apex.
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  # Name deliberately unchanged when the MX was added. external-dns encodes the
  # resource name in each ownership TXT marker, so renaming this object would
  # rewrite the CNAME's marker — churn on a record Google may already have
  # validated. Stable names, additive changes.
  name: oleole-ai-workspace-verification
  namespace: external-dns
spec:
  endpoints:
    # NOTE: the apex MX for Google Workspace is NOT here, deliberately.
    #
    # It would be silently ignored. external-dns refuses to create a new record type at
    # a name holding unowned records, and the oleole.ai apex has 40 unowned A records —
    # apex records never get an ownership marker (upstream #6125). Separately, the
    # rfc2136 provider cannot read MX back via AXFR, so even a written MX could not be
    # kept in step. Both verified against live behaviour.
    #
    # The MX lives in pdns-static-records.yaml instead, applied by pdnsutil.
    # Record types external-dns CAN manage belong here.

    # Google Workspace domain verification — CNAME method.
    #
    # The value and name are issued per-Workspace-account by the admin console; they
    # are not derivable, so they are recorded here verbatim as supplied.
    #
    # CNAME rather than the TXT method (google-site-verification=...) because it is
    # Google's current mechanism and stays valid without re-pasting codes. The usual
    # objection to a CNAME — illegal at the zone apex (RFC 1034) — does not apply as
    # this is a subdomain. It also coexists correctly with *.oleole.ai: a specific
    # name takes precedence over the wildcard, confirmed via five resolvers.
    - dnsName: 2rbnnd3xklw7.oleole.ai
      recordType: CNAME
      recordTTL: 300
      targets:
        - gv-ijbp37komhcvmp.dv.googlehosted.com

    # Google Workspace DKIM signing key, from Admin console → Apps → Gmail → Authenticate
    # email. Google issues one key per domain; it is not derivable, so it is recorded
    # verbatim as supplied.
    #
    # This is a SUBDOMAIN (google._domainkey) with type TXT, so unlike the apex MX it goes
    # through external-dns normally — the apex-ownership block that forces the MX onto the
    # pdnsutil path does not apply here, and TXT is in --managed-record-types.
    #
    # The value is 410 characters and is served as TWO quoted character-strings, split at
    # the 255-byte limit. That is required, not incidental: a DKIM key exceeds one
    # character-string, and RFC 6376 consumers concatenate the strings with no separator.
    # Verified that PowerDNS splits and rejoins it automatically — the stored value
    # round-trips identically — so the value below is written as a single string and
    # should not be pre-split by hand.
    #
    # The surrounding double quotes are part of the DNSEndpoint target, not decoration:
    # without them the target is not a valid TXT string. They are escaped as \" inside
    # the single-quoted YAML scalar.
    - dnsName: google._domainkey.oleole.ai
      recordType: TXT
      recordTTL: 300
      targets:
        - '"v=DKIM1; k=rsa; "'
---
# * www and api target Rishi's Azure swarm, overriding the cluster wildcard.
# * The apex targets are declared in pdns_zones.apex_ipv4_addresses in Ansible;
# * external-dns cannot own the apex. The swarm's Caddy manages its certificates.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: oleole-ai-website-and-api
  namespace: external-dns
spec:
  endpoints:
    - dnsName: www.oleole.ai
      recordType: A
      recordTTL: 300
      targets:
        - 20.219.36.211
        - 20.219.222.27
        - 20.235.107.58
    - dnsName: api.oleole.ai
      recordType: A
      recordTTL: 300
      targets:
        - 20.219.36.211
        - 20.219.222.27
        - 20.235.107.58
---
# *.rishi.oleole.ai — Rishi's Docker Swarm (3 Azure Central India nodes), the same
# pattern as *.rishi.yral.com. Each node runs the swarm's edge Caddy, which issues
# its own certificates (HTTP-01) for the hostnames it serves, so all this zone has
# to provide is the round-robin A records. A specific name such as
# agent.rishi.oleole.ai resolves through this wildcard; the more specific
# *.rishi.oleole.ai takes precedence over *.oleole.ai for every name under it.
#
# The three addresses are the nodes' public IPs (rishi-azure-central-india-1/2/3).
# If a node is added or replaced, update this list.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: oleole-ai-rishi-swarm
  namespace: external-dns
spec:
  endpoints:
    - dnsName: "*.rishi.oleole.ai"
      recordType: A
      recordTTL: 300
      targets:
        - 20.219.36.211
        - 20.219.222.27
        - 20.235.107.58
---
# * Resend — the transactional sender for @oleole.ai (applicant emails from
# * api.oleole.ai: "your video is ready", "please fix a photo"). Values are issued
# * per-domain by the Resend dashboard (domain oleole.ai, region us-east-1); they
# * are not derivable, so they are recorded here verbatim as supplied.
# *
# * All four are SUBDOMAINS, so external-dns owns them normally; none touches the
# * apex SPF or MX, which stay Google Workspace's. send/rsend are the bounce
# * (Return-Path) domain, which carries Resend's own SPF, so the apex SPF needs no
# * include. Specific names take precedence over *.oleole.ai.
# *
# * _dmarc starts at p=none: report-only, so nothing Google Workspace already sends
# * can be rejected by it.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: oleole-ai-resend
  namespace: external-dns
spec:
  endpoints:
    - dnsName: resend._domainkey.oleole.ai
      recordType: TXT
      recordTTL: 300
      targets:
        - '"p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDBl6ME75afA38MwPRwxIkfU26WnmvmS/3zE8KVUuBveNAXTCRNLxXQtheEjr/97Zk4D1Lx3OaTD2A+jJbcUu4Xu0GpJf/X57DviAd8rvk4SwPD3CsLiBp8aaFtuoqQvSLtIsxz5gWRiJWUXCZSst5ZMcOOzBDGVJ68maOTg7URuQIDAQAB"'
    - dnsName: send.oleole.ai
      recordType: CNAME
      recordTTL: 300
      targets:
        - send.forge.rmta.net
    - dnsName: rsend.oleole.ai
      recordType: CNAME
      recordTTL: 300
      targets:
        - rsend.forge.rmta.net
    - dnsName: _dmarc.oleole.ai
      recordType: TXT
      recordTTL: 300
      targets:
        - '"v=DMARC1; p=none;"'
