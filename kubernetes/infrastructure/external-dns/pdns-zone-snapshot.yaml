# Snapshot of the saikat.dev zone, exported from the pre-migration LMDB backend
# with: pdnsutil --config-dir=/etc/powerdns zone list saikat.dev
#
# Used by the pdns-db-seed Job (pdns-db-seed.yaml) to repopulate the zone when
# the pdns-db CNPG cluster is created (or rebuilt). Kept in git because it is the
# source of truth for a from-scratch rebuild — external-dns would also recreate
# these records from its DNSEndpoint CRDs, but only after its next reconcile,
# during which the zone would answer NODATA (cached for the SOA minimum).
#
# The TXT records here are external-dns's own ownership markers. Preserving them
# verbatim matters: without them external-dns would see the loaded A/NS records as
# unmanaged and, under --policy=sync, delete them.
#
# The SOA is the one record normalised on import. As exported it carried PowerDNS's
# placeholder MNAME "a.misconfigured.dns.server.invalid." — an artifact of
# `zone create`, never a real nameserver — and a 3600s minimum, which is the
# negative-cache TTL. Both are wrong for a zone we actually serve:
#   - MNAME -> ns1.saikat.dev., a real in-zone NS that already has an A record.
#     (Nothing queries the MNAME here: the zone is unsigned, so there is no ZSK to
#     publish. It is corrected because it is operator-visible and "misconfigured"
#     is misleading in diagnostics.)
#   - minimum -> 300, matching default-ttl. At 3600, any transient NODATA — most
#     relevantly the window between zone creation and the records being loaded — is
#     pinned in resolver caches for a full hour.
# The serial stays authoritative: SOA-EDIT-DNSUPDATE INCREASE rewrites it on every
# external-dns / cert-manager update, so this value only seeds the zone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdns-zone-snapshot
  namespace: external-dns
