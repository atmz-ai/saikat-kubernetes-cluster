#
# Ansible managed
#
# ! external-dns never writes an ownership marker for an apex record, so plan.go
# ! filters the apex out of BOTH creates and updates — no record type can be managed
# ! at the apex through a DNSEndpoint. Full evidence: pdns-static-records.yaml;
# ! upstream kubernetes-sigs/external-dns#6125.
# * GENERATED from ansible/inventory/00-hosts.yml by ansible/roles/pdns-zones — never
#   hand-edit. Regenerate with: mise run dns-generate. The role runs as the second
#   play of add-worker/add-control-plane/remove-node, so node churn converges here.
# ! The Job name carries a content checksum deliberately. A Job's pod template is
# ! immutable and a ConfigMap change does not alter its spec, so a fixed Job name
# ! would never re-run and the apex would silently keep the previous node set. A
# ! changed checksum is a NEW Job object: Flux creates it (it runs fresh) and prunes
# ! the previous one — no manual `kubectl delete job`, no --force on the Kustomization.
# * FORMAT: one rrset per line, pipe-separated, contents SPACE-separated:
#     <zone>|<name>|<TYPE>|<ttl>|<content> <content> ...
#   Each line is applied in a single `rrset replace`; a call per value would leave
#   only the last one set. This is why the format differs from pdns-static-records,
#   where an MX is one value that itself contains a space.
# * Apex NS is here alongside apex A. Both are unowned for the same reason, and a
#   removed node can be a nameserver — so both must converge on node churn.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdns-apex-records-4abe7b87faa6
  namespace: external-dns
  labels:
    app.kubernetes.io/name: pdns-apex-records
