---
apiVersion: batch/v1
kind: Job
metadata:
  name: pdns-apex-records-4abe7b87faa6
  namespace: external-dns
  labels:
    app.kubernetes.io/name: pdns-apex-records
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply
          image: docker.io/powerdns/pdns-auth-52:latest
          command:
            - /bin/bash
            - -c
            - |
              set -eu

              # ! pdnsutil ignores PDNS_* env vars and cannot take backend settings on
              # ! the command line, so it needs a real config file — the same constraint
              # ! documented on pdns-db-seed. The file holds the DB password, so it lives
              # ! under /tmp and is removed on exit, including on failure.
              trap 'rm -rf /tmp/pdns-apex' EXIT
              mkdir -p /tmp/pdns-apex
              printf '%s\n' \
                "launch=gpgsql" \
                "gpgsql-host=$PDNS_DB_HOST" \
                "gpgsql-port=$PDNS_DB_PORT" \
                "gpgsql-dbname=$PDNS_DB_NAME" \
                "gpgsql-user=$PDNS_DB_USER" \
                "gpgsql-password=$PDNS_DB_PASSWORD" \
                > /tmp/pdns-apex/pdns.conf

              echo "Waiting for the PowerDNS tables to be reachable..."
              until pdnsutil --config-dir=/tmp/pdns-apex zone list-all > /dev/null 2>&1; do
                echo "  backend not ready yet, retrying..."
                sleep 5
              done
              echo "Backend reachable."

              # <zone>|<name>|<TYPE>|<ttl>|<content> <content> ...
              applied=0
              while IFS='|' read -r zone name rtype ttl content; do
                case "$zone" in ''|'#'*) continue ;; esac
                content="$(printf '%s' "$content" | sed 's/[[:space:]]*$//')"

                # ! Fail loudly on a malformed line. A skipped rrset is exactly the
                # ! failure this Job exists to prevent, so it must not be silent.
                if [ -z "$zone" ] || [ -z "$name" ] || [ -z "$rtype" ] || [ -z "$ttl" ] || [ -z "$content" ]; then
                  echo "ERROR: malformed rrset line: '$zone|$name|$rtype|$ttl|$content'" >&2
                  exit 1
                fi

                # * Split into positional parameters so each value is one argument and
                # * the whole rrset is replaced in a single call. `rrset replace` takes
                # * CONTENT [CONTENT...]; a call per value would leave only the last.
                # ! Deliberately `set --` and `$#`, NOT a bash array: the array's length
                # ! form is `${` followed by `#name[@]}`, and that embedded pair is a
                # ! Jinja2 comment opener — it fails the render here, not at run time.
                set -- $content

                echo "Replacing $name IN $rtype (zone $zone, ttl $ttl) with $# value(s)"
                pdnsutil --config-dir=/tmp/pdns-apex rrset replace "$zone" "$name" "$rtype" "$ttl" "$@"
                applied=$((applied + 1))
              done < /apex/apex-records

              echo "Replaced $applied rrset(s)."
          env:
            - name: PDNS_DB_HOST
              value: pdns-db-rw.external-dns.svc.cluster.local
            - name: PDNS_DB_PORT
              value: "5432"
            - name: PDNS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: dbname
            - name: PDNS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: username
            - name: PDNS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: password
          volumeMounts:
            - name: apex-records
              mountPath: /apex
              readOnly: true
      volumes:
        - name: apex-records
          configMap:
            name: pdns-apex-records-4abe7b87faa6
