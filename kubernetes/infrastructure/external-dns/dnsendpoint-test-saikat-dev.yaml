#
# TEMPORARY — validation fixture for the new-zone onboarding path.
#
# Proves that external-dns writes into a SECOND zone, which is the half the
# existing config never exercised: saikat.dev was populated from a snapshot, not
# by external-dns, so its zone flags were effectively untested for writes.
#
# One A record is enough. A full generated file (via the pdns-zone role) would
# also emit NS/glue records for all 40 nodes, which says nothing extra here.
#
# DELETE THIS FILE (and its kustomization entry, and the test.saikat.dev entry in
# pdns_zones) once the path is confirmed working.
#
# Record is deliberate:
#   probe.test.saikat.dev — distinct from *.test.saikat.dev so a wildcard cannot
#                           mask a failure. If this resolves, external-dns wrote it.
#   192.0.2.99            — TEST-NET-1 (RFC 5737), reserved for documentation and
#                           unroutable, so a stray lookup cannot reach anything.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: test-saikat-dev-validation
  namespace: external-dns
spec:
  endpoints:
    - dnsName: probe.test.saikat.dev
      recordType: A
      recordTTL: 60
      targets:
        - 192.0.2.99
