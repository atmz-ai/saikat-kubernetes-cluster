# Seeds the PowerDNS zone, TSIG key and zone metadata using `pdnsutil` — PowerDNS's
# own CLI — rather than hand-written SQL.
#
# Why this Job exists at all: external-dns manages records WITHIN a zone but never
# creates the zone itself, and cert-manager's RFC2136 solver likewise needs the zone
# (and the update metadata) to already exist. Both would fail silently against an
# empty database. The old LMDB setup did this in a StatefulSet init container; with
# gpgsql there is no local file to initialise, so it becomes a Job.
#
# Why `pdnsutil` and not SQL: PDNS owns the internal representation of zones, TSIG
# keys and metadata, and `pdnsutil` is the supported interface for mutating it. It
# is also self-documenting — `zone create` vs `INSERT INTO domains (...)`.
#
# Runs against the gpgsql backend only, so it needs `launch=gpgsql` — it reads the
# same pdns.conf ConfigMap as the server, then overrides nothing. The connection
# string comes from the pdns-secrets Secret.
#
# Idempotency and REBUILD: the Job is safe to re-run by hand. A completed Job will
# NOT re-run automatically when Flux re-applies it (Kubernetes keeps Completed Jobs),
# so if the pdns-db CNPG cluster is ever rebuilt from scratch, re-trigger with:
#   kubectl -n external-dns delete job pdns-db-seed
# Flux then recreates it on the next reconcile. This is the disaster-recovery path
# for the seed step — the table schema is re-applied automatically by CNPG's
# postInitApplicationSQLRefs, but the zone/TSIG/metadata are not.
#
# The same deletion is needed after ANY change to this Job's spec, not just a
# rebuild: a Job's pod template is immutable, so amending it (a new volume, env var,
# or command) fails with `field is immutable` and Flux will not patch it in place.
# Delete the Job and let Flux recreate it. Note Flux reports the failure as a
# dry-run error against the whole resource set, so one immutable Job blocks every
# other resource in this kustomization until it is removed.
#
# Order matters: the zone must exist before metadata or TSIG mapping is applied to it.
apiVersion: batch/v1
kind: Job
metadata:
  name: pdns-db-seed
  namespace: external-dns
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: docker.io/powerdns/pdns-auth-52:latest
          command:
            - /bin/bash
            - -c
            - |
              set -eu

              # pdnsutil does NOT go through the image's pdns_server-startup wrapper,
              # so it does not benefit from the TEMPLATE_FILES rendering the server
              # uses. It also cannot take backend settings on the command line
              # (it does not recognise `--gpgsql-host=...`) and does not read PDNS_*
              # environment variables. Both were verified against the running image.
              #
              # The supported route is therefore a config file: write one containing
              # the connection parameters and point --config-dir at its directory.
              # It holds the DB password, so it lives under /tmp (never on a volume)
              # and is removed on exit — including on failure — so the credential
              # cannot outlive the Job.
              trap 'rm -rf /tmp/pdns-seed' EXIT
              mkdir -p /tmp/pdns-seed
              printf '%s\n' \
                "launch=gpgsql" \
                "gpgsql-host=$PDNS_DB_HOST" \
                "gpgsql-port=$PDNS_DB_PORT" \
                "gpgsql-dbname=$PDNS_DB_NAME" \
                "gpgsql-user=$PDNS_DB_USER" \
                "gpgsql-password=$PDNS_DB_PASSWORD" \
                > /tmp/pdns-seed/pdns.conf

              echo "Waiting for the PowerDNS tables to be reachable..."
              # The schema and grants are applied by CNPG during bootstrap; poll
              # until a zone listing succeeds, which proves the tables exist, the
              # grants landed, and the credentials work.
              until pdnsutil --config-dir=/tmp/pdns-seed zone list-all > /dev/null 2>&1; do
                echo "  backend not ready yet, retrying..."
                sleep 5
              done
              echo "Backend reachable."

              # ── Per-zone setup ──────────────────────────────────────────────
              # The zone list is a ConfigMap generated from `pdns_zones` in
              # ansible/inventory/group_vars/all/vars.yml (see
              # ansible/roles/pdns-zones). Each line is "<zone> <snapshot>".
              #
              # Everything below runs once per zone. It is idempotent, so re-running
              # (or re-running after adding a zone) is safe: existing zones, keys and
              # metadata are detected and left alone.
              #
              # The zone name must appear in three places that have to agree — this
              # Job (create + metadata), and external-dns's --rfc2136-zone and
              # --domain-filter flags. All three are generated from that one list, so
              # a new zone cannot end up configured here but unknown to external-dns.
              while read -r zone use_snapshot; do
                [ -n "$zone" ] || continue

                # Zone. `zone create` fails if the zone already exists, which is the
                # expected state on re-run — treat that as success.
                if pdnsutil --config-dir=/tmp/pdns-seed zone list-all 2>/dev/null | grep -qx "$zone"; then
                  echo "Zone $zone already exists."
                else
                  echo "Creating zone $zone..."
                  pdnsutil --config-dir=/tmp/pdns-seed zone create "$zone"
                fi

                # Load the record snapshot, for zones that already served records
                # elsewhere. external-dns would eventually recreate them from its
                # DNSEndpoint CRDs, but only after its next reconcile — and in the
                # meantime the zone would answer NODATA, which resolvers cache for the
                # SOA minimum. Loading the snapshot closes that window, and preserves
                # the external-dns TXT ownership markers exactly so external-dns
                # recognises the records as its own rather than treating them as
                # unmanaged and deleting them under --policy=sync.
                #
                # New zones skip this (snapshot=false in pdns_zones): there is nothing
                # to preserve, and an empty zone is correct until external-dns
                # populates it.
                if [ "$use_snapshot" = "true" ] && [ -s "/seed/$zone.zone" ]; then
                  echo "Loading $zone contents from snapshot..."
                  pdnsutil --config-dir=/tmp/pdns-seed zone load "$zone" "/seed/$zone.zone"
                else
                  echo "No snapshot for $zone — leaving it for external-dns to populate."
                fi

                # Zone metadata enabling RFC2136 updates, automatic SOA serial bumps,
                # and the AXFR external-dns needs to read existing records.
                echo "Setting $zone metadata..."
                pdnsutil --config-dir=/tmp/pdns-seed metadata set "$zone" ALLOW-DNSUPDATE-FROM 0.0.0.0/0 ::/0
                pdnsutil --config-dir=/tmp/pdns-seed metadata set "$zone" TSIG-ALLOW-DNSUPDATE saikat-dev-key
                pdnsutil --config-dir=/tmp/pdns-seed metadata set "$zone" SOA-EDIT-DNSUPDATE INCREASE

                # TSIG-ALLOW-AXFR is required by external-dns, not optional. With
                # --policy=sync it needs to READ the zone (AXFR) to learn which records
                # already exist and which are stale. Without AXFR permission it cannot
                # list anything and silently degrades to create-only:
                #   "--rfc2136-axfr is not set: ExternalDNS cannot list existing
                #    records, so --policy=sync will never update or delete them"
                # Scoping to the TSIG key (rather than ALLOW-AXFR-FROM) keeps transfers
                # closed to unauthenticated readers — a publicly served zone must not
                # be enumerable by anyone who can reach port 53.
                pdnsutil --config-dir=/tmp/pdns-seed metadata set "$zone" TSIG-ALLOW-AXFR saikat-dev-key
              done < /zones/zones

              # TSIG key used by external-dns and cert-manager for RFC2136 updates.
              # NOTE: this only makes the key known to POWERDNS. external-dns and
              # cert-manager read the same key from their own SOPS secrets.
              if pdnsutil --config-dir=/tmp/pdns-seed tsigkey list 2>/dev/null | grep -q "saikat-dev-key"; then
                echo "TSIG key saikat-dev-key already exists."
              else
                echo "Importing TSIG key saikat-dev-key..."
                pdnsutil --config-dir=/tmp/pdns-seed tsigkey import saikat-dev-key hmac-sha512 "$TSIG_SECRET"
              fi

              echo "Seeding complete."
              pdnsutil --config-dir=/tmp/pdns-seed zone list-all
          env:
            - name: TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: pdns-tsig-key
                  key: tsig-key
            # Same connection parameters the PowerDNS server uses. Credentials come
            # from pdns-db-app — the CNPG-generated Secret for the role that owns
            # the database. See pdns-deployment.yaml for why the superuser secret is
            # deliberately not used.
            - name: PDNS_DB_HOST
              value: pdns-db-rw.external-dns.svc.cluster.local
            - name: PDNS_DB_PORT
              value: "5432"
            - name: PDNS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: dbname
            - name: PDNS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: username
            - name: PDNS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: password
          volumeMounts:
            # Zone snapshots, for zones that have one. Mounted as a directory so the
            # loop can pick out "/seed/<zone>.zone"; zones without a snapshot simply
            # find no file and start empty.
            - name: zone-snapshot
              mountPath: /seed
              readOnly: true
            # The generated zone list ("<zone> <snapshot>" per line). See
            # ansible/roles/pdns-zones.
            - name: zones
              mountPath: /zones
              readOnly: true
      volumes:
        - name: zone-snapshot
          configMap:
            name: pdns-zone-snapshot
        - name: zones
          configMap:
            name: pdns-zones
