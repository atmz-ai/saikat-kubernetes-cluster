# CloudNativePG Cluster backing the PowerDNS authoritative server.
#
# Replaces the single-replica LMDB StatefulSet. Reasons for the switch:
#   - LMDB is single-writer, so PowerDNS could never run more than one pod
#     (`Multiple instances: No` in the PowerDNS backend support matrix). That made
#     DNS a single point of failure on one node — unacceptable for a component
#     that the cluster depends on.
#   - gpgsql is a shared-database backend (`Multiple instances: Yes`), so every
#     PowerDNS pod reads and writes the same records. Updates from external-dns
#     and cert-manager land in one place and are visible to all pods, instead of
#     each pod holding its own diverging LMDB file.
#
# 3 instances, not 2: with 2, losing one instance leaves neither redundancy nor a
# failover target. With 3, one can fail and automatic failover still has a
# remaining replica to promote. CNPG handles the promotion and repoints the
# `pdns-db-rw` service; PowerDNS always connects via -rw, so it follows failover
# with no configuration change.
#
# Storage: longhorn-1replica, per the storage replication policy — CNPG implements
# native streaming replication, so Longhorn 2-replica would be redundant write
# amplification. Same reasoning as the harbor-db Cluster.
#
# Role, database and password are owned by CNPG, following the documented pattern
# in "Connecting from an application":
#   - `pdns-db-app`     → the role that OWNS the database; this is what
#                         applications (here, PowerDNS) must connect as.
#   - `pdns-db-superuser` → administrative only, and NOT generated at all unless
#                         enableSuperuserAccess is set.
#
# The owner is therefore a DEDICATED low-privilege role (`pdns`), not `postgres`.
# An earlier revision set `owner: postgres` and used the -app secret, which is
# subtly broken: `postgres` is also CNPG's superuser, so with superuser access
# enabled the operator manages that role's password from the SUPERUSER secret,
# leaving the -app secret's password stale. PowerDNS then failed with
# `FATAL: password authentication failed for user "postgres"`. Keeping application
# and administrative roles distinct is what avoids that class of bug — and it is
# why enableSuperuserAccess is not needed here at all (nothing performs
# administrative work; PowerDNS only needs to read and write its own tables).
#
# Only the TABLE schema is applied by hand, because PowerDNS ships no tooling for
# it: `pdnsutil` has no create-db/setup-schema command (only `test-schema`, which
# validates), and the .sql files under /usr/local/share/doc/pdns/ are meant to be
# applied by the operator. postInitApplicationSQLRefs is therefore the only option.
#
# Zone, TSIG key and zone metadata are NOT seeded here — they are created by the
# `pdnsutil` seed Job (pdns-db-seed.yaml), using PowerDNS's own CLI.
#
# PowerDNS connects via the -rw service:
#   pdns-db-rw.external-dns.svc.cluster.local
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pdns-db
  namespace: external-dns
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  bootstrap:
    initdb:
      database: pdns
      owner: pdns
      # Order matters. `schema.sql` creates the tables (as superuser, so they are
      # owned by postgres), then `grants.sql` transfers rights to the `pdns` app
      # role. Without the grants PowerDNS could not write a single record.
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: pdns-db-schema
            key: schema.sql
          - name: pdns-db-grants
            key: grants.sql

  storage:
    storageClass: longhorn-1replica
    size: 5Gi

  # PowerDNS needs to know about failover promptly. CNPG's default probe interval
  # is tuned for general workloads; a DNS backend benefits from faster detection.
  # Only the liveness probe interval is set — everything else stays at CNPG
  # defaults (see the "Default-First Configuration" policy in AGENTS.md).
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
