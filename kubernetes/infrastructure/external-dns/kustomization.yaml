apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Self-hosted authoritative DNS + ExternalDNS.
#
# PowerDNS: authoritative DNS server (gpgsql backend on the pdns-db CNPG cluster,
# supports RFC2136). It was LMDB on a PVC, which is single-writer and pinned DNS to
# one node; gpgsql lets every replica read and write the same record store.
# ExternalDNS: syncs DNSEndpoint CRDs to PowerDNS via RFC2136 + TSIG.
#
# WHICH ZONES ARE SERVED is declared once, in `pdns_zones`
# (ansible/inventory/group_vars/all/vars.yml). Two files here are generated from it
# and must not be hand-edited — regenerate with `mise run dns-generate`:
#   pdns-zones-config.yaml        zone list the seed Job creates + configures
#   external-dns-zones-patch.yaml appends --rfc2136-zone/--domain-filter per zone
#
# To add a domain: append to pdns_zones, run `mise run dns-generate`, commit, then
# delegate the domain at its registrar to the glue records.
#
# SOPS-encrypted secrets (pdns-secrets.sops.yaml) contain:
#   - PowerDNS API key (read-only debugging API)
#   - TSIG key (RFC2136 dynamic updates — shared with cert-manager + ExternalDNS)
#
# Flux applies this automatically on git push (see infrastructure-external-dns.yaml
# in kubernetes/clusters/yral-k8s/). No manual apply needed.
resources:
  - namespace.yaml
  - dnsendpoint-crd.yaml
  - pdns-config.yaml
  - pdns-deployment.yaml
  - pdns-service-dns.yaml
  - pdns-service-api.yaml
  - external-dns-rbac.yaml
  - external-dns-deployment.yaml
  # DNS records are declared in DNSEndpoint CRDs, one pair of files per zone:
  #
  #   dnsendpoint-<zone>.yaml            GENERATED by the pdns-zones role from
  #                                     hosts.yml — apex + wildcard + ns1-11 glue +
  #                                     API endpoint records, all pointing at the
  #                                     cluster's nodes. NEVER hand-edit;
  #                                     regenerate EVERY zone at once with:
  #                                       mise run dns-generate
  #
  #   dnsendpoint-<zone>-external.yaml   WRITTEN BY HAND — the records that point
  #                                     OUT of the cluster: mail, third-party
  #                                     services, anything a person asked for.
  #                                     Add the file here when it exists.
  #
  # Both are ordinary DNSEndpoints and flow through external-dns identically; the
  # split is only about who owns the content. The generator owns the cluster's slice
  # of a zone, a human owns the rest. Regenerating therefore cannot clobber the
  # hand-written entries, and hand-writing cannot clobber the node records.
  #
  # Two safety properties make this work, both verified rather than assumed:
  #   - external-dns never modifies an unowned record. A record with no ownership
  #     TXT marker is treated as someone else's, so `--policy=sync` cannot delete a
  #     record external-dns did not create.
  #   - cert-manager's _acme-challenge TXT records are likewise unowned, so enabling
  #     --managed-record-types=TXT does not touch them.
  #
  # Record types accepted here: A, AAAA, CNAME, MX, NS, TXT. Anything else is
  # silently ignored — external-dns filters by type before comparing anything, so an
  # unsupported type produces no error and no log line. Add the type to
  # --managed-record-types in external-dns-deployment.yaml first if one is missing.
  - dnsendpoint-saikat-dev.yaml
  - dnsendpoint-oleole-ai.yaml
  - dnsendpoint-oleole-ai-external.yaml
  - pdns-secrets.sops.yaml
  # PowerDNS's PostgreSQL backend (CNPG) and its one-time seed.
  #
  # Ordering intent (Flux applies in list order, and re-applies every reconcile):
  #   cnpg-cluster      creates the DB, role and tables (schema via
  #                     postInitApplicationSQLRefs)
  #   pdns-zones-config the generated zone list the seed Job reads
  #   pdns-db-seed      seeds zones + TSIG + metadata once the DB exists
  #
  # The seed Job is safe to list here because pdns.conf says launch=gpgsql, so
  # pdnsutil in the Job talks to the new backend rather than the old LMDB file. The
  # Job is idempotent, and Flux keeps a Completed Job rather than re-running it.
  # For a from-scratch rebuild, delete the Job so Flux recreates it — see the
  # rebuild note in pdns-db-seed.yaml.
  - cnpg-cluster.yaml
  - pdns-db-schema.yaml
  - pdns-db-grants.yaml
  - pdns-zone-snapshot.yaml
  - pdns-zones-config.yaml
  - pdns-db-seed.yaml
  # Records external-dns cannot manage, applied with pdnsutil:
  #
  #   pdns-static-records.yaml      the oleole.ai MX + SPF, WRITTEN BY HAND. Blocked by
  #                                 two independent external-dns gaps — see its own header
  #                                 for both, with evidence. Changing it needs a manual
  #                                 `kubectl delete job pdns-static-records` (fixed name).
  #
  #   pdns-apex-records.yaml        GENERATED by the pdns-zones role from hosts.yml — the
  #                                 bare apex A + NS rrsets for every zone. Apex records
  #                                 carry no ownership marker, so external-dns drops them
  #                                 from both creates and updates and they can never be
  #                                 converged through a DNSEndpoint (upstream #6125).
  #                                 NEVER hand-edit; regenerate with `mise run dns-generate`.
  #                                 ConfigMap and Job are named by a content checksum, so a
  #                                 node change produces a NEW Job that Flux creates (and
  #                                 prunes the previous one) — no manual delete step.
  - pdns-static-records.yaml
  - pdns-static-records-job.yaml
  - pdns-apex-records.yaml

# Generated. Appends the per-zone RFC2136 flags to the external-dns Deployment.
#
# Must be a patch, not a resource — a JSON6902 op list has no resource metadata, so
# listing it under `resources` fails with "missing Resource metadata". The target
# lives here (stable) while the operations are generated per zone.
patches:
  - path: external-dns-zones-patch.yaml
    target:
      kind: Deployment
      name: external-dns
      namespace: external-dns
