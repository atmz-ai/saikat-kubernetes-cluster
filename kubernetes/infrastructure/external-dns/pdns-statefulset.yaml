# PowerDNS Authoritative Server — StatefulSet with the gpgsql (PostgreSQL) backend.
#
# All zone data lives in the pdns-db CNPG cluster, so PowerDNS itself is stateless:
# no PVC, no init container, and replicas are interchangeable. The previous LMDB
# backend stored zones in a local file and could therefore only ever run ONE pod
# (LMDB is single-writer — `Multiple instances: No`), which made DNS a single point
# of failure on a single node.
#
# Zone, TSIG key and zone metadata are seeded once by the pdns-db-seed Job using
# `pdnsutil` — see pdns-db-seed.yaml. That is a bootstrap concern, not a per-pod
# one, which is why it is a Job rather than an init container here: three replicas
# would otherwise race to seed the same zone on every pod start.
#
# One shared TSIG key serves every zone (the key name is just an identifier);
# external-dns sends the same key whichever zone it writes to. Add a new zone by
# appending it in pdns-db-seed.yaml AND to external-dns's --rfc2136-zone /
# --domain-filter lists, plus its DNSEndpoint CRD.
#
# Scheduling: worker nodes only (node affinity excludes control-plane).
#
# Ports:
#   - 5300/UDP + 5300/TCP: DNS (LoadBalancer Service maps 53→5300)
#   - 8081/TCP: HTTP API (ClusterIP — read-only debugging only)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: powerdns
  namespace: external-dns
  labels:
    app: powerdns
spec:
  serviceName: powerdns-api
  # 3 replicas: PowerDNS is stateless now (all state is in the pdns-db CNPG
  # cluster), so any replica can answer any query and accept any update. Three
  # gives HA across nodes and matches the database's 3 instances, so losing one
  # node does not remove the ability to serve DNS or accept RFC2136 updates.
  replicas: 3
  selector:
    matchLabels:
      app: powerdns
  template:
    metadata:
      labels:
        app: powerdns
    spec:
      securityContext:
        fsGroup: 953
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: powerdns
          image: docker.io/powerdns/pdns-auth-52:latest
          args:
            - --api-key=$(PDNS_API_KEY)
            # Connection parameters passed as args rather than in pdns.conf, so the
            # password never lands in a ConfigMap. Kubernetes expands $(VAR) in args;
            # these resolve from the env block below.
            - --gpgsql-host=$(PDNS_DB_HOST)
            - --gpgsql-port=$(PDNS_DB_PORT)
            - --gpgsql-dbname=$(PDNS_DB_NAME)
            - --gpgsql-user=$(PDNS_DB_USER)
            - --gpgsql-password=$(PDNS_DB_PASSWORD)
          ports:
            - name: dns-udp
              containerPort: 5300
              protocol: UDP
            - name: dns-tcp
              containerPort: 5300
              protocol: TCP
            - name: api
              containerPort: 8081
              protocol: TCP
          env:
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pdns-api-key
                  key: api-key
            # host/port are literals; dbname/user/password come from the Secret CNPG
            # generates for the `pdns` database. The -rw service is used so a CNPG
            # failover (which repoints it at the promoted replica) needs no change here.
            - name: PDNS_DB_HOST
              value: pdns-db-rw.external-dns.svc.cluster.local
            - name: PDNS_DB_PORT
              value: "5432"
            - name: PDNS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: dbname
            - name: PDNS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: username
            - name: PDNS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pdns-db-app
                  key: password
          volumeMounts:
            - name: pdns-config
              mountPath: /etc/powerdns/pdns.conf
              subPath: pdns.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 5300
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5300
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      # No volumeClaimTemplates: PowerDNS holds no local state. All zone data lives
      # in the pdns-db CNPG cluster (see cnpg-cluster.yaml).
      volumes:
        - name: pdns-config
          configMap:
            name: pdns-config
