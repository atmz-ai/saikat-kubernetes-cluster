# ExternalDNS — syncs DNSEndpoint CRDs to PowerDNS records.
#
# Uses --source=crd only (DNSEndpoint CRDs in kubernetes/infrastructure/external-dns/).
# Service annotations are NOT used — all DNS records are declarative DNSEndpoint CRDs.
# This avoids the EndpointSlice listing timeout on large clusters.
#
# Creates/updates records in PowerDNS via RFC2136 dynamic updates (TSIG-signed).
# Uses TXT registry for ownership tracking (--txt-owner-id=yral-k8s).
#
# Sources:
#   - service: creates records from Service annotations + LoadBalancer/ClusterIP
#   - crd: DNSEndpoint CRD for records without a Service (Phase 2 team delegation)
#
# Provider: rfc2136 (PowerDNS)
#   - --rfc2136-host: PowerDNS DNS Service (ClusterIP or LoadBalancer, port 53)
#   - --rfc2136-tsig-key-name: TSIG key name (must match PowerDNS config)
#   - --rfc2136-tsig-secret: from Secret (must match cert-manager's TSIG key)
#
# Domain filter: saikat.dev (Phase 1). Phase 2: add yral.com.
#
# Policy: sync (create + delete records to match desired state).
# ExternalDNS does NOT support leader election — single replica only.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.23.0
          args:
            - --source=crd
            - --provider=rfc2136
            - --rfc2136-host=powerdns-dns.external-dns.svc.cluster.local
            - --rfc2136-port=53
            # --rfc2136-zone and --domain-filter are NOT set here. They are appended
            # per zone by external-dns-zones-patch.yaml, generated from the
            # `pdns_zones` list in ansible/inventory/group_vars/all/vars.yml.
            #
            # They were previously hardcoded in this file as a comma-joined value,
            # which silently disabled record management entirely: both flags are
            # repeatable, so "saikat.dev,oleole.ai" named a single zone that matched
            # nothing and external-dns logged "All records are already up to date"
            # every cycle while managing zero records. Generating them removes the
            # chance to reintroduce that, and keeps them in step with the seed Job.
            #
            # Do not add --rfc2136-zone or --domain-filter here; add a zone to
            # pdns_zones and run `mise run dns-generate`.
            - --rfc2136-tsig-keyname=saikat-dev-key
            - --rfc2136-tsig-secret-alg=hmac-sha512
            - --rfc2136-tsig-secret=$(TSIG_KEY)
            # REQUIRED for --policy=sync. Without AXFR, ExternalDNS cannot list existing
            # records, and the sync policy silently degrades to create-only — it logs a
            # single warning at startup and then never updates or deletes anything:
            #   "--rfc2136-axfr is not set: ExternalDNS cannot list existing records,
            #    so --policy=sync will never update or delete them"
            # Server side: the zone authorises this key via TSIG-ALLOW-AXFR (set by
            # pdns-db-seed.yaml). The two must stay in step — the flag without the
            # metadata fails the transfer, the metadata without the flag is unused.
            - --rfc2136-axfr
            # Same repeatable-flag rule as --rfc2136-zone, and also generated — see
            # the note above. Add a zone to pdns_zones, not to this list.
            - --registry=txt
            - --txt-owner-id=yral-k8s
            - --policy=sync
            - --managed-record-types=A
            - --managed-record-types=AAAA
            - --managed-record-types=CNAME
            - --managed-record-types=NS
            - --log-level=info
            - --kube-api-qps=20
            - --kube-api-burst=40
          env:
            - name: TSIG_KEY
              valueFrom:
                secretKeyRef:
                  name: pdns-tsig-key
                  key: tsig-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi