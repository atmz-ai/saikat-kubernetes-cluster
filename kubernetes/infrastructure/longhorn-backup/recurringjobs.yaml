---
# Weekly S3 backup — full incremental backup to Hetzner Object Storage.
# Kept for 8 weeks (2 months); runs at 02:00 UTC every Sunday.
# groups: [default] applies to every volume that has no explicit recurring job
# selector set (i.e. all current volumes).
# ! This is the only copy that survives losing the node holding a volume. Local
# ! snapshots never did — deleting them is lossless, but never drop this job.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup
  namespace: longhorn-system
spec:
  cron: "0 2 * * 0"
  task: backup
  groups:
    - default
  retain: 8
  concurrency: 2
  labels: {}
---
# * No local snapshots accumulate on any volume. The former daily `snapshot` job is what pushed Loki
# * (431 GiB on a 50 GiB volume) and Prometheus (218 GiB on 100 GiB) 4-8x past their provisioned size,
# * and a volume that size cannot be copied to a fresh replica over the Helsinki<->India link before the
# * engine's 8 s replica timeout tears the rebuild down.
# *
# * `snapshot-delete` is the documented task that removes and purges all kinds of snapshots exceeding the
# * retention count — it clears the backlog the old snapshot job left behind, then holds every volume at
# * `retain`. retain is 2, not 1, because Longhorn needs two snapshots to coalesce and rebuild; the two
# * newest are small incremental deltas, so the bulk of the space is reclaimed either way.
# *
# * ! snapshot-delete drops snapshots a `backup` may be mid-upload on. Weekly backup runs Sun 02:00, so
# * ! the steady-state cron stays well clear of it.
# * ! BLOCKED on two volumes: Loki (pvc-728ed435, worker-35+azure-india-2) and Prometheus
# * ! (pvc-6e1d6c64, worker-17+azure-india-3) sit at 431/218 GiB and are NOT purging, because a
# * ! cross-region replica on them is perpetually rebuilding. A rebuilding replica blocks snapshot
# * ! removal outright -- the engine returns `cannot remove a snapshot because tcp://<india-ip>:10160
# * ! is rebuilding`. That is a deadlock: the volume is too big to copy to an India replica over the
# * ! ~146 ms link, the un-finishable rebuild blocks the purge, and the purge is what would shrink the
# * ! volume enough for the rebuild to finish. Every other volume purged cleanly (143 -> 50 snapshots,
# * ! 9 -> 2 per volume) and reclaimed its space.
# * Fix is to remove the cross-region replica for those two volumes, not to tune this job -- see the
# * volume owner's replica placement. Loki's durable data is in S3 anyway (this PVC is only WAL/index/
# * compactor working dir), so its WAN replica buys nothing.
# * The every-minute cron was the one-off backlog purge; daily is the steady-state schedule.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-delete
  namespace: longhorn-system
spec:
  cron: "0 3 * * *"
  task: snapshot-delete
  groups:
    - default
  retain: 2
  concurrency: 2
  labels: {}
