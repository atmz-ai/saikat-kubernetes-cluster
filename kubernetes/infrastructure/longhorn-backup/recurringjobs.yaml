---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-volume-backup
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: backup
  groups:
    - default
  retain: 7
  concurrency: 2
  labels: {}
---
# ! Backup uploads need their source snapshot; purge only removable and system layers.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup
  namespace: longhorn-system
spec:
  cron: "0 4 * * *"
  task: snapshot-cleanup
  groups:
    - default
  retain: 0
  concurrency: 2
  labels: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: postgresql-snapshot-cleanup
  namespace: longhorn-system
spec:
  cron: "0 4 * * *"
  task: snapshot-cleanup
  groups: []
  retain: 0
  concurrency: 2
  labels: {}
