apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-harbor
  namespace: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-harbor
  template:
    metadata:
      labels:
        app: oauth2-proxy-harbor
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --provider=google
            - --authenticated-emails-file=/etc/oauth2-proxy/allowed-emails
            - --upstream=http://harbor.harbor.svc.cluster.local
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://harbor.saikat.dev/oauth2/callback
            - --cookie-name=_oauth2_proxy_harbor
            - --cookie-secure=true
            - --cookie-expire=720h
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: atmz-internal-apps-google-oauth
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atmz-internal-apps-google-oauth
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
          volumeMounts:
            - name: allowed-emails
              mountPath: /etc/oauth2-proxy
              readOnly: true
          ports:
            - containerPort: 4180
              name: http
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: allowed-emails
          configMap:
            name: harbor-allowed-emails
