apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-longhorn-ui
  namespace: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-longhorn-ui
  template:
    metadata:
      labels:
        app: oauth2-proxy-longhorn-ui
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          args:
            - --provider=google
            # * Client B (atmz internal apps) + email allowlist, matching the dashboard
            # * pattern. Longhorn v1.12.1 has no native auth, so this proxy is the only gate.
            - --authenticated-emails-file=/etc/oauth2-proxy/allowed-emails
            - --upstream=http://longhorn-frontend.longhorn-system.svc.cluster.local:80
            - --http-address=0.0.0.0:4180
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_longhorn_ui
            - --cookie-expire=720h
            # ! Google will reject the login with redirect_uri_mismatch until
            # ! https://longhorn-ui.saikat.oleole.ai/oauth2/callback is added to the
            # ! atmz-internal-apps-google-oauth client's authorized redirect URIs in the
            # ! Google Cloud console. That step cannot be done from git.
            - --redirect-url=https://longhorn-ui.saikat.oleole.ai/oauth2/callback
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: atmz-internal-apps-google-oauth
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atmz-internal-apps-google-oauth
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: allowed-emails
              mountPath: /etc/oauth2-proxy
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: allowed-emails
          configMap:
            name: longhorn-ui-allowed-emails
