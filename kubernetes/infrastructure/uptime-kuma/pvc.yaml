# * Monitor configuration and history can be recreated manually; backups are intentionally disabled.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime-kuma
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/snapshot-cleanup: enabled
    recurring-job-group.longhorn.io/default: disabled
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi