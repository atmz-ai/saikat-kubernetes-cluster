# TODO(consolidate-build-pipeline): Replace Tekton Triggers only once SHIP-0031
# provides GitHub webhook handling. Keep Tekton Pipelines as the build engine.
# ! Shipwright Triggers currently exposes metrics, not a GitHub webhook receiver.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - webhook-certificate.yaml
  - https://github.com/shipwright-io/build/releases/download/v0.21.11/release.yaml
  - https://github.com/shipwright-io/triggers/releases/download/v0.20.0/release.yaml
  - clusterbuildstrategy-buildkit.yaml
# ! CRD conversion requires cert-manager CA injection; an empty caBundle breaks watches.
patches:
  - path: crd-ca-injection-patch.yaml
  # ! The upstream Triggers chart exposes port 80, but this image listens on 8080.
  - target:
      kind: Service
      name: shipwright-triggers
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8080
      - op: replace
        path: /spec/ports/0/targetPort
        value: webhook
  - target:
      kind: Deployment
      name: shipwright-triggers
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080