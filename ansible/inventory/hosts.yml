    k8s_cluster:
      children:
        control_plane:
          hosts:
            # ORDER MATTERS HERE: several roles delegate cluster operations to the
            # first OTHER member of this group, and that member must already be part
            # of the running cluster. Ansible preserves the order hosts appear in this
            # file, so a not-yet-joined node listed before the joined ones is picked as
            # the delegate and fails (no /etc/kubernetes/admin.conf). List the Azure
            # nodes LAST, after node-1..node-7, and comment them in one at a time.
            #
            # Azure nodes are reached as `saikat-machine-access`, NOT root: Azure
            # reserves the root account on its Ubuntu images and sshd refuses root
            # connections outright ("Please login as the user ... rather than the user
            # root"). The account has passwordless sudo.
            # Stacked control plane + worker nodes (run both CP and workloads)
            # node-1 = stacked CP (was control-plane-2)
            node-1:
              ansible_host: 65.21.137.111
              provider: hetzner
              stacked_mode: true
              datacenter: HEL1-DC3
              region: helsinki
              country: fi
              disk_type: nvme
              cloudflare_dns_records:
