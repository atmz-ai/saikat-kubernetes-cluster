---
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    # Kubernetes cluster configuration
    #
    # control_plane_endpoint becomes `controlPlaneEndpoint` in the kubeadm-config
    # ConfigMap, which is the address every NEWLY JOINING node bakes into its
    # kubeconfig via `kubeadm token create --print-join-command`.
    #
    # It reaches no component on an already-joined node — those hold their own baked
    # URL and nothing re-reads this value — so changing it affects only future joins
    # and is safe to do while the fleet is still running.
    #
    # Nodes joined before 2026-09 reference the PREVIOUS endpoint and keep working
    # because that name is still in the certificate below and still in DNS. They
    # converge by reprovisioning, and the old name is retired once none remain.
    control_plane_endpoint: "kubernetes-api.oleole.ai"
    # Additional Subject Alternative Names for the kube-apiserver serving
    # certificate, on top of `control_plane_endpoint` (which kubeadm already embeds)
    # and the node name/IP.
    #
    # List EVERY name that must stay valid at the same time — including the current
    # endpoint. The certificate is the gate: a name absent from it fails TLS
    # verification and loses the control plane, so a name is added here and rolled out
    # to the nodes BEFORE any client uses it, and removed only once no client remains.
    #
    # Keeping the previous endpoint listed is what makes the endpoint move a
    # no-flag-day change rather than a simultaneous switch. Combined with the endpoint
    # above, both nodes joined BEFORE the move and nodes joined AFTER it end up
    # carrying the same two names, so the fleet stays uniform throughout and either
    # name works on every node.
    #
    # Rendered into ansible/manifests/kubeadm-cluster-configuration.yaml.j2. The
    # control-plane-certificates role asserts each entry is actually present in the
    # live certificate, since changing this does not itself change any node.
    api_server_cert_sans:
      - kubernetes-api.oleole.ai
      - kubernetes-api.yral.com # previous endpoint — retire once no node references it
    pod_network_cidr: "10.244.0.0/16"

    # Hetzner Robot API credentials
    # (loaded from ansible/group_vars/all/vault.yml)
    hetzner_robot_api_user: "#ws+hEJX77Pr"
    # hetzner_robot_api_password: defined in vault.yml

    # Hetzner Object Storage for backups
    # (loaded from ansible/group_vars/all/vault.yml)
    hetzner_s3_access_key: "XO5X9A1W8AMHY3DSTKMS"
    # hetzner_s3_secret_key: defined in vault.yml
    hetzner_s3_bucket: "yral-bare-metal-kubernetes-cluster-control-plane-backup"
    hetzner_s3_endpoint: "https://hel1.your-objectstorage.com"
    hetzner_s3_region: "hel1"

  # TODO: Rename all the "worker-*" hosts to "node-*" by removing with the current name, renaming in inventory, and reprovisioning with the new name.
  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            # ORDER MATTERS HERE: several roles delegate cluster operations to the
            # first OTHER member of this group, and that member must already be part
            # of the running cluster. A node listed before the joined nodes but not
            # yet joined will be picked as the delegate and fail (no /etc/kubernetes).
            # Keep not-yet-joined nodes commented out until their join has succeeded.
            #
            # ── Azure nodes ───────────────────────────────────────────────
            # Reached as `saikat-machine-access`, NOT root: Azure reserves the
            # root account on its Ubuntu images and sshd refuses root connections
            # outright ("Please login as the user ... rather than the user root").
            # The global `ansible_user: root` is therefore overridden per host.
            # The account has passwordless sudo, and roles that need privilege ask
            # for it explicitly.
            #
            # `provider: azure` gates the provider-specific steps that do NOT apply
            # to a cloud VM: there is no Hetzner Robot to reprovision through (the
            # VM is built by Azure with cloud-init), the image already satisfies
            # ssh-hardening, and the interface address is a NAT'd private IP so the
            # node's public address has to be pinned for kubelet — see the
            # node_provider_address role.
            #
            # A CLUSTER LOCATION NEEDS MORE THAN ONE NODE. Kilo links one leader per
            # location and only routes BETWEEN locations, so a location holding a
            # single node has no peer to link to. All three nodes share
            # `location: centralindia`, which is what puts them in one location and
            # one subnet (vnet-centralindia-1/snet-centralindia-1, 172.16.0.0/24).
            #
            # kilo_peer_address vs kilo_endpoint_address — THE TWO DIVERGE HERE, which
            # is the whole reason they are separate variables:
            #   peer     = the private address on eth0. This is what the node's
            #              etcd/kubelet bind to and what the mesh routes to. It is NOT
            #              `ansible_host`: the VM's public IP is provider-side NAT and
            #              is absent from the interface entirely.
            #   endpoint = the public address, where peers open the WireGuard tunnel.
            #              The private address is not routable between cloud networks,
            #              so this must stay public.
            # Setting BOTH to the public IP reproduces the outage that took five nodes
            # NotReady — Kilo skips any node whose internal address equals its endpoint
            # ("we cannot encapsulate traffic to an IP through the IP").
            #
            # A node is listed here only once its join has succeeded, because several
            # roles delegate cluster operations to the first OTHER member of
            # control_plane and that member must already be in the cluster. Join
            # saikat-azure-central-india-1 first, verify it Ready, then uncomment the
            # next.
            #
            # NOT YET JOINED — all three are commented out deliberately. Joining them
            # depends on the Kilo mesh being live, which is what these addresses are
            # for; see the enable procedure in
            # kubernetes/clusters/yral-k8s/infrastructure-kilo.yaml.
            #
            # saikat-azure-central-india-1:
            #   ansible_host: 20.219.32.205
            #   ansible_user: saikat-machine-access
            #   provider: azure
            #   stacked_control_plane: true
            #   location: centralindia
            #   provider_zone: "1"
            #   resource_group: saikat-resource-group
            #   vm_name: saikat-azure-central-india-1
            #   # Split identity: private identity, public endpoint (see above).
            #   kilo_peer_address: 172.16.0.4
            #   kilo_endpoint_address: 20.219.32.205
            # saikat-azure-central-india-2:
            #   ansible_host: 20.198.74.224
            #   ansible_user: saikat-machine-access
            #   provider: azure
            #   stacked_control_plane: true
            #   location: centralindia
            #   provider_zone: "2"
            #   resource_group: saikat-resource-group
            #   vm_name: saikat-azure-central-india-2
            #   kilo_peer_address: 172.16.0.5
            #   kilo_endpoint_address: 20.198.74.224
            # saikat-azure-central-india-3:
            #   ansible_host: 20.235.109.17
            #   ansible_user: saikat-machine-access
            #   provider: azure
