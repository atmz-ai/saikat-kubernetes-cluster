---
# Ansible Variables - Configuration and Vault Indirection
# This file contains plaintext configuration values and indirection for vault secrets.
# Vault variables (prefixed with vault_) are loaded in pre_tasks before roles execute.

# Kubernetes cluster configuration (cluster-wide kubeadm ClusterConfiguration
# values — single source of truth, consumed by the cluster-init and
# control-plane-metrics roles' kubeadm config template)
kubernetes_version: "1.36.4"
service_node_port_range: "80-32767"

# Hetzner Robot API credentials
hetzner_robot_api_user: "#ws+hEJX77Pr"
hetzner_robot_api_password: "{{ vault_hetzner_robot_api_password }}" # Indirection to vault

# Hetzner S3 credentials
hetzner_s3_access_key: "XO5X9A1W8AMHY3DSTKMS"
hetzner_s3_secret_key: "{{ vault_hetzner_s3_secret_key }}" # Indirection to vault

# Kubernetes cluster admin kubeconfig (stored in vault, used by scripts/setup-local-env.sh)
kubeconfig: "{{ vault_kubeconfig }}" # Indirection to vault

# GitHub PAT for Flux bootstrap (stored in vault, exported as GITHUB_TOKEN by scripts/setup-local-env.sh)
github_flux_token: "{{ vault_github_flux_token }}" # Indirection to vault

# Age private key for Flux SOPS decryption
# scripts/setup-local-env.sh creates k8s Secret 'sops-age' in flux-system namespace.
# Flux uses this key to decrypt *.sops.yaml files from git (e.g. cloudflare-api-token).
# To generate: age-keygen -o /tmp/age.key  (then store contents as vault_age_private_key)
age_private_key: "{{ vault_age_private_key }}" # Indirection to vault

# Saikat machine-access SSH keypair — used for all node access, on any provider
# (Hetzner today; cloud providers as they are added) AND for git operations
# against GitHub (single key for everything).
# Private key is secret (vault); public key is plaintext (safe to commit).
# `mise run bootstrap` extracts the private key to ./.saikat-machine-access-ed25519 (fnox +
# ansible.cfg use it) AND installs it as ~/.ssh/id_ed25519 (the default SSH
# identity), so ssh, git, and ansible all pick it up automatically.
# To get the public key: ssh-keygen -y -f ~/.ssh/id_ed25519
saikat_machine_access_ssh_private_key: "{{ vault_saikat_machine_access_ssh_private_key }}" # Indirection to vault
saikat_machine_access_ssh_pub_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM/H7Jp2RgC1xtg1nyzpmhzOTmUz3n+PQPsk83BzUskg saikat-machine-access" # Plaintext — derived from private key via: ssh-keygen -y -f ~/.ssh/id_ed25519

# Cloudflare DNS management for kubernetes-api round-robin A records
# Used by node-remove and control-plane-join roles to update DNS on CP add/remove
cloudflare_api_token: "{{ vault_cloudflare_api_token }}" # Indirection to vault
cloudflare_zone_id: "f0e13310b0b3c66709f0debd5e3bbb10"
cloudflare_zone_name: "yral.com"
kubernetes_api_hostname: "kubernetes-api.yral.com"
cloudflare_app_wildcard_hostname: "*.yral.com" # Proxied wildcard served by cilium-envoy on all nodes

# Namecheap API — for custom nameserver (glue record) management
# Used by the namecheap-dns role to register ns1–ns13 glue records.
# Enable API access in Namecheap dashboard: Profile > Tools > Business & Dev Tools > API Access
# Whitelist the Ansible control machine IP in the same dashboard.
# ApiUser and UserName are the same (Namecheap account username) — not secret.
# Only the API key is sensitive (vault indirection).
namecheap_api_user: "saikatdas0790" # Plaintext — not secret
namecheap_username: "saikatdas0790" # Plaintext — not secret (same as api_user)
namecheap_api_key: "{{ vault_namecheap_api_key }}" # Indirection to vault — secret

# Namecheap custom nameservers — per-host annotation in hosts.yml
# Workers with `namecheap_nameserver` defined (e.g. "ns1") are registered
# as custom nameservers (glue records) at Namecheap via the namecheap-dns role.
# The worker's ansible_host IP is used as the glue record IP.
# The nameserver prefix is generic ("ns1") — the FQDN is constructed per-domain
# by the role (e.g. "ns1.saikat.dev", "ns1.yral.com"). This way the same workers
# serve as nameservers for all domains without changing hosts.yml.
# 11 nameservers = Namecheap API max (ICANN allows 13, but Namecheap's setCustom API limits to 11).
# These IPs must match the externalIPs in the powerdns-dns Service
# (kubernetes/infrastructure/external-dns/pdns-service-dns.yaml).

# ── PowerDNS zones ──────────────────────────────────────────────────────────
# SINGLE SOURCE OF TRUTH for every zone this cluster serves authoritatively.
#
# Adding a domain = append one entry here, run `mise run dns-generate`, commit.
# Two files are rendered from this list and must not be hand-edited:
#   kubernetes/infrastructure/external-dns/pdns-zones-config.yaml
#     - the zone list the seed Job creates + configures (zone, TSIG metadata)
#   kubernetes/infrastructure/external-dns/external-dns-zones-patch.yaml
#     - a JSON6902 append patch adding --rfc2136-zone/--domain-filter per zone
# The generator asserts both carry every zone, so a bad render fails loudly.
#
# Why a generated list rather than editing the manifests directly: the zone name
# appears in three unrelated places (the seed Job's script, external-dns's
# --rfc2136-zone flag, and external-dns's --domain-filter flag) and they must
# agree. They are the same value, so hardcoding it three times meant a new zone
# was a multi-file edit with silent failure modes — a flag left behind, or a zone
# created but never added to external-dns's list.
#
# Fields:
#   name       the zone, exactly as the registrar delegates it
#   snapshot   load pdns-zone-snapshot.yaml on seed. Only for zones that already
#              served records elsewhere and need their contents preserved before
#              external-dns can recreate them from DNSEndpoint CRDs. A brand-new
#              zone leaves this false and starts empty.
#
# There is deliberately no "declared but not live" state. A zone listed here is a
# zone this cluster serves: the seed Job creates it and external-dns is pointed at
# it. Listing a zone that does not exist yet would break the AXFR at startup, so a
# not-yet-ready domain simply stays out of the list until it is ready.
#
# After adding a zone, the registrar must delegate it here — point the domain's
# NS records at the glue records registered by the namecheap-dns role
# (ns1–ns11.<zone>, see hosts.yml `namecheap_nameserver`).
pdns_zones:
  - name: saikat.dev
    snapshot: true
  # Newly registered — no prior records, so nothing to preserve and the zone starts
  # empty for external-dns to populate from its DNSEndpoint CRDs.
  - name: oleole.ai
    snapshot: false

# ── Hetzner vSwitch (the cluster's private L2 network) ──────────────────────
# Shared data for TWO roles — `vswitch` (Robot API membership) and `vswitch-vlan`
# (the per-node VLAN interface). It lives here rather than in either role's
# defaults because role defaults are not shared between roles, and duplicating the
# VLAN id or the subnets would let the two drift: a mismatch produces an interface
# that comes up cleanly and carries nothing.
#
# WHY A VSWITCH AT ALL. Every node's only address is its public /32, so Kilo finds
# no "private" address (it classifies with an RFC1918 test), gives each node its own
# location, and that is what broke pod->ClusterIP cluster-wide. Pointing
# kilo.squat.ai/force-internal-ip at the public IP does not help either: the internal
# address then EQUALS the endpoint, and Kilo skips the node entirely —
#   "we cannot encapsulate traffic to an IP through the IP".
# The address has to genuinely exist AND differ from the endpoint.
#
# PER-REGION SUBNETS, one VLAN. Kilo groups by region and links only BETWEEN
# locations, so a single shared subnet would put each region's peers behind another
# location — a black hole. Splitting by region makes same-subnet traffic on-link and
# cross-region traffic exactly what Kilo encapsulates (--encapsulate=crosssubnet).
#
# 172.20 is clear of 10.244/16 (pods), 10.96/12 (services), 10.4/16 (Kilo WireGuard),
# 172.16/16 (Azure), 172.31/16 (AWS) and 10.128/20 (GCP), and was verified absent
# from the node routing tables. Keys are topology.kubernetes.io/region values.
vswitch_name: "k8s-mesh"
vswitch_vlan_id: 4000
vswitch_subnets:
  falkenstein: "172.20.10.0/24"
  helsinki: "172.20.20.0/24"

# First host octet handed out inside a region subnet; a node's octet is this plus its
# position in the region's sorted node list (see the vswitch-vlan role). Starting at
# 10 rather than 1 leaves the low addresses free for a future gateway or router on
# the VLAN, which is where one conventionally goes.
vswitch_host_octet_base: 10

# Parent interface — every Hetzner bare-metal node in this cluster reports this
# (the provisioning role's installimage layout). NOT auto-detected: guessing the
# wrong parent would take the node's primary interface down.
vswitch_vlan_parent: "enp0s31f6"

# A VLAN tag costs 4 bytes, so the device must stay under the parent's 1500.
# Hetzner's docs specify 1400 and note netplan does not always apply it, so the role
# verifies and corrects it after apply.
vswitch_vlan_mtu: 1400
