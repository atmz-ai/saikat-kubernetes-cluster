---
# ── The node list ─────────────────────────────────────────────────────────────
# EVERY cluster node is declared ONCE, here, in the order it should be considered.
# There is no control-plane list and no worker list to keep in step — those are
# DERIVED from this one by 10-role-groups.yml, so they cannot drift from it.
#
# ORDER IS LOAD-BEARING. Several roles delegate cluster operations to the first
# member of the derived control_plane group, and that member must already be part
# of the running cluster — a not-yet-joined node listed before the joined ones is
# picked as the delegate and fails with no /etc/kubernetes/admin.conf. Add a node
# at the END of `hosts:` below, and join it before anything else depends on it.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    # ! Changing the join endpoint does not change existing kubeconfigs.
    control_plane_endpoint: "kubernetes-api.oleole.ai"
    # ! Desired SANs do not change existing certificates. Verify every serving
    # ! endpoint before DNS regeneration or client cutover; retain old names meanwhile.
    api_server_cert_sans:
      - kubernetes-api.oleole.ai
      - kubernetes-api.saikat.dev
      - kubernetes-api.yral.com # ! Retain until every client has moved.
    pod_network_cidr: "10.244.0.0/16"

    # Hetzner Robot API credentials
    # (loaded from ansible/group_vars/all/vault.yml)
    hetzner_robot_api_user: "#ws+hEJX77Pr"
    # hetzner_robot_api_password: defined in vault.yml

  children:
    controller:
      hosts:
        localhost:
          ansible_connection: local
          ansible_become: false
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    nodes:
      # ! `node_role` is what decides which derived group a host lands in, so a new
      # ! CONTROL PLANE MUST SET `node_role: control-plane` (and `stacked_control_plane:
      # ! true`). Omitting it makes the node a worker by inheritance, and the failure is
      # ! silent: it drops out of `control_plane`, so it is left out of the API server
      # ! endpoint records and skipped by the control-plane upgrade playbook while
      # ! everything still reports healthy.
      #
      # * `worker` is the default rather than the exception so the 22 workers need no
      # * per-host line at all — only the 10 control planes state their role. Default-first:
      # * the common case carries no configuration, and a host's entry states only what
      # * makes it different.
      vars:
        node_role: worker
      hosts:
        # ── Control planes ─────────────────────────────────────────────
        # `namecheap_nameserver` on a control plane makes it one of the domain's
        # nameservers: the annotation drives the registrar glue record, the zone's NS
        # set, AND the PowerDNS Service's externalIPs, all from this one line.
        #
        # The set lives here, on the control planes, rather than on the workers: every
        # control plane is `stacked_control_plane: true` and runs workloads like any other
        # node, and they are the stable set — a delegation anchored on the workers has to be
        # re-pointed every time the worker fleet churns.
        #
        # A nameserver needs only its address bound to :53; Cilium routes that to whichever
        # node hosts a PowerDNS pod over the VXLAN tunnel, so NO PowerDNS pod needs to run
        # on the annotated node. Verified: the previous worker-based nameservers answered
        # queries while running no PowerDNS pod at all.
        #
        # ! The desired delegation is ns1/ns4/ns5 on Azure. Retired glue registrations
        # ! are not active delegation members after setCustom replaces the parent NS set.
        # ! Keep outgoing addresses reachable via pdns_nameservers_previous_ips until
        # ! the parent delegation cache window expires; only then remove their hosts.
        # node-1 = stacked CP (was control-plane-2)

        # ── Azure control plane ───────────────────────────────────────
        #
        # THE HOST NAME IS THE VM NAME ON PURPOSE. kubeadm registers a node under
        # its machine hostname, and an Azure VM's hostname is the resource name the
        # provider set at creation — it cannot be `node-N` without renaming the VM
        # or overriding the hostname. Keeping the two the same means
        # `ansible_facts['hostname'] == inventory_hostname` for every node, which
        # the roles rely on: they are split between the two (control-plane-join uses
        # inventory_hostname, node-labels uses the hostname fact), and that split is
        # invisible on Hetzner only because installimage sets the OS hostname from
        # the inventory name.
        #
        # Azure nodes are reached as `saikat-machine-access`, NOT root: Azure
        # reserves the root account on its Ubuntu images and sshd refuses root
        # connections outright ("Please login as the user ... rather than the user
        # root"). The account has passwordless sudo, so `ansible_become: true` is
        # set per host — delegated cluster administration (kubectl, ctr) then runs
        # as root and finds /etc/kubernetes/admin.conf.
        #
        # There is no `private_address`: the NAT'd eth0 address is not routable by
        # peers, so `ansible_host` (public) is this node's cluster identity — the
        # apiserver advertise address, the etcd peer URL and kubelet's --node-ip.
        # Cilium encapsulates pod traffic to it over VXLAN.
        #
        # LISTED LAST, after node-1..node-7, because Ansible preserves this file's
        # order and the first derived control plane (`groups['control_plane'][0]`) is
        # the delegate for several roles.
        #
        # Enable a node here only after its join succeeded and etcd is healthy with it.
        saikat-azure-central-india-1:
          ansible_host: 20.219.32.205
          rustfs_data_disks:
            - device: /dev/disk/azure/data/by-lun/0
              mount_path: /var/lib/rustfs/data/disk-0
          namecheap_nameserver: "ns1"
          powerdns_frontend_address: 172.16.0.4
          ansible_user: saikat-machine-access
          ansible_become: true
          provider: azure
          node_role: control-plane
          stacked_control_plane: true
          location: centralindia
          provider_zone: "1"
        saikat-azure-central-india-2:
          ansible_host: 20.198.74.224
          rustfs_data_disks:
            - device: /dev/disk/azure/data/by-lun/0
              mount_path: /var/lib/rustfs/data/disk-0
          namecheap_nameserver: "ns4"
          powerdns_frontend_address: 172.16.0.5
          ansible_user: saikat-machine-access
          ansible_become: true
          provider: azure
          node_role: control-plane
          stacked_control_plane: true
          location: centralindia
          provider_zone: "2"
        saikat-azure-central-india-3:
          ansible_host: 20.235.109.17
          rustfs_data_disks:
            - device: /dev/disk/azure/data/by-lun/0
              mount_path: /var/lib/rustfs/data/disk-0
          namecheap_nameserver: "ns5"
          powerdns_frontend_address: 172.16.0.6
          ansible_user: saikat-machine-access
          ansible_become: true
          provider: azure
          node_role: control-plane
          stacked_control_plane: true
          location: centralindia
          provider_zone: "3"

        # ── Workers ───────────────────────────────────────────────────
        # `node_role` is inherited as `worker` from the group vars above, so these
        # entries declare only what distinguishes each node (address, provider,
        # datacenter, and for ns1–ns11 the nameserver glue record).
        #
        # All DNS records are grey cloud (proxied: false) — Cloudflare proxy removed to avoid upload limits.
