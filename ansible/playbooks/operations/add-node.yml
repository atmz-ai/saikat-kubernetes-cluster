---
# Add a node to the cluster — control plane OR worker, decided by the node's own
# `node_role` in the inventory rather than by which playbook was invoked.
#
# Usage:
#   ansible-playbook ansible/playbooks/operations/add-node.yml -e target_host=node-8
#   ansible-playbook ansible/playbooks/operations/add-node.yml -e target_host=saikat-azure-central-india-4
#
# WHY THERE IS NO add-worker/add-control-plane SPLIT ANY MORE: the two differed only in
# the join role; every other role is either identical or self-gating. Keeping them apart
# meant maintaining the same role list twice, and they had already drifted — they ran
# storage-longhorn at different points in the sequence, and only the control-plane
# variant ran node_provider_address (so a cloud WORKER would have joined advertising an
# address kubelet cannot use, while the control-plane path was correct).
#
# Which roles run is now derived from the host's own attributes:
#   node_role: control-plane  → control-plane-join  (etcd member, apiserver, taint handling)
#   node_role: worker         → worker-join         (join token)
#   provider:  hetzner        → provision (Robot API + installimage), ssh-hardening
#   provider:  azure          → neither; the cloud image already satisfies both, and
#                               running them can only change things that do not need it

- name: Add node to the cluster (provision, configure, join)
  hosts: "{{ target_host | default('nodes') }}"
  # ! gather_facts MUST stay true. Several roles here need ansible_facts
  # ! (base-system, containerd, kubernetes, node_provider_address, node-labels,
  # ! storage-longhorn), and the ONLY other place they are gathered is inside the
  # ! `provision` role — which is skipped on a cloud provider. Without this, a fresh
  # ! host (or an expired 24h fact cache) fails at node_provider_address six roles in,
  # ! with a message about the address rather than about the missing facts.
  gather_facts: true
  serial: 1
  # ! Play-level become, NOT role meta. `become: true` in a role's meta/main.yml is
  # ! ignored by ansible-core (RoleMetadata accepts only allow_duplicates, dependencies,
  # ! galaxy_info, argument_specs), so declaring it there silently does nothing. A cloud
  # ! VM is reached as a non-root sudo-capable user, so privilege must actually be
  # ! granted; as root this is a no-op.
  become: true

  roles:
    # A cloud VM is built from an image and arrives ready to configure, so it is not
    # reached through the Robot API at all. Gated by provider, not by "is it up yet".
    - role: provision
      when: provider | default('hetzner') == 'hetzner'
    - role: storage-longhorn
    - role: storage-rustfs
    # Skipped on a cloud VM: the image already satisfies this role's entire intent, and
    # its one real effect there would be flipping UsePAM yes -> no, which buys nothing
    # (password auth is already off) and carries the documented risk of breaking
    # account/session handling. On Hetzner it matters — installimage builds a minimal
    # sshd config with password auth ON.
    - role: ssh-hardening
      when: provider | default('hetzner') == 'hetzner'
    - role: base-system
    - role: resolv-cleanup
    - role: sysctl-tuning
    - role: containerd
    - role: kubernetes
    # AFTER kubernetes and BEFORE the join, and this ordering is load-bearing: this role
    # restarts kubelet and pins the address kubelet must advertise, so kubelet has to
    # exist first, and it must already be running with the right --node-ip when the join
    # registers the node — otherwise the node joins advertising an address its peers
    # cannot reach. It self-gates on provider (no pinning when the routed address is
    # already local), so it is safe on bare metal and necessary on a NAT'd cloud VM.
    - role: node_provider_address
    - role: control-plane-join
      when: node_role == 'control-plane'
    - role: worker-join
      when: node_role == 'worker'
    - role: node-labels
    # LAST, and only after the node has joined: the agent registers itself with the hub
    # under the node's name, so the name must already be the real one. It is not gated on
    # node_role — control planes are monitored too.
    - role: beszel-agent

# Regenerate the DNS records from the updated inventory — a SECOND play, because the
# generator reads hostvars and must run after the join rather than alongside it.
#
# Without this a new node joins successfully, reports Ready, and receives NO traffic: the
# apex and wildcard records list every node IP, so a node absent from them is simply never
# routed to. Nothing reports a problem — the cluster looks healthy and the node is
# unreachable.
#
# It matters more for a control plane: the API server endpoint record lists control-plane
# IPs only, so a new control plane absent from it is not part of the API endpoint.
#
# These records are owned by external-dns, so this only rewrites the DNSEndpoint files.
# Writing the DNS records directly would put two writers on one record and external-dns
# would revert it on its next sync — succeeding while undoing itself. Commit and push
# instead; Flux applies it and external-dns converges.
- name: Regenerate the DNS records for the updated inventory
  hosts: localhost
  gather_facts: false
  vars:
    pdns_zones_output_dir: "{{ playbook_dir }}/../../../kubernetes/infrastructure/external-dns"
  roles:
    - role: pdns-zones
