---
# Register/update Namecheap custom nameservers (glue records) from inventory.
#
# Iterates over all `nodes` hosts — control planes included, since nameservers are no
# longer workers-only. Any node with `namecheap_nameserver` defined in hosts.yml is
# registered as a custom nameserver at Namecheap. That node's ansible_host IP is used
# as the glue record IP (single source of truth).
#
# API calls are delegated to node-3 (IP 95.216.228.60) — that is the static IP
# whitelisted in the Namecheap dashboard. It was `control-plane-1` before the
# control-plane-N → node-N inventory rename, so the delegate was a dead host name
# until this fix. node-3's IP is already on the allowlist, so it is left as-is
# deliberately (changing it would break the working setup until the new node's IP
# is whitelisted).
#
# Whitelisting is UI-only — Namecheap exposes no API for it. If a delegate's IP
# drops off the allowlist (e.g. the node was reprovisioned and got a new IP), the
# role's preflight in ansible/roles/namecheap-dns/tasks/main.yml fails with the
# exact dashboard steps to add the new IP.
#
# Personal devices on WiFi don't have static IPs, so we can't whitelist them.
# To whitelist a different node, change the `namecheap_delegate_host` var.
#
# Run this after PowerDNS is deployed and the DNS LoadBalancer Service has
# externalIPs configured (matching the worker IPs in hosts.yml).
#
# Usage:
#   ansible-playbook ansible/playbooks/operations/update-namecheap-dns.yml \
#     -e namecheap_domain_sld=saikat -e namecheap_domain_tld=dev

- name: Register Namecheap glue records and set custom nameservers
  hosts: nodes
  # Serial — Namecheap API rate-limits parallel requests ("Too many requests").
  # One node at a time: getInfo → create/update, then move to the next.
  serial: 1
  gather_facts: false
  vars:
    # Domain defaults — override with -e namecheap_domain_sld=... -e namecheap_domain_tld=...
    namecheap_domain_sld: "saikat"
    namecheap_domain_tld: "dev"
    # API calls delegate to this host (must be whitelisted in Namecheap dashboard).
    # node-3 == the old control-plane-1; its IP is the one Namecheap has on file.
    namecheap_delegate_host: "node-3"
  roles:
    - role: namecheap-dns
