---
# TODO(remove-after-endpoint-migration): delete this playbook and the
# control-plane-certificates role once the controlPlaneEndpoint has moved to
# kubernetes-api.oleole.ai, `api_server_cert_sans` is empty, and the old yral.com
# name is retired.
#
# This is meant to be a one-time convergence step, not permanent tooling: the SANs it
# installs are an intermediate state that exists only so the endpoint can be moved
# without a flag day. Once the migration is done, `kubeadm init`/`join` on
# reprovisioned nodes produce the correct certificate directly and there is nothing
# left to reconcile. Deleting it outright before then would strand the change — the
# certificate is not derived from the declaration on an existing node, so removing
# this leaves the declaration and the live certificates disagreeing.
#
# Converge the kube-apiserver serving certificate on the declarative Subject
# Alternative Name list (control-plane-certificates role).
#
# The SAN list lives in ansible/inventory/hosts.yml (`api_server_cert_sans`) and is
# rendered into the shared kubeadm ClusterConfiguration template, but a certificate
# on a running node is not rebuilt from that configuration — kubeadm only builds
# certificates at init and join time. A name missing from the certificate is a TLS
# verification failure for every client using it, so this playbook is what makes the
# declaration actually take effect on existing control planes.
#
# Run it after changing `api_server_cert_sans`, and BEFORE any client starts using a
# newly added name. Both the old and new names are verified on every node, so the
# endpoint migration has no flag day.
#
# Usage:
#   Canary on a single node first — always:
#     ansible-playbook ansible/playbooks/operations/reconcile-control-plane-certificates.yml -e target_host=node-1
#
#   Then roll out to the rest, one at a time:
#     ansible-playbook ansible/playbooks/operations/reconcile-control-plane-certificates.yml -e target_host=node-2
#     ... (node-3 through node-7)
#
#   All control planes (serial: 1, so still one at a time):
#     ansible-playbook ansible/playbooks/operations/reconcile-control-plane-certificates.yml
#
# Each node's API server is restarted to load the new certificate, so its endpoint is
# briefly unavailable. serial: 1 keeps that to one control plane at a time — the
# remaining nodes keep serving. Do not raise it.
#
# Idempotent: a node whose certificate already carries every required SAN is only
# read and reported, never restarted.

- name: Reconcile control plane API server certificate SANs
  hosts: "{{ target_host | default('control_plane') }}"
  gather_facts: true
  serial: 1

  roles:
    - role: control-plane-certificates
