---
# TODO: merge this to add-node.yml
# Add Control Plane Node to Kubernetes Cluster
# Usage: ansible-playbook operations/add-control-plane.yml -e target_host=control-plane-X

- name: Add control plane node (provision, configure, join)
  # target_host is always passed explicitly at run time (-e target_host=control-plane-X);
  # the default exists only so ansible-lint syntax-check can resolve the hosts keyword.
  hosts: "{{ target_host | default('control_plane') }}"
  gather_facts: false

  serial: 1

  roles:
    - role: provision
    - role: storage-longhorn
    - role: ssh-hardening
    - role: base-system
    - role: resolv-cleanup
    - role: sysctl-tuning
    - role: containerd
    - role: kubernetes
    - role: control-plane-join
    - role: node-labels
    - role: cloudflare-dns

# Regenerate the DNS records from the updated inventory — a SECOND play, because the
# generator reads hostvars and must run after the join rather than alongside it.
#
# This matters more for a control plane than a worker: the API server endpoint record
# lists control plane IPs only, so a new control plane absent from it is not part of the
# API endpoint's round-robin — the control plane is up but not used.
- name: Regenerate the DNS records for the updated inventory
  hosts: localhost
  gather_facts: false
  vars:
    pdns_zones_output_dir: "{{ playbook_dir }}/../../kubernetes/infrastructure/external-dns"
  roles:
    - role: pdns-zones
