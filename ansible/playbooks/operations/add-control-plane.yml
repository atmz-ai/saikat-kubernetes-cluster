---
# TODO: merge this to add-node.yml
# Add Control Plane Node to Kubernetes Cluster
# Usage: ansible-playbook operations/add-control-plane.yml -e target_host=control-plane-X

- name: Add control plane node (provision, configure, join)
  # target_host is always passed explicitly at run time (-e target_host=control-plane-X);
  # the default exists only so ansible-lint syntax-check can resolve the hosts keyword.
  hosts: "{{ target_host | default('control_plane') }}"
  gather_facts: false

  serial: 1

  # Play-level become, NOT role meta. `become: true` in a role's meta/main.yml is
  # ignored by ansible-core (RoleMetadata accepts only allow_duplicates,
  # dependencies, galaxy_info, argument_specs), so several roles in this repo
  # declare it and silently do not get it. That went unnoticed because every
  # node so far was reached as root, where no escalation is needed. A cloud VM is
  # reached as a non-root sudo-capable user, so privilege must actually be granted.
  #
  # Set here rather than per-task so a role cannot forget it, and it is safe for
  # the root-connected providers too: become as root is a no-op.
  become: true

  roles:
    # `provision` reprovisions a bare-metal server through the Hetzner Robot API
    # (rescue mode + installimage). A cloud VM is not reached that way: the
    # provider builds it from an image, and the node arrives ready to configure.
    # Running it against an Azure node would hit the Robot API with an IP that is
    # not a Hetzner server — so it is skipped by provider, not by "is it up yet".
    - role: provision
      when: provider | default('hetzner') == 'hetzner'
    - role: storage-longhorn
    # Skipped on azure: the cloud image already satisfies this role's entire
    # intent, so running it can only change things that do not need changing.
    #
    # Verified against the live image (`sshd -T`, the authoritative view):
    #   PasswordAuthentication      no   (already — 50-cloud-init.conf drop-in)
    #   PubkeyAuthentication        yes  (already)
    #   KbdInteractiveAuthentication no  (already)
    # The role's four directives therefore have exactly ONE effect here: flipping
    # UsePAM yes -> no. That buys no security (password auth is already off) and
    # carries real risk — sshd's own documentation warns that disabling PAM can
    # break account and session handling.
    #
    # On Hetzner the role is worth keeping: installimage builds a minimal sshd
    # config with password auth ON, and provision reinstalls the OS on every run,
    # so those edits both matter and cannot accumulate.
    - role: ssh-hardening
      when: provider | default('hetzner') == 'hetzner'
    - role: base-system
    - role: resolv-cleanup
    - role: sysctl-tuning
    - role: containerd
    - role: kubernetes
    # AFTER kubernetes, not before: this role restarts kubelet and asserts it is
    # running with the pinned address, so kubelet has to exist first. Placing it
    # earlier failed with "Could not find the requested service kubelet" on a
    # node where the service was not installed yet.
    #
    # Still BEFORE control-plane-join, which is the ordering that matters: kubelet
    # must already be running with --node-ip when the join registers the node, or
    # the node joins advertising an address its peers cannot reach.
    - role: node_provider_address
    # BEFORE the join, and before node-labels. Two reasons:
    #   * node-labels writes the Kilo annotation from the address this role puts on the
    #     interface, so the interface has to exist first for the two to agree.
    #   * the mesh address must be up by the time the node registers, so that etcd comes
    #     up on an address its peers can reach — otherwise a rejoining control plane
    #     advertises the public address and the mesh routes to a different one.
    #
    # It has its own dead-man's switch (see the role), which is what makes this safe to
    # run unattended inside a join: a failure here returns the node's networking to its
    # pre-role state rather than stranding it.
    - role: vswitch-vlan
    - role: control-plane-join
    - role: node-labels
    - role: cloudflare-dns

# Regenerate the DNS records from the updated inventory — a SECOND play, because the
# generator reads hostvars and must run after the join rather than alongside it.
#
# This matters more for a control plane than a worker: the API server endpoint record
# lists control plane IPs only, so a new control plane absent from it is not part of the
# API endpoint's round-robin — the control plane is up but not used.
- name: Regenerate the DNS records for the updated inventory
  hosts: localhost
  gather_facts: false
  vars:
    pdns_zones_output_dir: "{{ playbook_dir }}/../../kubernetes/infrastructure/external-dns"
  roles:
    - role: pdns-zones
