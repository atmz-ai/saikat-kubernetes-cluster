---
# Initialize First Control Plane Node
# Usage: ansible-playbook operations/init-control-plane.yml
#
# Role order: provision → storage-longhorn → ssh-hardening → base-system → resolv-cleanup →
#             sysctl-tuning → containerd → kubernetes → cluster-init → node-labels →
#             helm → gateway-api-crds → cilium

- name: Initialize first control plane node (provision from scratch)
  # target_host is always passed explicitly at run time (-e target_host=node-N);
  # the default exists only so ansible-lint syntax-check can resolve the hosts
  # keyword. Same convention as add-control-plane.yml.
  hosts: "{{ target_host | default('control_plane') }}"
  gather_facts: false
  serial: 1

  roles:
    - role: provision
    - role: storage-longhorn
    - role: ssh-hardening
    - role: base-system
    - role: resolv-cleanup
    - role: sysctl-tuning
    - role: containerd
    - role: kubernetes
    - role: cluster-init
    - role: node-labels
    - role: helm
    - role: gateway-api-crds
    - role: cilium
