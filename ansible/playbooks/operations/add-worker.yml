---
# TODO: merge this to add-node.yml
# Add Worker Node to Kubernetes Cluster
# Usage: ansible-playbook operations/add-worker.yml -e target_host=worker-X

- name: Add worker node (provision, configure, join)
  # target_host is always passed explicitly at run time (-e target_host=worker-X);
  # the default exists only so ansible-lint syntax-check can resolve the hosts keyword.
  hosts: "{{ target_host | default('worker_nodes') }}"
  gather_facts: false
  serial: 1

  roles:
    - role: provision
    - role: base-system
    - role: resolv-cleanup
    - role: sysctl-tuning
    - role: storage-longhorn
    - role: ssh-hardening
    - role: containerd
    - role: kubernetes
    # BEFORE the join, and before node-labels. Two reasons:
    #   * node-labels writes the Kilo annotation from the address this role puts on the
    #     interface, so the interface has to exist first for the two to agree.
    #   * the mesh address must be up by the time the node registers, so that anything
    #     binding to it (kubelet, and later etcd on a control plane) comes up on an
    #     address its peers can reach.
    #
    # It has its own dead-man's switch (see the role), which is what makes this safe to
    # run unattended inside a join: a failure here returns the node's networking to its
    # pre-role state rather than stranding it.
    - role: vswitch-vlan
    - role: worker-join
    - role: node-labels
    - role: cloudflare-dns

# Regenerate the DNS records from the updated inventory — a SECOND play, because the
# generator reads hostvars and must run after the join rather than alongside it.
#
# Without this a new node joins successfully, reports Ready, and receives NO traffic:
# the apex and wildcard records list every node IP, so a node absent from them is simply
# never routed to. Nothing reports a problem — the cluster looks healthy and the node is
# unreachable.
#
# These records are owned by external-dns, so this only rewrites the DNSEndpoint files.
# Writing the DNS records directly would put two writers on one record and external-dns
# would revert it on its next sync — succeeding while undoing itself. Commit and push
# instead; Flux applies it and external-dns converges.
- name: Regenerate the DNS records for the updated inventory
  hosts: localhost
  gather_facts: false
  vars:
    pdns_zones_output_dir: "{{ playbook_dir }}/../../kubernetes/infrastructure/external-dns"
  roles:
    - role: pdns-zones
