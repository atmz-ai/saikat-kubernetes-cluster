---
- name: Wait for node to be registered
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get node {{ ansible_facts['hostname'] }} --no-headers 2>/dev/null | wc -l
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: node_check
  until: node_check.stdout | int > 0
  retries: 30
  delay: 10
  delegate_to: "{{ groups['control_plane'][0] }}"
  changed_when: false

- name: Collect the topology labels this node can supply
  # Each label is emitted only when its value is known. An empty-string label would
  # look like a valid topology and could steer volume scheduling to the wrong place,
  # so omitting is the safer failure. `datacenter`/`region`/`country` are Hetzner
  # concepts; a cloud VM supplies `provider_zone`/`location` instead.
  ansible.builtin.set_fact:
    node_topology_labels: >-
      {{
        {}
        | combine({'topology.kubernetes.io/zone': datacenter} if datacenter is defined
                  else ({'topology.kubernetes.io/zone': provider_zone} if provider_zone is defined else {}))
        | combine({'topology.kubernetes.io/region': region} if region is defined
                  else ({'topology.kubernetes.io/region': location} if location is defined else {}))
        | combine({'topology.kubernetes.io/country': country} if country is defined else {})
      }}

- name: Display the topology labels to be applied
  ansible.builtin.debug:
    msg: >-
      {{ node_topology_labels if node_topology_labels | length > 0
         else 'No topology values known for this node — skipping topology labels.' }}

- name: Apply topology labels to node
  ansible.builtin.command: >
    kubectl label node {{ ansible_facts['hostname'] }}
    {% for label_key, label_value in node_topology_labels.items() %}{{ label_key }}={{ label_value }} {% endfor %}
    --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: label_result
  changed_when: "'labeled' in label_result.stdout"
  when: node_topology_labels | length > 0

# ! do NOT reintroduce kilo.squat.ai/* annotations here. Cilium is the only
# ! cross-provider network component; Kilo was a second implementation of that layer and
# ! fought Cilium over the same pod-CIDR routes. See the warning on the routing config in
# ! kubernetes/infrastructure/cilium/helmrelease.yaml.

- name: Apply disk type label to node
  ansible.builtin.command: >
    kubectl label node {{ ansible_facts['hostname'] }}
    node.yral.com/disk-type={{ disk_type }}
    --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: disk_label_result
  changed_when: "'labeled' in disk_label_result.stdout"
  when: disk_type is defined

- name: Apply workload preference label for NVMe nodes
  ansible.builtin.command: >
    kubectl label node {{ ansible_facts['hostname'] }}
    node.yral.com/workload-preference=stateful
    --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: workload_label_result
  changed_when: "'labeled' in workload_label_result.stdout"
  when: disk_type is defined and disk_type == "nvme"

- name: Verify control plane taint
  ansible.builtin.command: kubectl get node {{ ansible_facts['hostname'] }} -o jsonpath='{.spec.taints}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: taint_check
  changed_when: false
  when: node_type == "control-plane"

- name: Display taint status for control plane
  ansible.builtin.debug:
    msg:
      - "Control plane node {{ ansible_facts['hostname'] }} taints:"
      - "{{ taint_check.stdout }}"
  when: node_type == "control-plane"

- name: Verify node labels
  ansible.builtin.command: kubectl get node {{ ansible_facts['hostname'] }} --show-labels
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: labels_output
  changed_when: false
- name: Display node labels
  ansible.builtin.debug:
    msg: "{{ labels_output.stdout_lines }}"

# ---------------------------------------------------------------------------
# Fix stale Longhorn disk UUID (idempotent)
#
# When a node is reprovisioned (OS reinstalled), the Longhorn Node CR persists
# with the old disk UUID. The new disk has a different UUID, causing a
# "DiskFilesystemChanged" mismatch. This task detects the mismatch and resets
# the disk spec so Longhorn re-registers the disk with the new UUID.
#
# This is safe and idempotent: if there's no mismatch, the disk is left alone.
# It also handles the case where the Node CR doesn't exist yet (first join).
# The node-remove role deletes the CR during removal, but this catches edge
# cases (e.g. node was force-deleted without running the playbook).
- name: Wait for Longhorn manager pod to be ready on this node
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n longhorn-system get pod -l app=longhorn-manager \
      --field-selector spec.nodeName={{ ansible_facts['hostname'] }} \
      -o json | python3 -c "
    import sys, json
    pods = json.load(sys.stdin)['items']
    ready = all(c.get('ready') for c in [p['status'].get('containerStatuses', [{}])[0] for p in pods]) if pods else False
    print('ready' if ready else 'not_ready')
    "
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: lh_manager_status
  until: lh_manager_status.stdout == 'ready'
  retries: 30
  delay: 5
  changed_when: false

- name: Check Longhorn Node CR disk status (retry until reconciled)
  # Prints one of three things:
  #   <disk-name>  the disk exists but its filesystem changed (stale UUID)
  #   healthy      the disk is Ready
  #   pending      no Node CR yet, or no disk status yet — nothing to act on
  #
  # `failed_when: false` is deliberate here so retry exhaustion does NOT fail with
  # a generic retry message; the task below turns exhaustion into an explicit,
  # diagnosable failure instead. Exhaustion being silent is what this file got
  # wrong before: with `until` satisfied by a non-'pending' value and the failure
  # suppressed, a still-'pending' result was reported as `ok`, and 'pending' then
  # passed the stale-disk guard below and tried to patch a Node CR that does not
  # exist ("nodes.longhorn.io \"X\" not found").
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n longhorn-system get node.longhorn.io {{ ansible_facts['hostname'] }} \
      -o json 2>/dev/null | python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    disks = d.get('status', {}).get('diskStatus', {})
    if not disks:
        print('pending')
        sys.exit(0)
    for disk_name, disk_info in disks.items():
        conditions = disk_info.get('conditions', [])
        for c in conditions:
            if c.get('reason') == 'DiskFilesystemChanged':
                print(disk_name)
                sys.exit(0)
        for c in conditions:
            if c.get('type') == 'Ready' and c.get('status') == 'True':
                print('healthy')
                sys.exit(0)
    print('pending')
    " 2>/dev/null || echo 'pending'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: lh_stale_disk
  until: lh_stale_disk.stdout | trim not in ['', 'pending']
  retries: 30
  delay: 10
  changed_when: false
  failed_when: false

- name: Fail with a diagnosable message when the Longhorn Node CR never appeared
  # A node that never gets a Longhorn Node CR is broken in a way the rest of this
  # role cannot fix, and silently continuing hides it. The most common cause seen
  # in practice is that the node cannot reach the Kubernetes service IP, so the
  # longhorn-manager pod on it cannot create its own Node CR — i.e. a POD
  # NETWORKING fault, which presents here rather than announcing itself.
  #
  # Included because the alternative (the previous behaviour) was a confusing
  # "NotFound: nodes.longhorn.io" from a later task, which pointed at Longhorn
  # when the real fault was the network.
  ansible.builtin.fail:
    msg: |-
      Longhorn's Node CR for {{ ansible_facts['hostname'] }} did not report a disk
      status within {{ 30 * 10 }}s (last result: '{{ lh_stale_disk.stdout | trim }}').

      Nothing in this role can act on that: a missing Node CR means longhorn-manager
      on this node has not registered it. Check, in this order:

      1. Does the CR exist at all?
           kubectl -n longhorn-system get node.longhorn.io {{ ansible_facts['hostname'] }}

      2. Is longhorn-manager running there, and can it reach the API?
           kubectl -n longhorn-system logs -l app=longhorn-manager \
             --field-selector spec.nodeName={{ ansible_facts['hostname'] }}
         A pod that logs `dial tcp 10.96.0.1:443: i/o timeout` cannot reach the
         Kubernetes service IP. That is a pod-networking fault on this node (CNI
         tunnel or encryption), not a Longhorn fault — fix the networking first.

      3. Is the node Ready and does it have the Longhorn manager pod scheduled?
           kubectl get node {{ ansible_facts['hostname'] }}
  when: lh_stale_disk.stdout | trim == 'pending'

- name: Reset stale Longhorn disk with UUID mismatch
  # Only a real disk NAME can be stale. 'pending'/''/'healthy' must never reach the
  # patch below — that was the bug this replaces.
  when: lh_stale_disk.stdout | trim not in ['', 'pending', 'healthy']
  block:
    - name: Disable scheduling on stale disk
      ansible.builtin.shell: |
        kubectl -n longhorn-system patch node.longhorn.io {{ ansible_facts['hostname'] }} \
          --type=merge \
          -p '
        {
          "spec": {
            "disks": {
              "{{ lh_stale_disk.stdout | trim }}": {
                "allowScheduling": false,
                "evictionRequested": false,
                "path": "/var/lib/longhorn/",
                "storageReserved": 2684354560,
                "tags": [],
                "diskType": "filesystem",
                "diskDriver": ""
              }
            }
          }
        }
        '
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      changed_when: true

    - name: Clear stale disks from Node CR spec
      ansible.builtin.shell: |
        kubectl -n longhorn-system patch node.longhorn.io {{ ansible_facts['hostname'] }} \
          --type=json \
          -p '[{"op":"replace","path":"/spec/disks","value":{}}]'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      changed_when: true

    - name: Wait for Longhorn to sync empty disk spec
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n longhorn-system get node.longhorn.io {{ ansible_facts['hostname'] }} \
          -o json | python3 -c "
        import sys, json
        d = json.load(sys.stdin)
        disks = d.get('spec', {}).get('disks', {})
        print('empty' if not disks else 'pending')
        "
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: lh_disk_spec
      until: lh_disk_spec.stdout == 'empty'
      retries: 10
      delay: 3
      changed_when: false

    - name: Re-add disk with fresh UUID
      ansible.builtin.shell: |
        kubectl -n longhorn-system patch node.longhorn.io {{ ansible_facts['hostname'] }} \
          --type=merge \
          -p '
        {
          "spec": {
            "disks": {
              "default-disk": {
                "allowScheduling": true,
                "evictionRequested": false,
                "path": "/var/lib/longhorn/",
                "storageReserved": 2684354560,
                "tags": [],
                "diskType": "filesystem",
                "diskDriver": ""
              }
            }
          }
        }
        '
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: lh_disk_readd
      until: lh_disk_readd.rc == 0
      retries: 5
      delay: 10
      changed_when: true

    - name: Wait for fresh disk to become Ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n longhorn-system get node.longhorn.io {{ ansible_facts['hostname'] }} \
          -o json | python3 -c "
        import sys, json
        d = json.load(sys.stdin)
        disk = d.get('status', {}).get('diskStatus', {}).get('default-disk', {})
        ready = False
        for c in disk.get('conditions', []):
            if c.get('type') == 'Ready':
                ready = c.get('status') == 'True'
        print('ready' if ready else 'pending')
        "
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: lh_disk_ready
      until: lh_disk_ready.stdout == 'ready'
      retries: 15
      delay: 5
      changed_when: false

    - name: Display Longhorn disk UUID fix result
      ansible.builtin.debug:
        msg: >-
          Fixed stale Longhorn disk UUID on {{ ansible_facts['hostname'] }}:
          old disk '{{ lh_stale_disk.stdout | trim }}' replaced with 'default-disk'

- name: Skip Longhorn disk fix (no mismatch)
  ansible.builtin.debug:
    msg: "Longhorn disk on {{ ansible_facts['hostname'] }} is healthy, no UUID fix needed"
  when: lh_stale_disk.stdout | trim == '' or lh_stale_disk.stdout | trim == 'healthy'

- name: Get nodes by topology
  ansible.builtin.command: >
    kubectl get nodes
    -L topology.kubernetes.io/zone,topology.kubernetes.io/region,node.yral.com/disk-type,node.yral.com/workload-preference
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: topology_output
  changed_when: false
  run_once: true

- name: Display topology summary
  ansible.builtin.debug:
    msg:
      - "✅ Topology labels applied to all nodes"
      - ""
      - "{{ topology_output.stdout_lines }}"
      - ""
      - "Cluster distribution:"
      - "  - Control planes: 3 nodes in HEL1-DC2 (Helsinki)"
      - "  - Workers: 9 nodes in FSN1 (Falkenstein), 1 node in HEL1-DC2 (Helsinki)"
  run_once: true
