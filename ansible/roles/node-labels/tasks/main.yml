---
- name: Wait for node to be registered
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get node {{ ansible_facts['hostname'] }} --no-headers 2>/dev/null | wc -l
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: node_check
  until: node_check.stdout | int > 0
  retries: 30
  delay: 10
  delegate_to: "{{ groups['control_plane'][0] }}"
  changed_when: false

- name: Collect the topology labels this node can supply
  # Builds the label set from whatever the node actually reports, rather than
  # requiring provider-specific inventory keys.
  #
  # This used to unconditionally read `datacenter`, `region` and `country`, which
  # are Hetzner concepts. A host that does not define them (any cloud VM) failed
  # outright with "'datacenter' is undefined" — so the role could only ever run
  # against Hetzner nodes.
  #
  # The values are still the SAME values on Hetzner, just sourced by falling back:
  #   zone    <- datacenter (Hetzner DC, e.g. HEL1-DC3) | Azure zone (e.g. 1)
  #   region  <- region (Hetzner, e.g. helsinki)        | Azure location
  #   country <- country (Hetzner, e.g. fi)             | omitted when unknown
  #
  # A label is included only when a value is known. Labels are set by default (the
  # repo relies on topology.kubernetes.io/zone for volume scheduling), but omitting
  # one is better than labelling every Azure node with an empty string, which would
  # look like a valid topology and could steer scheduling to the wrong place.
  ansible.builtin.set_fact:
    node_topology_labels: >-
      {{
        {}
        | combine({'topology.kubernetes.io/zone': datacenter} if datacenter is defined
                  else ({'topology.kubernetes.io/zone': provider_zone} if provider_zone is defined else {}))
        | combine({'topology.kubernetes.io/region': region} if region is defined
                  else ({'topology.kubernetes.io/region': location} if location is defined else {}))
        | combine({'topology.kubernetes.io/country': country} if country is defined else {})
      }}

- name: Display the topology labels to be applied
  ansible.builtin.debug:
    msg: >-
      {{ node_topology_labels if node_topology_labels | length > 0
         else 'No topology values known for this node — skipping topology labels.' }}

- name: Apply topology labels to node
  ansible.builtin.command: >
    kubectl label node {{ ansible_facts['hostname'] }}
    {% for label_key, label_value in node_topology_labels.items() %}{{ label_key }}={{ label_value }} {% endfor %}
    --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: label_result
  changed_when: "'labeled' in label_result.stdout"
  when: node_topology_labels | length > 0

# ── Kilo mesh annotations ────────────────────────────────────────────────────
# Kilo groups nodes into "locations" by their topology.kubernetes.io/region label
# and links one leader per location. A node with NO private address is instead
# given its own single-node location (pkg/mesh/topology.go):
#
#     if node.InternalIP == nil { location = nodeLocationPrefix + node.Name }
#
# which is the behaviour that took this cluster down: with every node in its own
# location, every packet is "cross-location", so Kilo installed routing for all of
# it while --local=false (which asserts "the CNI owns in-location routing") skipped
# the return paths, and pod->ClusterIP broke cluster-wide.
#
# Kilo decides "private" with isPublic() in pkg/mesh/discoverips.go — an RFC1918
# test. A Hetzner node's only address is its public /32, so it is classified public,
# InternalIP stays nil, and the node lands in its own location. `force-internal-ip`
# is the documented way out: it sets InternalIP directly (pkg/k8s/backend.go reads
# the annotation BEFORE falling back to the agent-written internal-ip), so the node
# groups into its real region instead. The address does not have to be RFC1918 to be
# the node's internal identity — that is the point of the word "force".
#
# `force-endpoint` is the other half: a cloud VM's public IP is provider-side NAT and
# is absent from the interface, so Kilo's endpoint heuristic cannot find it. This is
# the case Kilo's own docs describe verbatim ("nodes are allocated a public IP but
# the Ethernet devices are only configured with the private network address; in this
# case the allocated public IP should be specified").
#
# The peer address is resolved in two steps, and the ORDER matters:
#   1. `kilo_peer_address`, set per host in the inventory — the escape hatch, and the
#      only correct source for a cloud node, whose private address is not derivable
#      from anything else in the inventory.
#   2. `vswitch_node_addresses` (group_vars/all/vars.yml), keyed by region + hostname —
#      the VLAN address the vswitch-vlan role configured. This is what makes the fix
#      reach the node: without it the peer address falls through to the public IP,
#      equals the endpoint, and the assert below stops the run.
#   3. `ansible_host`, only as a last resort so a failure names the node rather than
#      raising `undefined` far from the cause.
#
# Read from group_vars rather than a fact set by the vswitch-vlan role: that role runs
# in its own play, so its facts never reach this one, and the earlier attempt to use
# them left every annotation pointing at the public IP. A cluster-wide variable cannot
# be missed that way.
#
# The endpoint needs no such lookup: it is the address peers DIAL, which for every
# provider is the public one already in `ansible_host`.
#
# Applied BEFORE Kilo ever runs, because Kilo reads these at topology-build time. With
# Kilo suspended these annotations are INERT — nothing consumes them — which is what
# makes this step safe to apply to every node and verify before enabling.
#
# `force-internal-ip` OVERRIDES THE AGENT-WRITTEN VALUE (pkg/k8s/backend.go reads the
# annotation BEFORE falling back to the agent-written internal-ip), so this annotation
# is what decides the node's mesh identity.
#
# TODO(advertise-private-address): etcd and kubelet still advertise the PUBLIC address,
# so the private address this annotation points at is not yet what the control plane
# binds. Nothing needs it to be while Kilo is the only thing routing on it, but it must
# be done before the mesh is relied on for control-plane traffic — kubelet's --node-ip
# and the etcd peer/advertise addresses have to move to the private address, which is
# the same change `node_provider_address` makes for cloud nodes.
- name: Resolve the addresses the Kilo mesh uses for this node
  # The region lookup is inlined into the peer-address expression rather than read from
  # `kilo_node_region` below: facts defined in ONE set_fact are not visible to their
  # siblings during evaluation, so referencing it here fails with
  # "'kilo_node_region' is undefined" — a confusing error, since the key is right there.
  ansible.builtin.set_fact:
    kilo_node_endpoint_address: >-
      {{ kilo_endpoint_address | default(hostvars[inventory_hostname]['ansible_host']) }}
    kilo_node_peer_address: >-
      {{ kilo_peer_address
         | default(vswitch_node_addresses.get(
             hostvars[inventory_hostname]['region']
               | default(hostvars[inventory_hostname]['location'] | default('')),
             {}).get(inventory_hostname, hostvars[inventory_hostname]['ansible_host']), true) }}
    kilo_node_region: >-
      {{ hostvars[inventory_hostname]['region']
         | default(hostvars[inventory_hostname]['location'] | default('')) }}

- name: Fail if the mesh identity and the endpoint are the same address
  # This is the second outage, turned into a precondition. Kilo skips any node whose
  # internal address equals its endpoint:
  #
  #   // Topology.Routes, pkg/mesh/topology.go
  #   if segment.privateIPs[i].Equal(t.updateEndpoint(...).IP()) {
  #       continue   // "we cannot encapsulate traffic to an IP through the IP"
  #   }
  #
  # so the node gets no route at all and goes NotReady — exactly the five-node failure.
  # The cluster-wide outage was the same guard reached differently: with no internal
  # address the node was given its own single-node location, making every packet
  # cross-location while --local=false skipped the return paths.
  #
  # Neither is detectable from the annotation being present, so the annotations cannot
  # be validated by their own presence. Catching it here turns a silent datapath failure
  # into a named error at the node that would cause it.
  ansible.builtin.assert:
    that:
      - kilo_node_peer_address | length > 0
      - kilo_node_endpoint_address | length > 0
      - kilo_node_peer_address != kilo_node_endpoint_address
    fail_msg: >-
      Node {{ inventory_hostname }} would get peer address
      '{{ kilo_node_peer_address }}' and endpoint '{{ kilo_node_endpoint_address }}'.
      Kilo requires them to DIFFER — an internal address equal to the endpoint makes
      Kilo skip the node entirely ("we cannot encapsulate traffic to an IP through the
      IP"), leaving it NotReady. Check `kilo_peer_address` / `kilo_endpoint_address`
      in the inventory and `vswitch_node_addresses` in group_vars/all/vars.yml.

- name: Apply Kilo mesh annotations to node
  ansible.builtin.command: >
    kubectl annotate node {{ ansible_facts['hostname'] }}
    kilo.squat.ai/force-internal-ip={{ kilo_node_peer_address }}/32
    kilo.squat.ai/force-endpoint={{ kilo_node_endpoint_address }}:51820
    --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: kilo_annotation_result
  changed_when: "'not annotated' not in kilo_annotation_result.stdout"

- name: Apply disk type label to node
  ansible.builtin.command: >
    kubectl label node {{ ansible_facts['hostname'] }}
    node.yral.com/disk-type={{ disk_type }}
    --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: disk_label_result
  changed_when: "'labeled' in disk_label_result.stdout"
  when: disk_type is defined

- name: Apply workload preference label for NVMe nodes
  ansible.builtin.command: >
    kubectl label node {{ ansible_facts['hostname'] }}
    node.yral.com/workload-preference=stateful
    --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: workload_label_result
  changed_when: "'labeled' in workload_label_result.stdout"
  when: disk_type is defined and disk_type == "nvme"

- name: Verify control plane taint
  ansible.builtin.command: kubectl get node {{ ansible_facts['hostname'] }} -o jsonpath='{.spec.taints}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: taint_check
  changed_when: false
  when: node_type == "control-plane"

- name: Display taint status for control plane
  ansible.builtin.debug:
    msg:
      - "Control plane node {{ ansible_facts['hostname'] }} taints:"
      - "{{ taint_check.stdout }}"
  when: node_type == "control-plane"

- name: Verify node labels
  ansible.builtin.command: kubectl get node {{ ansible_facts['hostname'] }} --show-labels
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: labels_output
  changed_when: false
- name: Display node labels
  ansible.builtin.debug:
    msg: "{{ labels_output.stdout_lines }}"

# ---------------------------------------------------------------------------
# Fix stale Longhorn disk UUID (idempotent)
#
# When a node is reprovisioned (OS reinstalled), the Longhorn Node CR persists
# with the old disk UUID. The new disk has a different UUID, causing a
# "DiskFilesystemChanged" mismatch. This task detects the mismatch and resets
# the disk spec so Longhorn re-registers the disk with the new UUID.
#
# This is safe and idempotent: if there's no mismatch, the disk is left alone.
# It also handles the case where the Node CR doesn't exist yet (first join).
# The node-remove role deletes the CR during removal, but this catches edge
# cases (e.g. node was force-deleted without running the playbook).
- name: Wait for Longhorn manager pod to be ready on this node
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n longhorn-system get pod -l app=longhorn-manager \
      --field-selector spec.nodeName={{ ansible_facts['hostname'] }} \
      -o json | python3 -c "
    import sys, json
    pods = json.load(sys.stdin)['items']
    ready = all(c.get('ready') for c in [p['status'].get('containerStatuses', [{}])[0] for p in pods]) if pods else False
    print('ready' if ready else 'not_ready')
    "
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: lh_manager_status
  until: lh_manager_status.stdout == 'ready'
  retries: 30
  delay: 5
  changed_when: false

- name: Check Longhorn Node CR disk status (retry until reconciled)
  # Prints one of three things:
  #   <disk-name>  the disk exists but its filesystem changed (stale UUID)
  #   healthy      the disk is Ready
  #   pending      no Node CR yet, or no disk status yet — nothing to act on
  #
  # `failed_when: false` is deliberate here so retry exhaustion does NOT fail with
  # a generic retry message; the task below turns exhaustion into an explicit,
  # diagnosable failure instead. Exhaustion being silent is what this file got
  # wrong before: with `until` satisfied by a non-'pending' value and the failure
  # suppressed, a still-'pending' result was reported as `ok`, and 'pending' then
  # passed the stale-disk guard below and tried to patch a Node CR that does not
  # exist ("nodes.longhorn.io \"X\" not found").
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n longhorn-system get node.longhorn.io {{ ansible_facts['hostname'] }} \
      -o json 2>/dev/null | python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    disks = d.get('status', {}).get('diskStatus', {})
    if not disks:
        print('pending')
        sys.exit(0)
    for disk_name, disk_info in disks.items():
        conditions = disk_info.get('conditions', [])
        for c in conditions:
            if c.get('reason') == 'DiskFilesystemChanged':
                print(disk_name)
                sys.exit(0)
        for c in conditions:
            if c.get('type') == 'Ready' and c.get('status') == 'True':
                print('healthy')
                sys.exit(0)
    print('pending')
    " 2>/dev/null || echo 'pending'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: lh_stale_disk
  until: lh_stale_disk.stdout | trim not in ['', 'pending']
  retries: 30
  delay: 10
  changed_when: false
  failed_when: false

- name: Fail with a diagnosable message when the Longhorn Node CR never appeared
  # A node that never gets a Longhorn Node CR is broken in a way the rest of this
  # role cannot fix, and silently continuing hides it. The most common cause seen
  # in practice is that the node cannot reach the Kubernetes service IP, so the
  # longhorn-manager pod on it cannot create its own Node CR — i.e. a POD
  # NETWORKING fault, which presents here rather than announcing itself.
  #
  # Included because the alternative (the previous behaviour) was a confusing
  # "NotFound: nodes.longhorn.io" from a later task, which pointed at Longhorn
  # when the real fault was the network.
  ansible.builtin.fail:
    msg: |-
      Longhorn's Node CR for {{ ansible_facts['hostname'] }} did not report a disk
      status within {{ 30 * 10 }}s (last result: '{{ lh_stale_disk.stdout | trim }}').

      Nothing in this role can act on that: a missing Node CR means longhorn-manager
      on this node has not registered it. Check, in this order:

      1. Does the CR exist at all?
           kubectl -n longhorn-system get node.longhorn.io {{ ansible_facts['hostname'] }}

      2. Is longhorn-manager running there, and can it reach the API?
           kubectl -n longhorn-system logs -l app=longhorn-manager \
             --field-selector spec.nodeName={{ ansible_facts['hostname'] }}
         A pod that logs `dial tcp 10.96.0.1:443: i/o timeout` cannot reach the
         Kubernetes service IP. That is a pod-networking fault on this node (CNI
         tunnel or encryption), not a Longhorn fault — fix the networking first.

      3. Is the node Ready and does it have the Longhorn manager pod scheduled?
           kubectl get node {{ ansible_facts['hostname'] }}
  when: lh_stale_disk.stdout | trim == 'pending'

- name: Reset stale Longhorn disk with UUID mismatch
  # 'pending' and '' are excluded explicitly. Only a real disk NAME can be stale,
  # so anything else must not reach the patch below — that was the bug this
  # replaces.
  when: lh_stale_disk.stdout | trim not in ['', 'pending', 'healthy']
  block:
    - name: Disable scheduling on stale disk
      ansible.builtin.shell: |
        kubectl -n longhorn-system patch node.longhorn.io {{ ansible_facts['hostname'] }} \
          --type=merge \
          -p '
        {
          "spec": {
            "disks": {
              "{{ lh_stale_disk.stdout | trim }}": {
                "allowScheduling": false,
                "evictionRequested": false,
                "path": "/var/lib/longhorn/",
                "storageReserved": 2684354560,
                "tags": [],
                "diskType": "filesystem",
                "diskDriver": ""
              }
            }
          }
        }
        '
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      changed_when: true

    - name: Clear stale disks from Node CR spec
      ansible.builtin.shell: |
        kubectl -n longhorn-system patch node.longhorn.io {{ ansible_facts['hostname'] }} \
          --type=json \
          -p '[{"op":"replace","path":"/spec/disks","value":{}}]'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      changed_when: true

    - name: Wait for Longhorn to sync empty disk spec
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n longhorn-system get node.longhorn.io {{ ansible_facts['hostname'] }} \
          -o json | python3 -c "
        import sys, json
        d = json.load(sys.stdin)
        disks = d.get('spec', {}).get('disks', {})
        print('empty' if not disks else 'pending')
        "
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: lh_disk_spec
      until: lh_disk_spec.stdout == 'empty'
      retries: 10
      delay: 3
      changed_when: false

    - name: Re-add disk with fresh UUID
      ansible.builtin.shell: |
        kubectl -n longhorn-system patch node.longhorn.io {{ ansible_facts['hostname'] }} \
          --type=merge \
          -p '
        {
          "spec": {
            "disks": {
              "default-disk": {
                "allowScheduling": true,
                "evictionRequested": false,
                "path": "/var/lib/longhorn/",
                "storageReserved": 2684354560,
                "tags": [],
                "diskType": "filesystem",
                "diskDriver": ""
              }
            }
          }
        }
        '
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: lh_disk_readd
      until: lh_disk_readd.rc == 0
      retries: 5
      delay: 10
      changed_when: true

    - name: Wait for fresh disk to become Ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n longhorn-system get node.longhorn.io {{ ansible_facts['hostname'] }} \
          -o json | python3 -c "
        import sys, json
        d = json.load(sys.stdin)
        disk = d.get('status', {}).get('diskStatus', {}).get('default-disk', {})
        ready = False
        for c in disk.get('conditions', []):
            if c.get('type') == 'Ready':
                ready = c.get('status') == 'True'
        print('ready' if ready else 'pending')
        "
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: lh_disk_ready
      until: lh_disk_ready.stdout == 'ready'
      retries: 15
      delay: 5
      changed_when: false

    - name: Display Longhorn disk UUID fix result
      ansible.builtin.debug:
        msg: >-
          Fixed stale Longhorn disk UUID on {{ ansible_facts['hostname'] }}:
          old disk '{{ lh_stale_disk.stdout | trim }}' replaced with 'default-disk'

- name: Skip Longhorn disk fix (no mismatch)
  ansible.builtin.debug:
    msg: "Longhorn disk on {{ ansible_facts['hostname'] }} is healthy, no UUID fix needed"
  when: lh_stale_disk.stdout | trim == '' or lh_stale_disk.stdout | trim == 'healthy'

- name: Get nodes by topology
  ansible.builtin.command: >
    kubectl get nodes
    -L topology.kubernetes.io/zone,topology.kubernetes.io/region,node.yral.com/disk-type,node.yral.com/workload-preference
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: topology_output
  changed_when: false
  run_once: true

- name: Display topology summary
  ansible.builtin.debug:
    msg:
      - "✅ Topology labels applied to all nodes"
      - ""
      - "{{ topology_output.stdout_lines }}"
      - ""
      - "Cluster distribution:"
      - "  - Control planes: 3 nodes in HEL1-DC2 (Helsinki)"
      - "  - Workers: 9 nodes in FSN1 (Falkenstein), 1 node in HEL1-DC2 (Helsinki)"
  run_once: true
