---
# Per-node VLAN subinterface for the Hetzner vSwitch — see defaults/main.yml for the
# design rationale (separate netplan file, MTU 1400, dead-man's switch).
#
# Applied ONE NODE AT A TIME (serial: 1 at the playbook level), because this is the
# step that can take a live node off the network.
#
# Deliberately uses NO collection filter plugins. `ansible.utils` (ipaddr/ipmath) is
# NOT installed in this repo's vendored collections, and adding a collection
# dependency to compute a host octet is not worth it — the arithmetic is one
# addition and the subnets are /24s, so the address is assembled from a string. If a
# non-/24 subnet is ever needed, this is the place to revisit.

# ── Derive this node's private address ───────────────────────────────────────
- name: Determine this node's region from inventory
  ansible.builtin.set_fact:
    vswitch_node_region: >-
      {{ hostvars[inventory_hostname]['region']
         | default(hostvars[inventory_hostname]['location'] | default('')) }}

- name: Fail if this node has no usable region
  ansible.builtin.assert:
    that:
      - vswitch_node_region | length > 0
      - vswitch_node_region in vswitch_subnets
    fail_msg: >-
      Node {{ inventory_hostname }} has region '{{ vswitch_node_region }}', which is
      not in vswitch_subnets ({{ vswitch_subnets.keys() | list }}). Refusing to guess
      a subnet — the wrong one breaks peer reachability silently.

- name: Start the region node list empty
  # Reset explicitly: a set_fact persists for the rest of the play, so without this a
  # second run of the role would append to the previous list and hand out doubled
  # octets.
  ansible.builtin.set_fact:
    vswitch_region_nodes: []

- name: Collect the nodes in this region
  # An accumulating loop, deliberately not a selectattr chain. The list is hostname
  # STRINGS and selectattr tests attributes on the items themselves, so
  # selectattr('region', 'equalto', X) silently matches nothing — `region` lives in
  # hostvars[hostname], not on the string. That produced an empty list which then
  # failed much later, at list.index(), pointing nowhere near the cause.
  #
  # `groups['k8s_cluster'] | sort` so the accumulated order is sorted and the octet
  # each node derives is stable across runs. If it were inventory-order-dependent, a
  # re-run could renumber peers and take the VLAN down for nodes already working.
  #
  # Built from groups['k8s_cluster'] rather than the `vswitch` role's vswitch_hosts:
  # role defaults are not shared between roles, and region is all that matters here.
  ansible.builtin.set_fact:
    vswitch_region_nodes: "{{ vswitch_region_nodes + [item] }}"
  loop: "{{ groups['k8s_cluster'] | sort }}"
  when:
    - item in hostvars
    - (hostvars[item]['region'] | default(hostvars[item]['location'] | default(''))) == vswitch_node_region

- name: Derive this node's host octet and CIDR
  ansible.builtin.set_fact:
    vswitch_node_octet: >-
      {{ vswitch_host_octet_base + (vswitch_region_nodes.index(inventory_hostname)) }}
    vswitch_node_cidr: >-
      {{ vswitch_subnets[vswitch_node_region].split('/')[0].split('.')[0:3] | join('.') }}.{{
         vswitch_host_octet_base + (vswitch_region_nodes.index(inventory_hostname)) }}/{{
         vswitch_subnets[vswitch_node_region].split('/')[1] }}

- name: Show the derived addressing
  ansible.builtin.debug:
    msg:
      - "region:  {{ vswitch_node_region }} ({{ vswitch_region_nodes | length }} nodes)"
      - "subnet:  {{ vswitch_subnets[vswitch_node_region] }}"
      - "address: {{ vswitch_node_cidr }}"

# ── Dead-man's switch: schedule the revert BEFORE any change ─────────────────
- name: Remove any backup left by an earlier version of this role
  # Nothing else writes 60-vswitch.yaml, so there is no "previous configuration" worth
  # preserving and no .prev file is created any more. An earlier version did create
  # one, and a stale copy of our OWN config is worse than useless: the revert path
  # treats its existence as "restore this", which would restore the very state we are
  # trying to back out of. Removed for cleanliness on re-runs.
  ansible.builtin.file:
    path: "{{ vswitch_vlan_netplan_file }}.prev"
    state: absent

- name: Generate a unique marker for this run's revert job
  # `at` does not return the job id it created, so the job has to be findable some
  # other way. A unique token embedded in the script, then located in the spool file,
  # is robust; diffing `atq` before/after is NOT.
  #
  # The difference approach breaks under concurrency: with two runs in flight, run A's
  # "after" snapshot contains run B's job, so A can conclude B's job is its own and
  # cancel it — leaving B's revert armed against a change B is still verifying. That
  # happened while rolling these nodes out and stranded two jobs which would have
  # deleted a verified VLAN interface. A self-identifying job cannot be confused with
  # someone else's, no matter how many runs overlap.
  ansible.builtin.set_fact:
    vswitch_deadman_marker: >-
      kilo-vswitch-deadman-{{ inventory_hostname }}-{{
      ansible_facts['date_time']['iso8601_basic_short'] | default(now(True) | to_uuid) }}

- name: Schedule an unattended revert
  # Runs on the NODE via `at`, so it fires even if this playbook's SSH session dies
  # with the network.
  #
  # ALWAYS deletes the netplan fragment and re-applies, rather than restoring a backup.
  # The role is the only writer of 60-vswitch.yaml, so there is no previous
  # configuration to restore — "no VLAN interface" IS the previous state, and the
  # public address, default route and nameservers live in Hetzner's 01-netcfg.yaml,
  # which this role never touches. An earlier version backed up and restored its own
  # file, which on a re-run would have restored the state it was meant to back out of.
  #
  # This is what makes the step safe to take at all: a wrong parent interface or VLAN
  # id takes the node off the network, and without this the recovery is a physical
  # rescue — and per the repo's rules a node that gets stuck is reprovisioned from
  # scratch. The operator should never see it fire.
  #
  # `shell` rather than `command`: the script is piped to `at` on stdin, which
  # `command` cannot do.
  ansible.builtin.shell:
    cmd: "at now + {{ vswitch_vlan_deadman_minutes }} minutes"
    stdin: |
      #!/bin/sh
      # Kilo vSwitch VLAN dead-man's switch. Fires only if the playbook failed to
      # cancel it, which means verification did not complete — i.e. this node may be
      # off the network right now. Deleting the fragment returns the node to exactly
      # its pre-role networking.
      set -x
      rm -f {{ vswitch_vlan_netplan_file }}
      rm -f {{ vswitch_vlan_netplan_file }}.prev
      netplan apply
      # Marker: {{ vswitch_deadman_marker }}
  changed_when: false
  # noqa: command-instead-of-shell — stdin to `at` requires a shell.

- name: Identify our job by its marker
  # `at -c <id>` prints the spooled script, so the marker written above locates OUR
  # job regardless of what else is scheduled on the node.
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      for id in $(atq | awk '{print $1}'); do
        if at -c "$id" 2>/dev/null | grep -qF '{{ vswitch_deadman_marker }}'; then echo "$id"; fi;
      done | head -1
  register: vswitch_deadman_lookup
  changed_when: false
  failed_when: false

- name: Record our job id
  ansible.builtin.set_fact:
    vswitch_deadman_job_id: "{{ vswitch_deadman_lookup.stdout | trim }}"

- name: Fail if our revert job could not be located
  # Loud, because the alternative is silent: proceeding without the id would mean the
  # switch can never be cancelled, so it fires and removes a verified interface.
  ansible.builtin.assert:
    that:
      - vswitch_deadman_job_id | length > 0
    fail_msg: >-
      Scheduled the revert but could not find its job. The dead-man's switch will fire
      in {{ vswitch_vlan_deadman_minutes }} minutes. Find it with `atq` and either
      cancel it by hand or let it run — the node returns to its pre-role networking
      either way, so this is not unsafe, just untidy.

# ── Apply the VLAN configuration ─────────────────────────────────────────────
- name: Write the VLAN netplan fragment
  ansible.builtin.copy:
    dest: "{{ vswitch_vlan_netplan_file }}"
    mode: "0600"
    content: |
      # Managed by Ansible (role: vswitch-vlan). Do not edit by hand.
      #
      # VLAN {{ vswitch_vlan_id }} on {{ vswitch_vlan_parent }}, carrying this node's
      # PRIVATE address on the Hetzner vSwitch. A separate file from Hetzner's
      # 01-netcfg.yaml on purpose: netplan merges them, so this adds the VLAN without
      # touching the public address, routes or nameservers, and revert is a file
      # deletion rather than surgery on the node's primary config.
      #
      # MTU {{ vswitch_vlan_mtu }} because a VLAN tag costs 4 bytes under the parent's 1500.
      network:
        version: 2
        renderer: networkd
        vlans:
          {{ vswitch_vlan_parent }}.{{ vswitch_vlan_id }}:
            id: {{ vswitch_vlan_id }}
            link: {{ vswitch_vlan_parent }}
            mtu: {{ vswitch_vlan_mtu }}
            addresses:
              - {{ vswitch_node_cidr }}
  register: vswitch_netplan_write

- name: Validate the netplan fragment before applying it
  # `netplan generate` parses and writes backend config WITHOUT touching the running
  # network, so a syntax error is caught while the node is still reachable rather
  # than during `netplan apply`.
  ansible.builtin.command: netplan generate
  changed_when: false

- name: Apply the netplan configuration
  ansible.builtin.command: netplan apply
  when: vswitch_netplan_write.changed
  changed_when: true
  # noqa: no-handler — this is deliberately a conditional task, not a handler.
  # A handler would fire at the end of the play, AFTER the assertions below. The
  # whole point of this sequence is apply-then-verify-then-cancel-the-dead-man's-
  # switch; deferring the apply to a handler would verify nothing and leave the
  # safety mechanism cancelled before the change landed.

- name: Read back the applied address
  # Skipped in check mode: this reads LIVE state that check mode deliberately did not
  # create, so asserting on it would fail on a dry run for no useful reason and train
  # the operator to ignore the result.
  ansible.builtin.command: "ip -o addr show dev {{ vswitch_vlan_parent }}.{{ vswitch_vlan_id }}"
  register: vswitch_vlan_addr
  changed_when: false
  retries: 5
  delay: 2
  until: vswitch_vlan_addr.rc == 0
  when: not ansible_check_mode

- name: Assert the address actually took
  ansible.builtin.assert:
    that:
      - vswitch_node_cidr.split('/')[0] in vswitch_vlan_addr.stdout
    fail_msg: >-
      VLAN interface is up but does not carry {{ vswitch_node_cidr }} — got
      '{{ vswitch_vlan_addr.stdout }}'. The vSwitch VLAN and this device must match
      for traffic to flow.
    success_msg: "VLAN interface up with {{ vswitch_node_cidr }}"
  when: not ansible_check_mode

- name: Read the applied MTU
  # From sysfs, NOT from `ip addr`. The first version of this parsed `ip -o addr
  # show` for an "mtu N" field — but that output does not contain the MTU at all, so
  # the regex never matched. `| first` on an empty match list then raised
  # "'NoneType' object is not iterable", failing the play AFTER the VLAN had already
  # been applied and verified — which left the dead-man's switch armed against a
  # change that had actually succeeded.
  #
  # /sys/class/net/<iface>/mtu is the authoritative value and cannot be absent when
  # the interface exists.
  ansible.builtin.slurp:
    src: "/sys/class/net/{{ vswitch_vlan_parent }}.{{ vswitch_vlan_id }}/mtu"
  register: vswitch_vlan_mtu_now
  when: not ansible_check_mode

- name: Apply the MTU manually if netplan did not
  # A documented netplan/VLAN defect, which Hetzner's own docs also point at (they
  # suggest exactly this `ip link set mtu` plus an `@reboot` entry). Without it the
  # device works but fragments on large packets, surfacing as odd TLS/etcd failures
  # rather than a clear error.
  ansible.builtin.command: "ip link set mtu {{ vswitch_vlan_mtu }} dev {{ vswitch_vlan_parent }}.{{ vswitch_vlan_id }}"
  when:
    - not ansible_check_mode
    - (vswitch_vlan_mtu_now.content | b64decode | trim) != (vswitch_vlan_mtu | string)
  changed_when: true

- name: Re-read the MTU after the correction
  ansible.builtin.slurp:
    src: "/sys/class/net/{{ vswitch_vlan_parent }}.{{ vswitch_vlan_id }}/mtu"
  register: vswitch_vlan_mtu_final
  when: not ansible_check_mode

- name: Assert the MTU is correct
  # Asserted rather than left as a silent fix-up: an MTU mismatch fragments only on
  # large packets, so it surfaces much later as an unrelated-looking TLS/etcd failure.
  # Cheap to check now, expensive to diagnose later.
  ansible.builtin.assert:
    that:
      - (vswitch_vlan_mtu_final.content | b64decode | trim) == (vswitch_vlan_mtu | string)
    fail_msg: >-
      MTU on {{ vswitch_vlan_parent }}.{{ vswitch_vlan_id }} is
      {{ vswitch_vlan_mtu_final.content | b64decode | trim }}, expected
      {{ vswitch_vlan_mtu }}. Large packets will fragment.
    success_msg: "MTU {{ vswitch_vlan_mtu }} confirmed on {{ vswitch_vlan_parent }}.{{ vswitch_vlan_id }}"
  when: not ansible_check_mode

# ── Cancel the dead-man's switch ─────────────────────────────────────────────
# Placed HERE, immediately after the change is verified, and deliberately NOT at the
# end of the role.
#
# The first version put it last. That is the wrong ordering: an earlier run applied
# the VLAN successfully, then failed on an unrelated task several steps later — so the
# play never reached the cancel, the switch stayed armed, and it was minutes from
# reverting a change that had already been verified good. A safety net that undoes
# correct work is worse than no safety net.
#
# The rule: once the change itself is proven, the revert is cancelled. Anything that
# fails after this point is a reporting or advisory problem and must not trigger a
# rollback of a verified change.
#
# Not run in check mode: nothing was applied, so there is nothing to protect, and the
# at-job would be cancelled for a change that never happened.
- name: Cancel the unattended revert, now that the change is verified
  ansible.builtin.command: "atrm {{ vswitch_deadman_job_id }}"
  when:
    - not ansible_check_mode
    - vswitch_deadman_job_id | length > 0
  changed_when: false
  failed_when: false

- name: Confirm no revert is left scheduled
  # Reported rather than asserted: a leftover job is not a reason to fail an otherwise
  # successful rollout, but the operator should see it. It would delete a verified
  # VLAN interface minutes later, which is confusing if unexpected.
  ansible.builtin.command: atq
  register: vswitch_atq_final
  changed_when: false
  when: not ansible_check_mode

- name: Report any jobs still scheduled
  ansible.builtin.debug:
    msg: >-
      {{ 'No at-jobs scheduled — the dead-man\'s switch is disarmed.'
         if vswitch_atq_final.stdout_lines | length == 0
         else 'WARNING: at-jobs still scheduled: ' ~ vswitch_atq_final.stdout_lines | join('; ') }}
  when: not ansible_check_mode

# ── Advisory notes (nothing below can roll the change back) ──────────────────
- name: Note peer-reachability expectations
  # Deliberately no peer ping on the first node of a region: a same-region peer has no
  # VLAN address until its OWN run, so the ping would fail for a reason that says
  # nothing about this node. The L2 path is proven on the SECOND node, where the ping
  # reaches the first. Making it a gate now would train the operator to ignore it.
  ansible.builtin.debug:
    msg: >-
      VLAN {{ vswitch_vlan_id }} configured with {{ vswitch_node_cidr }} on
      {{ vswitch_vlan_parent }}. Peer reachability becomes a meaningful check once a
      second node in {{ vswitch_node_region }} is configured.
