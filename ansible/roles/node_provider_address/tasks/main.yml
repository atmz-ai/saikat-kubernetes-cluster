---
# * Node address settings that differ by provider, applied before the join so kubelet
# * and the apiserver each register with an address that works for them.
# *
# ! There are TWO addresses, and they have OPPOSITE requirements. Conflating them
# ! is what this role used to do, and it does not fail loudly:
# !
# !   - kubelet --node-ip must be an address present on one of the host's interfaces.
# !     kubelet REJECTS anything else ("node IP ... not found in the host's network
# !     interfaces") and then publishes NO address at all — the node reports Ready
# !     while every `kubectl logs`/`exec` against its pods fails with "no preferred
# !     addresses found; known addresses: []".
# !   - The apiserver advertise address must be routable by every other node. It is
# !     what peers put in the API endpoint list, so an unroutable value silently
# !     breaks a fraction of API requests.
# !
# ! On a bare-metal node the public address IS on the interface and one value
# ! satisfies both. On a cloud VM the public address is a provider-side NAT that
# ! appears on no interface, so the two genuinely differ.
# *
# ! do NOT point --node-ip at any Cilium address (e.g. the cilium_host
# ! CiliumInternalIP). Cilium re-derives InternalIP from the K8s Node object on every
# ! agent start and uses it for the underlay:
# !
# !     pkg/node/sync/local_node_sync.go
# !     for _, addr := range parsedNode.IPAddresses {
# !         if addr.Type == addressing.NodeInternalIP { node.SetNodeInternalIP(addr.IP.Addr) }
# !     }
# !
# ! so publishing a pod-CIDR address as InternalIP makes the VXLAN tunnel endpoint a
# ! pod-CIDR address — carrying pod traffic then requires pod traffic to exist.
# * Measured 2026-09-29: the tunnel endpoint moved to the CiliumInternalIP and
# * cross-cloud pod traffic stopped. Two traps: it looks fine until the AGENT
# * restarts (a kubelet-only test stays green), and the bad value is STICKY —
# * reverting --node-ip did not recover it, a second agent restart did.
# * `ExtractNodeIP` separately skips CiliumInternalIP when picking the node IP, so
# * the two are not interchangeable by design.

- name: Determine the address peers must use to reach this node
  # * Routed address: the apiserver's advertise address and the kubeadm certificate
  # * SANs. Read from `ansible_host` — the address we connect on, which is what every
  # * other consumer already treats as this node's address.
  ansible.builtin.set_fact:
    node_provider_address_peer: "{{ hostvars[inventory_hostname]['ansible_host'] }}"

- name: Determine the address kubelet must advertise
  # * The default-interface address: the only thing kubelet will accept, and what it
  # * would pick unaided. Stated explicitly so the intent is visible and so the two
  # * addresses cannot be conflated again.
  ansible.builtin.set_fact:
    node_provider_address_local: "{{ ansible_facts['default_ipv4']['address'] }}"

- name: Check whether that address is already on an interface
  # ! The fact is `ansible_facts['all_ipv4_addresses']`, NOT `ansible_all_ipv4_addresses`.
  # ! Getting it wrong does not error — the comparison is silently False and the role
  # ! concludes "behind NAT", rewriting kubelet config on a node whose address was
  # ! already correct. The assert makes an absent fact loud instead, because "unknown"
  # ! must not read as "needs pinning".
  ansible.builtin.assert:
    that:
      - ansible_facts['all_ipv4_addresses'] is defined
      - ansible_facts['default_ipv4']['address'] is defined
    fail_msg: >-
      The gathered IPv4 facts are incomplete, so this role cannot tell which address
      kubelet should advertise. Refusing to guess — a wrong answer here rewrites
      kubelet config and can leave the node publishing no address at all.
    quiet: true

- name: Compare the routed address against this node's local addresses
  ansible.builtin.set_fact:
    node_provider_address_is_local: >-
      {{ node_provider_address_peer in ansible_facts['all_ipv4_addresses'] }}

- name: Report which address kubelet will advertise
  ansible.builtin.debug:
    msg: >-
      Peers reach this node at {{ node_provider_address_peer }}
      ({{ 'on a local interface' if node_provider_address_is_local
         else 'NOT local (behind NAT)' }});
      kubelet will advertise {{ node_provider_address_local }}.

- name: Pin the kubelet address
  # * Gated on the concrete problem: the routed address is NOT on an interface, so
  # * kubelet would reject it. On a node where the routed address IS local, kubelet's
  # * auto-detection already yields the right value and writing the file anyway would
  # * be matching a default — unnecessary config, plus a kubelet restart, on every
  # * bare-metal node.
  when: not node_provider_address_is_local
  block:
    # * /etc/default/kubelet is read by the kubelet unit via
    # * `EnvironmentFile=-/etc/default/kubelet` (the `-` makes it optional, so the file
    # * may be absent — which is the state on the Hetzner nodes before this runs).
    # *
    # * Written here rather than via kubeadm's nodeRegistration.kubeletExtraArgs
    # * because control-plane-join runs a bare `kubeadm join` with no --config, so a
    # * JoinConfiguration file would never be read. Writing it before the join means
    # * kubelet carries --node-ip when it first registers.
    # *
    # ! Set to the interface address rather than the routed one. An earlier version
    # ! wrote `--node-ip=<public>` here; kubelet rejects that (the address is on no
    # ! interface) and then publishes NO address at all. The interface address is the
    # ! only value kubelet accepts.
    - name: Write kubelet extra args
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: |
          KUBELET_EXTRA_ARGS=--node-ip={{ node_provider_address_local }}
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Restart kubelet to pick up the address
      # * failed_when: false — kubelet has no cluster config yet at this stage, so it
      # * exits immediately. That is expected; the assertion below checks the
      # * configuration this role owns, not kubelet's run state (the join's business).
      ansible.builtin.systemd_service:
        name: kubelet
        state: restarted
      become: true
      failed_when: false

    - name: Verify kubelet loaded the pinned address
      # ! check the FILE, not a shell pipeline. `pgrep -a kubelet | grep -c --
      # ! '--node-ip=X'` under `set -o pipefail` fails precisely on the case it was
      # ! meant to detect (grep exits 1 on no match), and kubelet is cycling with no
      # ! cluster config at this stage so it may not be running at all. The
      # ! configuration is this role's responsibility; kubelet's run state is the join's.
      ansible.builtin.slurp:
        src: /etc/default/kubelet
      register: node_provider_address_kubelet_env

    - name: Read the running kubelet arguments if kubelet is up yet
      ansible.builtin.command: pgrep -a kubelet
      register: node_provider_address_kubelet_procs
      changed_when: false
      failed_when: false

    - name: Assert the pinned address is configured for kubelet
      ansible.builtin.assert:
        that:
          - node_provider_address_kubelet_env['content'] | b64decode
            is search('--node-ip=' ~ node_provider_address_local | regex_escape)
        fail_msg: >-
          /etc/default/kubelet does not set --node-ip={{ node_provider_address_local }}.
          kubelet requires an address that is on an interface; with none set, or set
          to a NAT'd address, it publishes NO address and `kubectl logs`/`exec`
          against this node's pods fail. Do NOT proceed — inspect /etc/default/kubelet.
        success_msg: "kubelet configured with --node-ip={{ node_provider_address_local }}"

    - name: Report whether the running kubelet has picked the address up yet
      # * Informational only — see the warning above; not being in the process list
      # * yet is expected while kubelet has no cluster config.
      ansible.builtin.debug:
        msg: >-
          {{ 'kubelet process carries --node-ip=' ~ node_provider_address_local
             if (node_provider_address_kubelet_procs.stdout | default(''))
                | regex_search('--node-ip=' ~ node_provider_address_local | regex_escape)
             else 'kubelet process not yet showing the flag (expected while it has no cluster config) — it reads /etc/default/kubelet on each start' }}
      vars:
        # * Resolve the whole expression once so the conditional reads cleanly.
        node_provider_address_kubelet_procs: "{{ node_provider_address_kubelet_procs | default({}) }}"
