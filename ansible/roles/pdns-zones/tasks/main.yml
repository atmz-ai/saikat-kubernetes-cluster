# Render every generated PowerDNS artifact from `pdns_zones` (group_vars/all/vars.yml).
#
# Runs on localhost — reads the inventory variable only, does not touch nodes and does
# not talk to the cluster. The rendered files are committed and applied by Flux.
#
# ONE role, ONE run, EVERY zone. It generates two kinds of thing:
#
#   1. The zone LIST — which zones exist and their flags:
#        pdns-zones-config.yaml        the seed Job's zone list (create + TSIG metadata)
#        external-dns-zones-patch.yaml a JSON6902 append patch adding
#                                      --rfc2136-zone / --domain-filter per zone
#   2. One DNSEndpoint file per zone — the actual records:
#        dnsendpoint-<zone>.yaml       apex + wildcard + ns glue, plus the API server
#                                      endpoint records for names the CERTIFICATE covers
#      plus pdns-service-dns.yaml, the :53 Service whose externalIPs are the ns set.
#
# Everything is driven from `pdns_zones`, so a node add regenerates the apex and wildcard
# in ALL zones at once. That matters because those records list every node: a new node
# that never reaches them joins successfully and receives no traffic, with nothing
# reporting a problem.
#
# The verification task below is not a formality. It is the reason the list can be
# trusted: without it, a template bug would produce a manifest that quietly omits a zone,
# and the failure would surface at runtime as external-dns managing no records
# (indistinguishable from success, as happened with the comma-joined flags).
#
# Usage:
#   mise run dns-generate
# which runs:
#   ansible-playbook ansible/playbooks/operations/update-dns-zone-config.yml
#
# The generated files are INPUT to GitOps, not live changes: commit and push them, and
# Flux applies. external-dns then converges the records from the DNSEndpoint — which is
# why nothing here writes DNS directly.

- name: Fail fast if no zones are declared
  ansible.builtin.assert:
    that:
      - pdns_zones is defined
      - pdns_zones | length > 0
    fail_msg: >-
      pdns_zones is empty or undefined in ansible/inventory/group_vars/all/vars.yml.
      At least one zone must be declared — rendering an empty zone list would
      disable RFC2136 for every zone and strip the seed Job's zone setup.

- name: Render the zone list consumed by the seed Job
  ansible.builtin.template:
    src: zones-config.yaml.j2
    dest: "{{ playbook_dir }}/../../../kubernetes/infrastructure/external-dns/pdns-zones-config.yaml"
    mode: '0644'

- name: Render the external-dns zone flag patch
  ansible.builtin.template:
    src: zones-patch.yaml.j2
    dest: "{{ playbook_dir }}/../../../kubernetes/infrastructure/external-dns/external-dns-zones-patch.yaml"
    mode: '0644'

# Read the rendered files back and prove each one carries every declared zone.
# A dropped zone fails the playbook locally, before anything is committed or applied.
- name: Read back the rendered artifacts
  ansible.builtin.set_fact:
    pdns_rendered_seed_config: "{{ lookup('file', pdns_zones_output_dir ~ '/pdns-zones-config.yaml') }}"
    pdns_rendered_zone_patch: "{{ lookup('file', pdns_zones_output_dir ~ '/external-dns-zones-patch.yaml') }}"

- name: Verify every zone reached the seed Job's zone list
  ansible.builtin.assert:
    that:
      - item in pdns_rendered_seed_config
    fail_msg: >-
      Zone '{{ item }}' is missing from pdns-zones-config.yaml. The seed Job would
      never create it, so external-dns would have nothing to write records into.
      Fix the template — do not commit this.
  loop: "{{ pdns_zones | map(attribute='name') | list }}"

- name: Verify every zone reached the external-dns flag patch
  ansible.builtin.assert:
    that:
      - item in pdns_rendered_zone_patch
    fail_msg: >-
      Zone '{{ item }}' is missing from external-dns-zones-patch.yaml. external-dns
      would ignore it entirely and still report success while managing nothing.
      Fix the template — do not commit this.
  loop: "{{ pdns_zones | map(attribute='name') | list }}"

- name: Report what was generated
  ansible.builtin.debug:
    msg: >-
      Generated zone artifacts for {{ pdns_zones | map(attribute='name') | join(', ') }}.
      Loading a snapshot: {{ pdns_zones | selectattr('snapshot') | map(attribute='name') | join(', ') | default('none', true) }}.

# ── Per-zone record files ────────────────────────────────────────────────────
# Everything above is the zone LIST (which zones exist + their flags). Below is one
# DNSEndpoint file per zone, listing the actual records.
#
# Driven from `pdns_zones` so EVERY zone regenerates in one run. A node add changes the
# apex and wildcard in all of them, so a per-zone invocation would make that a checklist
# — and the entry most likely to be missed is the zone nobody is currently looking at.
- name: Collect every node's IP (workers + control planes)
  # The set the apex and wildcard point at. ANY node serves these records' traffic: the
  # Cilium mesh routes to whichever node hosts the destination pod, so the record lists
  # the whole fleet and no per-service routing exists.
  #
  # Sorted, so the generated file's target order does not churn with inventory order.
  ansible.builtin.set_fact:
    pdns_all_node_ips: "{{ (groups['worker_nodes'] + groups['control_plane']) | map('extract', hostvars) | map(attribute='ansible_host') | sort }}"

- name: Collect control plane node IPs
  # For the API server endpoint records only. Distinct from the full node set on purpose:
  # the apiserver listens on the control planes, so pointing an endpoint record at a
  # worker's :6443 would add a dead target.
  ansible.builtin.set_fact:
    pdns_control_plane_ips: "{{ groups['control_plane'] | map('extract', hostvars) | map(attribute='ansible_host') | sort }}"

- name: Gather the nameservers (workers with a namecheap_nameserver annotation)
  # `host` is carried alongside the prefix and IP so the generated Service can label each
  # externalIP with the node it belongs to — without it, an IP in the Service can only be
  # traced to hosts.yml by matching addresses by eye.
  ansible.builtin.set_fact:
    pdns_nameservers: >-
      {{ pdns_nameservers | default([])
         + [{'prefix': hostvars[item].namecheap_nameserver,
             'host': item,
             'ip': hostvars[item].ansible_host}] }}
  loop: "{{ groups['worker_nodes'] }}"
  when: hostvars[item].namecheap_nameserver is defined

- name: Report the node sets the zone records will carry
  ansible.builtin.debug:
    msg:
      - "all node IPs (apex + wildcard): {{ pdns_all_node_ips | length }}"
      - "control plane IPs (API endpoint): {{ pdns_control_plane_ips | length }}"
      - "nameservers (ns glue + DNS Service): {{ pdns_nameservers | length }}"

- name: Generate the DNSEndpoint file for every declared zone
  ansible.builtin.include_tasks: generate_zone.yaml
  loop: "{{ pdns_zones }}"
  loop_control:
    loop_var: zone
    label: "{{ zone.name }}"

# The DNS Service's externalIPs are the SAME node set as the glue records — the IPs that
# bind :53 on the nodes the NS records point at. Generating it here is what makes the
# three copies of this list (glue records, NS records, Service) impossible to disagree,
# rather than merely checked by hand.
#
# Emitted once, not per zone: the content depends only on the nameserver list, never on
# which zone was being generated, so the bytes are identical whichever zone ran last.
- name: Generate the PowerDNS DNS Service from the same nameserver list
  ansible.builtin.template:
    src: pdns-service-dns.yaml.j2
    dest: "{{ pdns_zones_output_dir }}/pdns-service-dns.yaml"
    mode: '0644'

# The seed Job reads this ConfigMap's CONTENT, so a zone change does not alter the
# Job's pod template — which means no immutable-template error (good) but also no
# restart. A Completed Job never runs again on its own, so a newly added zone is
# silently ignored until the Job is deleted and Flux recreates it. That silence is
# the same failure shape as the flag bugs, so it is called out here rather than
# left to be remembered.
- name: Remind that the seed Job must be re-run for a zone change
  ansible.builtin.debug:
    msg: >-
      ZONES CHANGED → the seed Job reads this list at run time, but a Completed Job
      will not re-run itself. After pushing, delete it so Flux recreates it:
        kubectl -n external-dns delete job pdns-db-seed
      Skipping this leaves the new zone absent from PowerDNS while the config claims
      it exists.
