---
- name: Check if node is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf_stat

- name: Skip if already joined
  ansible.builtin.debug:
    msg: "Node {{ ansible_facts['hostname'] }} is already part of the cluster"
  when: kubelet_conf_stat.stat.exists

- name: Join worker node to cluster
  when: not kubelet_conf_stat.stat.exists
  block:
    # Same reasoning as control-plane-join, and it applies just as much here: a
    # joining node reads no config file. `kubeadm token create --print-join-command`
    # runs on the first control plane and reads the kubeadm-config ConfigMap, so that
    # ConfigMap's controlPlaneEndpoint is what gets baked into this node's
    # kubelet.conf. Left stale, a worker joins the OLD endpoint and only breaks when
    # that name is retired — long after the join reported success.
    #
    # Done before the join command is generated below, including before the cached
    # `worker_join_command` fallback is consulted (that value comes from cluster-init,
    # which uploads the ConfigMap first, so the two are consistent either way).
    - name: Render the declarative kubeadm ClusterConfiguration on the first control plane
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../manifests/kubeadm-cluster-configuration.yaml.j2"
        dest: /etc/kubernetes/kubeadm-cluster-configuration.yaml
        mode: "0600"
      delegate_to: "{{ groups['control_plane'][0] }}"

    - name: Reconcile the kubeadm-config ConfigMap before joining
      ansible.builtin.command: >-
        kubeadm init phase upload-config kubeadm
        --config /etc/kubernetes/kubeadm-cluster-configuration.yaml
      delegate_to: "{{ groups['control_plane'][0] }}"
      changed_when: false

    - name: Use cached join command from first control plane if available
      ansible.builtin.set_fact:
        join_command: "{{ hostvars[groups['control_plane'][0]]['worker_join_command'] }}"
      when: hostvars[groups['control_plane'][0]]['worker_join_command'] is defined

    - name: Generate join command from first control plane
      ansible.builtin.command: kubeadm token create --print-join-command
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: join_command_dynamic
      changed_when: true   # token create always mints a new bootstrap token
      when: join_command is not defined

    - name: Set join command from generated output
      ansible.builtin.set_fact:
        join_command: "{{ join_command_dynamic.stdout }}"
      when: join_command is not defined

    - name: Join cluster
      ansible.builtin.command: "{{ join_command }}"
      register: join_result
      changed_when: true   # kubeadm join always rewrites kubelet state

    - name: Display join result
      ansible.builtin.debug:
        msg: "{{ join_result.stdout_lines }}"
