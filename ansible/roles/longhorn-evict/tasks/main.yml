---
# longhorn-evict — gracefully drain all Longhorn replicas from a node
#
# Sets evictionRequested=true on every disk of the target Longhorn node, then
# waits until scheduledReplica is empty for all disks before returning.
# Longhorn migrates each replica to another node during this wait.
#
# * "Migrates" means REBUILDS, never moves: Longhorn builds a new replica on another node
# * and deletes the old one only once the new one is healthy. A 1-replica volume
# * (longhorn-1replica SC) goes through exactly the same path as a 2-replica one — it is
# * not reused or relocated because some second copy exists.
# *
# ! CALL THIS BEFORE THE DRAIN, NEVER AFTER. The eviction is performed by the target
# ! node's own instance-manager, so that pod must stay alive for the wait to finish.
# ! `kubectl drain` cordons the node, and a cordoned node cannot host the
# ! instance-manager — it is evicted and cannot be rescheduled, the InstanceManager CR
# ! goes to `currentState: error`, and the engine on that node can no longer be synced,
# ! so the eviction ticket never detaches and this role times out. `--ignore-daemonsets`
# ! does NOT protect it: instance-manager pods are owned by InstanceManager CRs, not a
# ! DaemonSet (verified — all 31 in the cluster have owner kind InstanceManager).
# ! Measured on worker-16 (2026-09-30): drain-first left a 2-replica volume's engine
# ! stranded, blocked the workload's reattach and took harbor-registry to zero endpoints.
# *
# * The drain also cordons the node, and `node-drain-policy: block-if-contains-last-replica`
# * auto-evicts on CORDON — so a 1-replica volume normally starts migrating before this role
# * runs. This role then covers what auto-eviction does not: a volume where the node held a
# * replica that was not the last healthy one (no auto-eviction under that policy).
#
# Called from:
#   remove-node.yml  (hosts: localhost, target_host=<node>)
#
# Not used in upgrade-node.yml because the upgrade cycle (delete → reboot → rejoin)
# is brief (~5-10 min) and Longhorn recognises disk UUIDs on rejoin, cancelling any
# in-progress rebuild. Proactively setting evictionRequested before an upgrade would
# leave it permanently enabled if no reboot ended up being required.
#
# kubectl commands run on localhost (the Ansible controller / devcontainer).
# The vscode user's ~/.kube/config is used directly — no become needed.

- name: Check that target_host is defined
  ansible.builtin.fail:
    msg: "target_host must be specified: -e target_host=worker-X"
  when: target_host is not defined or target_host == ""
  run_once: true

- name: Check Longhorn node object exists
  ansible.builtin.command: >
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system -o name
  register: longhorn_node_check
  changed_when: false
  failed_when: false
  run_once: true

- name: Skip eviction if node not registered in Longhorn
  ansible.builtin.debug:
    msg: "Node {{ target_host }} not found in Longhorn, skipping replica eviction."
  when: longhorn_node_check.rc != 0
  run_once: true

- name: Get Longhorn disk keys for target node
  ansible.builtin.shell: |
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system \
      -o json | python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    for key in d['spec']['disks']:
        print(key)
    "
  register: longhorn_disk_keys
  changed_when: false
  when: longhorn_node_check.rc == 0
  run_once: true

- name: Check current replica count before eviction
  ansible.builtin.shell: |
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system \
      -o json | python3 -c "
    import sys, json, subprocess, shlex
    d = json.load(sys.stdin)
    total = 0
    for disk in d.get('status', {}).get('diskStatus', {}).values():
        for replica_name in disk.get('scheduledReplica', {}):
            # Only count replicas whose CR actually exists.
            # On a dead node, scheduledReplica can contain phantom entries
            # (the replica CR was already deleted but the node status was never
            # reconciled because the node is unreachable). Counting phantoms
            # would cause the eviction wait to loop forever.
            result = subprocess.run(
                shlex.split(
                    f'kubectl get replica.longhorn.io {replica_name} -n longhorn-system'
                ),
                capture_output=True
            )
            if result.returncode == 0:
                total += 1
            else:
                print(f'PHANTOM replica {replica_name} (CR not found, skipping)', file=sys.stderr)
    print(total)
    "
  register: replica_count_before
  changed_when: false
  when: longhorn_node_check.rc == 0
  run_once: true

- name: Display replica count before eviction
  ansible.builtin.debug:
    msg: "Replicas on {{ target_host }} before eviction: {{ replica_count_before.stdout }}"
  when: longhorn_node_check.rc == 0
  run_once: true

- name: Enable eviction on each disk
  ansible.builtin.shell: >
    kubectl patch node.longhorn.io {{ target_host }} -n longhorn-system
    --type=json
    -p='[{"op":"replace","path":"/spec/disks/{{ item }}/allowScheduling","value":false},{"op":"replace","path":"/spec/disks/{{ item }}/evictionRequested","value":true}]'
  loop: "{{ longhorn_disk_keys.stdout_lines | default([]) }}"
  when:
    - longhorn_node_check.rc == 0
    - longhorn_disk_keys.stdout_lines | default([]) | length > 0
    - replica_count_before.stdout | int > 0
  run_once: true
  changed_when: true

- name: Wait for all replicas to evacuate before continuing removal
  ansible.builtin.shell: |
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system \
      -o json | python3 -c "
    import sys, json, subprocess, shlex
    d = json.load(sys.stdin)
    total = 0
    for disk in d.get('status', {}).get('diskStatus', {}).values():
        for replica_name in disk.get('scheduledReplica', {}):
            result = subprocess.run(
                shlex.split(
                    f'kubectl get replica.longhorn.io {replica_name} -n longhorn-system'
                ),
                capture_output=True
            )
            if result.returncode == 0:
                total += 1
    print(total)
    "
  register: replica_count
  until: replica_count.stdout | int == 0
  # ! 30 minutes, matching what the diagnostics below already assume ("a rebuild that
  # ! needs longer than the 30-minute wait"). This was `retries: 2, delay: 30` — 60
  # ! seconds total — so the wait could never outlast a real rebuild and the docs and
  # ! the code disagreed. Eviction is a full replica copy: a ~50 GiB replica took ~30 min
  # ! Helsinki->India (measured, Loki/worker-35, 2026-10-02), and a 200 GiB one takes most
  # ! of a day. Under 60 s the eviction was effectively guaranteed to "time out", which
  # ! is the normal path for any node that holds a replica of a non-trivial volume.
  retries: 60
  delay: 30
  changed_when: false
  failed_when: replica_count.rc != 0 or replica_count.stdout | trim != "0"
  when:
    - longhorn_node_check.rc == 0
    - replica_count_before.stdout | int > 0
  run_once: true

- name: Set eviction timeout fact
  ansible.builtin.set_fact:
    eviction_timed_out: "{{ replica_count is defined and replica_count.stdout | default('0') | int > 0 }}"
  when:
    - longhorn_node_check.rc == 0
    - replica_count_before.stdout | int > 0
  run_once: true

- name: Check data safety after eviction timeout
  # ! The floor is PER VOLUME, not a flat 2. A flat "remaining >= 2" is UNSATISFIABLE
  # ! on a cluster that uses the 1-replica StorageClass: a 1-replica volume can never
  # ! have 2 replicas anywhere, so it is reported unsafe even when the target node
  # ! holds no replica of it at all — blocking node removal for EVERY node while any
  # ! 1-replica volume exists. Measured: removing worker-14 (which holds exactly one
  # ! volume, a 3-replica one) failed with 10 unrelated 1-replica volumes listed.
  # !
  # ! The two floors are different hazards:
  # !   want >= 2  → losing redundancy below the SC's design. Require 2 remaining.
  # !   want == 1  → the SC promises NO redundancy (used only for app-layer-replicated
  # !                stores), so the only loss to prevent is the LAST replica. Require 1.
  # ! So: floor = min(want, 2).
  #
  # Reads the VOLUME object for the desired count rather than inferring it from the
  # replica list — a volume reduced by a previous failure would otherwise look
  # permanently 1-replica and keep raising its own bar.
  ansible.builtin.shell: |
    kubectl get volumes.longhorn.io -n longhorn-system -o json > /tmp/lh-vols.json
    kubectl get replicas.longhorn.io -n longhorn-system -o json |
    python3 -c "
    import sys, json
    target = '{{ target_host }}'
    with open('/tmp/lh-vols.json') as fh:
        vols = json.load(fh)
    want = {
        v['metadata']['name']: v['spec'].get('numberOfReplicas', 1)
        for v in vols.get('items', [])
    }
    d = json.load(sys.stdin)
    # Count each volume's replicas that are NOT on the node being removed.
    remaining = {}
    for r in d.get('items', []):
        vol = r['metadata']['labels'].get('longhornvolume', '')
        node = r['spec']['nodeID']
        if vol and node != target:
            remaining[vol] = remaining.get(vol, 0) + 1
    unsafe = []
    for vol, desired in want.items():
        have = remaining.get(vol, 0)
        floor = 1 if desired < 2 else 2
        if have < floor:
            unsafe.append(f'{vol}(have={have},want={desired})')
    print('UNSAFE:' + ','.join(unsafe) if unsafe else 'SAFE')
    "
  register: data_safety_check
  changed_when: false
  when:
    - longhorn_node_check.rc == 0
    - eviction_timed_out | default(false) | bool
  run_once: true

- name: Gather the live rebuild state for replicas that could not evacuate
  # ! WHY THIS EXISTS. The old message blamed "storage issues (add disks, enable
  # ! scheduling)" for every timeout. That is ONE cause, not the only one, and it is
  # ! the wrong one when the eviction is merely SLOW: eviction of an attached volume
  # ! rebuilds a REPLACEMENT replica first and only then deletes the old one, so a
  # ! rebuild that needs longer than the 30-minute wait leaves the eviction pending
  # ! with plenty of free disk. The operator was sent to look at capacity while the
  # ! cluster was healthily copying 100+ GB across regions.
  # ! Measured on worker-15 / pvc-6e1d6c64: the replacement replica on
  # ! saikat-azure-central-india-3 was transferring ~15 MB/s (a 107 GB encrypted,
  # ! 205 GB-actual volume over a ~146 ms cross-region link), which is on the order
  # ! of a full working day to finish.
  #
  # Reads the ENGINE's rebuildStatus, which is the only place the controller publishes
  # per-replica transfer state (replica status has no progress field):
  #   state=in_progress|complete|failed, progress=N (percent), appliedRebuildingMBps,
  #   isRebuilding, error.
  #
  # ! Do NOT read `appliedRebuildingMBps` as evidence either way. It reports 0 for the
  # ! whole slow phase (verified against the destination disk, which was visibly draining
  # ! at ~15 MB/s while this field stayed 0), and `progress` advances in bursts. Both
  # ! fields are informational; the only trustworthy measure of "is it moving" is whether
  # ! the destination node's free space is falling. The debug task below therefore prints
  # ! the numbers without asserting on them.
  ansible.builtin.shell: |
    kubectl get volumes.longhorn.io -n longhorn-system -o json > /tmp/lh-vols.json
    kubectl get replicas.longhorn.io -n longhorn-system -o json > /tmp/lh-reps.json
    kubectl get engines.longhorn.io -n longhorn-system -o json > /tmp/lh-engines.json
    python3 -c "
    import json
    target = '{{ target_host }}'
    vols = json.load(open('/tmp/lh-vols.json')).get('items', [])
    reps = json.load(open('/tmp/lh-reps.json')).get('items', [])
    engines = json.load(open('/tmp/lh-engines.json')).get('items', [])

    robustness = {v['metadata']['name']: v['status'].get('robustness') for v in vols}
    want = {v['metadata']['name']: v['spec'].get('numberOfReplicas', 1) for v in vols}

    stuck = {}
    for r in reps:
        vol = r['metadata']['labels'].get('longhornvolume', '')
        if vol and r['spec']['nodeID'] == target:
            stuck[vol] = r['metadata']['name']

    rebuild = {}
    for e in engines:
        vol = e['metadata']['labels'].get('longhornvolume', '')
        status = e['status'].get('rebuildStatus') or {}
        if vol and status:
            rebuild[vol] = status

    lines = []
    for vol in sorted(stuck):
        lines.append(f'  {vol} robustness={robustness.get(vol)} want={want.get(vol)}')
        details = rebuild.get(vol) or {}
        if not details:
            lines.append('    rebuild: NONE in progress — no healthy source or no schedulable disk')
        for endpoint, info in details.items():
            lines.append(
                f\"    rebuild -> {endpoint}: state={info.get('state')} \"
                f\"progress={info.get('progress')}% MBps={info.get('appliedRebuildingMBps')} \"
                f\"isRebuilding={info.get('isRebuilding')} error={info.get('error')!r}\"
            )
    print('\n'.join(lines) if lines else '  (no replicas remain on the target node)')
    "
  register: longhorn_eviction_diagnostics
  changed_when: false
  when:
    - longhorn_node_check.rc == 0
    - eviction_timed_out | default(false) | bool
  run_once: true

- name: Report why the eviction did not complete
  ansible.builtin.debug:
    msg: "{{ longhorn_eviction_diagnostics.stdout_lines | default([]) }}"
  when:
    - longhorn_node_check.rc == 0
    - eviction_timed_out | default(false) | bool
  run_once: true

- name: Fail if removing this node would drop a volume below its replica floor
  ansible.builtin.fail:
    msg: >-
      Longhorn replica eviction timed out for {{ target_host }} and data safety
      cannot be guaranteed. Volumes below their floor (have < want, where the floor
      is 1 for a 1-replica volume and 2 for anything larger):
      {{ data_safety_check.stdout }}.

      WHY it did not complete (the replica could not be rebuilt elsewhere in time —
      check the rebuild line for each volume: no rebuild line means no healthy source
      or no schedulable disk, which IS a capacity/placement problem, whereas an
      in_progress line means the transfer is simply still running):

      {{ longhorn_eviction_diagnostics.stdout | default('') }}

      Do NOT proceed. A pending in_progress transfer at or near 100% usually just needs
      a longer wait; re-running the playbook resumes it. A missing rebuild line, or a
      state of failed, is what needs a storage fix first.
  when:
    - longhorn_node_check.rc == 0
    - eviction_timed_out | default(false) | bool
    - "'UNSAFE' in data_safety_check.stdout"
  run_once: true

- name: Warn about forced eviction (data safe)
  ansible.builtin.debug:
    msg: >-
      Longhorn replica eviction timed out for {{ target_host }} but data is safe
      (every volume keeps at least its floor of replicas elsewhere).
      Proceeding with forced eviction — the replica on {{ target_host }} will
      be lost, but data integrity is maintained.

      State of the replicas that could not evacuate:

      {{ longhorn_eviction_diagnostics.stdout | default('') }}
  when:
    - longhorn_node_check.rc == 0
    - eviction_timed_out | default(false) | bool
    - "'SAFE' in data_safety_check.stdout"
  run_once: true

- name: Eviction complete
  ansible.builtin.debug:
    msg: >-
      Longhorn eviction complete for {{ target_host }} —
      all {{ replica_count_before.stdout }} replicas migrated off the node.
  when:
    - longhorn_node_check.rc == 0
    - replica_count_before.stdout | int > 0
    - not (eviction_timed_out | default(false) | bool)
  run_once: true
