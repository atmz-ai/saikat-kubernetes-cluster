# Create or update a single Namecheap glue record.
#
# Uses per-host variables:
#   namecheap_nameserver: the nameserver prefix (e.g. "ns1" — generic, no domain)
#   ansible_host:         the worker node IP (used as the glue record IP)
#
# The FQDN is constructed: {{ namecheap_nameserver }}.{{ namecheap_domain_sld }}.{{ namecheap_domain_tld }}
#
# Flow:
#   1. Check if the nameserver already exists (namecheap.domains.ns.getInfo)
#   2. If not: create it (namecheap.domains.ns.create)
#   3. If yes but IP differs: update it (namecheap.domains.ns.update)
#   4. If yes and IP matches: skip (idempotent)

- name: Construct nameserver FQDN
  ansible.builtin.set_fact:
    nameserver_fqdn: "{{ namecheap_nameserver }}.{{ namecheap_domain_sld }}.{{ namecheap_domain_tld }}"

- name: Get info for existing nameserver
  ansible.builtin.uri:
    url: >-
      {{ namecheap_api_url }}?ApiUser={{ namecheap_api_user }}&ApiKey={{ namecheap_api_key
      }}&UserName={{ namecheap_username }}&ClientIp={{ namecheap_client_ip
      }}&Command=namecheap.domains.ns.getInfo&SLD={{ namecheap_domain_sld
      }}&TLD={{ namecheap_domain_tld }}&Nameserver={{ nameserver_fqdn }}
    method: GET
    return_content: true
  delegate_to: "{{ namecheap_delegate_host }}"
  register: ns_info_result
  changed_when: false
  failed_when: false

- name: Check if nameserver exists (API returns HTTP 200 even for errors)
  # ! Two traps lived here. Both fail SILENTLY, and the wrong version looks like success:
  # !
  # ! 1. `regex_search` returns the MATCHED STRING, not a boolean, and `| bool` coerces an
  # !    unrecognised string to False — even one that plainly reads Status="OK". So
  # !    `ns_exists` was ALWAYS false: the role took the CREATE path on every run and
  # !    NEVER ran the update, while still reporting `changed`. Measured 2026-10-02: after
  # !    a run that reported changed on all six nameservers, the TLD ADDITIONAL section
  # !    still held the previous node IPs. `is search` is the boolean-returning test.
  # ! 2. The IP is an ATTRIBUTE of DomainNSInfoResult, not an <IP> element:
  # !    `<DomainNSInfoResult Domain="..." Nameserver="..." IP="138.201.85.40">`.
  # !    Parsing for an element yields nothing, and the following update then fails with
  # !    the API's "Parameter OldIP is Missing" — which names only the symptom.
  ansible.builtin.set_fact:
    ns_exists: "{{ ns_info_result.content is search('ApiResponse Status=\"OK\"') }}"
    # `regex_findall` yields a list, so `join` gives '' when absent rather than raising —
    # set_fact evaluates this eagerly even on the create path, where it is never read.
    current_ns_ip: "{{ ns_info_result.content | regex_findall('IP=\"([^\"]*)\"') | join(' ') }}"

- name: Assert the existing glue record's IP was parsed
  # Fail where the cause is visible. A getInfo that reports OK but yields no IP means the
  # response shape changed and this parse is stale — better a message naming that than the
  # API's "Parameter OldIP is Missing", which points at the caller instead of the parser.
  ansible.builtin.assert:
    that:
      - current_ns_ip | length > 0
    fail_msg: >-
      getInfo reports the glue record for {{ nameserver_fqdn }} exists, but no IP could be
      parsed from it. The response shape has probably changed; re-check the attribute this
      task reads. Verbatim response:
      {{ ns_info_result.content }}
  when: ns_exists

- name: Create new glue record
  ansible.builtin.uri:
    url: >-
      {{ namecheap_api_url }}?ApiUser={{ namecheap_api_user }}&ApiKey={{ namecheap_api_key
      }}&UserName={{ namecheap_username }}&ClientIp={{ namecheap_client_ip
      }}&Command=namecheap.domains.ns.create&SLD={{ namecheap_domain_sld
      }}&TLD={{ namecheap_domain_tld }}&Nameserver={{ nameserver_fqdn }}&IP={{ ansible_host }}
    method: GET
    return_content: true
  delegate_to: "{{ namecheap_delegate_host }}"
  register: ns_create_result
  when: not ns_exists
  changed_when: true

- name: Fail when the API refuses the create
  # ! Without this the create path is fire-and-forget, and Namecheap answers errors with
  # ! HTTP 200, so a refused create is indistinguishable from a successful one. That is
  # ! the same silent-success shape as the ns_exists bug above, and it is what let a run
  # ! report changes on every node while the registrar held the old addresses.
  ansible.builtin.fail:
    msg: |
      Namecheap refused to create the glue record for {{ nameserver_fqdn }} -> {{ ansible_host }}.

      Upstream response (verbatim):
      {{ ns_create_result.content | default('no response body') }}
  when:
    - not ns_exists
    - ns_create_result.content is defined
    - "'Status=\"ERROR\"' in ns_create_result.content"

- name: Update glue record IP
  ansible.builtin.uri:
    url: >-
      {{ namecheap_api_url }}?ApiUser={{ namecheap_api_user }}&ApiKey={{ namecheap_api_key
      }}&UserName={{ namecheap_username }}&ClientIp={{ namecheap_client_ip
      }}&Command=namecheap.domains.ns.update&SLD={{ namecheap_domain_sld
      }}&TLD={{ namecheap_domain_tld }}&Nameserver={{ nameserver_fqdn
      }}&OldIP={{ current_ns_ip }}&IP={{ ansible_host }}
    method: GET
    return_content: true
  delegate_to: "{{ namecheap_delegate_host }}"
  register: ns_update_result
  when:
    - ns_exists
    - current_ns_ip != ansible_host
  changed_when: true

- name: Fail when the API refuses the update
  # Same silent-success guard as the create path: an error body is not an exception.
  ansible.builtin.fail:
    msg: |
      Namecheap refused to update the glue record for {{ nameserver_fqdn }}:
      {{ current_ns_ip }} -> {{ ansible_host }}.

      Upstream response (verbatim):
      {{ ns_update_result.content | default('no response body') }}
  when:
    - ns_exists
    - current_ns_ip != ansible_host
    - ns_update_result.content is defined
    - "'Status=\"ERROR\"' in ns_update_result.content"

- name: Display glue record status
  ansible.builtin.debug:
    msg: "Glue record {{ nameserver_fqdn }} -> {{ ansible_host }} already up to date"
  when:
    - ns_exists
    - current_ns_ip == ansible_host
