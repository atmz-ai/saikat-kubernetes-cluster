# Create/update Namecheap custom nameservers (glue records) and set domain NS.
#
# Uses the Namecheap API (HTTP GET, XML response) via ansible.builtin.uri.
# API docs: https://www.namecheap.com/support/api/methods/
#
# This role runs on every node in `nodes` — control planes included. Any node with
# `namecheap_nameserver` defined in hosts.yml is registered as a custom nameserver —
# that node's ansible_host IP is used as the glue record IP (single source of truth).
#
# ! It used to run on worker_nodes only, from when control planes were dedicated and ran
# ! no workloads. Every control plane here is stacked, so they host pods like any other
# ! node and are the more stable set — a better home for a nameserver delegation than a
# ! fleet of workers that is being torn down.
#
# ! setCustom runs on the last host after serial glue updates complete.
#
# Idempotent: checks existing state before making changes.
#
# Variables (from group_vars + playbook):
#   namecheap_api_user:      API username (vault indirection)
#   namecheap_api_key:       API key (vault indirection)
#   namecheap_username:      Namecheap account username (vault indirection)
#   namecheap_client_ip:     Whitelisted IP for API access (auto-detected if not set)
#   namecheap_domain_sld:    Second-level domain (e.g. "saikat")
#   namecheap_domain_tld:    Top-level domain (e.g. "dev")
#   namecheap_nameserver:    Per-host annotation in hosts.yml (e.g. "ns1" — generic prefix)
#
# The FQDN is constructed as: {{ namecheap_nameserver }}.{{ namecheap_domain_sld }}.{{ namecheap_domain_tld }}
# This allows the same workers to serve as nameservers for multiple domains.
#
# Namecheap API limits: up to 13 nameservers for .dev TLD (ICANN standard).
#
# WHITELISTING IS UI-ONLY — there is no API for it (verified 2026-09-23 against
# the full method list: domains, domains.dns, domains.ns, domains.transfer, ssl,
# users, users.address, domainprivacy all lack it; users.update only covers
# contact details). Every call needs a ClientIp that Namecheap validates against
# an account-level allowlist, so an un-whitelisted delegate surfaces as
# `1011150 Invalid request IP`. The preflight below turns that into an
# actionable message instead. See TODO(namecheap-delegate) in
# ansible/playbooks/operations/update-namecheap-dns.yml.

- name: Detect delegate host's public IP
  ansible.builtin.uri:
    url: https://api.ipify.org
    return_content: true
  delegate_to: "{{ namecheap_delegate_host }}"
  register: detected_ip
  when: namecheap_client_ip is not defined

- name: Set client IP from delegate host
  ansible.builtin.set_fact:
    namecheap_client_ip: "{{ detected_ip.content }}"
  when: namecheap_client_ip is not defined

- name: Build Namecheap API base URL
  ansible.builtin.set_fact:
    namecheap_api_url: "https://api.namecheap.com/xml.response"

- name: Get current nameservers for domain
  ansible.builtin.uri:
    url: >-
      {{ namecheap_api_url }}?ApiUser={{ namecheap_api_user }}&ApiKey={{ namecheap_api_key
      }}&UserName={{ namecheap_username }}&ClientIp={{ namecheap_client_ip
      }}&Command=namecheap.domains.dns.getList&SLD={{ namecheap_domain_sld
      }}&TLD={{ namecheap_domain_tld }}
    method: GET
    return_content: true
  delegate_to: "{{ namecheap_delegate_host }}"
  register: namecheap_current_ns
  # Namecheap answers errors with HTTP 200 + <ApiResponse Status="ERROR">, and a
  # non-2xx would also land here. Either way the NEXT task owns the decision, so
  # this one must not abort first — otherwise a whitelist rejection surfaces as
  # a raw uri failure instead of the remediation message below.
  failed_when: false
  changed_when: false

- name: Fail with remediation when Namecheap rejects the API call
  ansible.builtin.fail:
    msg: |
      Namecheap rejected the API call delegated to {{ namecheap_delegate_host }}.

      This is almost always the IP allowlist: Namecheap requires ClientIp on every
      call and validates it against an account-level allowlist that can ONLY be
      edited in the web dashboard (there is no API method to read or change it).
      A delegate whose IP is not on that list always fails with error 1011150.

      Upstream response (verbatim):
      {{ namecheap_current_ns.content | default(namecheap_current_ns.msg | default('no response body')) }}

      To fix:
        1. Namecheap → Profile → Tools → Business & Dev Tools → Namecheap API Access
        2. Under "Whitelisted IPs" click Edit → Add IP → add {{ namecheap_client_ip }}
        3. Re-run this playbook

      Or delegate from an already-whitelisted node instead:
        -e namecheap_delegate_host=<host>
  when:
    - namecheap_current_ns.content is defined
    - "'Status=\"ERROR\"' in namecheap_current_ns.content"

- name: Parse current nameservers
  ansible.builtin.set_fact:
    namecheap_existing_ns: "{{ namecheap_current_ns.content | regex_findall('<Nameserver>([^<]+)</Nameserver>', '\\1') }}"
  changed_when: false

- name: Display current nameservers
  ansible.builtin.debug:
    msg: "Current NS for {{ namecheap_domain_sld }}.{{ namecheap_domain_tld }}: {{ namecheap_existing_ns }}"

- name: Create or update glue record for this worker
  ansible.builtin.include_tasks: manage_glue_record.yml
  when: namecheap_nameserver is defined

- name: Build desired nameserver list after every host's glue record is reconciled
  # ! With serial: 1, the first host runs before later hosts update their glue.
  # ! ansible_play_hosts_all preserves the complete inventory-selected delegation.
  ansible.builtin.set_fact:
    namecheap_desired_ns: "{{ ansible_play_hosts_all | map('extract', hostvars, 'namecheap_nameserver') | select('defined') | list }}"
  when: inventory_hostname == ansible_play_hosts_all[-1]

- name: Append domain suffix to nameserver prefixes
  ansible.builtin.set_fact:
    namecheap_desired_ns: "{{ namecheap_desired_ns | map('regex_replace', '^(.+)$', '\\1.' + namecheap_domain_sld + '.' + namecheap_domain_tld) | list }}"
  when: inventory_hostname == ansible_play_hosts_all[-1]

- name: Set custom nameservers (run once, if different from current)
  ansible.builtin.uri:
    url: >-
      {{ namecheap_api_url }}?ApiUser={{ namecheap_api_user }}&ApiKey={{ namecheap_api_key
      }}&UserName={{ namecheap_username }}&ClientIp={{ namecheap_client_ip
      }}&Command=namecheap.domains.dns.setCustom&SLD={{ namecheap_domain_sld
      }}&TLD={{ namecheap_domain_tld }}&NameServers={{ namecheap_desired_ns | join(',') }}
    method: GET
    return_content: true
  delegate_to: "{{ namecheap_delegate_host }}"
  register: namecheap_set_ns_result
  when:
    - inventory_hostname == ansible_play_hosts_all[-1]
    - namecheap_existing_ns | sort != namecheap_desired_ns | sort
  changed_when: true

- name: Verify Namecheap accepted the delegation change
  ansible.builtin.assert:
    that:
      - namecheap_set_ns_result.content is search('Status="OK"')
      - namecheap_set_ns_result.content is search('Updated="true"')
    fail_msg: "{{ namecheap_set_ns_result.content }}"
  when:
    - inventory_hostname == ansible_play_hosts_all[-1]
    - namecheap_existing_ns | sort != namecheap_desired_ns | sort

- name: Display setCustom result
  ansible.builtin.debug:
    msg: "Nameservers updated to: {{ namecheap_desired_ns | join(', ') }}"
  when:
    - inventory_hostname == ansible_play_hosts_all[-1]
    - namecheap_existing_ns | sort != namecheap_desired_ns | sort

- name: Confirm nameservers already up to date
  ansible.builtin.debug:
    msg: "Nameservers already up to date: {{ namecheap_existing_ns | join(', ') }}"
  when:
    - inventory_hostname == ansible_play_hosts_all[-1]
    - namecheap_existing_ns | sort == namecheap_desired_ns | sort
