---
- name: Require a covered endpoint and explicit administrative client paths
  ansible.builtin.assert:
    that:
      - control_plane_endpoint in api_server_cert_sans
      - kubeconfig_endpoint_paths | length > 0
      - kubeconfig_endpoint_paths | reject('equalto', '') | list | length == kubeconfig_endpoint_paths | length

- name: Read only the controller's public CA for client identity validation
  ansible.builtin.command:
    argv:
      - kubectl
      - config
      - view
      - --minify
      - --raw
      - -o
      - "jsonpath={.clusters[0].cluster.certificate-authority-data}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: kubeconfig_endpoint_authority

- name: Require the existing controller cluster CA
  ansible.builtin.assert:
    that:
      - kubeconfig_endpoint_authority.stdout | length > 0

- name: Update only covered administrative clients
  ansible.builtin.include_tasks: update.yml
  loop: "{{ kubeconfig_endpoint_paths }}"
  loop_control:
    loop_var: kubeconfig_endpoint_path
