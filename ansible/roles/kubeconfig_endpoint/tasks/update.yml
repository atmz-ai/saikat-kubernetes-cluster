---
- name: Inspect the current context without transferring client credentials
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('file', role_path + '/files/inspect_kubeconfig.py') }}"
      - "{{ kubeconfig_endpoint_path }}"
  changed_when: false
  check_mode: false
  register: kubeconfig_endpoint_before_result

- name: Record public metadata and non-endpoint fingerprint
  ansible.builtin.set_fact:
    kubeconfig_endpoint_before: "{{ kubeconfig_endpoint_before_result.stdout | from_json }}"
    kubeconfig_endpoint_target: "https://{{ control_plane_endpoint }}:6443"

- name: Refuse an unrelated cluster or an unknown endpoint
  ansible.builtin.assert:
    that:
      - kubeconfig_endpoint_before.authority_sha256 == kubeconfig_endpoint_authority.stdout | b64decode | trim | hash('sha256')
      - (kubeconfig_endpoint_before.server | urlsplit('hostname')) in api_server_cert_sans

- name: Verify the new endpoint before editing this client
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ kubeconfig_endpoint_path }}"
      - "--server={{ kubeconfig_endpoint_target }}"
      - get
      - --raw=/readyz
  changed_when: false
  check_mode: false

- name: Change only the selected cluster's server URL
  when:
    - kubeconfig_endpoint_before.server != kubeconfig_endpoint_target
    - not ansible_check_mode
  block:
    - name: Use kubectl's native merge editor without touching CA or user fields
      ansible.builtin.command:
        argv:
          - kubectl
          - "--kubeconfig={{ kubeconfig_endpoint_path }}"
          - config
          - set-cluster
          - "{{ kubeconfig_endpoint_before.cluster_name }}"
          - "--server={{ kubeconfig_endpoint_target }}"
      changed_when: true

    - name: Inspect the updated client without exporting credentials
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('file', role_path + '/files/inspect_kubeconfig.py') }}"
          - "{{ kubeconfig_endpoint_path }}"
      changed_when: false
      register: kubeconfig_endpoint_after_result

    - name: Require unchanged credentials, contexts and other cluster fields
      ansible.builtin.assert:
        that:
          - (kubeconfig_endpoint_after_result.stdout | from_json).server == kubeconfig_endpoint_target
          - (kubeconfig_endpoint_after_result.stdout | from_json).non_endpoint_sha256 == kubeconfig_endpoint_before.non_endpoint_sha256
          - (kubeconfig_endpoint_after_result.stdout | from_json).authority_sha256 == kubeconfig_endpoint_before.authority_sha256

    - name: Verify the updated client's actual saved endpoint
      ansible.builtin.command:
        argv:
          - kubectl
          - "--kubeconfig={{ kubeconfig_endpoint_path }}"
          - get
          - --raw=/readyz
      changed_when: false

  rescue:
    - name: Retain the cutover failure
      ansible.builtin.set_fact:
        kubeconfig_endpoint_failure: "{{ ansible_failed_result.msg | default(ansible_failed_result) }}"

    - name: Restore only the original server URL
      ansible.builtin.command:
        argv:
          - kubectl
          - "--kubeconfig={{ kubeconfig_endpoint_path }}"
          - config
          - set-cluster
          - "{{ kubeconfig_endpoint_before.cluster_name }}"
          - "--server={{ kubeconfig_endpoint_before.server }}"
      changed_when: true

    - name: Stop cutover after restoring the original endpoint
      ansible.builtin.fail:
        msg: "Client cutover failed for {{ kubeconfig_endpoint_path }}; original URL restored. Failure: {{ kubeconfig_endpoint_failure }}"

- name: Report the verified client target
  ansible.builtin.debug:
    msg: >-
      {{ 'Planned' if ansible_check_mode else 'Verified' }} {{ kubeconfig_endpoint_path }}:
      {{ kubeconfig_endpoint_target }}; CA/client credentials and unrelated contexts preserved
