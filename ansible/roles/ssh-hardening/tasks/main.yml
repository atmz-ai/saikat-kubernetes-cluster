---
# SSH Security Hardening
# This role hardens SSH configuration by disabling password authentication
# and ensuring only key-based authentication is allowed
#
# ── SSH ACCESS PREFERENCE (repo-wide, read this before adding a provider) ────
# Connect as **saikat-machine-access**, not root, wherever the provider allows it.
# That account has passwordless sudo, and the account name is uniform across
# providers, so a node's login details do not change with where it runs.
#
# Root is avoided because it is a per-provider accident rather than a choice:
# Hetzner happens to permit root SSH, Azure reserves the account outright
# ("Please login as the user ... rather than the user root"), and others will
# differ again. A role that assumes root is really assuming one provider.
#
# Two consequences to keep in mind when writing or changing a role:
#   1. Privilege must be requested EXPLICITLY. `become: true` in a role's
#      meta/main.yml is silently ignored — ansible-core accepts only
#      allow_duplicates, dependencies, galaxy_info and argument_specs there
#      (ansible/playbook/role/metadata.py, class RoleMetadata). Several roles in
#      this repo declare it and do not get it; they work only because root needs
#      no escalation. Put `become: true` on the PLAY or on individual tasks.
#   2. Anything referring to the login account must derive it from
#      `ansible_user`, not hardcode `root` — see the preflight below.
#
# WHICH USER'S authorized_keys IS CHECKED is derived from the connection user
# (`ansible_user`), not hardcoded to root. Hardcoding root was correct while every
# node was a Hetzner box reached as root, but it is not a fact about hardening —
# it is a fact about one provider. A cloud VM that reserves the root account and
# is reached as an ordinary sudo-capable user has no /root/.ssh at all, so the
# preflight below failed on a node whose SSH access was perfectly fine.
#
# The check exists to avoid locking ourselves out by disabling password auth on an
# account with no key installed. That reasoning applies to whichever account we
# actually log in as, so that is the account to inspect.

- name: Resolve the account whose SSH access this role must not break
  # Prefer the resolved connection user; fall back to ansible_user. Both are
  # expected, but resolving explicitly keeps this robust when one is set only in
  # ansible.cfg / the inventory and the other is not.
  ansible.builtin.set_fact:
    ssh_hardening_login_user: "{{ ansible_user | default('root') }}"

- name: Resolve that account's home directory and authorized_keys path
  # getent rather than assuming /root or /home/<user>: the answer comes from the
  # system itself, so it is right on any provider's account layout (a cloud image
  # may place the admin user's home anywhere).
  ansible.builtin.shell: |
    set -o pipefail
    getent passwd '{{ ssh_hardening_login_user }}' | cut -d: -f6
  args:
    executable: /bin/bash
  register: ssh_hardening_login_home
  changed_when: false
  failed_when: false

- name: Assert the login account exists on this node
  ansible.builtin.assert:
    that:
      - ssh_hardening_login_home.stdout | length > 0
    fail_msg: >-
      The account we connect as ({{ ssh_hardening_login_user }}) does not exist on
      this node, so its authorized_keys cannot be verified. Refusing to touch SSH
      configuration — disabling password auth for an account we cannot inspect
      risks locking us out.
    success_msg: "Login account {{ ssh_hardening_login_user }} found."

- name: Set the authorized_keys path for the login account
  ansible.builtin.set_fact:
    ssh_hardening_authorized_keys_path: "{{ ssh_hardening_login_home.stdout }}/.ssh/authorized_keys"

- name: Ensure authorized_keys exists for the login account
  ansible.builtin.stat:
    path: "{{ ssh_hardening_authorized_keys_path }}"
  register: authorized_keys_stat

- name: Fail if no authorized_keys found
  ansible.builtin.fail:
    msg: >-
      No authorized_keys file found at {{ ssh_hardening_authorized_keys_path }}
      (the account we connect as is {{ ssh_hardening_login_user }}). SSH key
      authentication must be configured for that account before password auth is
      disabled.
  when: not authorized_keys_stat.stat.exists

- name: Check authorized_keys has content
  ansible.builtin.shell: |
    set -o pipefail
    cat {{ ssh_hardening_authorized_keys_path }} | grep -v '^#' | grep -v '^$' | wc -l
  register: key_count
  changed_when: false

- name: Fail if authorized_keys is empty
  ansible.builtin.fail:
    msg: "authorized_keys file is empty. At least one SSH key must be configured."
  when: key_count.stdout | int == 0

- name: Display number of SSH keys
  ansible.builtin.debug:
    msg: "Found {{ key_count.stdout }} SSH key(s) in {{ ssh_hardening_login_user }}'s authorized_keys"

- name: Disable password authentication in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
    backup: true
  notify: Restart SSH service

- name: Disable challenge-response authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?ChallengeResponseAuthentication"
    line: "ChallengeResponseAuthentication no"
    state: present
  notify: Restart SSH service

- name: Disable PAM authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?UsePAM"
    line: "UsePAM no"
    state: present
  notify: Restart SSH service

- name: Ensure PubkeyAuthentication is enabled
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PubkeyAuthentication"
    line: "PubkeyAuthentication yes"
    state: present
  notify: Restart SSH service

- name: Validate sshd configuration
  ansible.builtin.command: sshd -t
  register: sshd_test
  changed_when: false
  failed_when: sshd_test.rc != 0

- name: Display SSH configuration validation result
  ansible.builtin.debug:
    msg: "✅ SSH configuration is valid"
