---
# ! `stacked_control_plane` IS REQUIRED ON EVERY CONTROL PLANE, and it is NOT the same
# ! fact as `node_role: control-plane`. This flag means "control plane that also runs
# ! workloads" — the taint-removal tasks below are gated on it, so a node declaring only
# ! `node_role: control-plane` joins as a DEDICATED control plane and keeps the
# ! NoSchedule taint. That is the correct behaviour, not a bug: a control plane that
# ! silently scheduled workloads because the two facts were conflated would be the bug.
#
# * Defaults to false, so the absent flag means dedicated control plane. Every control
# * plane in this cluster sets it to true in the inventory (all of them are stacked).
# * There is exactly ONE spelling — `stacked_mode` was the older name and has been
# * removed from the inventory, so a stale `stacked_mode: true` now does nothing.
stacked_control_plane: false
