---
- name: Check for the pinned version stamp
  # * The version stamp is written only after a successful install.
  ansible.builtin.stat:
    path: "{{ beszel_agent_install_dir }}/.version"
  register: beszel_agent_version_stamp

- name: Read the installed version
  ansible.builtin.slurp:
    src: "{{ beszel_agent_install_dir }}/.version"
  register: beszel_agent_installed_version
  when: beszel_agent_version_stamp.stat.exists

- name: Decide whether the install or upgrade is needed
  ansible.builtin.set_fact:
    beszel_agent_needs_install: >-
      {{ not beszel_agent_version_stamp.stat.exists
         or (beszel_agent_installed_version.content | default('') | b64decode | trim) != beszel_agent_version }}

- name: Report the version decision
  ansible.builtin.debug:
    msg: >-
      beszel-agent {{ beszel_agent_version }} —
      {{ 'installing' if beszel_agent_needs_install else 'binary already pinned; reconciling configuration' }}

- name: Ensure the service account exists
  ansible.builtin.user:
    name: "{{ beszel_agent_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Ensure the install, config and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ beszel_agent_user }}"
    group: "{{ beszel_agent_group }}"
    mode: "0755"
  loop:
    - "{{ beszel_agent_install_dir }}"
    - "{{ beszel_agent_data_dir }}"
  # ! The credential-bearing config directory remains root-owned.

- name: Ensure the config directory exists (root-owned — it holds the token)
  ansible.builtin.file:
    path: "{{ beszel_agent_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether the agent binary is present
  ansible.builtin.stat:
    path: "{{ beszel_agent_install_dir }}/beszel-agent"
  register: beszel_agent_binary

- name: Download and unpack the pinned agent release
  # ! Binary existence alone cannot identify the installed version.
  ansible.builtin.unarchive:
    src: "https://github.com/henrygd/beszel/releases/download/v{{ beszel_agent_version }}/{{ beszel_agent_asset }}"
    dest: "{{ beszel_agent_install_dir }}"
    remote_src: true
    owner: "{{ beszel_agent_user }}"
    group: "{{ beszel_agent_group }}"
    mode: "0755"
  when: beszel_agent_needs_install

- name: Record the installed version
  ansible.builtin.copy:
    content: "{{ beszel_agent_version }}\n"
    dest: "{{ beszel_agent_install_dir }}/.version"
    owner: "{{ beszel_agent_user }}"
    group: "{{ beszel_agent_group }}"
    mode: "0644"
  when: beszel_agent_needs_install

- name: Write the agent environment file
  ansible.builtin.template:
    src: beszel-agent.env.j2
    dest: "{{ beszel_agent_env_file }}"
    owner: root
    group: root
    mode: "0600"
  diff: false
  # ! Configuration changes independently of the binary version and contains credentials.
  notify: Reload systemd and restart the beszel agent

- name: Install the systemd unit
  ansible.builtin.template:
    src: beszel-agent.service.j2
    dest: "{{ beszel_agent_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and restart the beszel agent

- name: Validate the unit file with systemd's own parser
  # ! systemd_service does not validate unit syntax; unrelated unit diagnostics also appear here.
  ansible.builtin.command:
    cmd: systemd-analyze verify {{ beszel_agent_unit_path }}
  register: beszel_agent_unit_verify
  changed_when: false
  failed_when: >-
    beszel_agent_unit_verify.rc != 0
    or 'beszel-agent.service' in (beszel_agent_unit_verify.stdout ~ beszel_agent_unit_verify.stderr)

- name: Enable and start the agent service
  ansible.builtin.systemd_service:
    name: "{{ beszel_agent_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending agent configuration before verifying the running process
  ansible.builtin.meta: flush_handlers

- name: Confirm the agent is running
  # ! Verify live process state after restart, not just the handler's exit code.
  ansible.builtin.systemd_service:
    name: "{{ beszel_agent_service_name }}"
  register: beszel_agent_active
  changed_when: false
  retries: 5
  delay: 3
  until: beszel_agent_active.status.ActiveState == "active"
  failed_when: beszel_agent_active.status.ActiveState != "active"

- name: Report the agent state
  ansible.builtin.debug:
    msg: "beszel-agent {{ beszel_agent_version }} is {{ beszel_agent_active.status.ActiveState }} on {{ inventory_hostname }}"

- name: Read the running agent environment without exposing credentials
  ansible.builtin.slurp:
    src: "/proc/{{ beszel_agent_active.status.MainPID }}/environ"
  register: beszel_agent_runtime_environment
  no_log: true
  when: not ansible_check_mode

- name: Verify the running agent uses the declared hub URL
  ansible.builtin.assert:
    that:
      - >-
        ('HUB_URL=' ~ beszel_hub_url) in
        (beszel_agent_runtime_environment.content | b64decode).split('\x00')
    fail_msg: The running Beszel agent did not load its declared HUB_URL.
  no_log: true
  when: not ansible_check_mode

- name: Report the verified running hub URL
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} is running Beszel with HUB_URL={{ beszel_hub_url }}"
  when: not ansible_check_mode
