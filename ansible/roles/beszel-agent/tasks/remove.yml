---
# beszel-agent_remove — uninstall the beszel agent from a node being removed.
#
# Two halves, and the ORDER matters:
#   1. stop and remove the service on the node (best-effort — the node may already be
#      unreachable by the time a removal play runs, and that must not fail the play)
#   2. delete the corresponding SYSTEM from the hub, so the node does not linger as a
#      permanently "down" entry forever
#
# The hub deletion is the part with no local equivalent: Longhorn and Kubernetes clean
# up their own objects on removal, but Beszel's `systems` record is owned by the hub and
# nothing else will ever garbage-collect it.

- name: Check whether the agent unit exists on the node
  ansible.builtin.stat:
    path: "{{ beszel_agent_unit_path }}"
  register: beszel_agent_remove_unit
  # ! A node in a removal play is frequently already dead — that is often WHY it is being
  # ! removed. Unreachable must not abort the play, or the hub-side cleanup below (the half
  # ! that has no other owner) would never run. `failed_when: false` + `ignore_unreachable`
  # ! is the explicit form of "tolerate, but keep going", which ignore_errors cannot express.
  failed_when: false
  ignore_unreachable: true

- name: Stop and disable the agent service
  ansible.builtin.systemd_service:
    name: "{{ beszel_agent_service_name }}"
    state: stopped
    enabled: false
    daemon_reload: true
  when:
    - beszel_agent_remove_unit.stat is defined
    - beszel_agent_remove_unit.stat.exists | default(false)
  failed_when: false
  ignore_unreachable: true

- name: Remove the unit, environment file and install directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ beszel_agent_unit_path }}"
    - "{{ beszel_agent_env_dir }}"
    - "{{ beszel_agent_install_dir }}"
  # These paths already exist in the node image / were created by the install, so a
  # failure here means the host is unreachable, not that the removal was wrong.
  failed_when: false
  ignore_unreachable: true

- name: Reload systemd after removing the unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  failed_when: false
  ignore_unreachable: true

# ── Hub-side cleanup: deliberately NOT automated ────────────────────────────────────
# The local agent is removed above. Removing its SYSTEM record from the hub is left to
# the operator, on purpose, and this is the whole reason:
#
# Beszel has no hub-native API for it. The UI's delete is PocketBase's collection
# endpoint — `DELETE /api/collections/systems/records/<id>` (see systemsManager.ts's
# `delete` action, and `internal/hub/collections_test.go`) — and Beszel's own auth-
# protected routes in `internal/hub/api.go` contain NO /systems CRUD route. So the only
# way in is the collection API, i.e. the database layer.
#
# ! The universal agent token CANNOT authenticate to it, so an attempted delete never
# ! works — and worse, it fails in a way that reads as success:
# !   - `internal/hub/api.go`: "Superusers cannot use universal tokens" — the universal
# !     token is a per-USER registration token, and record ownership is enforced against
# !     an authenticated user/superuser record. Skipping oauth2-proxy does not change
# !     that, because the rejection is by the record's auth, not the network path.
# !   - An unauthorised LIST returns HTTP 200 with `"items":[]` (PocketBase hides records
# !     rather than admitting they exist — asserted in Beszel's own test
# !     `"Unauthorized user cannot list systems"`, with the upstream discussion linked in
# !     the test). So "looked up and found nothing" is indistinguishable from
# !     "not allowed to see anything". An earlier revision of this role reported
# !     "No Beszel system record for <node> on the hub" on exactly that response, which
# !     was a false all-clear: the record was there, merely invisible.
# !   - An unauthorised DELETE returns 404, not 403, for the same reason.
#
# So the task prints an instruction instead of pretending to act. Do NOT "improve" this
# back into an API call with the universal token — it cannot work. Automating it would
# mean storing a PocketBase user/superuser credential (a database-layer login) purely
# for a one-click convenience, which is a bad trade.
- name: Tell the operator to remove the node's system from the Beszel hub
  ansible.builtin.debug:
    msg: >-
      ACTION REQUIRED (one click, cannot be automated):
      delete the system '{{ target_host | default(inventory_hostname) }}' from the Beszel hub.
      Open {{ beszel_hub_url }} → Systems → '{{ target_host | default(inventory_hostname) }}' → Delete.

      The agent has already been removed from this node, so the hub entry will drop to
      DOWN and then age out of the graph — but it stays LISTED until deleted, and it will
      be re-claimed if a future node reuses this name. Deleting by hand is required because
      the hub exposes no API for it: the UI's remove calls PocketBase's collection
      endpoint, which the universal agent token cannot authenticate against (see the
      comment above this task for the measured evidence).
  run_once: true
