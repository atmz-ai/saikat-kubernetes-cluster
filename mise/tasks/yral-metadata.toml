# ── hello-world ─────────────────────────────────────────────────────────────
# The `leptos-tutorial-builder-syntax` app (and the `hello-world` daemon that
# pointed at it) were removed in cf6691f9, so this app has no source or Trunk
# config left — only a stale untracked dist/. Its hello-world-build/-run/-stop
# tasks were dropped with the migration to [daemons] rather than carried over,
# since they could never have worked (the old `-run` started a daemon named
# `hello-world`, which never existed while the daemon that did was named
# `leptos-tutorial-builder-syntax`). Re-create all three if the app returns.

# ── yral-metadata ───────────────────────────────────────────────────────────

[yral-metadata-build]
description = "Build yral-metadata server (release). Linux/WSL: musl x86_64 (mimics prod). macOS: native arm64."
run = '''
if [[ "$(uname)" == "Darwin" ]]; then
  cargo build --release -p yral-metadata-server
else
  cargo build --release --target x86_64-unknown-linux-musl -p yral-metadata-server
fi
'''

[yral-metadata-run]
description = "Run yral-metadata locally (release binary, port 7001; avoids macOS Control Center on 7000)"
depends = ["yral-metadata-build"]
daemons = ["yral-metadata"]
run = "echo 'yral-metadata daemon started (mise daemons logs yral-metadata to follow)'"

[yral-metadata-test]
description = "Run yral-metadata tests"
run = "cargo test -p yral-metadata-server -p yral-metadata-client -p yral-metadata-types"

[yral-metadata-image]
description = "Build the yral-metadata container image locally (container on macOS, podman on Linux)"
depends = ["container-system-start"]
run = '''
if [[ "$(uname)" == "Darwin" ]]; then
  exec container build -f apps/yral-metadata/Dockerfile.buildkit -t test/yral-metadata --platform linux/amd64 --cpus 17 --memory 40gb .
else
  exec podman build -f apps/yral-metadata/Dockerfile.buildkit -t test/yral-metadata --platform linux/amd64 .
fi
'''

[yral-metadata-image-run]
description = "Run the yral-metadata container image locally (podman, port 7000)"
depends = ["yral-metadata-image"]
daemons = ["yral-metadata-container"]
run = "echo 'yral-metadata-container daemon started (mise daemons logs yral-metadata-container to follow)'"

[yral-metadata-stop]
description = "Stop yral-metadata dev server and container"
run = "mise daemons stop yral-metadata yral-metadata-container"

[yral-metadata-all]
description = "Full yral-metadata workflow: build → run → test → image → image-run"
run = '''
mise run yral-metadata-build
mise run yral-metadata-run
mise run yral-metadata-test
mise run yral-metadata-image
mise run yral-metadata-image-run
'''

[yral-metadata-validate]
description = "Validate yral-metadata on prod (read-only kubectl checks)"
run = '''
echo "=== Pods ==="
kubectl -n yral-metadata get pods -l app=yral-metadata -o wide
echo ""
echo "=== Health ==="
kubectl -n yral-metadata get pods -l app=yral-metadata -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.containerStatuses[0].ready}{"\n"}{end}'
echo ""
echo "=== Recent logs (last 20 lines, first pod) ==="
FIRST_POD=$(kubectl -n yral-metadata get pods -l app=yral-metadata -o jsonpath='{.items[0].metadata.name}')
kubectl -n yral-metadata logs "$FIRST_POD" --tail=20
'''
