[renovate-configuration-checks]
description = "Validate Renovate schema, generic bundle and image extraction, and check-gated merging"
run = '''
#!/usr/bin/env -S ./.venv/bin/python -u
import json
import subprocess
import urllib.request
from pathlib import Path

import jsonschema
import yaml

configuration = json.loads(Path("renovate.json").read_text())
with urllib.request.urlopen(configuration["$schema"], timeout=30) as response:
    schema = json.load(response)
jsonschema.validate(configuration, schema)
print("PASS: Renovate configuration matches the published schema")

release = next(
    resource for resource in yaml.safe_load_all(Path("kubernetes/infrastructure/rustfs/helmrelease.yaml").read_text())
    if resource["kind"] == "HelmRelease"
)
image = release["spec"]["values"]["image"]["rustfs"]
assert image["repository"] == "rustfs/rustfs"
assert isinstance(image["tag"], str) and image["tag"]
print("PASS: RustFS declares its image repository and tag together")

subprocess.run(["node", "--input-type=module", "-e", r"""
import assert from 'node:assert/strict';
import fs from 'node:fs';

const configuration = JSON.parse(fs.readFileSync('renovate.json', 'utf8'));
const manager = configuration.customManagers.find(manager => manager.customType === 'jsonata');
assert.equal(manager.fileFormat, 'yaml');
assert.equal(manager.datasourceTemplate, 'docker');
assert.equal(manager.versioningTemplate, 'docker');
for (const owner of [configuration.flux, configuration.kubernetes, manager]) {
    const patterns = owner.managerFilePatterns.map(pattern => new RegExp(pattern.slice(1, -1)));
    for (const path of ['kubernetes/infrastructure/rustfs/helmrelease.yaml', 'new-service/arbitrary.yml', 'another/previously-unknown.yaml']) {
        assert(patterns.some(pattern => pattern.test(path)));
    }
    assert(!patterns.some(pattern => pattern.test('new-service/notes.md')));
}
assert(!configuration.customManagers.some(manager => manager.depNameTemplate === 'rustfs/rustfs'));
console.log('PASS: existing and previously unknown YAML paths are discovered without per-image rules');

assert.equal(configuration.automerge, true);
assert.equal(configuration.platformAutomerge, false);
assert.notEqual(configuration.ignoreTests, true);
assert.notEqual(configuration.requiredStatusChecks, null);
assert.equal(configuration.schedule, undefined);
console.log('PASS: Renovate waits for checks instead of relying on unavailable branch protection');

const tektonTemplate = 'tektoncd/' + '{'.repeat(2) + 'project' + '}'.repeat(2);
const releaseManagers = configuration.customManagers.filter(manager => manager.datasourceTemplate === 'github-releases' && (manager.depNameTemplate === undefined || manager.depNameTemplate === tektonTemplate));
for (const [address, repository, version] of [
    ['https://github.com/new-owner/new-controller/releases/download/v2.3.4/release.yaml', 'new-owner/new-controller', 'v2.3.4'],
    ['https://raw.githubusercontent.com/new-owner/new-controller/v2.3.4/config/crd.yaml', 'new-owner/new-controller', 'v2.3.4'],
    ['https://infra.tekton.dev/tekton-releases/new-project/previous/v2.3.4/release.yaml', 'tektoncd/new-project', 'v2.3.4'],
]) {
    const extracted = releaseManagers.flatMap(manager => manager.matchStrings.flatMap(pattern => {
        const match = new RegExp(pattern).exec(address);
        if (!match) return [];
        assert(new RegExp(manager.managerFilePatterns[0].slice(1, -1)).test('new-service/arbitrary.yml'));
        let dependency = match.groups.depName ?? manager.depNameTemplate;
        for (const [key, value] of Object.entries(match.groups)) dependency = dependency.replaceAll('{'.repeat(2) + key + '}'.repeat(2), value);
        return [{repository: dependency, version: match.groups.currentValue}];
    }));
    assert.deepEqual(extracted, [{repository, version}]);
    console.log('PASS: unknown release bundle is automatically discoverable', address);
}
for (const address of [
    'https://github.com/new-owner/new-controller/releases/download/latest/release.yaml',
    'https://raw.githubusercontent.com/new-owner/new-controller/main/config/crd.yaml',
    'https://infra.tekton.dev/tekton-releases/pipeline/latest/release.yaml',
]) {
    assert(!releaseManagers.some(manager => manager.matchStrings.some(pattern => new RegExp(pattern).test(address))));
    console.log('PASS: floating release reference is not accepted as a pinned version', address);
}

const floating = configuration.packageRules.find(rule => rule.pinDigests === true);
assert.deepEqual(floating.matchDatasources, ['docker']);
const floatingPattern = new RegExp(floating.matchCurrentValue.slice(1, -1));
for (const tag of ['latest', 'alpine']) assert(floatingPattern.test(tag));
for (const tag of ['1.0.1', 'v0.37.0', '20261102050204-5a17bbdf']) assert(!floatingPattern.test(tag));
const privateImages = configuration.packageRules.find(rule => rule.enabled === false);
assert(new RegExp(privateImages.matchDepNames[0].slice(1, -1)).test('harbor.yral.com/my-website/my-website'));
assert(!new RegExp(privateImages.matchDepNames[0].slice(1, -1)).test('rustfs/rustfs'));
console.log('PASS: floating public images get digest PRs; Flux-owned private images remain untouched');
"""], check=True)
'''

[backup-configuration-checks]
description = "Regression-check backup manifests, pinned charts, recovery schemas, and deployment dependencies"
run = '''
#!/usr/bin/env -S ./.venv/bin/python -u
import json
import re
import subprocess
import tempfile
from pathlib import Path

import jsonschema
import yaml

rendered = {}
for owner in ("rustfs", "longhorn", "longhorn-backup", "cloudnative-pg", "harbor", "external-dns"):
    result = subprocess.run(
        ["kubectl", "kustomize", "--load-restrictor", "LoadRestrictionsNone", "kubernetes/infrastructure/" + owner],
        capture_output=True, text=True,
    )
    if result.stderr:
        print(result.stderr)
    result.check_returncode()
    rendered[owner] = [resource for resource in yaml.safe_load_all(result.stdout) if resource]
    print("PASS: rendered", owner)

entrypoint = yaml.safe_load(Path("kubernetes/clusters/saikat-kubernetes-cluster/kustomization.yaml").read_text())
assert "infrastructure-velero.yaml" not in entrypoint["resources"]
print("PASS: Velero is absent from the reconciliation entrypoint")

for owner in ("longhorn-backup",):
    declaration = yaml.safe_load(Path("kubernetes/infrastructure", owner, "kustomization.yaml").read_text())
    assert declaration["patches"][0]["path"] == "../loki/loki-rustfs-credentials.sops.yaml"
    secret_name = "longhorn-rustfs-credentials"
    secret = next(resource for resource in rendered[owner] if resource["kind"] == "Secret" and resource["metadata"]["name"] == secret_name)
    assert {"AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"} <= set(secret["stringData"])
    print("PASS:", owner, "decrypts shared credentials before authenticated key renaming")

jobs = [resource for resource in rendered["longhorn-backup"] if resource["kind"] == "RecurringJob"]
backup = next(job for job in jobs if job["spec"]["task"] == "backup")
assert backup["spec"]["cron"] == "0 2 * * *"
assert backup["spec"]["retain"] == 7
assert all(job["spec"]["task"] not in ("snapshot", "snapshot-force-create", "snapshot-delete") for job in jobs)
assert next(job for job in jobs if job["spec"]["task"] == "snapshot-cleanup")["spec"]["retain"] == 0
target = next(resource for resource in rendered["longhorn-backup"] if resource["kind"] == "BackupTarget" and resource["metadata"]["name"] == "default")
assert [resource["metadata"]["name"] for resource in rendered["longhorn-backup"] if resource["kind"] == "BackupTarget"] == ["default"]
assert not any(resource["kind"] == "Secret" and resource["metadata"]["name"] == "longhorn-s3-backup-credentials" for resource in rendered["longhorn-backup"])
settings = next(resource for resource in rendered["longhorn"] if resource["kind"] == "HelmRelease")["spec"]["values"]["defaultSettings"]
assert target["spec"]["backupTargetURL"] == settings["backupTarget"]
assert target["spec"]["credentialSecret"] == settings["backupTargetCredentialSecret"]
print("PASS: Longhorn daily S3 backups retain recovery points without a local snapshot-history job")

for resource in rendered["longhorn-backup"]:
    if resource["kind"] == "Backup":
        result = subprocess.run(
            ["kubectl", "get", "snapshots.longhorn.io", resource["spec"]["snapshotName"], "-n", resource["metadata"]["namespace"], "-o", "json"],
            capture_output=True, text=True,
        )
        assert result.returncode == 0, "Deploy the source Snapshot before its Backup; Longhorn checks it during dry-run"
        source_snapshot = json.loads(result.stdout)
        assert source_snapshot["status"]["readyToUse"] is True
        assert resource["metadata"]["labels"]["backup-volume"] == source_snapshot["spec"]["volume"]
        assert resource["metadata"]["labels"]["backup-target"] == target["metadata"]["name"]
        print("PASS: Longhorn Backup admission source is ready and volume and internal target labels match")

provisioner = next(resource for resource in rendered["rustfs"] if resource["kind"] == "Job" and resource["metadata"]["name"] == "rustfs-cluster-backup-buckets-2")
script = provisioner["spec"]["template"]["spec"]["containers"][0]["args"][0]
subprocess.run(["sh", "-n"], input=script, text=True, check=True)
buckets = set(re.findall(r"saikat-kubernetes-cluster-[a-z-]+", script))
assert len(buckets) == 2 and all(3 <= len(bucket) <= 63 for bucket in buckets)
assert target["spec"]["backupTargetURL"].split("/")[2].split("@")[0] in buckets
print("PASS: bucket names, provisioner syntax, and backup destinations agree")

with tempfile.TemporaryDirectory(prefix="backup-chart-checks-") as directory:
    charts = (
        ("plugin-barman-cloud", "https://github.com/cloudnative-pg/charts/releases/download/plugin-barman-cloud-v0.8.1/plugin-barman-cloud-0.8.1.tgz", "cnpg-system", "plugin-barman-cloud-0.8.1.tgz"),
    )
    for name, url, namespace, filename in charts:
        subprocess.run(
            ["curl", "--fail", "--location", "--retry", "3", "--connect-timeout", "15", "--max-time", "180", "--output", str(Path(directory, filename)), url],
            check=True,
        )
        for enabled in (True,):
            chart_values = {}
            result = subprocess.run(
                ["helm", "template", name, str(Path(directory, filename)), "--namespace", namespace, "--include-crds", "-f", "-"],
                input=json.dumps(chart_values), capture_output=True, text=True,
            )
            if result.stderr:
                print(result.stderr)
            result.check_returncode()
            chart_resources = [resource for resource in yaml.safe_load_all(result.stdout) if resource]
            if name == "plugin-barman-cloud":
                definition = next(resource for resource in chart_resources if resource["kind"] == "CustomResourceDefinition" and resource["metadata"]["name"] == "objectstores.barmancloud.cnpg.io")
                schema = next(version for version in definition["spec"]["versions"] if version["name"] == "v1")["schema"]["openAPIV3Schema"]
                destinations = []
                for owner, application_role in (("harbor", "harbor"), ("external-dns", "pdns")):
                    cluster = next(resource for resource in rendered[owner] if resource["kind"] == "Cluster")
                    store = next(resource for resource in rendered[owner] if resource["kind"] == "ObjectStore")
                    scheduled = next(resource for resource in rendered[owner] if resource["kind"] == "ScheduledBackup")
                    jsonschema.validate(store, schema)
                    assert cluster["spec"]["plugins"][0]["isWALArchiver"] is True
                    assert cluster["spec"]["plugins"][0]["parameters"]["barmanObjectName"] == store["metadata"]["name"]
                    assert scheduled["spec"]["cluster"]["name"] == cluster["metadata"]["name"]
                    assert scheduled["spec"]["method"] == "plugin" and len(scheduled["spec"]["schedule"].split()) == 6
                    assert not scheduled["spec"].get("immediate", False)
                    labels = cluster["spec"]["inheritedMetadata"]["labels"]
                    assert labels["recurring-job.longhorn.io/source"] == "enabled"
                    assert labels["recurring-job-group.longhorn.io/default"] == "disabled"
                    assert labels["recurring-job.longhorn.io/postgresql-snapshot-cleanup"] == "enabled"
                    assert cluster["spec"]["bootstrap"]["initdb"]["owner"] == application_role
                    assert not cluster["spec"].get("enableSuperuserAccess", False)
                    destination = store["spec"]["configuration"]["destinationPath"]
                    assert destination.split("/")[2] in buckets
                    destinations.append(destination)
                    print("PASS:", owner, "published ObjectStore schema, daily base backup, WAL archiving, and application role")
                assert len(set(destinations)) == 2

graph = {}
for path in Path("kubernetes/clusters/saikat-kubernetes-cluster").glob("*.yaml"):
    for resource in yaml.safe_load_all(path.read_text()):
        if resource and resource.get("apiVersion", "").startswith("kustomize.toolkit.fluxcd.io/"):
            graph[resource["metadata"]["name"]] = [dependency["name"] for dependency in resource.get("spec", {}).get("dependsOn", [])]
for starting in graph:
    pending = [(starting, [])]
    while pending:
        current, ancestry = pending.pop()
        assert current not in ancestry, "Dependency cycle: " + " -> ".join(ancestry + [current])
        pending.extend((dependency, ancestry + [current]) for dependency in graph.get(current, []))
print("PASS: Flux backup dependencies have no cycles")
