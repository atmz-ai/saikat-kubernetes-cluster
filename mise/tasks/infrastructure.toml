description = "Render official VM operators, verify role-owned release pins, and preserve the existing Goose workload"
run = '''
#!/usr/bin/env -S ./.venv/bin/python
from pathlib import Path
import subprocess
from jinja2 import Environment, StrictUndefined
from jinja2.nativetypes import NativeEnvironment
from ansible.plugins.filter.core import FilterModule
import jsonpatch
import tomllib
import base64
import yaml

for component in ["kubevirt", "containerized-data-importer"]:
  role = Path("ansible/roles") / component
  defaults = yaml.safe_load((role / "defaults/main.yml").read_text())
  expected = Environment(undefined=StrictUndefined).from_string((role / "templates/operator-kustomization.yaml.j2").read_text()).render(**defaults)
  directory = Path("kubernetes/infrastructure") / component
  assert expected.rstrip() == (directory / "operator/kustomization.yaml").read_text().rstrip(), component + " entrypoint differs from its role-owned release pin"
  for path in [directory / "operator", directory]:
    resources = list(yaml.safe_load_all(subprocess.check_output(["kubectl", "kustomize", str(path)], text=True)))
    for resource in resources:
      print("Validated " + resource["kind"] + " " + resource["metadata"]["name"], flush=True)
cluster = list(yaml.safe_load_all(subprocess.check_output(["kubectl", "kustomize", "kubernetes/clusters/yral-k8s"], text=True)))
for component in ["kubevirt", "containerized-data-importer"]:
  name = "infrastructure-" + component
  resource = next(item for item in cluster if item["kind"] == "Kustomization" and item["metadata"]["name"] == name)
  assert resource["spec"]["dependsOn"][0]["name"] == name + "-operator"
  print("PASS: " + name + " waits for its operator", flush=True)
application = list(yaml.safe_load_all(subprocess.check_output(["kubectl", "kustomize", "kubernetes/apps/goose"], text=True)))
goose = next(item for item in application if item["kind"] == "Deployment" and item["metadata"]["name"] == "goose")
assert [item["name"] for item in goose["spec"]["template"]["spec"]["containers"]] == ["goose"]
print("PASS: operator bootstrap preserves the existing Goose container", flush=True)
defaults = tomllib.loads(Path("mise.toml").read_text())["vars"]
expected = Environment(undefined=StrictUndefined).from_string(Path("kubernetes/apps/goose/workstation-root-disk.yaml.j2").read_text()).render(**defaults)
root_disk = next(item for item in application if item["kind"] == "DataVolume" and item["metadata"]["name"] == "goose-workstation-root")
assert yaml.safe_load(expected) == root_disk
assert root_disk["metadata"]["annotations"]["kustomize.toolkit.fluxcd.io/prune"] == "disabled"
virtual_machine = next(item for item in application if item["kind"] == "VirtualMachine" and item["metadata"]["name"] == "goose-workstation")
volumes = virtual_machine["spec"]["template"]["spec"]["volumes"]
assert not any(item.get("persistentVolumeClaim", {}).get("claimName") == "goose-home" for item in volumes)
config_reference = next(item["configMap"]["name"] for item in volumes if "configMap" in item)
assert any(item["kind"] == "ConfigMap" and item["metadata"]["name"] == config_reference for item in application)
cloud_init_volume = next(item["cloudInitNoCloud"] for item in volumes if "cloudInitNoCloud" in item)
assert "userData" not in cloud_init_volume
cloud_init_secret = next(item for item in application if item["kind"] == "Secret" and item["metadata"]["name"] == cloud_init_volume["secretRef"]["name"])
cloud_init = yaml.safe_load(base64.b64decode(cloud_init_secret["data"]["userdata"]))
assert cloud_init["ssh_pwauth"] is False
assert cloud_init["users"][0]["uid"] == 1000
assert "PermitRootLogin no" in next(item["content"] for item in cloud_init["write_files"] if item["path"].endswith("10-goose-workstation.conf"))
print("PASS: staged VM pins its root disk, preserves existing home data, and resolves bootstrap configuration", flush=True)
ssh_service = next(item for item in application if item["kind"] == "Service" and item["metadata"]["name"] == "goose-workstation")
assert ssh_service["spec"]["type"] == "LoadBalancer"
assert ssh_service["spec"]["loadBalancerClass"] == "io.cilium/node"
assert ssh_service["spec"]["allocateLoadBalancerNodePorts"] is False
assert "externalIPs" not in ssh_service["spec"]
assert not any("nodePort" in port for port in ssh_service["spec"]["ports"])
assert ssh_service["spec"]["ports"] == [{"name": "ssh", "port": 2222, "targetPort": 22}]
assert not any(item["kind"] in ["Gateway", "TCPRoute"] and item["metadata"]["name"] == "goose-ssh" for item in application)
print("PASS: SSH uses Cilium Node IPAM with no NodePort, deprecated externalIPs, or unsupported Gateway", flush=True)
node_label_tasks = yaml.safe_load(Path("ansible/roles/node-labels/tasks/load-balancer.yml").read_text())[0]
policy_environment = NativeEnvironment(undefined=StrictUndefined)
policy_environment.filters["bool"] = FilterModule().filters()["bool"]
eligibility = policy_environment.from_string(node_label_tasks["vars"]["node_load_balancer_eligible"])
for configuration, expected_eligible in [
  ({"node_role": "worker"}, True),
  ({}, True),
  ({"node_role": "control-plane", "stacked_control_plane": True}, True),
  ({"node_role": "control-plane", "stacked_control_plane": False}, False),
  ({"node_role": "control-plane"}, False),
]:
  assert eligibility.render(**configuration) is expected_eligible
  print("PASS: load balancer eligibility " + str(configuration), flush=True)
patch_task = next(task for task in node_label_tasks["block"] if "kubernetes.core.k8s_json_patch" in task)
original_node = {"metadata": {"labels": {"node.kubernetes.io/exclude-from-external-load-balancers": "", "preserved-label": "value"}}}
updated_node = jsonpatch.apply_patch(original_node, patch_task["kubernetes.core.k8s_json_patch"]["patch"])
assert "node.kubernetes.io/exclude-from-external-load-balancers" not in updated_node["metadata"]["labels"]
assert updated_node["metadata"]["labels"]["preserved-label"] == "value"
assert "node.kubernetes.io/exclude-from-external-load-balancers" in original_node["metadata"]["labels"]
print("PASS: exclusion removal preserves other labels and leaves its input unchanged", flush=True)
'''

# ── API version hygiene ─────────────────────────────────────────────────────
# Report manifests whose apiVersion+kind the cluster no longer SERVES.
#
# Why this exists: whether an apiVersion is served is decided by the CRD that
# defines it, and a channel/version change can silently stop serving a version we
# still use. Not hypothetical — switching the Gateway API CRDs from the
# experimental to the standard channel dropped `v1alpha2`, and every Kafka
# TLSRoute using it stopped applying with "the server could not find the
# requested resource". Version strings are no signal on their own: `v1alpha1`
# looks old but is correct for Tekton's ClusterInterceptor, which serves it and
# nothing else.
#
# Sources of truth, and why the obvious one is wrong:
#   CRDs               -> spec.versions[].served   (authoritative)
#   built-in resources -> kubectl api-resources    (authoritative for these)
#   NOT api-resources for CRDs: it lists only the PREFERRED version per resource,
#   so a CRD serving both v1 and v1beta1 (ReferenceGrant) reports only v1, and
#   every v1beta1 manifest becomes a false positive.
#
# Deliberately dependency-free (stdlib only, regex rather than a YAML parser):
# apiVersion/kind are top-level scalars, so regex is safe, and PyYAML is NOT
# guaranteed — the workflow installs only mise plus the root .venv.
#
# Requires a working kubeconfig (`mise run bootstrap` extracts it from the vault).
# Read-only: `kubectl get crd` and `kubectl api-resources` only.
[check-api-versions]
description = "Fail if any manifest uses an apiVersion the cluster no longer serves (requires kubeconfig)"
run = '''
#!/usr/bin/env python3
"""Fail if any manifest uses an apiVersion the cluster no longer serves."""
import json
import re
import subprocess
import sys
from pathlib import Path

MANIFEST_ROOT = Path("kubernetes")

# apiVersions consumed by tooling, not applied to the API server.
NON_RESOURCE_GROUPS = {"kustomize.config.k8s.io"}

# Top-level `apiVersion:` / `kind:` only — column 0, no leading whitespace.
# That is what keeps this safe without a YAML parser.
API_VERSION_RE = re.compile(r"^apiVersion:[ \t]*(\S+)[ \t]*$", re.M)
KIND_RE = re.compile(r"^kind:[ \t]*(\S+)[ \t]*$", re.M)


def declared_pairs():
    """(apiVersion, kind) -> set of files, from manifests under kubernetes/."""
    pairs = {}
    for path in sorted(MANIFEST_ROOT.rglob("*.yaml")):
        # SOPS files are ciphertext; their apiVersion/kind are opaque blobs.
        if path.name.endswith(".sops.yaml"):
            continue
        text = path.read_text(errors="replace")
        # Pair positionally: within a document they appear apiVersion then kind.
        for api_version, kind in zip(
            API_VERSION_RE.findall(text), KIND_RE.findall(text)
        ):
            group = api_version.split("/")[0] if "/" in api_version else ""
            if group in NON_RESOURCE_GROUPS:
                continue
            pairs.setdefault((api_version, kind), set()).add(str(path))
    return pairs


def served_pairs():
    """Every (apiVersion, kind) the cluster serves."""
    served = set()

    crds = json.loads(
        subprocess.run(
            ["kubectl", "get", "crd", "-o", "json"],
            capture_output=True, text=True, check=True,
        ).stdout
    )
    for crd in crds["items"]:
        spec = crd["spec"]
        kind = spec["names"]["kind"]
        for version in spec.get("versions", []):
            if version.get("served"):
                served.add((f"{spec['group']}/{version['name']}", kind))

    resources = subprocess.run(
        ["kubectl", "api-resources", "--no-headers", "--verbs=list"],
        capture_output=True, text=True, check=True,
    ).stdout
    for line in resources.splitlines():
        # Columns are whitespace-padded and SHORTNAMES can be EMPTY (e.g.
        # `secrets`), so positional splitting misreads the row. NAMESPACED is
        # always literally true/false and sits immediately before KIND, with
        # APIVERSION immediately before it — anchor on that instead.
        fields = line.split()
        if "true" not in fields and "false" not in fields:
            continue
        idx = next(i for i, f in enumerate(fields) if f in ("true", "false"))
        if idx >= 2:
            served.add((fields[idx - 1], fields[idx + 1]))

    return served


def main():
    declared = declared_pairs()
    served = served_pairs()
    missing = [
        (api_version, kind, sorted(files))
        for (api_version, kind), files in sorted(declared.items())
        if (api_version, kind) not in served
    ]

    if not missing:
        print(f"OK: all {len(declared)} declared apiVersion+kind pairs are served")
        return 0

    print(
        f"OUTDATED API VERSIONS: {len(missing)} of {len(declared)} declared "
        "pairs are NOT served by the cluster.\n"
    )
    for api_version, kind, files in missing:
        print(f"  {api_version}  ({kind})")
        for path in files:
            print(f"      {path}")
    print(
        "\nEach entry above will fail to apply. Check which versions the "
        "resource now serves:\n"
        "  kubectl get crd <crd> -o jsonpath='{range .spec.versions[*]}"
        "{.name} served={.served}{\"\\n\"}{end}'"
    )
    return 1


if __name__ == "__main__":
    sys.exit(main())
'''
