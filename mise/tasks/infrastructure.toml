    print("PASS: rendered", owner)

entrypoint = yaml.safe_load(Path("kubernetes/clusters/yral-k8s/kustomization.yaml").read_text())
assert "infrastructure-velero.yaml" not in entrypoint["resources"]
print("PASS: Velero is absent from the reconciliation entrypoint")

for owner in ("longhorn-backup",):
    declaration = yaml.safe_load(Path("kubernetes/infrastructure", owner, "kustomization.yaml").read_text())
    assert declaration["patches"][0]["path"] == "../loki/loki-rustfs-credentials.sops.yaml"
    secret_name = "longhorn-rustfs-credentials"
