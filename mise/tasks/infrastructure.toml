[netbird-contract-generate]
description = "Refresh the full version-matched NetBird API snapshot and generate Python bindings"
run = '''
#!/usr/bin/env -S ./.venv/bin/python -u
import subprocess
import urllib.request
from pathlib import Path
import yaml

directory = Path("kubernetes/infrastructure/netbird")
deployment = next(yaml.safe_load_all((directory / "deployment.yaml").read_text()))
version = deployment["spec"]["template"]["spec"]["containers"][0]["image"].rsplit(":", 1)[1]
url = "https://raw.githubusercontent.com/netbirdio/netbird/v" + version + "/shared/management/http/api/openapi.yml"
print("Fetching full NetBird contract:", url, flush=True)
with urllib.request.urlopen(url, timeout=30) as response:
    (directory / "openapi.yaml").write_bytes(response.read())
subprocess.run([
    ".venv/bin/datamodel-codegen", "--input", str(directory / "openapi.yaml"),
    "--input-file-type", "openapi", "--output-model-type", "typing.TypedDict",
    "--no-use-closed-typed-dict",
    "--target-python-version", "3.11", "--use-standard-collections",
    "--use-union-operator", "--disable-timestamp", "--formatters", "builtin",
    "--type-mappings", "string+cidr=string", "--output", str(directory / "api_models.py"),
], check=True)
print("Generated Python bindings from the complete NetBird API", flush=True)
'''

[netbird-checks]
description = "Test NetBird bootstrap decisions and validate Kubernetes rendering and version-matched API bindings"
depends = ["netbird-contract-generate"]
run = '''
#!/usr/bin/env -S ./.venv/bin/python -u
import subprocess
subprocess.run([".venv/bin/python", "-B", "-m", "unittest", "discover", "-v", "-s", "kubernetes/infrastructure/netbird", "-p", "test_*.py"], check=True)
for directory in ("kubernetes/infrastructure/netbird", "kubernetes/networking/routes/netbird", "kubernetes/clusters/saikat-kubernetes-cluster"):
    print("Rendering", directory, flush=True)
    subprocess.run(["kubectl", "kustomize", directory], check=True)
'''

[infrastructure-release-checks]
description = "Validate upstream release bundles and consumed CRD contracts"
depends = ["netbird-checks"]
run = '''
#!/usr/bin/env -S ./.venv/bin/python -u
import json
import re
import subprocess
import urllib.request
from pathlib import Path

import jsonschema
import yaml

monitoring = yaml.safe_load(Path("kubernetes/infrastructure/monitoring/helmrelease.yaml").read_text())
assert monitoring["spec"]["upgrade"].get("crds", "Create") == "CreateReplace", "Prometheus operator upgrades must reconcile their chart's CRDs"
print("PASS: Prometheus operator upgrades reconcile their CRDs through Flux")
configuration = json.loads(Path("renovate.json").read_text())
tekton_template = "tektoncd/" + "{" * 2 + "project" + "}" * 2
managers = [manager for manager in configuration["customManagers"] if manager.get("datasourceTemplate") == "github-releases" and ("depNameTemplate" not in manager or manager.get("depNameTemplate") == tekton_template)]
versions = {}
schemas = {}
for path in sorted(Path("kubernetes/infrastructure").rglob("kustomization.yaml")):
    declaration = yaml.safe_load(path.read_text())
    addresses = [resource for resource in declaration.get("resources", []) if resource.startswith("https://")]
    if not addresses:
        continue
    expected = {}
    for address in addresses:
        extracted = []
        for manager in managers:
            for pattern in manager["matchStrings"]:
                match = re.search(pattern.replace("(?<", "(?P<"), address)
                if match:
                    groups = match.groupdict()
                    repository = groups.get("depName", manager.get("depNameTemplate", ""))
                    for key, value in groups.items():
                        repository = repository.replace("{" * 2 + key + "}" * 2, value)
                    extracted.append((repository, groups["currentValue"]))
        assert len(extracted) == 1, "release URL is not unambiguously discoverable: " + address
        repository, version = extracted[0]
        versions.setdefault(repository, set()).add(version)
        with urllib.request.urlopen(address, timeout=60) as response:
            upstream = [resource for resource in yaml.safe_load_all(response.read()) if resource]
        for resource in upstream:
            identity = (resource["apiVersion"], resource["kind"], resource["metadata"].get("namespace", ""), resource["metadata"]["name"])
            assert identity not in expected, "duplicate upstream resource: " + str(identity)
            expected[identity] = resource
        print("PASS: discoverable upstream bundle", repository, version, address)
    result = subprocess.run(
        ["kubectl", "kustomize", "--load-restrictor", "LoadRestrictionsNone", str(path.parent)],
        capture_output=True, text=True,
    )
    if result.stderr:
        print(result.stderr)
    result.check_returncode()
    rendered = [resource for resource in yaml.safe_load_all(result.stdout) if resource]
    actual = {(resource["apiVersion"], resource["kind"], resource["metadata"].get("namespace", ""), resource["metadata"]["name"]) for resource in rendered}
    missing = expected.keys() - actual
    if path.parent.name == "tekton-triggers":
        missing.discard(("v1", "ConfigMap", "tekton-pipelines", "config-triggers-core-interceptors"))
    assert not missing, "upstream bundle resources omitted: " + str(missing)
    for resource in rendered:
        identity = (resource["apiVersion"], resource["kind"], resource["metadata"].get("namespace", ""), resource["metadata"]["name"])
        if resource["kind"] == "Deployment" and identity in expected:
            bundled = expected[identity]["spec"]["template"]["spec"]
            deployed = resource["spec"]["template"]["spec"]
            for section in ("containers", "initContainers"):
                assert {container["name"]: container["image"] for container in deployed.get(section, [])} == {container["name"]: container["image"] for container in bundled.get(section, [])}, "independent image override: " + str(identity)
        if resource["kind"] == "CustomResourceDefinition":
            for version in resource["spec"]["versions"]:
                if version["served"]:
                    schemas[(resource["spec"]["group"] + "/" + version["name"], resource["spec"]["names"]["kind"])] = version["schema"]["openAPIV3Schema"]
        print("PASS: rendered", *identity)
    if path.parent.name == "cert-manager":
        controller = next(resource for resource in rendered if resource["kind"] == "Deployment" and resource["metadata"]["name"] == "cert-manager")
        assert "--enable-gateway-api" in controller["spec"]["template"]["spec"]["containers"][0]["args"]
    if path.parent.name == "shipwright":
        for resource in rendered:
            if resource["kind"] == "CustomResourceDefinition":
                assert resource["metadata"]["annotations"]["cert-manager.io/inject-ca-from"] == "shipwright-build/shipwright-build-webhook-cert"
            if resource["kind"] == "Service" and resource["metadata"]["name"] == "shipwright-triggers":
                assert resource["spec"]["ports"][0]["port"] == 8080
                assert resource["spec"]["ports"][0]["targetPort"] == "webhook"
            if resource["kind"] == "Deployment" and resource["metadata"]["name"] == "shipwright-triggers":
                assert resource["spec"]["template"]["spec"]["containers"][0]["ports"][0]["containerPort"] == 8080

for repository, declared in versions.items():
    assert len(declared) == 1, "mixed release references: " + repository + " " + str(declared)
    print("PASS: coherent release", repository, *declared)
for path in sorted(Path("kubernetes").rglob("*.yaml")):
    for resource in yaml.safe_load_all(path.read_text()):
        if not isinstance(resource, dict):
            continue
        identity = (resource.get("apiVersion"), resource.get("kind"))
        if identity not in schemas:
            if any(kind == identity[1] and version.split("/")[0] == str(identity[0]).split("/")[0] for version, kind in schemas):
                raise AssertionError("unserved upstream CRD version: " + str(path) + " " + str(identity))
            continue
        jsonschema.Draft7Validator(schemas[identity]).validate(resource)
        print("PASS: upstream CRD contract", path, *identity)
result = subprocess.run(["kubectl", "kustomize", "kubernetes/clusters/saikat-kubernetes-cluster"], capture_output=True, text=True)
if result.stderr:
    print(result.stderr)
result.check_returncode()
for resource in yaml.safe_load_all(result.stdout):
    if resource:
        print("PASS: cluster entrypoint", resource["kind"], resource["metadata"]["name"])
'''

[check-api-versions]
description = "Fail if any manifest uses an apiVersion the cluster no longer serves (requires kubeconfig)"
run = '''
#!/usr/bin/env python3
import json
import re
import subprocess
import sys
from pathlib import Path

def declared_pairs():
    pairs = {}
    for path in sorted(Path("kubernetes").rglob("*.yaml")):
        if path.name.endswith(".sops.yaml"):
            continue
        text = path.read_text(errors="replace")
        for api_version, kind in zip(
            re.findall(r"^apiVersion:[ \t]*(\S+)[ \t]*$", text, re.M),
            re.findall(r"^kind:[ \t]*(\S+)[ \t]*$", text, re.M),
        ):
            group = api_version.split("/")[0] if "/" in api_version else ""
            if group != "kustomize.config.k8s.io":
                pairs.setdefault((api_version, kind), set()).add(str(path))
    return pairs

def served_pairs():
    served = set()
    definitions = json.loads(subprocess.run(
        ["kubectl", "get", "crd", "-o", "json"], capture_output=True, text=True, check=True,
    ).stdout)
    # ! Discovery lists only preferred CRD versions; read every served version from the CRD.
    for definition in definitions["items"]:
        specification = definition["spec"]
        for version in specification.get("versions", []):
            if version.get("served"):
                served.add((f"{specification['group']}/{version['name']}", specification["names"]["kind"]))
    resources = subprocess.run(
        ["kubectl", "api-resources", "--no-headers", "--verbs=list"],
        capture_output=True, text=True, check=True,
    ).stdout
    for line in resources.splitlines():
        fields = line.split()
        # * SHORTNAMES may be empty; NAMESPACED anchors the version and kind columns.
        if "true" not in fields and "false" not in fields:
            continue
        position = next(position for position, field in enumerate(fields) if field in ("true", "false"))
        if position >= 2:
            served.add((fields[position - 1], fields[position + 1]))
    return served

def main():
    declared = declared_pairs()
    served = served_pairs()
    missing = [(api_version, kind, sorted(files)) for (api_version, kind), files in sorted(declared.items()) if (api_version, kind) not in served]
    if not missing:
        print(f"OK: all {len(declared)} declared apiVersion+kind pairs are served")
        return 0
    print(f"OUTDATED API VERSIONS: {len(missing)} of {len(declared)} declared pairs are NOT served by the cluster.\n")
    for api_version, kind, files in missing:
        print(f"  {api_version}  ({kind})")
        for path in files:
            print(f"      {path}")
    print(
        "\nEach entry above will fail to apply. Check which versions the resource now serves:\n"
        "  kubectl get crd <crd> -o jsonpath='{range .spec.versions[*]}"
        "{.name} served={.served}{\"\\n\"}{end}'"
    )
    return 1

if __name__ == "__main__":
    sys.exit(main())
'''
