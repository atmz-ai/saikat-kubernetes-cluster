[infrastructure-release-checks]
description = "Render every upstream infrastructure bundle and validate release integrity and consumed CRD contracts"
depends = ["tekton-triggers-configuration-checks"]
run = '''
#!/usr/bin/env -S ./.venv/bin/python -u
import base64
import copy
import json
import re
import subprocess
import urllib.request
from pathlib import Path
from urllib.parse import urlparse

import jsonschema
import yaml
from jinja2 import Environment

configuration = json.loads(Path("renovate.json").read_text())
beszel_configuration = yaml.safe_load(Path("kubernetes/infrastructure/beszel/configmap.yaml").read_text())
node_configuration = yaml.safe_load(Path("ansible/inventory/group_vars/all/vars.yml").read_text())
beszel_routes = [resource for resource in yaml.safe_load_all(Path("kubernetes/networking/routes/beszel.yaml").read_text()) if resource]
beszel_hostname = urlparse(beszel_configuration["data"]["APP_URL"]).hostname
assert beszel_configuration["data"]["APP_URL"] == node_configuration["beszel_hub_url"]
assert beszel_configuration["data"]["DISABLE_PASSWORD_AUTH"] == "true"
assert beszel_configuration["data"].get("USER_CREATION", "false") == "false"
for scenario in ("complete", "retired-hostname-restored", "missing-new-hostname"):
    candidate = copy.deepcopy(beszel_routes)
    if scenario == "retired-hostname-restored":
        candidate[0]["spec"]["hostnames"].append("beszel.saikat.oleole.ai")
    elif scenario == "missing-new-hostname":
        candidate[0]["spec"]["hostnames"].remove(beszel_hostname)
    try:
        for route in candidate:
            assert route["spec"]["hostnames"] == [beszel_hostname], "Beszel must serve only the migrated hub origin"
        secure_route = next(route for route in candidate if route["metadata"]["name"] == "beszel")
        assert {parent["sectionName"] for parent in secure_route["spec"]["parentRefs"]} == {"https-saikat-dev"}
    except AssertionError:
        assert scenario != "complete", "Beszel domain migration is invalid"
        print("PASS: rejected Beszel migration regression", scenario)
    else:
        assert scenario == "complete", "missing Beszel endpoint accepted"
        print("PASS: Beszel UI and agent declarations use only the migrated hub origin")
agent_tasks = yaml.safe_load(Path("ansible/roles/beszel-agent/tasks/main.yml").read_text())
for scenario in ("complete", "missing-restart-flush"):
    candidate = [task for task in agent_tasks if scenario == "complete" or task.get("ansible.builtin.meta") != "flush_handlers"]
    restart_position = next((position for position, task in enumerate(candidate) if task.get("ansible.builtin.meta") == "flush_handlers"), -1)
    verification_position = next(position for position, task in enumerate(candidate) if task["name"] == "Confirm the agent is running")
    try:
        assert 0 <= restart_position < verification_position, "verify the restarted process, not the previous process"
    except AssertionError:
        assert scenario != "complete", "Beszel agent verifies configuration before restarting"
        print("PASS: rejected agent restart regression", scenario)
    else:
        assert scenario == "complete", "missing agent restart accepted"
        print("PASS: Beszel restart handlers run before process verification")
runtime_expression = next(task for task in agent_tasks if task["name"] == "Verify the running agent uses the declared hub URL")["ansible.builtin.assert"]["that"][0]
template_environment = Environment()
template_environment.filters["b64decode"] = lambda value: base64.b64decode(value).decode()
for scenario, contents, expected in (
    ("new-domain", "TOKEN=fixture\x00HUB_URL=https://beszel.saikat.dev\x00", True),
    ("old-domain", "TOKEN=fixture\x00HUB_URL=https://beszel.saikat.oleole.ai\x00", False),
    ("token-substring", "TOKEN=HUB_URL=https://beszel.saikat.dev\x00", False),
):
    encoded = base64.b64encode(contents.encode()).decode()
    result = template_environment.from_string("{" * 2 + " " + runtime_expression + " " + "}" * 2).render(
        beszel_hub_url="https://beszel.saikat.dev", beszel_agent_runtime_environment={"content": encoded}
    )
    assert (result == "True") == expected, "incorrect agent runtime URL verification: " + scenario
    print("PASS: agent runtime HUB_URL verification", scenario)
for filename in ("kubernetes/infrastructure/cilium/helmrelease.yaml", "ansible/manifests/cilium-values.yaml"):
    declaration = yaml.safe_load(Path(filename).read_text())
    values = declaration["spec"]["values"] if "spec" in declaration else declaration
    for scenario in ("complete", "ui-enabled", "relay-disabled"):
        candidate = copy.deepcopy(values["hubble"])
        if scenario == "ui-enabled":
            candidate["ui"]["enabled"] = True
        elif scenario == "relay-disabled":
            candidate["relay"]["enabled"] = False
        try:
            assert candidate["enabled"] and candidate["relay"]["enabled"] and candidate["metrics"]["enabled"], "Hubble observability must remain enabled"
            assert not candidate["ui"]["enabled"], "retired Hubble UI must remain disabled"
        except AssertionError:
            assert scenario != "complete", "invalid Hubble UI retirement: " + filename
            print("PASS: rejected Hubble retirement regression", filename, scenario)
        else:
            assert scenario == "complete", "invalid Hubble configuration accepted"
            print("PASS: Hubble UI retired while relay and metrics remain enabled", filename)
for application in ("grafana", "headlamp", "dashboard"):
    deployment = yaml.safe_load(Path("kubernetes/infrastructure/oauth2-proxy/deployment-" + application + ".yaml").read_text())
    allowlist = yaml.safe_load(Path("kubernetes/infrastructure/oauth2-proxy/" + application + "-allowed-emails.yaml").read_text())
    for scenario in ("complete", "legacy-google-group", "domain-bypasses-allowlist", "missing-email-file", "additional-user"):
        candidate = copy.deepcopy(deployment)
        emails = allowlist["data"]["allowed-emails"].splitlines()
        container = candidate["spec"]["template"]["spec"]["containers"][0]
        if scenario == "legacy-google-group":
            container["args"].append("--google-group=developer-admin@gobazzinga.io")
        elif scenario == "domain-bypasses-allowlist":
            container["args"].append("--email-domain=atmz.ai")
        elif scenario == "missing-email-file":
            candidate["spec"]["template"]["spec"]["volumes"] = []
        elif scenario == "additional-user":
            emails.append("another@atmz.ai")
        try:
            assert emails == ["saikat@atmz.ai"], application + " must admit only the operator"
            assert "--authenticated-emails-file=/etc/oauth2-proxy/allowed-emails" in container["args"]
            assert not any(argument.startswith(("--email-domain=", "--google-group=", "--google-admin-email=", "--google-service-account-json=")) for argument in container["args"]), "legacy checks or domain grants override the exact-email policy"
            volume = next((volume for volume in candidate["spec"]["template"]["spec"]["volumes"] if volume["name"] == "allowed-emails"), {})
            assert volume.get("configMap", {}).get("name") == allowlist["metadata"]["name"]
            assert {"name": "allowed-emails", "mountPath": "/etc/oauth2-proxy", "readOnly": True} in container["volumeMounts"]
        except AssertionError:
            assert scenario != "complete", application + " exact-email policy is invalid"
            print("PASS: rejected access regression", application, scenario)
        else:
            assert scenario == "complete", "overbroad or unusable policy accepted: " + application
            print("PASS: operator-only mounted allowlist", application)
dashboard_addresses = re.findall(r'href="(https://[^"]+)"', Path("kubernetes/apps/dashboard/index.html").read_text())
for scenario in ("complete", "dashboard-before-oauth-cutover"):
    candidate = list(dashboard_addresses)
    callbacks = []
    for name in ("grafana", "headlamp"):
        deployment = yaml.safe_load(Path("kubernetes/infrastructure/oauth2-proxy/deployment-" + name + ".yaml").read_text())
        arguments = deployment["spec"]["template"]["spec"]["containers"][0]["args"]
        callback = next(argument.split("=", 1)[1] for argument in arguments if argument.startswith("--redirect-url="))
        callbacks.append(urlparse(callback).hostname)
    if scenario == "dashboard-before-oauth-cutover":
        candidate = [address for address in candidate if urlparse(address).hostname != callbacks[0]]
        candidate.append("https://unconfigured.example.invalid")
    try:
        assert all(hostname in {urlparse(address).hostname for address in candidate} for hostname in callbacks), "dashboard link and OAuth callback hosts differ"
    except AssertionError:
        assert scenario != "complete", "dashboard promotes an unconfigured OAuth origin"
        print("PASS: rejected regression", scenario)
    else:
        assert scenario == "complete", "premature OAuth hostname cutover accepted"
        print("PASS: dashboard links preserve OAuth callback origins")
for workflow_path in sorted(Path(".github/workflows").glob("*.yml")):
    yaml.safe_load(workflow_path.read_text())
    print("PASS: workflow YAML syntax", workflow_path)
infrastructure_workflow = yaml.safe_load(Path(".github/workflows/infrastructure-releases.yml").read_text())
triggers = infrastructure_workflow.get("on", infrastructure_workflow.get(True))
assert "pull_request" in triggers
assert triggers["push"]["branches"] == ["main"]
print("PASS: PR checks run once while merged revisions still receive push checks")
tekton_template = "tektoncd/" + "{" * 2 + "project" + "}" * 2
managers = [manager for manager in configuration["customManagers"] if manager.get("datasourceTemplate") == "github-releases" and ("depNameTemplate" not in manager or manager.get("depNameTemplate") == tekton_template)]
versions = {}
schemas = {}
for path in sorted(Path("kubernetes/infrastructure").rglob("kustomization.yaml")):
    declaration = yaml.safe_load(path.read_text())
    addresses = [resource for resource in declaration.get("resources", []) if resource.startswith("https://")]
    if not addresses:
        continue
    expected = {}
    for address in addresses:
        extracted = []
        for manager in managers:
            for pattern in manager["matchStrings"]:
                match = re.search(pattern.replace("(?<", "(?P<"), address)
                if match:
                    groups = match.groupdict()
                    repository = groups.get("depName", manager.get("depNameTemplate", ""))
                    for key, value in groups.items():
                        repository = repository.replace("{" * 2 + key + "}" * 2, value)
                    extracted.append((repository, groups["currentValue"]))
        assert len(extracted) == 1, "release URL is not unambiguously discoverable: " + address
        repository, version = extracted[0]
        versions.setdefault(repository, set()).add(version)
        with urllib.request.urlopen(address, timeout=60) as response:
            upstream = [resource for resource in yaml.safe_load_all(response.read()) if resource]
        for resource in upstream:
            identity = (resource["apiVersion"], resource["kind"], resource["metadata"].get("namespace", ""), resource["metadata"]["name"])
            assert identity not in expected, "duplicate upstream resource: " + str(identity)
            expected[identity] = resource
        print("PASS: discoverable upstream bundle", repository, version, address)
    result = subprocess.run(
        ["kubectl", "kustomize", "--load-restrictor", "LoadRestrictionsNone", str(path.parent)],
        capture_output=True, text=True,
    )
    if result.stderr:
        print(result.stderr)
    result.check_returncode()
    rendered = [resource for resource in yaml.safe_load_all(result.stdout) if resource]
    actual = {(resource["apiVersion"], resource["kind"], resource["metadata"].get("namespace", ""), resource["metadata"]["name"]) for resource in rendered}
    missing = expected.keys() - actual
    if path.parent.name == "tekton-triggers":
        missing.discard(("v1", "ConfigMap", "tekton-pipelines", "config-triggers-core-interceptors"))
    assert not missing, "upstream bundle resources omitted: " + str(missing)
    for resource in rendered:
        identity = (resource["apiVersion"], resource["kind"], resource["metadata"].get("namespace", ""), resource["metadata"]["name"])
        if resource["kind"] == "Deployment" and identity in expected:
            bundled = expected[identity]["spec"]["template"]["spec"]
            deployed = resource["spec"]["template"]["spec"]
            for section in ("containers", "initContainers"):
                assert {container["name"]: container["image"] for container in deployed.get(section, [])} == {container["name"]: container["image"] for container in bundled.get(section, [])}, "independent image override: " + str(identity)
        if resource["kind"] == "CustomResourceDefinition":
            for version in resource["spec"]["versions"]:
                if version["served"]:
                    schemas[(resource["spec"]["group"] + "/" + version["name"], resource["spec"]["names"]["kind"])] = version["schema"]["openAPIV3Schema"]
        print("PASS: rendered", *identity)
    if path.parent.name == "cert-manager":
        controller = next(resource for resource in rendered if resource["kind"] == "Deployment" and resource["metadata"]["name"] == "cert-manager")
        assert "--enable-gateway-api" in controller["spec"]["template"]["spec"]["containers"][0]["args"]
    if path.parent.name == "shipwright":
        for resource in rendered:
            if resource["kind"] == "CustomResourceDefinition":
                assert resource["metadata"]["annotations"]["cert-manager.io/inject-ca-from"] == "shipwright-build/shipwright-build-webhook-cert"
            if resource["kind"] == "Service" and resource["metadata"]["name"] == "shipwright-triggers":
                assert resource["spec"]["ports"][0]["port"] == 8080
                assert resource["spec"]["ports"][0]["targetPort"] == "webhook"
            if resource["kind"] == "Deployment" and resource["metadata"]["name"] == "shipwright-triggers":
                assert resource["spec"]["template"]["spec"]["containers"][0]["ports"][0]["containerPort"] == 8080

for repository, declared in versions.items():
    assert len(declared) == 1, "mixed release references: " + repository + " " + str(declared)
    print("PASS: coherent release", repository, *declared)

for path in sorted(Path("kubernetes").rglob("*.yaml")):
    for resource in yaml.safe_load_all(path.read_text()):
        if not isinstance(resource, dict):
            continue
        identity = (resource.get("apiVersion"), resource.get("kind"))
        if identity not in schemas:
            if any(kind == identity[1] and version.split("/")[0] == str(identity[0]).split("/")[0] for version, kind in schemas):
                raise AssertionError("unserved upstream CRD version: " + str(path) + " " + str(identity))
            continue
        jsonschema.Draft7Validator(schemas[identity]).validate(resource)
        print("PASS: upstream CRD contract", path, *identity)

result = subprocess.run(["kubectl", "kustomize", "kubernetes/clusters/saikat-kubernetes-cluster"], capture_output=True, text=True)
if result.stderr:
    print(result.stderr)
result.check_returncode()
for resource in yaml.safe_load_all(result.stdout):
    if resource:
        print("PASS: cluster entrypoint", resource["kind"], resource["metadata"]["name"])
'''

[tekton-triggers-configuration-checks]
description = "Validate Tekton release alignment and independently reconcilable startup configuration"
run = '''
#!/usr/bin/env -S ./.venv/bin/python -u
import copy
import subprocess
import urllib.request
from pathlib import Path

import yaml

resources = []
for directory in ("tekton-triggers", "tekton-triggers/config"):
    result = subprocess.run(
        ["kubectl", "kustomize", "kubernetes/infrastructure/" + directory],
        capture_output=True, text=True,
    )
    if result.stderr:
        print(result.stderr)
    result.check_returncode()
    rendered = [resource for resource in yaml.safe_load_all(result.stdout) if resource]
    if directory.endswith("/config"):
        assert all(resource["kind"] == "ConfigMap" for resource in rendered)
    resources.extend(rendered)
    print("PASS: rendered", directory)

lookup = {(resource["kind"], resource["metadata"]["name"]): resource for resource in resources}
assert len(lookup) == len(resources), "duplicate configuration ownership"
version = lookup[("ConfigMap", "triggers-info")]["data"]["version"]
for name in ("release.yaml", "interceptors.yaml"):
    address = "https://infra.tekton.dev/tekton-releases/triggers/previous/" + version + "/" + name
    with urllib.request.urlopen(address, timeout=30) as response:
        official = [resource for resource in yaml.safe_load_all(response.read()) if resource]
    for resource in official:
        identity = (resource["kind"], resource["metadata"]["name"])
        assert lookup[identity] == resource, "release drift: " + str(identity)
        print("PASS: official", version, *identity)

for scenario in ("complete", "missing-startup-config", "old-eventlistener-image"):
    candidate = copy.deepcopy(lookup)
    if scenario == "missing-startup-config":
        del candidate[("ConfigMap", "config-triggers-core-interceptors")]
    controller = candidate[("Deployment", "tekton-triggers-controller")]["spec"]["template"]["spec"]["containers"][0]
    if scenario == "old-eventlistener-image":
        controller["args"][controller["args"].index("-el-image") + 1] = "ghcr.io/tektoncd/triggers/eventlistenersink-7ad1faa98cddbcb0c24990303b220bb8:v0.36.0"
    try:
        assert ("ConfigMap", "config-triggers-core-interceptors") in candidate
        listener_image = controller["args"][controller["args"].index("-el-image") + 1]
        assert listener_image.split(":")[-2] == version + "@sha256"
    except AssertionError:
        assert scenario != "complete", "valid configuration rejected"
        print("PASS: rejected regression", scenario)
    else:
        assert scenario == "complete", "broken configuration accepted: " + scenario
        print("PASS: complete startup configuration and matching EventListener image")

cluster = Path("kubernetes/clusters/saikat-kubernetes-cluster")
entrypoint = yaml.safe_load((cluster / "kustomization.yaml").read_text())
assert "infrastructure-tekton-triggers-config.yaml" in entrypoint["resources"]
configuration = yaml.safe_load((cluster / "infrastructure-tekton-triggers-config.yaml").read_text())
triggers = yaml.safe_load((cluster / "infrastructure-tekton-triggers.yaml").read_text())
assert configuration["spec"]["path"] == "./kubernetes/infrastructure/tekton-triggers/config"
assert {"name": configuration["metadata"]["name"]} in triggers["spec"]["dependsOn"]
assert {"name": "infrastructure-tekton-triggers"} not in configuration["spec"]["dependsOn"]
print("PASS: startup configuration reconciles before, and independently of, admission resources")

result = subprocess.run(["kubectl", "kustomize", "kubernetes/apps/my-website"], capture_output=True, text=True)
if result.stderr:
    print(result.stderr)
result.check_returncode()
website_resources = [resource for resource in yaml.safe_load_all(result.stdout) if resource]
for scenario in ("complete", "missing-trigger-clusterrole"):
    candidate = [resource for resource in website_resources if scenario == "complete" or resource["kind"] != "ClusterRole"]
    roles = {resource["metadata"]["name"] for resource in candidate if resource["kind"] == "ClusterRole"}
    bindings = [resource for resource in candidate if resource["kind"] == "ClusterRoleBinding"]
    assert bindings, "website trigger bindings must be validated"
    try:
        for binding in bindings:
            assert binding["roleRef"]["name"] in roles, "undefined trigger ClusterRole: " + binding["roleRef"]["name"]
    except AssertionError:
        assert scenario != "complete", "website depends on a retired application's ClusterRole"
        print("PASS: rejected regression", scenario)
    else:
        assert scenario == "complete", "missing trigger permissions accepted"
        print("PASS: website owns every referenced trigger ClusterRole")

event_listener = next(resource for resource in website_resources if resource["kind"] == "EventListener")
interceptors = event_listener["spec"]["triggers"][0]["interceptors"]
signing_secrets = {resource["metadata"]["name"]: resource for resource in website_resources if resource["kind"] == "Secret"}
for scenario in ("complete", "unsigned-listener", "missing-signing-secret-reference", "verification-after-filter"):
    candidate = copy.deepcopy(interceptors)
    if scenario == "unsigned-listener":
        candidate = [interceptor for interceptor in candidate if interceptor["ref"]["name"] != "github"]
    elif scenario == "missing-signing-secret-reference":
        candidate[0]["params"] = [parameter for parameter in candidate[0]["params"] if parameter["name"] != "secretRef"]
    elif scenario == "verification-after-filter":
        candidate.reverse()
    try:
        assert candidate[0]["ref"]["name"] == "github", "signature verification must precede CEL filtering"
        parameters = {parameter["name"]: parameter["value"] for parameter in candidate[0]["params"]}
        reference = parameters.get("secretRef", {})
        assert reference.get("secretName") in signing_secrets, "signing secret is missing"
        secret = signing_secrets[reference["secretName"]]
        assert reference.get("secretKey") in secret.get("stringData", secret.get("data", {})), "signing secret key is missing"
        assert parameters.get("eventTypes") == ["push"], "only signed push events may reach the build filter"
    except AssertionError:
        assert scenario != "complete", "website build listener is not configured to verify GitHub signatures"
        print("PASS: rejected regression", scenario)
    else:
        assert scenario == "complete", "invalid signature-verification configuration accepted"
        print("PASS: website verifies signatures before filtering against its declared signing secret")
'''

