[kafka-manifests-check]
description = "Validate Kafka, Connect, and Bridge placement and preserve replica counts and persistent storage"
run = '''
./.venv/bin/python - <<'PY'
import pathlib, yaml
def load(path):
  return list(yaml.safe_load_all(pathlib.Path(path).read_text()))
pool = next(document for document in load('kubernetes/infrastructure/kafka/kafka.yaml') if document['kind'] == 'KafkaNodePool')
connect = next(document for document in load('kubernetes/infrastructure/kafka-connect/connect.yaml') if document['kind'] == 'KafkaConnect')
bridge = next(document for document in load('kubernetes/infrastructure/kafka-bridge/kafka-bridge.yaml') if document['kind'] == 'KafkaBridge')
for affinity, topology_key in [
  (pool['spec']['template']['pod']['affinity'], 'topology.kubernetes.io/zone'),
  (connect['spec']['template']['pod']['affinity'], 'kubernetes.io/hostname'),
]:
  assert 'nodeAffinity' not in affinity
  assert affinity['podAntiAffinity']['preferredDuringSchedulingIgnoredDuringExecution'][0]['podAffinityTerm']['topologyKey'] == topology_key
assert 'nodeAffinity' not in bridge['spec'].get('template', {}).get('pod', {}).get('affinity', {})
assert pool['spec']['replicas'] == 3
assert pool['spec']['storage'] == {'type': 'persistent-claim', 'size': '250Gi', 'class': 'longhorn-1replica', 'deleteClaim': True}
assert connect['spec']['replicas'] == 2
assert bridge['spec']['replicas'] == 1
print('Verified unrestricted regional placement and preserved replica counts and persistent storage.')
PY
'''

[rustfs-manifests-check]
description = "Parse RustFS manifests and verify the pinned chart renders the expected storage claims"
run = '''
./.venv/bin/python - <<'PY'
import pathlib, subprocess, tempfile, yaml
directory = pathlib.Path('kubernetes/infrastructure/rustfs')
for path in directory.glob('*.yaml'):
  list(yaml.safe_load_all(path.read_text()))
  print(f'Parsed {path}')
import json
from jinja2.nativetypes import NativeEnvironment
template_environment = NativeEnvironment()
template_environment.filters['from_json'] = json.loads
removal_tasks = yaml.safe_load(pathlib.Path('ansible/roles/node-remove/tasks/main.yml').read_text())
storage_guard = next(task for task in removal_tasks if task['name'] == 'Refuse removal of a node with bound RustFS local storage')
for persistent_volumes in [[], [{'metadata': {'name': 'rustfs-azure-1-disk-0'}}]]:
  rendered_loop = template_environment.from_string(storage_guard['loop']).render(node_remove_persistent_volumes={'stdout': json.dumps({'items': persistent_volumes})})
  assert rendered_loop == persistent_volumes
  assert not callable(rendered_loop)
print('Verified node-removal storage guard reads JSON items, including an empty list.')
cleanup_tasks = yaml.safe_load(pathlib.Path('ansible/roles/node-remove/tasks/cleanup.yml').read_text())
assert cleanup_tasks[0]['ansible.builtin.command']['cmd'].startswith('kubeadm reset phase cleanup-node ')
assert next(index for index, task in enumerate(cleanup_tasks) if 'ansible.builtin.wait_for' in task) < next(index for index, task in enumerate(cleanup_tasks) if 'ansible.builtin.file' in task)
assert all('failed_when' not in task and 'ignore_unreachable' not in task for task in cleanup_tasks)
assert any(task.get('ansible.builtin.include_tasks') == 'cleanup.yml' for task in removal_tasks)
print('Verified container cleanup precedes configuration deletion and failures are not ignored.')
release = list(yaml.safe_load_all((directory / 'helmrelease.yaml').read_text()))[1]
with tempfile.TemporaryDirectory() as temporary:
  archive = pathlib.Path(temporary) / 'rustfs.tgz'
  subprocess.run(['curl', '--fail', '--location', 'https://charts.rustfs.com/rustfs-1.0.1.tgz', '--output', str(archive)], check=True)
  values = pathlib.Path(temporary) / 'values.yaml'
  values.write_text(yaml.safe_dump(release['spec']['values']))
  rendered = subprocess.run(['helm', 'template', 'rustfs', str(archive), '--namespace', 'rustfs', '-f', str(values)], text=True, capture_output=True, check=True)
  print(rendered.stdout)
  print(rendered.stderr)
  documents = list(yaml.safe_load_all(rendered.stdout))
  authorization = list(yaml.safe_load_all((directory / 'google-authorization.yaml').read_text()))
  documents.extend(authorization)
  import json
  policy = json.loads(next(document for document in authorization if document['kind'] == 'ConfigMap')['data']['policy.json'])
  for statement in policy['Statement']:
    operator = 'StringEquals' if statement['Effect'] == 'Allow' else 'StringNotEquals'
    assert statement['Condition'] == {operator: {'jwt:email': 'saikat@atmz.ai'}}
    assert len({action.split(':')[0] for action in statement['Action']}) == 1
  for family in ['admin', 'kms', 's3', 'sts']:
    assert {statement['Effect'] for statement in policy['Statement'] if statement['Action'][0].startswith(family + ':')} == {'Allow', 'Deny'}
  console_service = next(document for document in authorization if document['kind'] == 'Service')
  assert console_service['spec']['selector'] == {'statefulset.kubernetes.io/pod-name': 'rustfs-0'}
  statefulset = next(document for document in documents if document and document['kind'] == 'StatefulSet')
  environment = {entry['name']: entry for entry in statefulset['spec']['template']['spec']['containers'][0]['env']}
  assert environment['RUSTFS_IDENTITY_OPENID_ROLE_POLICY_google']['value'] == 'google-saikat-administrator'
  assert environment['RUSTFS_IDENTITY_OPENID_CLIENT_SECRET_google']['valueFrom']['secretKeyRef'] == {'name': 'rustfs-google-oauth', 'key': 'client-secret'}
  assert statefulset['metadata']['name'] == 'rustfs'
  assert statefulset['spec']['replicas'] == 3
  assert [claim['metadata']['name'] for claim in statefulset['spec']['volumeClaimTemplates']] == ['data']
  for route in yaml.safe_load_all((directory / 'route.yaml').read_text()):
    for rule in route['spec']['rules']:
      for backend in rule.get('backendRefs', []):
        assert any(document and document['kind'] == 'Service' and document['metadata']['name'] == backend['name'] and any(port['port'] == backend['port'] for port in document['spec']['ports']) for document in documents)
  print('Verified three replicas and data-only claims.')
PY
'''

