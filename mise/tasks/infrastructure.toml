[dns-generate]
description = "Regenerate the PowerDNS zone artifacts from the pdns_zones list (ansible/inventory/group_vars/all/vars.yml)"
run = "./.venv/bin/ansible-playbook ansible/playbooks/operations/update-dns-zone-config.yml"

[backup-configuration-checks]
description = "Regression-check backup manifests, pinned charts, recovery schemas, and deployment dependencies"
run = '''
#!/usr/bin/env -S ./.venv/bin/python -u
import json
import re
import subprocess
import tempfile
from pathlib import Path

import jsonschema
import yaml

rendered = {}
for owner in ("rustfs", "velero", "longhorn", "longhorn-backup", "cloudnative-pg", "harbor", "external-dns"):
    result = subprocess.run(
        ["kubectl", "kustomize", "--load-restrictor", "LoadRestrictionsNone", "kubernetes/infrastructure/" + owner],
        capture_output=True, text=True,
    )
    if result.stderr:
        print(result.stderr)
    result.check_returncode()
    rendered[owner] = [resource for resource in yaml.safe_load_all(result.stdout) if resource]
    print("PASS: rendered", owner)

assert not rendered["velero"]
print("PASS: Velero retirement resource set is empty")

for owner in ("longhorn-backup",):
    declaration = yaml.safe_load(Path("kubernetes/infrastructure", owner, "kustomization.yaml").read_text())
    assert declaration["patches"][0]["path"] == "../loki/loki-rustfs-credentials.sops.yaml"
    secret_name = "longhorn-rustfs-credentials"
    secret = next(resource for resource in rendered[owner] if resource["kind"] == "Secret" and resource["metadata"]["name"] == secret_name)
    assert {"AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"} <= set(secret["stringData"])
    print("PASS:", owner, "decrypts shared credentials before authenticated key renaming")

jobs = [resource for resource in rendered["longhorn-backup"] if resource["kind"] == "RecurringJob"]
backup = next(job for job in jobs if job["spec"]["task"] == "backup")
assert backup["spec"]["cron"] == "0 2 * * *"
assert backup["spec"]["retain"] == 7
assert all(job["spec"]["task"] not in ("snapshot", "snapshot-force-create", "snapshot-delete") for job in jobs)
assert next(job for job in jobs if job["spec"]["task"] == "snapshot-cleanup")["spec"]["retain"] == 0
target = next(resource for resource in rendered["longhorn-backup"] if resource["kind"] == "BackupTarget" and resource["metadata"]["name"] == "default")
settings = next(resource for resource in rendered["longhorn"] if resource["kind"] == "HelmRelease")["spec"]["values"]["defaultSettings"]
assert target["spec"]["backupTargetURL"] == settings["backupTarget"]
assert target["spec"]["credentialSecret"] == settings["backupTargetCredentialSecret"]
print("PASS: Longhorn daily S3 backups retain recovery points without a local snapshot-history job")

provisioner = next(resource for resource in rendered["rustfs"] if resource["kind"] == "Job" and resource["metadata"]["name"] == "rustfs-cluster-backup-buckets-1")
script = provisioner["spec"]["template"]["spec"]["containers"][0]["args"][0]
subprocess.run(["sh", "-n"], input=script, text=True, check=True)
buckets = set(re.findall(r"saikat-kubernetes-cluster-[a-z-]+", script))
assert len(buckets) == 2 and all(3 <= len(bucket) <= 63 for bucket in buckets)
assert target["spec"]["backupTargetURL"].split("/")[2].split("@")[0] in buckets
print("PASS: bucket names, provisioner syntax, and backup destinations agree")

with tempfile.TemporaryDirectory(prefix="backup-chart-checks-") as directory:
    charts = (
        ("plugin-barman-cloud", "https://github.com/cloudnative-pg/charts/releases/download/plugin-barman-cloud-v0.8.1/plugin-barman-cloud-0.8.1.tgz", "cnpg-system", "plugin-barman-cloud-0.8.1.tgz"),
    )
    for name, url, namespace, filename in charts:
        subprocess.run(
            ["curl", "--fail", "--location", "--retry", "3", "--connect-timeout", "15", "--max-time", "180", "--output", str(Path(directory, filename)), url],
            check=True,
        )
        for enabled in (True,):
            chart_values = {}
            result = subprocess.run(
                ["helm", "template", name, str(Path(directory, filename)), "--namespace", namespace, "--include-crds", "-f", "-"],
                input=json.dumps(chart_values), capture_output=True, text=True,
            )
            if result.stderr:
                print(result.stderr)
            result.check_returncode()
            chart_resources = [resource for resource in yaml.safe_load_all(result.stdout) if resource]
            if name == "plugin-barman-cloud":
                definition = next(resource for resource in chart_resources if resource["kind"] == "CustomResourceDefinition" and resource["metadata"]["name"] == "objectstores.barmancloud.cnpg.io")
                schema = next(version for version in definition["spec"]["versions"] if version["name"] == "v1")["schema"]["openAPIV3Schema"]
                destinations = []
                for owner, application_role in (("harbor", "harbor"), ("external-dns", "pdns")):
                    cluster = next(resource for resource in rendered[owner] if resource["kind"] == "Cluster")
                    store = next(resource for resource in rendered[owner] if resource["kind"] == "ObjectStore")
                    scheduled = next(resource for resource in rendered[owner] if resource["kind"] == "ScheduledBackup")
                    jsonschema.validate(store, schema)
                    assert cluster["spec"]["plugins"][0]["isWALArchiver"] is True
                    assert cluster["spec"]["plugins"][0]["parameters"]["barmanObjectName"] == store["metadata"]["name"]
                    assert scheduled["spec"]["cluster"]["name"] == cluster["metadata"]["name"]
                    assert scheduled["spec"]["method"] == "plugin" and len(scheduled["spec"]["schedule"].split()) == 6
                    assert cluster["spec"]["bootstrap"]["initdb"]["owner"] == application_role
                    assert not cluster["spec"].get("enableSuperuserAccess", False)
                    destination = store["spec"]["configuration"]["destinationPath"]
                    assert destination.split("/")[2] in buckets
                    destinations.append(destination)
                    print("PASS:", owner, "published ObjectStore schema, daily base backup, WAL archiving, and application role")
                assert len(set(destinations)) == 2

graph = {}
for path in Path("kubernetes/clusters/yral-k8s").glob("*.yaml"):
    for resource in yaml.safe_load_all(path.read_text()):
        if resource and resource.get("apiVersion", "").startswith("kustomize.toolkit.fluxcd.io/"):
            graph[resource["metadata"]["name"]] = [dependency["name"] for dependency in resource.get("spec", {}).get("dependsOn", [])]
for starting in graph:
    pending = [(starting, [])]
    while pending:
        current, ancestry = pending.pop()
        assert current not in ancestry, "Dependency cycle: " + " -> ".join(ancestry + [current])
        pending.extend((dependency, ancestry + [current]) for dependency in graph.get(current, []))
print("PASS: Flux backup dependencies have no cycles")
'''

# ── API version hygiene ─────────────────────────────────────────────────────
# Report manifests whose apiVersion+kind the cluster no longer SERVES.
#
# Why this exists: whether an apiVersion is served is decided by the CRD that
# defines it, and a channel/version change can silently stop serving a version we
# still use. Not hypothetical — switching the Gateway API CRDs from the
# experimental to the standard channel dropped `v1alpha2`, and every Kafka
# TLSRoute using it stopped applying with "the server could not find the
# requested resource". Version strings are no signal on their own: `v1alpha1`
# looks old but is correct for Tekton's ClusterInterceptor, which serves it and
# nothing else.
#
# Sources of truth, and why the obvious one is wrong:
#   CRDs               -> spec.versions[].served   (authoritative)
#   built-in resources -> kubectl api-resources    (authoritative for these)
#   NOT api-resources for CRDs: it lists only the PREFERRED version per resource,
#   so a CRD serving both v1 and v1beta1 (ReferenceGrant) reports only v1, and
#   every v1beta1 manifest becomes a false positive.
#
# Deliberately dependency-free (stdlib only, regex rather than a YAML parser):
# apiVersion/kind are top-level scalars, so regex is safe, and PyYAML is NOT
# guaranteed — the workflow installs only mise plus the root .venv.
#
# Requires a working kubeconfig (`mise run bootstrap` extracts it from the vault).
# Read-only: `kubectl get crd` and `kubectl api-resources` only.
[check-api-versions]
description = "Fail if any manifest uses an apiVersion the cluster no longer serves (requires kubeconfig)"
run = '''
#!/usr/bin/env python3
"""Fail if any manifest uses an apiVersion the cluster no longer serves."""
import json
import re
import subprocess
import sys
from pathlib import Path

MANIFEST_ROOT = Path("kubernetes")

# apiVersions consumed by tooling, not applied to the API server.
NON_RESOURCE_GROUPS = {"kustomize.config.k8s.io"}

# Top-level `apiVersion:` / `kind:` only — column 0, no leading whitespace.
# That is what keeps this safe without a YAML parser.
API_VERSION_RE = re.compile(r"^apiVersion:[ \t]*(\S+)[ \t]*$", re.M)
KIND_RE = re.compile(r"^kind:[ \t]*(\S+)[ \t]*$", re.M)


def declared_pairs():
    """(apiVersion, kind) -> set of files, from manifests under kubernetes/."""
    pairs = {}
    for path in sorted(MANIFEST_ROOT.rglob("*.yaml")):
        # SOPS files are ciphertext; their apiVersion/kind are opaque blobs.
        if path.name.endswith(".sops.yaml"):
            continue
        text = path.read_text(errors="replace")
        # Pair positionally: within a document they appear apiVersion then kind.
        for api_version, kind in zip(
            API_VERSION_RE.findall(text), KIND_RE.findall(text)
        ):
            group = api_version.split("/")[0] if "/" in api_version else ""
            if group in NON_RESOURCE_GROUPS:
                continue
            pairs.setdefault((api_version, kind), set()).add(str(path))
    return pairs


def served_pairs():
    """Every (apiVersion, kind) the cluster serves."""
    served = set()

    crds = json.loads(
        subprocess.run(
            ["kubectl", "get", "crd", "-o", "json"],
            capture_output=True, text=True, check=True,
        ).stdout
    )
    for crd in crds["items"]:
        spec = crd["spec"]
        kind = spec["names"]["kind"]
        for version in spec.get("versions", []):
            if version.get("served"):
                served.add((f"{spec['group']}/{version['name']}", kind))

    resources = subprocess.run(
        ["kubectl", "api-resources", "--no-headers", "--verbs=list"],
        capture_output=True, text=True, check=True,
    ).stdout
    for line in resources.splitlines():
        # Columns are whitespace-padded and SHORTNAMES can be EMPTY (e.g.
        # `secrets`), so positional splitting misreads the row. NAMESPACED is
        # always literally true/false and sits immediately before KIND, with
        # APIVERSION immediately before it — anchor on that instead.
        fields = line.split()
        if "true" not in fields and "false" not in fields:
            continue
        idx = next(i for i, f in enumerate(fields) if f in ("true", "false"))
        if idx >= 2:
            served.add((fields[idx - 1], fields[idx + 1]))

    return served


def main():
    declared = declared_pairs()
    served = served_pairs()
    missing = [
        (api_version, kind, sorted(files))
        for (api_version, kind), files in sorted(declared.items())
        if (api_version, kind) not in served
    ]

    if not missing:
        print(f"OK: all {len(declared)} declared apiVersion+kind pairs are served")
        return 0

    print(
        f"OUTDATED API VERSIONS: {len(missing)} of {len(declared)} declared "
        "pairs are NOT served by the cluster.\n"
    )
    for api_version, kind, files in missing:
        print(f"  {api_version}  ({kind})")
        for path in files:
            print(f"      {path}")
    print(
        "\nEach entry above will fail to apply. Check which versions the "
        "resource now serves:\n"
        "  kubectl get crd <crd> -o jsonpath='{range .spec.versions[*]}"
        "{.name} served={.served}{\"\\n\"}{end}'"
    )
    return 1


if __name__ == "__main__":
    sys.exit(main())
'''
