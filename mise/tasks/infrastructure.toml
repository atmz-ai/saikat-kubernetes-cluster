                    jsonschema.validate(store, schema)
                    assert cluster["spec"]["plugins"][0]["isWALArchiver"] is True
                    assert cluster["spec"]["plugins"][0]["parameters"]["barmanObjectName"] == store["metadata"]["name"]
                    assert scheduled["spec"]["cluster"]["name"] == cluster["metadata"]["name"]
                    assert scheduled["spec"]["method"] == "plugin" and len(scheduled["spec"]["schedule"].split()) == 6
                    assert not scheduled["spec"].get("immediate", False)
                    labels = cluster["spec"]["inheritedMetadata"]["labels"]
                    assert labels["recurring-job.longhorn.io/source"] == "enabled"
                    assert labels["recurring-job-group.longhorn.io/default"] == "disabled"
                    assert labels["recurring-job.longhorn.io/postgresql-snapshot-cleanup"] == "enabled"
                    assert cluster["spec"]["bootstrap"]["initdb"]["owner"] == application_role
                    assert not cluster["spec"].get("enableSuperuserAccess", False)
                    destination = store["spec"]["configuration"]["destinationPath"]
                    assert destination.split("/")[2] in buckets
                    destinations.append(destination)
                    print("PASS:", owner, "published ObjectStore schema, daily base backup, WAL archiving, and application role")
                assert len(set(destinations)) == 2

graph = {}
for path in Path("kubernetes/clusters/yral-k8s").glob("*.yaml"):
    for resource in yaml.safe_load_all(path.read_text()):
        if resource and resource.get("apiVersion", "").startswith("kustomize.toolkit.fluxcd.io/"):
            graph[resource["metadata"]["name"]] = [dependency["name"] for dependency in resource.get("spec", {}).get("dependsOn", [])]
for starting in graph:
    pending = [(starting, [])]
    while pending:
        current, ancestry = pending.pop()
        assert current not in ancestry, "Dependency cycle: " + " -> ".join(ancestry + [current])
        pending.extend((dependency, ancestry + [current]) for dependency in graph.get(current, []))
print("PASS: Flux backup dependencies have no cycles")
