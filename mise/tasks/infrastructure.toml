[tekton-triggers-configuration-checks]
description = "Validate Tekton release alignment and independently reconcilable startup configuration"
run = '''
#!/usr/bin/env -S ./.venv/bin/python -u
import copy
import subprocess
import urllib.request
from pathlib import Path

import yaml

resources = []
for directory in ("tekton-triggers", "tekton-triggers/config"):
    result = subprocess.run(
        ["kubectl", "kustomize", "kubernetes/infrastructure/" + directory],
        capture_output=True, text=True,
    )
    if result.stderr:
        print(result.stderr)
    result.check_returncode()
    rendered = [resource for resource in yaml.safe_load_all(result.stdout) if resource]
    if directory.endswith("/config"):
        assert all(resource["kind"] == "ConfigMap" for resource in rendered)
    resources.extend(rendered)
    print("PASS: rendered", directory)

lookup = {(resource["kind"], resource["metadata"]["name"]): resource for resource in resources}
assert len(lookup) == len(resources), "duplicate configuration ownership"
version = lookup[("ConfigMap", "triggers-info")]["data"]["version"]
for name in ("release.yaml", "interceptors.yaml"):
    address = "https://infra.tekton.dev/tekton-releases/triggers/previous/" + version + "/" + name
    with urllib.request.urlopen(address, timeout=30) as response:
        official = [resource for resource in yaml.safe_load_all(response.read()) if resource]
    for resource in official:
        identity = (resource["kind"], resource["metadata"]["name"])
        assert lookup[identity] == resource, "release drift: " + str(identity)
        print("PASS: official", version, *identity)

for scenario in ("complete", "missing-startup-config", "old-eventlistener-image"):
    candidate = copy.deepcopy(lookup)
    if scenario == "missing-startup-config":
        del candidate[("ConfigMap", "config-triggers-core-interceptors")]
    controller = candidate[("Deployment", "tekton-triggers-controller")]["spec"]["template"]["spec"]["containers"][0]
    if scenario == "old-eventlistener-image":
        controller["args"][controller["args"].index("-el-image") + 1] = "ghcr.io/tektoncd/triggers/eventlistenersink-7ad1faa98cddbcb0c24990303b220bb8:v0.36.0"
    try:
        assert ("ConfigMap", "config-triggers-core-interceptors") in candidate
        listener_image = controller["args"][controller["args"].index("-el-image") + 1]
        assert listener_image.split(":")[-2] == version + "@sha256"
    except AssertionError:
        assert scenario != "complete", "valid configuration rejected"
        print("PASS: rejected regression", scenario)
    else:
        assert scenario == "complete", "broken configuration accepted: " + scenario
        print("PASS: complete startup configuration and matching EventListener image")

cluster = Path("kubernetes/clusters/yral-k8s")
entrypoint = yaml.safe_load((cluster / "kustomization.yaml").read_text())
assert "infrastructure-tekton-triggers-config.yaml" in entrypoint["resources"]
configuration = yaml.safe_load((cluster / "infrastructure-tekton-triggers-config.yaml").read_text())
triggers = yaml.safe_load((cluster / "infrastructure-tekton-triggers.yaml").read_text())
assert configuration["spec"]["path"] == "./kubernetes/infrastructure/tekton-triggers/config"
assert {"name": configuration["metadata"]["name"]} in triggers["spec"]["dependsOn"]
assert {"name": "infrastructure-tekton-triggers"} not in configuration["spec"]["dependsOn"]
print("PASS: startup configuration reconciles before, and independently of, admission resources")
'''

[event-archive-configuration-checks]
description = "Validate the new-events-only archive destination, runtime credentials, and bucket provisioning"
run = '''
#!/usr/bin/env -S ./.venv/bin/python -u
import os
from pathlib import Path
import subprocess
import yaml

connector = yaml.safe_load(Path("kubernetes/infrastructure/kafka-connect/connector-event-archive.yaml").read_text())
configuration = connector["spec"]["config"]
assert connector["metadata"]["name"] == "enriched-event-archive"
assert configuration["consumer.override.auto.offset.reset"] == "latest"
assert configuration["s3.bucket.name"] == "enriched-event-archive"
assert configuration["store.url"] == "http://rustfs-svc.rustfs.svc.cluster.local:9000"
assert configuration["aws.access.key.id"] == "${secrets:rustfs/rustfs-credentials:RUSTFS_ACCESS_KEY}"
assert configuration["aws.secret.access.key"] == "${secrets:rustfs/rustfs-credentials:RUSTFS_SECRET_KEY}"
assert configuration["format.bytearray.extension"] == ".txt"
assert configuration["format.bytearray.separator"] == "\n"
assert configuration["rotate.schedule.interval.ms"] == "300000"
print("PASS: generic archive receives new events without replaying historical offsets or embedding credentials")

worker = yaml.safe_load(Path("kubernetes/infrastructure/kafka-connect/connect.yaml").read_text())
assert "connectContainer" not in worker["spec"]["template"]
assert not Path("kubernetes/infrastructure/kafka-connect/connector-s3-sink.yaml").exists()
assert worker["spec"]["config"]["config.providers"] == "secrets"
assert "config.providers.env.class" not in worker["spec"]["config"]
assert worker["spec"]["config"]["config.providers.secrets.class"] == "io.strimzi.kafka.KubernetesSecretConfigProvider"
credentials = yaml.safe_load(Path("kubernetes/infrastructure/kafka-connect/connect-credentials.sops.yaml").read_text())
assert set(credentials["stringData"]) == {"kafka-connect-password", "kafka-connect-jaas-config"}
assert all(value.startswith("ENC[") for value in credentials["stringData"].values())
assert worker["spec"]["authentication"]["passwordSecret"] == {"secretName": "connect-credentials", "password": "kafka-connect-password"}
print("PASS: retired environment credentials are absent and encrypted Kafka authentication is retained")
role, binding = yaml.safe_load_all(Path("kubernetes/infrastructure/rustfs/event-archive-credentials-access.yaml").read_text())
assert role["rules"] == [{"apiGroups": [""], "resources": ["secrets"], "resourceNames": ["rustfs-credentials"], "verbs": ["get"]}]
assert binding["subjects"] == [{"kind": "ServiceAccount", "name": "connect-cluster-connect", "namespace": "kafka-connect"}]
assert binding["roleRef"]["name"] == role["metadata"]["name"]
deployment = yaml.safe_load(Path("kubernetes/clusters/yral-k8s/infrastructure-kafka-connect.yaml").read_text())
assert {"name": "infrastructure-rustfs"} in deployment["spec"]["dependsOn"]
print("PASS: runtime Secret access is scoped and bucket provisioning precedes connector deployment")

job = yaml.safe_load(Path("kubernetes/infrastructure/rustfs/event-archive-bucket.yaml").read_text())
script = job["spec"]["template"]["spec"]["containers"][0]["args"][0]
subprocess.run(["sh", "-n"], input=script, text=True, check=True)
fixture = 'curl() { case "$*" in *--write-out*) printf "%s" "$fixture_status" ;; *) printf "REQUEST %s\\n" "$*" ;; esac; }\n'
for status, succeeds, creates in [("200", True, False), ("404", True, True), ("500", False, False)]:
    result = subprocess.run(["sh", "-ec", fixture + script], env={"PATH": os.environ["PATH"], "fixture_status": status}, capture_output=True, text=True)
    assert (result.returncode == 0) == succeeds, result.stderr
    assert ("--request PUT" in result.stdout) == creates
    if succeeds:
        assert "Verifying event archive bucket" in result.stdout
    else:
        assert "HTTP 500" in result.stderr
    print("PASS: bucket provisioning status=" + status + ", succeeds=" + str(succeeds) + ", creates=" + str(creates))
'''

