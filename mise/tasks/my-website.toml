[my-website-install]
description = "Install locked website dependencies"
dir = "apps/my-website"
run = "npm ci"

[my-website-build]
description = "Build the SvelteKit production server and prerendered pages"
depends = ["runtime-config-check", "my-website-install"]
dir = "apps/my-website"
run = "npm run build"

[my-website-checks]
description = "Type-check, test, and build the website"
depends = ["runtime-config-check", "my-website-install"]
dir = "apps/my-website"
run = "npm run check && npm test && npm run build"

[my-website-run]
description = "Run the website production server locally on port 8081"
depends = ["my-website-build"]
# ! Task-level daemons start before dependency tasks finish building.
run = "mise daemons restart my-website"

[my-website-watch]
description = "Run the website with SvelteKit hot reload on port 8080"
depends = ["my-website-install"]
dir = "apps/my-website"
run = "npm run dev -- --host 127.0.0.1 --port 8080"

[my-website-test]
description = "Run my-website tests"
depends = ["my-website-install"]
dir = "apps/my-website"
run = "npm test"

[my-website-browser-test]
description = "Run website browser regressions against a fresh production server"
depends = ["my-website-build"]
dir = "apps/my-website"
run = "npm run test:browser"

[my-website-image]
description = "Build the my-website container image locally (container on macOS, podman on Linux)"
depends = ["container-system-start"]
run = '''
if [[ "$(uname)" == "Darwin" ]]; then
  exec container build -f apps/my-website/Dockerfile.buildkit -t docker.io/test/my-website:latest --platform linux/amd64 --cpus 17 --memory 40gb .
else
  exec podman build -f apps/my-website/Dockerfile.buildkit -t docker.io/test/my-website:latest --platform linux/amd64 .
fi
'''

[my-website-image-run]
description = "Run the website container locally on port 8083"
depends = ["my-website-image"]
run = "mise daemons restart my-website-container"

[my-website-stop]
description = "Stop my-website dev server and container"
run = "mise daemons stop my-website my-website-container"

[my-website-validate]
description = "Validate my-website on prod (read-only kubectl checks)"
depends = ["my-website-install"]
run = '''
set -euo pipefail
echo "=== Pods ==="
kubectl -n my-website get pods -l app=my-website -o wide
echo ""
echo "=== Health ==="
kubectl -n my-website get pods -l app=my-website -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.containerStatuses[0].ready}{"\n"}{end}'
echo ""
echo "=== Logs from the first pod ==="
FIRST_POD=$(kubectl -n my-website get pods -l app=my-website -o jsonpath='{.items[0].metadata.name}')
kubectl -n my-website logs "$FIRST_POD"
curl --fail --show-error --location https://saikat.dev/
PLAYWRIGHT_BASE_URL=https://saikat.dev npm --prefix apps/my-website run test:browser
'''
