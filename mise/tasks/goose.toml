[goose-build-workflow-check]
description = "Regression-test unprivileged compilation and isolated sudo ownership context for OCI packaging"
run = '''
#!/usr/bin/env -S ./.venv/bin/python
import ast
import os
from pathlib import Path
import tomllib
from unittest.mock import patch

tasks = tomllib.loads(Path("mise/tasks/goose.toml").read_text())
with patch("os.geteuid", return_value=0):
  try:
    exec(compile(tasks["goose-build"]["run"], "goose-build", "exec"), {})
  except SystemExit as error:
    assert "without sudo" in str(error)
  else:
    raise AssertionError("Privileged compilation must be rejected")
print("PASS: compilation rejects root before running Git or Cargo")
body = ast.parse(tasks["goose-image"]["run"])
assignment = next(node for node in body.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "environment" for target in node.targets))
with patch.dict(os.environ, {"PATH": "/usr/bin", "HOME": "/home/operator", "SUDO_UID": "1000", "GITHUB_TOKEN": "must-not-pass"}, clear=True):
  namespace = {"os": os}
  exec(compile(ast.Module(body=[assignment], type_ignores=[]), "image-environment", "exec"), namespace)
  assert namespace["environment"] == {"PATH": "/usr/bin", "HOME": "/home/operator", "SUDO_UID": "1000"}
print("PASS: packaging preserves sudo repository ownership context without inheriting credentials")
selection = next(node for node in ast.walk(body) if isinstance(node, ast.If) and isinstance(node.test, ast.Compare) and isinstance(node.test.left, ast.Name) and node.test.left.id == "image_name" and any(isinstance(child, ast.Name) and child.id == "toolchain" for child in ast.walk(node)))
for selected, valid in [("stable-x86_64-unknown-linux-gnu", True), ("stable", False), ("stable-x86_64-unknown-linux-musl", False)]:
  namespace = {"image_name": "backend", "environment": {}, "subprocess": __import__("subprocess"), "json": __import__("json"), "lines": []}
  with patch("subprocess.check_output", return_value=selected + " (default)\n"):
    try:
      exec(compile(ast.Module(body=[selection], type_ignores=[]), "image-rust-toolchain", "exec"), namespace)
    except SystemExit:
      assert not valid
    else:
      assert valid
      assert namespace["lines"] == ['RUSTUP_TOOLCHAIN = "' + selected + '"']
print("PASS: packaging selects a complete GNU Rust toolchain and rejects ambiguous or musl selections")
'''

[goose-ssh-check]
description = "Validate Goose's canonical machine SSH identity and strict GitHub configuration without plaintext key files"
run = '''
#!/usr/bin/env -S ./.venv/bin/python
import os
from pathlib import Path
import subprocess
import yaml

root = Path("kubernetes/apps/goose").resolve()
secret = yaml.safe_load(subprocess.check_output(["mise", "--raw", "run", "sops-decrypt", "--", str(root / "machine-access-ssh.sops.yaml")], text=True))
key = secret["stringData"]["ssh-privatekey"]
canonical = subprocess.check_output(["mise", "--raw", "run", "ansible-vault-view", "--", "vault_saikat_machine_access_ssh_private_key"], text=True)
assert key.strip() == canonical.strip()
assert key.startswith("-----BEGIN OPENSSH PRIVATE KEY-----")
descriptor = os.memfd_create("goose-ssh-check", os.MFD_CLOEXEC)
try:
  os.fchmod(descriptor, 0o600)
  os.write(descriptor, key.encode())
  public = subprocess.check_output(["ssh-keygen", "-y", "-P", "", "-f", "/proc/" + str(os.getpid()) + "/fd/" + str(descriptor)], text=True)
  assert public.startswith("ssh-ed25519 ")
