[goose-image]
description = "Package and audit Goose backend and browser images with native mise OCI on Linux"
depends = ["goose-build"]
run = '''
#!/usr/bin/env -S ./.venv/bin/python
import json
import os
from pathlib import Path
import re
import subprocess
import tempfile
import tomllib
import yaml

root = Path.cwd()
with (root / "mise.toml").open("rb") as stream:
  defaults = __import__("tomllib").load(stream)["vars"]
with (root / "mise.toml").open("rb") as stream:
  configuration = tomllib.load(stream)
with (root / "mise.lock").open("rb") as stream:
  lock = tomllib.load(stream)
binary = root / "target/goose/compiler/x86_64-unknown-linux-musl/release/goose"
if not binary.is_file():
  raise SystemExit("Missing compiled Goose binary; run mise run goose-build without sudo first.")
browser = root / "target/goose/browser" / defaults["goose_browser_revision"]
environment = {key: os.environ[key] for key in ["PATH", "HOME", "CARGO_HOME", "RUSTUP_HOME", "SSL_CERT_FILE", "SSL_CERT_DIR", "SUDO_UID"] if key in os.environ}
if not browser.exists():
  browser.parent.mkdir(parents=True, exist_ok=True)
  subprocess.run(["git", "init", str(browser)], env=environment, check=True)
  subprocess.run(["git", "-C", str(browser), "fetch", "--depth", "1", "https://github.com/aaif-goose/goose-mobile.git", defaults["goose_browser_revision"]], env=environment, check=True)
  subprocess.run(["git", "-C", str(browser), "checkout", "FETCH_HEAD"], env=environment, check=True)
revision = subprocess.check_output(["git", "-C", str(browser), "rev-parse", "HEAD"], env=environment, text=True).strip()
if revision != defaults["goose_browser_revision"]:
  raise SystemExit("Browser checkout does not match the declared upstream revision")
subprocess.run(["git", "-C", str(browser), "diff", "--exit-code", "HEAD"], env=environment, check=True)
for image_name, tools, entrypoint, command, copies in [
  ("backend", ["node", "python", "rust"], ["/usr/local/bin/goose"], ["roam", "share", "--cwd", "/home/goose"], [(binary, "/usr/local/bin/goose")]),
  ("browser", ["python"], ["mise", "exec", "--", "python", "-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/srv"], [], [(browser / name, "/srv/goose-mobile/" + name) for name in ["index.html", "assets", "manifest.webmanifest", "favicon.svg"]]),
]:
  with tempfile.TemporaryDirectory(prefix="goose-oci-") as temporary_directory:
    temporary = Path(temporary_directory)
    lines = ["[settings]", "experimental = true", "", "[tools]"]
    for tool in tools:
      version = lock["tools"][tool][0]["version"]
      if tool == "rust":
        options = dict(configuration["tools"]["core:rust"])
        options["version"] = version
        value = "{ " + ", ".join(key + " = " + json.dumps(value) for key, value in options.items()) + " }"
      else:
        value = json.dumps(version)
      lines.append(json.dumps("core:" + tool) + " = " + value)
    base_image = defaults["goose_backend_base_image"] if image_name == "backend" else defaults["goose_base_image"]
    lines.extend(["", "[oci]", "from = " + json.dumps(base_image), 'user = "1000:1000"', 'workdir = "/home/goose"', "entrypoint = " + json.dumps(entrypoint), "cmd = " + json.dumps(command), "", "[oci.env]", 'HOME = "/home/goose"', 'GOOSE_DISABLE_KEYRING = "1"'])
    if image_name == "backend":
      toolchain = subprocess.check_output(["rustup", "show", "active-toolchain"], env=environment, text=True).split()[0]
      if not toolchain.endswith("-x86_64-unknown-linux-gnu"):
        raise SystemExit("The backend requires the installed Linux GNU Rust toolchain")
      lines.append("RUSTUP_TOOLCHAIN = " + json.dumps(toolchain))
    (temporary / "mise.toml").write_text("\n".join(lines) + "\n")
    (temporary / "empty.toml").write_text("")
    isolated_environment = dict(environment)
    isolated_environment.update({"MISE_GLOBAL_CONFIG_FILE": str(temporary / "empty.toml"), "MISE_SYSTEM_CONFIG_FILE": str(temporary / "empty.toml"), "MISE_CEILING_PATHS": str(temporary.parent), "MISE_OVERRIDE_CONFIG_FILENAMES": "mise.toml", "MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES": "none", "MISE_NO_ENV": "1", "MISE_NO_HOOKS": "1"})
    subprocess.run(["mise", "trust", str(temporary / "mise.toml")], cwd=temporary, env=isolated_environment, check=True)
    output = root / "target/goose/oci" / image_name
    arguments = ["mise", "oci", "build", "--output", str(output)]
    for host_path, image_path in copies:
      if not host_path.exists():
        raise SystemExit("Missing image artifact: " + str(host_path))
      print("Packaging " + str(host_path) + " as " + image_path, flush=True)
      arguments.extend(["--copy", str(host_path) + ":" + image_path])
    subprocess.run(arguments, cwd=temporary, env=isolated_environment, check=True)
    with (output / "index.json").open() as stream:
      index = json.load(stream)
    manifest_path = output / "blobs/sha256" / index["manifests"][0]["digest"].split(":", 1)[1]
    with manifest_path.open() as stream:
      manifest = json.load(stream)
    config_path = output / "blobs/sha256" / manifest["config"]["digest"].split(":", 1)[1]
    config_bytes = config_path.read_bytes()
    image_configuration = json.loads(config_bytes)
    image_environment = dict(value.split("=", 1) for value in image_configuration["config"]["Env"])
    generated_paths = {"HOME": "/home/goose", "CARGO_HOME": "/mise/rust/cargo", "RUSTUP_HOME": "/mise/rust/rustup"}
    for key, expected in generated_paths.items():
      if key in image_environment and image_environment[key] != expected:
        raise SystemExit("Refusing unexpected image path for " + key)
    leaked_names = (set(configuration["env"]) & set(image_environment)) - set(generated_paths) - {"_"}
    if leaked_names:
      raise SystemExit("Refusing image with inherited project environment: " + ", ".join(sorted(leaked_names)))
    for key, value in os.environ.items():
      if re.search("TOKEN|SECRET|PASSWORD|API_KEY|PRIVATE_KEY", key) and len(value) >= 16 and value.encode() in config_bytes:
        raise SystemExit("Refusing image containing credential value from " + key)
    if image_configuration["config"]["User"] != "1000:1000":
      raise SystemExit("Refusing an image that does not use the declared non-root user")
    print("PASS: " + image_name + " config has no project environment or known credentials", flush=True)
    print("PASS: " + image_name + " manifest " + index["manifests"][0]["digest"], flush=True)
'''

[goose-workstation-check]
description = "Verify cloud-init's mise-only seed and the guest-owned mise bootstrap"
run = '''
#!/usr/bin/env -S ./.venv/bin/python
from pathlib import Path
import subprocess
import tomllib
import io
from unittest.mock import patch
import yaml

configuration = tomllib.loads(Path("mise.toml").read_text())
tasks = tomllib.loads(Path("mise/tasks/goose.toml").read_text())
virtual_machine = yaml.safe_load(Path("kubernetes/apps/goose/workstation.yaml").read_text())
volumes = virtual_machine["spec"]["template"]["spec"]["volumes"]
cloud_init_volume = next(volume["cloudInitNoCloud"] for volume in volumes if "cloudInitNoCloud" in volume)
assert "userData" not in cloud_init_volume
assert cloud_init_volume["secretRef"]["name"] == "goose-workstation-cloud-init"
assert "userDataSecretRef" not in cloud_init_volume
cloud_init_source = Path("kubernetes/apps/goose/workstation-cloud-init.yaml").read_text()
assert len(cloud_init_source.encode()) > 2048
cloud_init = yaml.safe_load(cloud_init_source)
print("PASS: large cloud-init data uses a Secret reference, never the rejected inline field", flush=True)
settings = next(item for item in cloud_init["write_files"] if item["path"] == "/home/goose/.config/mise/config.toml")
assert tomllib.loads(settings["content"])["settings"]["self_update"]["auto"] is True
assert settings["owner"] == "goose:goose"
seed = next(command for command in cloud_init["runcmd"] if "sha256sum --check" in str(command))
assert seed[:3] == ["sh", "-eu", "-c"]
assert seed[3].index("sha256sum --check") < seed[3].index("chmod 0755")
assert "/home/goose/.local/bin/mise" in seed[3] and "curl" in seed[3]
subprocess.run(["sh", "-n"], input=seed[3], text=True, check=True)
assert not any("code" in command or "goose-build" in command for command in cloud_init["runcmd"])
print("PASS: cloud-init only seeds writable, checksum-verified mise with global self-updates", flush=True)
for name in ["workstation-mise-setup", "workstation-tunnel-login", "workstation-tunnel-setup"]:
  subprocess.run(["bash", "-n"], input=tasks[name]["run"], text=True, check=True)
assert "self_update.auto true" in tasks["workstation-mise-setup"]["run"]
assert "--provider github" in tasks["workstation-tunnel-login"]["run"]
assert "service install" in tasks["workstation-tunnel-setup"]["run"]
assert "--accept-server-license-terms" in tasks["workstation-tunnel-setup"]["run"]
assert "--local" not in tasks["workstation-mise-setup"]["run"]
assert 'readlink -f "$(command -v mise)"' in tasks["workstation-mise-setup"]["run"]
assert not any(path.is_file() for path in Path("ansible/roles/goose-workstation").rglob("*"))
print("PASS: guest software and authenticated tunnel services are owned by mise, not Ansible", flush=True)
installer = compile(tasks["workstation-vscode-install"]["run"], "workstation-vscode-install", "exec")
expected = "code " + configuration["vars"]["workstation_vscode_version"] + " (commit " + configuration["vars"]["workstation_vscode_commit"] + ")"
for output, accepted in [(expected, True), (expected.removeprefix("code "), False), ("code 0.0.0 (commit wrong)", False)]:
  with patch("pathlib.Path.home", return_value=Path("/fixture")), patch("pathlib.Path.mkdir"), patch("pathlib.Path.exists", return_value=True), patch("subprocess.check_output", return_value=output):
    try:
      exec(installer, {})
    except SystemExit as error:
      assert accepted if error.code == 0 else not accepted
    else:
      assert accepted
  print("PASS: VS Code version fixture accepted=" + str(accepted), flush=True)
with patch("pathlib.Path.mkdir"), patch("pathlib.Path.exists", return_value=False), patch("urllib.request.urlopen", return_value=io.BytesIO(b"invalid archive")), patch("tarfile.open") as extract:
  try:
    exec(installer, {})
  except SystemExit as error:
    assert "checksum mismatch" in str(error)
  else:
    raise AssertionError("An invalid archive must never be extracted")
  extract.assert_not_called()
print("PASS: an invalid VS Code checksum prevents extraction", flush=True)
account_guard = tasks["workstation-tunnel-setup"]["run"].split("sudo -n loginctl", 1)[0]
account_guard = account_guard.replace("vscode_executable=/usr/local/bin/code", "vscode_executable=fixture_cli")
fixture_prefix = 'fixture_account="$1"; fixture_exit="$2"; fixture_cli() { printf "%s\\n" "$fixture_account"; return "$fixture_exit"; }\n'
for account, exit_code, accepted in [
  ("logged in with provider GitHub Account", "0", True),
  ("not logged in", "1", False),
  ("logged in with provider Microsoft Account", "0", False),
]:
  result = subprocess.run(["bash", "-c", fixture_prefix + account_guard, "--", account, exit_code], capture_output=True, text=True)
  assert (result.returncode == 0) is accepted
  if not accepted:
    assert account in result.stderr and "workstation-tunnel-login" in result.stderr
  print("PASS: tunnel account accepted=" + str(accepted) + "; failed authorization is surfaced verbatim", flush=True)
deployment_gate = yaml.safe_load(Path("kubernetes/clusters/yral-k8s/app-goose.yaml").read_text())["spec"]
assert deployment_gate.get("wait", False) is False
checks = deployment_gate["healthChecks"]
assert any(item["kind"] == "VirtualMachineInstance" and item["name"] == "goose-workstation" for item in checks)
assert not any(item["kind"] == "VirtualMachine" for item in checks)
assert {item["name"] for item in checks if item["kind"] == "Deployment"} == {"goose", "goose-browser"}
assert any(item["kind"] == "DataVolume" for item in checks)
assert any(item["kind"] == "PersistentVolumeClaim" for item in checks)
instance_expression = next(item["current"] for item in deployment_gate["healthCheckExprs"] if item["kind"] == "VirtualMachineInstance")
assert "status.phase == 'Running'" in instance_expression and "condition.status == 'True'" in instance_expression
for phase, ready, expected_ready in [("Running", "True", True), ("Running", "False", False), ("Failed", "True", False)]:
  status = {"phase": phase, "conditions": [{"type": "Ready", "status": ready}]}
  observed_ready = status["phase"] == "Running" and any(item["type"] == "Ready" and item["status"] == "True" for item in status["conditions"])
  assert observed_ready is expected_ready
print("PASS: staged VM generations do not block healthy instances; failed or unready instances remain blocked", flush=True)
'''

[workstation-mise-setup]
description = "Enable self-updates using a guest-owned mise executable without changing the workspace or tunnel"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ "$(id -un)" != "goose" || "$(hostname)" != "goose-workstation" ]]; then
  printf '%s\n' 'Run workstation setup inside goose-workstation as goose.' >&2
  exit 1
fi
install -d "$HOME/.local/bin"
current_mise=$(readlink -f "$(command -v mise)")
if [[ "$current_mise" != "$HOME/.local/bin/mise" ]]; then
  install -m 0755 "$current_mise" "$HOME/.local/bin/mise"
fi
sudo -n ln -sfn "$HOME/.local/bin/mise" /usr/local/bin/mise
"$HOME/.local/bin/mise" settings set self_update.auto true
'''

[workstation-vscode-install]
description = "Adopt the approved installed VS Code CLI or install it without replacing working authorization"
run = '''
#!/usr/bin/env python3
import hashlib
from pathlib import Path
import shutil
import subprocess
import tarfile
import tempfile
import tomllib
import urllib.request

configuration = tomllib.loads(Path("mise.toml").read_text())["vars"]
version = configuration["workstation_vscode_version"]
commit = configuration["workstation_vscode_commit"]
expected_output = "code " + version + " (commit " + commit + ")"
existing_binary = Path("/usr/local/bin/code")
if existing_binary.exists():
  output = subprocess.check_output([str(existing_binary), "--version"], text=True).strip()
  if output != expected_output:
    raise SystemExit("Unexpected existing VS Code CLI version; refusing replacement: " + output)
  print("Adopted existing " + output, flush=True)
  raise SystemExit(0)
directory = Path.home() / ".local/share/vscode-cli" / version
directory.mkdir(parents=True, exist_ok=True)
binary = directory / "code"
if not binary.exists():
  url = "https://vscode.download.prss.microsoft.com/dbazure/download/stable/" + commit + "/vscode_cli_linux_x64_cli.tar.gz"
  print("Downloading VS Code CLI " + version, flush=True)
  with tempfile.TemporaryDirectory(prefix="vscode-cli-") as temporary:
    archive = Path(temporary) / "cli.tar.gz"
    with urllib.request.urlopen(url) as response, archive.open("wb") as stream:
      shutil.copyfileobj(response, stream)
    with archive.open("rb") as stream:
      checksum = hashlib.file_digest(stream, "sha256").hexdigest()
    if checksum != configuration["workstation_vscode_sha256"]:
      raise SystemExit("VS Code CLI checksum mismatch; refusing extraction")
    print("Verified VS Code CLI SHA256", flush=True)
    with tarfile.open(archive) as contents:
      contents.extractall(directory, filter="data")
output = subprocess.check_output([str(binary), "--version"], text=True).strip()
if output != expected_output:
  raise SystemExit("Unexpected installed VS Code CLI version: " + output)
subprocess.run(["sudo", "-n", "ln", "-sfn", str(binary), "/usr/local/bin/code"], check=True)
print("Verified " + output, flush=True)
'''

