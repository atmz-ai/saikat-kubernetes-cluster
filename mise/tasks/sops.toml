[sops-decrypt]
description = "Decrypt a SOPS file (usage: mise run sops-decrypt -- kubernetes/path/to/file.sops.yaml)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
SOPS_AGE_KEY="$(mise run ansible-vault-view -- vault_age_private_key)" sops --decrypt "$@"
'''

[sops-encrypt]
description = "Encrypt a plain YAML file as SOPS in-place (usage: mise run sops-encrypt -- kubernetes/path/to/file.sops.yaml)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
sops --encrypt --in-place "$@"
'''

[sops-encrypt-stdin]
description = "Encrypt Kubernetes YAML from stdin without plaintext files (usage: mise run sops-encrypt-stdin -- <destination.sops.yaml>)"
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
sops encrypt --filename-override "$1" --encrypted-regex '^(data|stringData)$'
'''

[sops-stdin-check]
description = "Regression-test streaming Kubernetes Secret encryption and vault-backed decryption"
run = '''
#!/usr/bin/env -S ./.venv/bin/python
import subprocess
import yaml

plaintext = "apiVersion: v1\nkind: Secret\nmetadata:\n  name: sops-stream-test\n  namespace: default\nstringData:\n  value: nonsecret-test-value\n"
encrypted = subprocess.run(["mise", "run", "sops-encrypt-stdin", "--", "kubernetes/test.sops.yaml"], input=plaintext, text=True, stdout=subprocess.PIPE, check=True).stdout
document = yaml.safe_load(encrypted)
assert document["metadata"]["name"] == "sops-stream-test"
assert document["stringData"]["value"].startswith("ENC[")
decrypted = subprocess.run(["mise", "--raw", "run", "sops-decrypt", "--", "--input-type", "yaml", "--output-type", "yaml", "/dev/stdin"], input=encrypted, text=True, stdout=subprocess.PIPE, check=True).stdout
assert yaml.safe_load(decrypted) == yaml.safe_load(plaintext)
print("PASS: streaming encryption preserves metadata, encrypts stringData, and round-trips without plaintext files")
'''

[sops-edit]
description = "Edit a SOPS file in-place (usage: mise run sops-edit -- kubernetes/path/to/file.sops.yaml)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
SOPS_AGE_KEY="$(mise run ansible-vault-view -- vault_age_private_key)" sops "$@"
'''
